relli C, Skinner AT, Sorbring E, Tapanya S, Uribe Tirado LM, Zelli A, Alampay LP, Al-Hassan SM, Bacchini D, Bombi AS, Chang L, Deater-Deckard K, Di Giunta L, Dodge KA, Oburu P", "date": "2015"}, "work": {"title": "Perceived mother and father acceptance-rejection predict four unique aspects of child adjustment across nine countries", "section": "Journal of Child Psychology and Psychiatry. 2015;56(8):923–932", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: في 1247 أسرة من 9 دول، تنبأ ارتفاع الرفض الوالدي كما يدركه الطفل بزيادة المشكلات الداخلية والخارجية، وانخفاض الأداء المدرسي والسلوك الاجتماعي الإيجابي خلال 3 سنوات، بعد الضبط الإحصائي. تشابه نمط العلاقات للأم والأب وعبر معظم البلدان، مع استثناءات؛", "verbatim": false}, "translation_ar": "", "urls": ["https://acamh.onlinelibrary.wiley.com/doi/10.1111/jcpp.12366", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4465055/"], "links": null, "strength": "explicit", "argument": "في تسع دول تنبأ رفض الأب كرفض الأم بمشكلات الطفل وضعف أدائه؛ فصلة الطفل بأبيه محل أثر في كل الثقافات.", "jurisdiction": "الصين، كولومبيا، إيطاليا، الأردن، كينيا، الفلبين، السويد، تايلاند، الولايات المتحدة", "title": "التقبل والرفض الوالديان ونتائج الطفل في 9 دول", "source_standing": "مشروع التربية عبر الثقافات بقيادة جنيفر لانسفورد وكينيث دودج من جامعة ديوك، ومارك بورنشتاين من المعهد الوطني الأمريكي لصحة الطفل؛ ونشرته مجلة علم نفس الطفل والطب النفسي.", "evidence_level": "دراسة متابعة طويلة دولية"}, {"section": "soc", "card_number": 98, "supports": ["shared_parenting"], "author": {"name": "Jeong J, McCoy DC, Yousafzai AK, Salhi C, Fink G", "date": "2016"}, "work": {"title": "Paternal Stimulation and Early Child Development in Low- and Middle-Income Countries", "section": "Pediatrics. 2016;138(4):e20161357", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: في بيانات 87286 طفلا بعمر 3 و4 سنوات من 38 دولة منخفضة ومتوسطة الدخل، ارتبط اشتراك الأب في أنشطة اللعب والتعلم بدرجات أعلى في مؤشر نمو، بعد مراعاة مشاركة مقدمي الرعاية الآخرين والعوامل السكانية. مقارنة بمن شارك آباؤهم في 5 أو 6 أنشطة، انخفض المؤشر بمقدار 0.09 درجة عند 1–4 أنشطة، و0.14 عند عدم المشاركة.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/27600319/", "https://publications.aap.org/pediatrics/article/138/4/e20161357/52343/Paternal-Stimulation-and-Early-Child-Development"], "links": null, "strength": "explicit", "argument": "في 38 دولة منخفضة ومتوسطة الدخل، ومنها بلاد عربية وإسلامية، ارتبط لعب الأب وتعليمه لصغيره بنمو أحسن؛ فالأب شريك في النمو في بلادنا كما في غيرها.", "jurisdiction": "الولايات المتحدة وباكستان — هارفارد وآغا خان ونورث إيسترن؛ بيانات من 38 دولة", "title": "مشاركة الأب في اللعب والتعلم في 38 دولة", "source_standing": "بحث على مسوح اليونيسف متعددة المؤشرات في 38 دولة، أجراه باحثون من جامعة هارفارد وجامعة آغا خان؛ ونشرته مجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال.", "evidence_level": "دراسة مسحية دولية"}, {"section": "soc", "card_number": 99, "supports": ["shared_parenting"], "author": {"name": "Hrdy SB", "date": "2009"}, "work": {"title": "Mothers and Others: The Evolutionary Origins of Mutual Understanding", "section": "", "volume": "", "page": "", "edition": "Cambridge, MA: Harvard University Press"}, "original": {"lang": "en", "text": "مضمونه: الإنسان من الأنواع المتعاونة في التربية، ولم يكن صغيره في تاريخه الطويل يربى بيد الأم وحدها، بل بيد الأب والأقارب معها.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL18805358W"], "links": [{"url": "https://openlibrary.org/works/OL18805358W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "علم الإنسان ينقض دعوى أن الطفل لا يحتاج إلا أمه، فطبيعة الإنسان أن يربى صغيره بأيد متعاونة، أولها يد أبيه.", "jurisdiction": "الولايات المتحدة — جامعة هارفارد", "title": "سارة هردي — الأم والآخرون", "source_standing": "سارة بلافر هردي عالمة إنسان أمريكية، أستاذة فخرية في جامعة كاليفورنيا في ديفيس، وعضو الأكاديمية الوطنية للعلوم في الولايات المتحدة؛ وكتابها صادر عن مطبعة جامعة هارفارد.", "evidence_level": "كتاب علمي لعالمة مرجع"}, {"section": "soc", "card_number": 100, "supports": ["shared_parenting"], "author": {"name": "Levtov R, van der Gaag N, Greene M, Kaufman M, Barker G", "date": "2015"}, "work": {"title": "State of the World's Fathers: A MenCare Advocacy Publication", "section": "", "volume": "", "page": "", "edition": "Washington, DC: Promundo, Rutgers, Save the Children, Sonke Gender Justice"}, "original": {"lang": "en", "text": "This first ever State of the World's Fathers report brings together key international research findings along with program and policy examples related to men's participation in caregiving [...] Involved fatherhood helps children thrive. As men take on more caregiving, research increasingly confirms that fathers' involvement affects children in much the same ways that mothers' involvement does. [...] Men's participation as fathers and as caregivers also matters tremendously for women's lives.", "verbatim": true}, "translation_ar": "«يجمع هذا التقرير الأول من نوعه عن حالة آباء العالم أهم نتائج البحوث الدولية مع أمثلة من البرامج والسياسات المتعلقة بمشاركة الرجال في الرعاية [...] إن الأبوة المشاركة تعين الأطفال على الازدهار. ومع تزايد ما يتولاه الرجال من رعاية، تؤكد البحوث أكثر فأكثر أن مشاركة الآباء تؤثر في الأطفال بالطرق نفسها تقريبا التي تؤثر بها مشاركة الأمهات. [...] ومشاركة الرجال كآباء وكمقدمي رعاية مهمة جدا أيضا لحياة النساء.»", "urls": ["https://www.equimundo.org/wp-content/uploads/2015/06/State-of-the-Worlds-Fathers-Full-Report-2015.pdf"], "links": [{"url": "https://www.equimundo.org/wp-content/uploads/2015/06/State-of-the-Worlds-Fathers-Full-Report-2015.pdf", "label": "نص التقرير", "site": "منظمة إيكيموندو", "domain": "www.equimundo.org"}], "strength": "explicit", "argument": "تقرير عالمي من منظمات في أمريكا وأوروبا وإفريقيا يقرر أن مشاركة الأب في الرعاية نفع للطفل في كل البلاد.", "jurisdiction": "عالمي — الولايات المتحدة وأوروبا وإفريقيا", "title": "حالة آباء العالم 2015 — تقرير عالمي", "source_standing": "تقرير تشترك فيه منظمات من الولايات المتحدة وهولندا والمملكة المتحدة وجنوب إفريقيا، ومنها منظمة إنقاذ الطفولة.", "evidence_level": "تقرير دولي"}, {"section": "soc", "card_number": 101, "supports": ["shared_parenting"], "author": {"name": "Amato PR", "date": "2005"}, "work": {"title": "The impact of family formation change on the cognitive, social, and emotional well-being of the next generation", "section": "The Future of Children 15(2):75–96", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "He shows that children growing up with two continuously married parents are less likely to experience a wide range of cognitive, emotional, and social problems, not only during childhood but also in adulthood. [...] He shows that compared with other children, those who grow up in stable, two-parent families have a higher standard of living, receive more effective parenting, experience more cooperative co-parenting, are emotionally closer to both parents, and are subjected to fewer stressful events and circumstances.", "verbatim": true}, "translation_ar": "«يبين [أماتو] أن الأطفال الذين ينشؤون مع والدين مستمرين في زواجهما أقل عرضة لطائفة واسعة من المشكلات الذهنية والعاطفية والاجتماعية، لا في الطفولة فحسب بل في الرشد أيضا. [...] ويبين أن الأطفال الذين ينشؤون في أسر مستقرة ذات والدين، مقارنة بغيرهم، يتمتعون بمستوى معيشة أعلى، ويتلقون تربية أكثر فاعلية، ويعيشون تعاونا أكبر بين والديهم، وهم أقرب عاطفيا إلى كلا الوالدين، ويتعرضون لأحداث وظروف ضاغطة أقل.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/16158731/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/16158731/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "علم الاجتماع الأسري يرد كثيرا من ضرر الطلاق إلى فقد الطفل أباه، فالقانون الذي يبعد الأب يزيد الضرر ولا ينقصه.", "jurisdiction": "الولايات المتحدة — جامعة ولاية بنسلفانيا", "title": "أماتو 2005 — أثر بنية الأسرة في أجيالها", "source_standing": "بول أماتو أستاذ علم الاجتماع في جامعة ولاية بنسلفانيا، من أوسع علماء الأسرة أثرا؛ والمجلة يصدرها مركز في جامعة برنستون مع مؤسسة بروكينغز.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "soc", "card_number": 102, "supports": ["shared_parenting"], "author": {"name": "Hewlett BS", "date": "1991"}, "work": {"title": "Intimate Fathers: The Nature and Context of Aka Pygmy Paternal Infant Care", "section": "", "volume": "", "page": "", "edition": "Ann Arbor: University of Michigan Press"}, "original": {"lang": "en", "text": "مضمونه: آباء قوم أكا في وسط إفريقيا من أقرب آباء العالم إلى رضعهم، يحملونهم ويرعونهم كثيرا، فرعاية الأب للرضيع جزء من الطبيعة الإنسانية لا طارئ عليها.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL4480763W"], "links": [{"url": "https://openlibrary.org/works/OL4480763W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "indirect", "argument": "رعاية الأب لصغيره منذ الرضاعة ثابتة في المجتمعات البشرية، فلا وجه لدعوى أن الصغير لا يصلح له إلا أمه.", "jurisdiction": "وسط إفريقيا — قوم أكا", "title": "آباء قوم أكا — أقرب آباء العالم إلى رضعهم", "source_standing": "باري هيولت أستاذ علم الإنسان في جامعة ولاية واشنطن، من رواد دراسة الأبوة في المجتمعات التقليدية؛ وكتابه صادر عن مطبعة جامعة ميشيغان.", "evidence_level": "دراسة ميدانية بالمعايشة"}, {"section": "soc", "card_number": 103, "supports": ["7", "childhood_ends_at_puberty"], "author": {"name": "Rogoff B, Sellers MJ, Pirrotta S, Fox N, White SH", "date": "1975"}, "work": {"title": "Age of assignment of roles and responsibilities to children: a cross-cultural survey", "section": "Human Development. 1975;18(5):353-369", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"for 16 of the 27 categories there appeared to be a modal cultural assignment of social responsibility in the 5- to 7-year age range. Four of the remaining eleven categories showed a mode at puberty ... diverse human cultures assign new roles and responsibilities to children in the 5- to 7-year age range.\"", "verbatim": true}, "translation_ar": "«في 16 من 27 فئة ظهر أن الإسناد الثقافي الغالب للمسؤولية الاجتماعية يقع في مدى العمر من 5 إلى 7 سنوات. وأظهرت أربع من الفئات الإحدى عشرة الباقية غلبة عند البلوغ... فالثقافات الإنسانية المتنوعة تسند أدوارا ومسؤوليات جديدة إلى الأطفال في مدى العمر من 5 إلى 7 سنوات».", "urls": ["https://karger.com/hde/article-abstract/18/5/353/156330/Age-of-Assignment-of-Roles-and-Responsibilities-to", "https://hraf.yale.edu/documents/722"], "links": [{"url": "https://karger.com/hde/article-abstract/18/5/353/156330/Age-of-Assignment-of-Roles-and-Responsibilities-to", "label": "ملخص الدراسة", "site": "دار كارغر", "domain": "karger.com"}, {"url": "https://hraf.yale.edu/documents/722", "label": "سجل الدراسة", "site": "ملفات العلاقات الإنسانية بجامعة ييل", "domain": "hraf.yale.edu"}], "strength": "explicit_7", "argument": "ليس في خمسين ثقافة إنسانية مدروسة عتبة عند الخامسة عشرة؛ العتبتان الوحيدتان هما السابعة والبلوغ، وهما بعينهما حدا الحضانة والطفولة عند الفقهاء.", "jurisdiction": "الولايات المتحدة — جامعة هارفارد", "title": "روغوف ووايت 1975 — خمسون ثقافة تكلف الطفل في السابعة", "source_standing": "مسح لإثنوغرافيات خمسين ثقافة من ملفات العلاقات الإنسانية بجامعة ييل؛ وشلدون وايت أستاذ علم النفس في هارفارد صاحب نظرية تحول الخامسة إلى السابعة، وباربرا روغوف من أبرز علماء النمو الثقافي؛ والمجلة تصدرها دار كارغر.", "evidence_level": "مسح مرجعي عبر الثقافات"}, {"section": "soc", "card_number": 104, "supports": ["7"], "author": {"name": "Barakat B, Bengtsson S", "date": "2018"}, "work": {"title": "What do we mean by school entry age? Conceptual ambiguity and its implications: the example of Indonesia", "section": "Comparative Education. 2018;54(2):203-224", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the distribution of school entry ages across countries has steadily concentrated on six years as standard, a threshold that applied in 58% of countries in 1990, 62% in 2000, up to 66% in 2010. ... there is an underlying assumption among early education experts that children are likely to start formal primary education at age six\"", "verbatim": true}, "translation_ar": "«تركز توزيع سن دخول المدرسة عبر البلدان باطراد على ست سنوات معيارا، وهي عتبة طبقت في 58 بالمئة من البلدان سنة 1990، و62 بالمئة سنة 2000، وحتى 66 بالمئة سنة 2010... وثمة افتراض كامن عند خبراء التعليم المبكر بأن الأطفال يبدأون التعليم الابتدائي النظامي في سن السادسة».", "urls": ["https://pmc.ncbi.nlm.nih.gov/articles/PMC6034361", "https://doi.org/10.1080/03050068.2017.1360564"], "links": [{"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6034361", "label": "النص الكامل", "site": "المكتبة الوطنية للطب الأمريكية", "domain": "pmc.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1080/03050068.2017.1360564", "label": "صفحة الدراسة", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "ثلثا دول العالم تخرج الطفل من البيت إلى المدرسة في السادسة؛ فالطفل في السابعة خارج حجر الأم بحكم الواقع ويحتاج إلى من يقومه ويعلمه ويؤدبه، وهو ما جعله الفقهاء إلى الأب.", "jurisdiction": "النمسا — أكاديمية العلوم النمساوية", "title": "بركات وبنغتسون 2018 — سن دخول المدرسة في العالم استقر على السادسة", "source_standing": "بحث لديموغرافيي التعليم في معهد فيينا للديموغرافيا بأكاديمية العلوم النمساوية ومركز فيتغنشتاين؛ والمجلة من أبرز مجلات التربية المقارنة، والبحث متاح كاملا في المكتبة الوطنية للطب الأمريكية.", "evidence_level": "بحث محكم على بيانات عالمية"}, {"section": "soc", "card_number": 105, "supports": ["shared_parenting", "7"], "author": {"name": "Statistics Sweden (SCB) — Statistical news", "date": "2023"}, "work": {"title": "Shared residence is common among children with parents living apart", "section": "بيان إحصائي رسمي بتاريخ 18 أكتوبر 2023، عن تقرير «إقامة الأطفال وإعالتهم عند الوالدين المنفصلين»", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"For these children, alternating residence equally with each parent, is the most common solution. Around 220 000 children have shared residence, about 205 000 live mostly or solely with their mother, and approximately 40 000 live mostly or solely with their father. ... Shared residence is more common in ages 6–9 years than among both younger and older children.\"", "verbatim": true}, "translation_ar": "«لهؤلاء الأطفال [الذين يسكن والداهم في عنوانين مختلفين] الإقامة المتناوبة بالتساوي عند كل من الوالدين هي الحل الأكثر شيوعا. فنحو 220 ألف طفل في إقامة مشتركة، ونحو 205 آلاف يعيشون غالبا أو كليا مع أمهاتهم، ونحو 40 ألفا يعيشون غالبا أو كليا مع آبائهم... والإقامة المشتركة أكثر شيوعا في أعمار 6–9 سنوات منها عند الأصغر والأكبر».", "urls": ["https://www.scb.se/en/finding-statistics/statistics-by-subject-area/population-and-living-conditions/living-conditions/children-and-their-families/pong/statistical-news/children-and-their-families-residence-and-support-of-children-with-parents-living-apart"], "links": [{"url": "https://www.scb.se/en/finding-statistics/statistics-by-subject-area/population-and-living-conditions/living-conditions/children-and-their-families/pong/statistical-news/children-and-their-families-residence-and-support-of-children-with-parents-living-apart", "label": "البيان الإحصائي الرسمي", "site": "هيئة الإحصاء السويدية", "domain": "www.scb.se"}], "strength": "explicit", "argument": "في السويد صارت الرعاية المشتركة بالمناصفة أشيع ترتيب لأبناء المنفصلين: 220 ألف طفل في المناصفة مقابل 205 آلاف مع الأم؛ وأكثر ما تكون المناصفة بين السادسة والتاسعة، وهي عين السن التي يحبس فيها الطفل في مصر عن أبيه إلا ساعات.", "jurisdiction": "السويد — هيئة الإحصاء السويدية", "title": "هيئة الإحصاء السويدية 2023 — المناصفة أشيع ترتيب لأبناء المنفصلين، وأكثر ما تكون بين السادسة والتاسعة", "source_standing": "هيئة الإحصاء السويدية هي الجهاز الإحصائي الرسمي للدولة، وبيانها مبني على مسح شمل 50 ألف طفل في خريف 2022 لوالدين لا يسكنان معا، مع سجلات السكان الرسمية.", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "soc", "card_number": 106, "supports": ["shared_parenting"], "author": {"name": "Statistisk sentralbyrå (SSB) — Rapporter 2022/53", "date": "2022"}, "work": {"title": "Delt bosted for barn etter samlivsbrudd. Nye utviklingstrekk og kjennetegn", "section": "تقرير رسمي منشور في 16 ديسمبر 2022 عن مسح الصحبة والإقامة لسنة 2020", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Rapporten bekrefter at 43 prosent av foreldrene som tidligere har bodd sammen har delt bosted, altså at barnet bor vekselsvis hos begge foreldrene og at foreldrene deler den daglige omsorgen for barnet. Dette er en kraftig økning fra forrige Undersøkelse om samvær og bidrag gjennomført i 2012, da 25 prosent av foreldrene hadde delt bosted. Andelen barn som bor fast med mor har sunket tilsvarende, fra 62 prosent i 2012 til 49 prosent i 2020. ... Delt-bostedsforeldre er i gjennomsnitt sammen med barna sine 50 prosent av tiden\"", "verbatim": true}, "translation_ar": "«يؤكد التقرير أن 43 بالمئة من الوالدين الذين سبق أن عاشوا معا لديهم إقامة مشتركة، أي أن الطفل يسكن بالتناوب عند الوالدين كليهما وأنهما يتقاسمان رعايته اليومية. وهذه زيادة كبيرة عن مسح الصحبة والنفقة السابق الذي أجري سنة 2012، حين كانت الإقامة المشتركة عند 25 بالمئة من الوالدين. وهبطت نسبة الأطفال المقيمين إقامة دائمة مع الأم بالمقدار نفسه، من 62 بالمئة سنة 2012 إلى 49 بالمئة سنة 2020... ووالدا الإقامة المشتركة يكونان مع أطفالهم في المتوسط 50 بالمئة من الوقت».", "urls": ["https://www.ssb.no/befolkning/barn-familier-og-husholdninger/artikler/delt-bosted-for-barn-etter-samlivsbrudd.nye-utviklingstrekk-og-kjennetegn"], "links": [{"url": "https://www.ssb.no/befolkning/barn-familier-og-husholdninger/artikler/delt-bosted-for-barn-etter-samlivsbrudd.nye-utviklingstrekk-og-kjennetegn", "label": "صفحة التقرير الرسمي", "site": "هيئة الإحصاء النرويجية", "domain": "www.ssb.no"}], "strength": "explicit", "argument": "في النرويج تضاعفت الإقامة المشتركة بين 2012 و2020 حتى بلغت 43% من أبناء المنفصلين، وتراجعت الإقامة عند الأم وحدها من 62% إلى 49%؛ فالاتجاه العالمي يسير نحو الرعاية المشتركة بالمناصفة لا نحو حبس الطفل عند أحد الوالدين.", "jurisdiction": "النرويج — هيئة الإحصاء النرويجية", "title": "هيئة الإحصاء النرويجية 2022 — الإقامة المشتركة قفزت من 25% إلى 43% من أبناء المنفصلين في ثماني سنوات", "source_standing": "هيئة الإحصاء النرويجية هي الجهاز الإحصائي الرسمي للدولة، والتقرير مبني على مسحها الوطني لسنة 2020 عن إقامة الأطفال بعد انفصال الوالدين.", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "soc", "card_number": 107, "supports": ["shared_parenting"], "author": {"name": "Böheim R, Francesconi M, Halla M", "date": "2012"}, "work": {"title": "Does Custody Law Affect Family Behavior In and Out of Marriage?", "section": "IZA Discussion Paper No. 7064, December 2012", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: فحصت الدراسة أثر إدخال الحضانة المشتركة في النمسا سنة 2001 على بيانات السكان الإدارية كلهم وعلى سجلات المحاكم، فوجدت أن الحضانة المشتركة خفضت معدلات الطلاق خفضا واضحا، ورفعت معدلات الزواج والمواليد داخل الزواج، وأدت إلى زيادة كبيرة في مجموع ما تتلقاه الأمهات من تحويلات مالية بعد الطلاق؛ وفسر الباحثون ذلك بأن إعطاء الرجل مركزا عادلا بعد الفرقة يزيد حافزه للاستثمار في زواجه وأسرته.", "verbatim": false}, "translation_ar": "", "urls": ["https://docs.iza.org/dp7064.pdf"], "links": [{"url": "https://docs.iza.org/dp7064.pdf", "label": "نص الدراسة", "site": "معهد اقتصاديات العمل IZA", "domain": "docs.iza.org"}], "strength": "explicit", "argument": "الاقتصاد يقطع بما قاله الطب وعلم النفس: لما صار للأب مركز عادل بعد الفرقة قل الطلاق وكثر الزواج والإنجاب وزاد ما يصل إلى الأمهات من مال؛ فالرعاية المشتركة بالمناصفة مصلحة للأم والأب والطفل والدولة معا.", "jurisdiction": "النمسا — جامعة لينز وجامعة إسكس ومعهد اقتصاديات العمل", "title": "دراسة نمساوية 2012 — الحضانة المشتركة خفضت الطلاق ورفعت الزواج والمواليد وزادت ما تتلقاه الأمهات بعد الطلاق", "source_standing": "رينيه بوهايم أستاذ الاقتصاد في جامعة لينز، وماركو فرانشيسكوني أستاذ الاقتصاد في جامعة إسكس، ومارتن هالا أستاذ الاقتصاد في جامعة فيينا للاقتصاد؛ والورقة من سلسلة معهد اقتصاديات العمل في بون، أكبر شبكة لاقتصاديي العمل في العالم.", "evidence_level": "دراسة على سجلات الدولة الإدارية الشاملة"}, {"section": "soc", "card_number": 108, "supports": ["shared_parenting"], "author": {"name": "Brinig MF, Allen DW", "date": "2000"}, "work": {"title": "'These boots are made for walking': why most divorce filers are women", "section": "American Law and Economics Review. 2000;2(1):126-169", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Yet women file for divorce and are often the instigators of separation, despite a deep attachment to their children and the evidence that many divorces harm children. ... This paper considers women's filing as rational behavior, based on spouses' relative power in the marriage, their opportunities following divorce, and their anticipation of custody.\"", "verbatim": true}, "translation_ar": "«ومع ذلك فالنساء هن من يرفعن دعاوى الطلاق، وهن في الغالب من يبدأ الانفصال، رغم تعلقهن العميق بأطفالهن ورغم الأدلة على أن كثيرا من حالات الطلاق تضر الأطفال... وتنظر هذه الورقة في رفع النساء للدعاوى بوصفه سلوكا عقلانيا، يقوم على قوة كل من الزوجين النسبية داخل الزواج، وفرصهما بعد الطلاق، وتوقعهما الحصول على الحضانة».", "urls": ["https://doi.org/10.1093/aler/2.1.126"], "links": [{"url": "https://doi.org/10.1093/aler/2.1.126", "label": "ملخص الدراسة", "site": "مطبعة جامعة أكسفورد", "domain": "doi.org"}], "strength": "explicit", "argument": "حين يضمن القانون لطرف واحد الحضانة سلفا يصير الطلاق مكسبا مضمونا له وخسارة للآخر، فيكثر الطلاق ويتضرر الأطفال؛ والرعاية المشتركة بالمناصفة تنزع هذا الحافز من أصله.", "jurisdiction": "الولايات المتحدة — جامعة أيوا وجامعة سايمون فريزر", "title": "برينيغ وآلن 2000 — توقع الفوز بالحضانة من دوافع رفع دعوى الطلاق", "source_standing": "مارغريت برينيغ أستاذة القانون في جامعة أيوا ثم نوتردام، ودوغلاس آلن أستاذ الاقتصاد في جامعة سايمون فريزر، من رواد اقتصاديات قانون الأسرة؛ والمجلة تصدرها مطبعة جامعة أكسفورد للجمعية الأمريكية للقانون والاقتصاد.", "evidence_level": "دراسة محكمة على سجلات الطلاق"}, {"section": "soc", "card_number": 109, "supports": ["shared_parenting"], "author": {"name": "Braver SL, Ellman IM, Votruba AM, Fabricius WV", "date": "2011"}, "work": {"title": "Lay judgments about child custody after divorce", "section": "Psychology, Public Policy, and Law. 2011;17(2):212-240", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: عرض الباحثون على 367 مواطنا من هيئة المحلفين في مقاطعة بيما بولاية أريزونا حالات طلاق افتراضية وسألوهم كيف يقسم وقت الطفل بين والديه؛ فاختار نحو 69% تقسيم وقت الإقامة بالتساوي حين كان الوالدان يتقاسمان الرعاية قبل الطلاق، وبقي التساوي الخيار الأكثر تفضيلا حتى حين كان أحد الوالدين يقوم بثلاثة أرباع الرعاية قبل الطلاق، وفي حالات النزاع الشديد كما في حالات النزاع القليل.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1037/a0023194", "https://news.asu.edu/content/studies-public-favors-equal-custody-children-divorce"], "links": [{"url": "https://doi.org/10.1037/a0023194", "label": "ملخص الدراسة", "site": "الجمعية الأمريكية لعلم النفس", "domain": "doi.org"}, {"url": "https://news.asu.edu/content/studies-public-favors-equal-custody-children-divorce", "label": "بيان جامعة ولاية أريزونا", "site": "أخبار جامعة ولاية أريزونا", "domain": "news.asu.edu"}], "strength": "explicit", "argument": "المناصفة ليست مطلب فئة، بل حكم الفطرة عند عامة الناس إذا سئلوا بلا خصومة؛ والمشرع الذي يخالف حس الناس وعلم العلماء معا لا يستند إلى شيء.", "jurisdiction": "الولايات المتحدة — جامعة ولاية أريزونا", "title": "برافر وزملاؤه 2011 — عامة الناس يختارون المناصفة حين يعرض عليهم الأمر مجردا", "source_standing": "سانفورد برافر وويليام فابريشيوس من كبار باحثي الطلاق والحضانة في جامعة ولاية أريزونا، وإيرا إلمان أستاذ قانون الأسرة فيها؛ والمجلة تصدرها الجمعية الأمريكية لعلم النفس.", "evidence_level": "دراسة مسحية محكمة"}, {"section": "soc", "card_number": 110, "supports": ["shared_parenting"], "author": {"name": "Cancian M, Meyer DR, Brown PR, Cook ST", "date": "2014"}, "work": {"title": "Who gets custody now? Dramatic changes in children's living arrangements after divorce", "section": "Demography. 2014;51(4):1381-1396", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"between 1988 and 2008, the proportion of mothers granted sole physical custody fell substantially, the proportion of parents sharing custody increased dramatically, and father-sole custody remained relatively stable. ... changes in custody may be the result of changes in social norms and the process by which custody is determined.\"", "verbatim": true}, "translation_ar": "«بين سنتي 1988 و2008 هبطت نسبة الأمهات اللائي يمنحن الحضانة المادية المنفردة هبوطا كبيرا، وارتفعت نسبة الوالدين المتقاسمين للحضانة ارتفاعا هائلا، وبقيت حضانة الأب المنفردة مستقرة نسبيا... وقد تكون التغيرات في الحضانة ثمرة تغير الأعراف الاجتماعية والطريقة التي تقرر بها الحضانة».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/24811135/", "https://doi.org/10.1007/s13524-014-0307-8"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/24811135/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1007/s13524-014-0307-8", "label": "صفحة الدراسة", "site": "مجلة الديموغرافيا", "domain": "doi.org"}], "strength": "explicit", "argument": "سجلات المحاكم عشرين سنة تشهد أن انفراد الأم بالحضانة عرف اجتماعي قديم يتراجع حيثما أصلح القانون طريقة تقرير الحضانة؛ فليس في بقائه في مصر إلا بقاء العرف.", "jurisdiction": "الولايات المتحدة — جامعة ويسكونسن في ماديسون", "title": "كانسيان وماير 2014 — في ويسكونسن هبطت حضانة الأم المنفردة هبوطا كبيرا وارتفعت الحضانة المشتركة ارتفاعا هائلا بين 1988 و2008", "source_standing": "ماريا كانسيان ودانيال ماير من معهد أبحاث الفقر بجامعة ويسكونسن، على سجلات محاكم الولاية؛ ومجلة الديموغرافيا لسان الجمعية الأمريكية للسكان.", "evidence_level": "دراسة سجلات المحاكم الرسمية"}, {"section": "soc", "card_number": 111, "supports": ["shared_parenting"], "author": {"name": "Centraal Bureau voor de Statistiek (CBS) — Statistische Trends", "date": "2020"}, "work": {"title": "Meerderheid gescheiden ouders blijft bij elkaar in de buurt", "section": "تقرير الاتجاهات الإحصائية، 30 يونيو 2020، الفقرة التمهيدية", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "\"Tegenwoordig kiest ruim een kwart van de gescheiden ouders voor co-ouderschap (CBS, 2017). Van de ouders die in 2010 uit elkaar gingen koos meer dan een kwart (27 procent) vlak na de scheiding voor co-ouderschap. Bij het merendeel van deze stellen (80 procent) was deze regeling ook twee jaar later nog de dagelijkse praktijk\"", "verbatim": true}, "translation_ar": "«اليوم يختار أكثر من ربع الوالدين المطلقين التناوب في رعاية الأطفال (المكتب المركزي للإحصاء، 2017). ومن الوالدين الذين انفصلوا سنة 2010 اختار أكثر من الربع (27 بالمئة) التناوب في الرعاية بعيد الطلاق مباشرة. وعند أغلب هؤلاء (80 بالمئة) كان هذا الترتيب لا يزال هو المعمول به يوميا بعد سنتين».", "urls": ["https://www.cbs.nl/nl-nl/longread/statistische-trends/2020/meerderheid-gescheiden-ouders-blijft-bij-elkaar-in-de-buurt/1-inleiding"], "links": [{"url": "https://www.cbs.nl/nl-nl/longread/statistische-trends/2020/meerderheid-gescheiden-ouders-blijft-bij-elkaar-in-de-buurt/1-inleiding", "label": "التقرير الرسمي", "site": "المكتب المركزي للإحصاء الهولندي", "domain": "www.cbs.nl"}], "strength": "explicit", "argument": "في هولندا، حيث جعل القانون سنة 2009 التوزيع المتكافئ للرعاية أصلا، صار التناوب اختيار أكثر من ربع المطلقين ويثبت عليه أربعة من كل خمسة؛ فالمناصفة ترتيب يدوم حيث يسمح به القانون.", "jurisdiction": "هولندا — المكتب المركزي للإحصاء", "title": "المكتب المركزي للإحصاء الهولندي 2020 — أكثر من ربع المطلقين يختارون التناوب في رعاية الأطفال، و80% منهم يستمرون عليه", "source_standing": "المكتب المركزي للإحصاء هو الجهاز الإحصائي الرسمي للدولة الهولندية، والتقرير من سلسلته الرسمية للاتجاهات الإحصائية.", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "soc", "card_number": 112, "supports": ["shared_parenting"], "author": {"name": "Brinig MF, Buckley FH", "date": "1998"}, "work": {"title": "Joint Custody: Bonding and Monitoring Theories", "section": "Indiana Law Journal. 1998;73(2):393-427 (ص 393 و425)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"joint-custody laws are significantly correlated with lower divorce rates, as predicted by bonding theories. ... A joint-custody dummy variable was significantly and negatively correlated with divorce rates.\"", "verbatim": true}, "translation_ar": "«قوانين الحضانة المشتركة ترتبط ارتباطا واضحا بانخفاض معدلات الطلاق، كما تتنبأ نظريات الترابط... وكان عامل وجود قانون الحضانة المشتركة مرتبطا ارتباطا واضحا وسالبا بمعدلات الطلاق».", "urls": ["https://ilj.law.indiana.edu/articles/73/73_2_Brinig.pdf"], "links": [{"url": "https://ilj.law.indiana.edu/articles/73/73_2_Brinig.pdf", "label": "نص الدراسة", "site": "مجلة إنديانا للقانون", "domain": "ilj.law.indiana.edu"}], "strength": "explicit", "argument": "حيث شرعت الحضانة المشتركة قل الطلاق؛ لأن من يعلم أنه لن يفقد ولده لا يهدم بيته ولا يهدمه عليه الآخر. فالمناصفة حصن للأسرة لا معول هدم كما يزعم الخصوم.", "jurisdiction": "الولايات المتحدة — جامعة أيوا وجامعة جورج ميسون", "title": "برينيغ وباكلي 1998 — قوانين الحضانة المشتركة ترتبط ارتباطا واضحا بانخفاض معدلات الطلاق في الولايات الأمريكية", "source_standing": "مارغريت برينيغ أستاذة القانون وفرانك باكلي أستاذ القانون في جامعة جورج ميسون، من رواد تحليل قانون الأسرة اقتصاديا، على بيانات الولايات الأمريكية؛ ومجلة إنديانا للقانون من المجلات القانونية الجامعية المحكمة.", "evidence_level": "دراسة قانونية اقتصادية محكمة"}, {"section": "soc", "card_number": 113, "supports": ["shared_parenting"], "author": {"name": "Instituto Nacional de Estadística (INE) — España", "date": "2026"}, "work": {"title": "Estadística de Nulidades, Separaciones y Divorcios (ENSD). Año 2025 — Nota de prensa", "section": "Nota de prensa del INE, 23 de julio de 2026 — «Principales resultados» y sección «Número de hijos, custodia y pensiones»; gráfico «Custodias de hijos menores en", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "\"La custodia compartida fue otorgada en el 50,8% de los casos de divorcio de parejas con hijos, 1,1 puntos más que en el año anterior. … En el 3,4% de estos divorcios la custodia se otorgó al padre, en el 45,3% a la madre, en el 50,8% fue compartida y en el 0,5% se otorgó a otras instituciones o familiares. Cabe destacar que los casos de custodia compartida siguen su tendencia creciente, superando a aquellos en los que la custodia se otorgó a la madre.\"", "verbatim": true}, "translation_ar": "«منحت الحضانة المشتركة في 50.8% من حالات طلاق الأزواج الذين لهم أبناء، بزيادة 1.1 نقطة عن العام السابق. … في 3.4% من هذه الطلاقات منحت الحضانة للأب، وفي 45.3% للأم، وفي 50.8% كانت مشتركة، وفي 0.5% منحت لمؤسسات أو أقارب آخرين. ويجدر التنبيه إلى أن حالات الحضانة المشتركة ماضية في اتجاهها المتصاعد، متجاوزة الحالات التي منحت فيها الحضانة للأم.»", "urls": ["https://www.ine.es/dyngs/Prensa/ENSD2025.htm", "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/20692.csv?nocab=1"], "links": [{"url": "https://www.ine.es/dyngs/Prensa/ENSD2025.htm", "label": "البيان الرسمي", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}, {"url": "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/20692.csv?nocab=1", "label": "المصدر الثاني", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}], "strength": "explicit", "argument": "في إسبانيا صارت الحضانة المشتركة بتناوب الإقامة هي الترتيب الغالب بعد الطلاق: 50.8% من الطلاقات التي فيها أبناء قصر سنة 2025، مقابل 45.3% للأم وحدها و3.4% للأب وحده، وهي نسبة تصاعدت كل سنة بلا انقطاع من 28.4% سنة 2016. فالأصل العملي الذي استقرت عليه محاكم دولة أوروبية كبرى هو بقاء الولد في كنف أبويه معا لا في كنف أحدهما.", "jurisdiction": "إسبانيا — المعهد الوطني للإحصاء (INE)", "title": "الإحصاء الإسباني الرسمي 2025 — الحضانة المشتركة في أكثر من نصف حالات الطلاق: 50.8%", "source_standing": "المعهد الوطني للإحصاء هو جهاز الإحصاء الرسمي للدولة الإسبانية، وإحصاؤه السنوي هذا مبني على أحكام المحاكم كلها في قضايا الطلاق والانفصال (حصر شامل لا عينة). و«الحضانة المشتركة» (custodia compartida) في القانون الإسباني تعني تناوب إقامة الولد بين بيت الأب وبيت الأم (المادة 92 من القانون المدني)، وهي غير الولاية على الولد (patria potestad) التي تبقى مشتركة بين الأبوين في كل الأحوال.", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "soc", "card_number": 114, "supports": ["shared_parenting"], "author": {"name": "Instituto Nacional de Estadística (INE) — España", "date": "2024"}, "work": {"title": "Estadística de Nulidades, Separaciones y Divorcios (ENSD). Año 2023 — Nota de prensa", "section": "Nota de prensa del INE, 11 de julio de 2024 — «Principales resultados» y sección «Número de hijos, custodia y pensiones»; gráfico «Custodias de hijos menores en", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "\"La custodia compartida fue otorgada en el 48,4% de los casos de divorcio de parejas con hijos, 2,9 puntos más que el año anterior. … En el 3,5% de estos divorcios la custodia se otorgó al padre, en el 47,8% a la madre, en el 48,4% fue compartida y en el 0,3% se otorgó a otras instituciones o familiares. Cabe destacar que, por primera vez, los casos de custodia compartida superaron a aquellos en los que la custodia se otorgó a la madre.\"", "verbatim": true}, "translation_ar": "«منحت الحضانة المشتركة في 48.4% من حالات طلاق الأزواج الذين لهم أبناء، بزيادة 2.9 نقطة عن العام السابق. … في 3.5% من هذه الطلاقات منحت الحضانة للأب، وفي 47.8% للأم، وفي 48.4% كانت مشتركة، وفي 0.3% منحت لمؤسسات أو أقارب آخرين. ويجدر التنبيه إلى أن حالات الحضانة المشتركة تجاوزت، للمرة الأولى، الحالات التي منحت فيها الحضانة للأم.»", "urls": ["https://www.ine.es/dyngs/Prensa/ENSD2023.htm", "https://www.ine.es/dyngs/Prensa/ENSD2024.htm"], "links": [{"url": "https://www.ine.es/dyngs/Prensa/ENSD2023.htm", "label": "البيان الرسمي", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}, {"url": "https://www.ine.es/dyngs/Prensa/ENSD2024.htm", "label": "بيان 2024", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}], "strength": "explicit", "argument": "سنة 2023 هي السنة التي تخطت فيها الحضانة المشتركة حضانة الأم المنفردة في إسبانيا للمرة الأولى في تاريخ الإحصاء الرسمي، بعد أن كانت 21.3% فقط سنة 2014؛ أي أن النسبة تضاعفت أكثر من مرتين في عشر سنين، والمعهد نفسه يصف ذلك بأنه «اتجاه متصاعد». فمنح الولد لأحد الأبوين وحده لم يعد هو القاعدة في القضاء الإسباني.", "jurisdiction": "إسبانيا — المعهد الوطني للإحصاء (INE)", "title": "الإحصاء الإسباني الرسمي 2023 — لأول مرة تتقدم الحضانة المشتركة على حضانة الأم", "source_standing": "النوتة الصحفية الرسمية للمعهد الوطني للإحصاء الإسباني عن سنة 2023، وهي السنة التي سجل فيها المعهد بنصه أن الحضانة المشتركة تجاوزت «للمرة الأولى» حضانة الأم. ونوتة سنة 2024 (18 يوليو 2025، الرابط الثاني) تؤكد استمرار الاتجاه: 49.7% مشتركة مقابل 46.6% للأم و3.4% للأب.", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "soc", "card_number": 115, "supports": ["shared_parenting"], "author": {"name": "Instituto Nacional de Estadística (INE) — España", "date": "2011"}, "work": {"title": "Estadística de Nulidades, Separaciones y Divorcios. Año 2010 — Nota de prensa (19 de septiembre de 2011)", "section": "Nota de prensa del INE (np673), 19 de septiembre de 2011, página 3 (custodia de los hijos menores); y Nota de prensa ENSD Año 2014 (np927), 15 de septiembre de ", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "\"La custodia de los hijos menores fue otorgada a la madre en el 83,2% de las rupturas matrimoniales, cifra similar a la observada en el año anterior (84%). En el 5,7% de las disoluciones la custodia la obtuvo el padre (similar al 5,6% de 2009), en el 10,5% fue compartida (ligeramente superior al 9,7% del año anterior) y en el 0,6% se otorgó a otros (instituciones, otros familiares). … [Año 2014:] La custodia compartida de los hijos fue otorgada en el 21,3% de los casos de divorcio. … en el 21,2% fue compartida (17,9% del año anterior)\"", "verbatim": true}, "translation_ar": "«منحت حضانة الأبناء القصر للأم في 83.2% من حالات انحلال الزواج، وهو رقم قريب مما لوحظ في العام السابق (84%). وفي 5.7% من حالات الانحلال حصل الأب على الحضانة (قريب من 5.6% سنة 2009)، وفي 10.5% كانت مشتركة (أعلى قليلا من 9.7% في العام السابق)، وفي 0.6% منحت لغيرهما (مؤسسات أو أقارب آخرين). … [سنة 2014:] منحت الحضانة المشتركة للأبناء في 21.3% من حالات الطلاق. … في 21.2% كانت مشتركة (17.9% في العام السابق)»", "urls": ["https://www.ine.es/prensa/np673.pdf", "https://www.ine.es/prensa/np927.pdf"], "links": [{"url": "https://www.ine.es/prensa/np673.pdf", "label": "البيان الرسمي", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}, {"url": "https://www.ine.es/prensa/np927.pdf", "label": "بيان 2014", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}], "strength": "explicit", "argument": "في خمس عشرة سنة فقط انقلبت الصورة في إسبانيا: من حضانة للأم في 83.2% من الحالات ومشتركة في 10.5% سنة 2010، إلى مشتركة في 50.8% وللأم في 45.3% سنة 2025، أي أن الحضانة المشتركة تضاعفت نحو خمس مرات. فالتحول نحو بقاء الولد مع أبويه معا ليس نظرية بل واقع قضائي موثق سنة بسنة من جهاز الدولة الإحصائي.", "jurisdiction": "إسبانيا — المعهد الوطني للإحصاء (INE)", "title": "الإحصاء الإسباني الرسمي 2010 — الحضانة المشتركة 10.5% فقط، فتضاعفت خمس مرات في خمس عشرة سنة", "source_standing": "نوتتان صحفيتان رسميتان للمعهد الوطني للإحصاء الإسباني تعطيان نقطة البداية في السلسلة الرسمية: 9.7% سنة 2009 و10.5% سنة 2010، ثم 17.9% سنة 2013 و21.3% سنة 2014. ومع نوتة سنة 2025 (50.8% مشتركة، 45.3% للأم) تكتمل سلسلة من 16 سنة متصلة. وتلاحظ أن المحكمة العليا الإسبانية قضت سنة 2013 (STS 257/2013، وهي بطاقة في المدونة) بأن الحضانة المشتركة هي الأصل، فجاءت الأرقام بعدها مطابقة لذلك.", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "soc", "card_number": 116, "supports": ["shared_parenting"], "author": {"name": "Instituto Nacional de Estadística (INE) — España", "date": "2026"}, "work": {"title": "Divorcios entre cónyuges de diferente sexo según cónyuge que debe ejercer la custodia — Resultados por comunidades y ciudades autónomas. Año 2025 (INEbase, tabla 21549)", "section": "INEbase — Estadística de Nulidades, Separaciones y Divorcios 2025, tabla 21549 (descarga CSV), periodo 2025", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"09 Cataluña;Padre;2025;161 — 09 Cataluña;Madre;2025;2.124 — 09 Cataluña;Custodia compartida;2025;3.965 … 16 País Vasco;Padre;2025;34 — 16 País Vasco;Madre;2025;608 — 16 País Vasco;Custodia compartida;2025;995 … 04 Balears, Illes;Padre;2025;60 — 04 Balears, Illes;Madre;2025;317 — 04 Balears, Illes;Custodia compartida;2025;547 … 02 Aragón;Padre;2025;26 — 02 Aragón;Madre;2025;411 — 02 Aragón;Custodia compartida;2025;580 … 17 Rioja, La;Padre;2025;8 — 17 Rioja, La;Madre;2025;89 — 17 Rioja, La;Custodia compartida;2025;170\"", "verbatim": true}, "translation_ar": "«كتالونيا: الأب 161، الأم 2,124، حضانة مشتركة 3,965 … إقليم الباسك: الأب 34، الأم 608، حضانة مشتركة 995 … جزر البليار: الأب 60، الأم 317، حضانة مشتركة 547 … أراغون: الأب 26، الأم 411، حضانة مشتركة 580 … لا ريوخا: الأب 8، الأم 89، حضانة مشتركة 170 (أعداد أحكام الطلاق سنة 2025 بحسب من يتولى الحضانة)»", "urls": ["https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/21549.csv?nocab=1", "https://www.ine.es/jaxiT3/Tabla.htm?t=21549&L=0"], "links": [{"url": "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/21549.csv?nocab=1", "label": "جدول الإحصاء الرسمي", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}, {"url": "https://www.ine.es/jaxiT3/Tabla.htm?t=21549&L=0", "label": "المصدر الثاني", "site": "المعهد الوطني للإحصاء في إسبانيا", "domain": "www.ine.es"}], "strength": "explicit", "argument": "في تسعة أقاليم إسبانية صارت الحضانة المشتركة أكثر من نصف أحكام الطلاق سنة 2025: لا ريوخا 63.2%، كتالونيا 63.2%، إقليم الباسك 60.4%، جزر البليار 58.8%، أراغون 56.1%، جزر الكناري 55.8%، فالنسيا 53.5%، أستورياس 50.8%، مدريد 50.2%. ففي كتالونيا وحدها حكمت المحاكم بالحضانة المشتركة في 3,965 طلاقا مقابل 2,124 للأم وحدها، أي نحو ضعف حضانة الأم المنفردة.", "jurisdiction": "إسبانيا — المعهد الوطني للإحصاء (INE)", "title": "الإحصاء الإسباني الرسمي 2025 — الحضانة المشتركة أغلبية في تسعة أقاليم: كتالونيا 63%", "source_standing": "جدول رسمي من قاعدة بيانات المعهد الوطني للإحصاء (INEbase) ضمن إحصاء البطلان والانفصال والطلاق لسنة 2025، يعرض أعداد أحكام الطلاق في كل إقليم بحسب من يتولى الحضانة. والنسب المذكورة في الحجة محسوبة من أعداد الجدول بقسمة الحضانة المشتركة على مجموع الحالات التي تقررت فيها حضانة (الأب + الأم + مشتركة + غيرهم)، وهي الطريقة نفسها التي تعطي أرقام نوتات المعهد الصحفية (50.8% على مستوى الدولة سنة 2025).", "evidence_level": "إحصاء رسمي للدولة"}, {"section": "harm", "card_number": 117, "supports": ["shared_parenting"], "author": {"name": "McLanahan S, Tach L, Schneider D", "date": "2013"}, "work": {"title": "The causal effects of father absence", "section": "Annual Review of Sociology 39:399–427", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: مراجعة لنحو خمسين دراسة بمناهج تكشف السببية؛ والدراسات الأحكم منهجا ما زالت تجد لغياب الأب أثرا سيئا في حال الأبناء، وأقوى الأدلة في إتمام التعليم والتوافق الاجتماعي العاطفي والصحة النفسية في الرشد.", "verbatim": false}, "translation_ar": "", "urls": ["https://ffcws.princeton.edu/publications/causal-effects-father-absence"], "links": null, "strength": "explicit", "argument": "غياب الأب سبب للضرر لا مجرد قرين له، فالحكم الذي يغيب الأب عن ولده سنين يوقع الضرر الذي أثبته علم الاجتماع.", "jurisdiction": "الولايات المتحدة — جامعة برنستون", "title": "علم الاجتماع 2013 — غياب الأب سبب للضرر", "source_standing": "سارة ماكلاناهان (1940–2021) أستاذة علم الاجتماع في جامعة برنستون، مؤسسة دراسة الأسر الهشة ورفاه الطفل؛ والمراجعة السنوية لعلم الاجتماع من أرفع منشورات التخصص.", "evidence_level": "مراجعة منهجية للأدلة السببية"}, {"sectio ندا بسجلات الجرائم حتى الثانية والثلاثين. ميزوا بين الأسرة ذات الوالد الواحد منذ الولادة، واستمرار ذلك إلى الرابعة عشرة، ووفاة الوالد، والطلاق. ارتبط الطلاق بالجرائم العنيفة بزيادة في الخطر تبلغ مرتين ونصفا (نسبة الخطر المعدلة 2.5)؛ وارتبط أيضا بالجرائم غير العنيفة.", "verbatim": false}, "translation_ar": "", "urls": ["https://journals.sagepub.com/doi/10.1177/002076402128783163", "https://pubmed.ncbi.nlm.nih.gov/12182506/"], "links": null, "strength": "explicit", "argument": "في متابعة مواليد شمال فنلندا ارتبط الطلاق بالجرائم العنيفة بخطر يبلغ ضعفين ونصفا؛ فتفكيك صلة الولد بأبيه باب من أبواب الانحراف.", "jurisdiction": "فنلندا — متابعة مواليد شمال فنلندا 1966", "title": "بناء الأسرة وجرائم الأبناء في متابعة فنلندية", "source_standing": "الدراسة على متابعة مواليد شمال فنلندا 1966، من أشهر دراسات المتابعة الطبية في العالم، بسجلات وزارة العدل الفنلندية؛ والمجلة الدولية للطب النفسي الاجتماعي تصدرها دار سيج.", "evidence_level": "دراسة متابعة مواليد"}, {"section": "harm", "card_number": 125, "supports": ["shared_parenting"], "author": {"name": "Auersperg F, Vlasak T, Ponocny I, Barth A", "date": "2019"}, "work": {"title": "Long-term effects of parental divorce on mental health – A meta-analysis", "section": "Journal of Psychiatric Research. 2019;119:107–115", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: جمع التحليل الجامع للدراسات 54 دراسة، بإجمالي معلن 506299 مشاركا، تناولت طلاق الوالدين وصحة أبنائهم النفسية لاحقا. فزاد خطر الاكتئاب بنسبة 29% (نسبة الخطر المجمعة 1.29)، وخطر محاولة الانتحار بنسبة 35% (1.35).", "verbatim": false}, "translation_ar": "", "urls": ["https://www.sfu.ac.at/en/news/new-publication-long-term-effects-of-parental-divorce-on-mental-health/", "https://research.sfu.ac.at/en/publications/long-term-effects-of-parental-divorce-on-mental-health-a-meta-ana/"], "links": null, "strength": "explicit", "argument": "تحليل 54 دراسة ونصف مليون مشارك: أبناء الطلاق أكثر عرضة للاكتئاب ومحاولة الانتحار في كبرهم؛ فحماية صلة الولد بأبويه وقاية لصحته النفسية.", "jurisdiction": "دراسات متعددة البلدان؛ فريق بحثي من النمسا", "title": "طلاق الوالدين والصحة النفسية لاحقا: تحليل 54 دراسة", "source_standing": "تحليل جامع لعدة دراسات لفريق من فيينا جمع أربعا وخمسين دراسة؛ ومجلة البحث النفسي مجلة طب نفسي محكمة تصدرها دار إلزفير.", "evidence_level": "تحليل جامع لعدة دراسات: أعلى درجات الدليل"}, {"section": "harm", "card_number": 126, "supports": ["shared_parenting"], "author": {"name": "Paananen R, Ristikari T, Merikukka M, Gissler M", "date": "2013"}, "work": {"title": "Social determinants of mental health: a Finnish nationwide follow-up study on mental disorders", "section": "Journal of Epidemiology and Community Health. 2013;67(12):1025–1031", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تابعت الدراسة السجلية 59476 من مواليد فنلندا سنة 1987 حتى سن 21. سجل اضطراب نفسي مشخص لدى 7578 منهم، أي 12.7% من الجماعة كلها. وارتبط طلاق الوالدين بزيادة خطر الاضطراب بنحو الثلث (نسبة الخطر 1.33). كما ارتبطت بها عوامل أسرية واجتماعية أخرى، بينها المشكلات النفسية لدى الوالدين والحرمان الاقتصادي.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/23908462/", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:23908462&format=json&resultType=core"], "links": null, "strength": "explicit", "argument": "في جماعة ميلاد فنلندية كاملة ارتبط طلاق الوالدين بالاضطرابات النفسية المشخصة حتى الحادية والعشرين.", "jurisdiction": "فنلندا؛ المعهد الوطني للصحة والرفاه", "title": "الطلاق والاضطرابات النفسية المشخصة في جماعة ميلاد فنلندية", "source_standing": "الدراسة من المعهد الوطني للصحة والرفاه في فنلندا، على متابعة المواليد الفنلنديين بالسجلات الوطنية؛ ومجلة علم الأوبئة وصحة المجتمع تصدرها مجموعة المجلة الطبية البريطانية.", "evidence_level": "دراسة متابعة وطنية بالسجلات"}, {"section": "harm", "card_number": 127, "supports": ["shared_parenting"], "author": {"name": "Tullius JM, De Kroon MLA, Almansa J, Reijneveld SA", "date": "2022"}, "work": {"title": "Adolescents’ mental health problems increase after parental divorce, not before, and persist until adulthood: a longitudinal TRAILS study", "section": "European Child and Adolescent Psychiatry. 2022;31(6):969–978", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: استخدمت دراسة هولندية أربع موجات من جماعة بدأت بـ2230 مشاركا بعمر 10–12 سنة، وتوفرت متابعة لاحقة لـ1881 منهم. ارتفعت درجات المشكلات الانفعالية والسلوكية بعد طلاق الوالدين أو انفصالهما، واستمرت الفروق خلال المتابعة؛ ولم يرصد الحساب زيادة يعتد بها في القياس السابق للانفصال.", "verbatim": false}, "translation_ar": "", "urls": ["https://link.springer.com/article/10.1007/s00787-020-01715-0"], "links": null, "strength": "explicit", "argument": "المشكلات الانفعالية والسلوكية عند المراهقين الهولنديين ارتفعت بعد انفصال الوالدين واستمرت؛ فالفرقة تحتاج إلى نظام يحفظ الطفل بأبويه معا.", "jurisdiction": "هولندا؛ شمال البلاد وجامعة خرونينغن", "title": "الأعراض النفسية والسلوكية قبل الانفصال وبعده في هولندا", "source_standing": "دراسة تريلز الممتدة سنوات من جامعة خرونينغن في هولندا، تتابع المشاركين من الطفولة إلى الرشد؛ والمجلة لسان الجمعية الأوروبية للطب النفسي للأطفال والمراهقين.", "evidence_level": "دراسة متابعة طويلة سكانية"}, {"section": "harm", "card_number": 128, "supports": ["shared_parenting"], "author": {"name": "Baker AJL", "date": "2005"}, "work": {"title": "The long-term effects of parental alienation on adult children: a qualitative research study", "section": "American Journal of Family Therapy 33(4):289–302", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "A qualitative retrospective study was conducted on 38 adults who experienced parental alienation as a child. [...] Results revealed seven major areas of impact: (1) low self-esteem, (2) depression, (3) drug/alcohol abuse, (4) lack of trust, (5) alienation from own children, (6) divorce, and (7) other.", "verbatim": true}, "translation_ar": "«أجريت دراسة وصفية استرجاعية على 38 بالغا عانوا في طفولتهم من التنفير من أحد الوالدين. [...] وكشفت النتائج عن سبعة مجالات رئيسية للأثر: (1) تدني تقدير الذات، (2) الاكتئاب، (3) تعاطي المخدرات أو الكحول، (4) انعدام الثقة، (5) الانفصال عن أبنائهم هم، (6) الطلاق، (7) آثار أخرى.»", "urls": ["https://doi.org/10.1080/01926180590962129"], "links": [{"url": "https://doi.org/10.1080/01926180590962129", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "أثر تنفير الطفل من أبيه يلازمه إلى رشده، فيورثه الاكتئاب والإدمان وضعف الثقة، وينتقل إلى الجيل الذي بعده.", "jurisdiction": "الولايات المتحدة", "title": "إيمي بيكر 2005 — آثار التنفير تمتد إلى الرشد", "source_standing": "إيمي بيكر عالمة نفس أمريكية، من أبرز الباحثين في تنفير الطفل من أحد والديه؛ والمجلة الأمريكية للعلاج الأسري مجلة محكمة تصدرها دار تايلور وفرانسيس.", "evidence_level": "دراسة ميدانية بالمقابلات"}, {"section": "harm", "card_number": 129, "supports": ["9", "shared_parenting"], "author": {"name": "Ellis BJ, Bates JE, Dodge KA, Fergusson DM, Horwood LJ, Pettit GS, Woodward L", "date": "2003"}, "work": {"title": "Does father absence place daughters at special risk for early sexual activity and teenage pregnancy?", "section": "Child Development 74(3):801–821", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "The impact of father absence on early sexual activity and teenage pregnancy was investigated in longitudinal studies in the United States (N = 242) and New Zealand (N = 520), in which community samples of girls were followed prospectively from early in life (5 years) to approximately age 18. Greater exposure to father absence was strongly associated with elevated risk for early sexual activity and adolescent pregnancy.", "verbatim": true}, "translation_ar": "«درس أثر غياب الأب في النشاط الجنسي المبكر والحمل في سن المراهقة في دراستي متابعة في الولايات المتحدة (242 بنتا) ونيوزيلندا (520 بنتا)، تتبعت فيهما عينات من البنات من سن 5 سنوات إلى نحو 18 سنة. وكان التعرض الأكبر لغياب الأب مرتبطا ارتباطا قويا بارتفاع خطر النشاط الجنسي المبكر والحمل في المراهقة.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/12795391/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/12795391/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "دليل من بلدين على أن البنت أحوج إلى صيانة أبيها، وأن غيابه يعرضها للخطر؛ وهو عين علة الفقهاء في نقل الجارية إلى أبيها عند الإدراك.", "jurisdiction": "الولايات المتحدة ونيوزيلندا", "title": "دراسة أمريكية نيوزيلندية 2003 — غياب الأب يعرض البنات للخطر", "source_standing": "بروس إليس أستاذ في جامعة يوتا، ومعه كينيث دودج من جامعة ديوك وديفيد فيرغسون من جامعة أوتاغو في نيوزيلندا؛ ومجلة نمو الطفل أرفع مجلات علم نفس النمو.", "evidence_level": "دراسة متابعة طويلة في بلدين"}, {"section": "harm", "card_number": 130, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Kruk E", "date": "1989"}, "work": {"title": "Impact of divorce on non-custodial fathers: psychological and structural factors contributing to disengagement", "section": "رسالة دكتوراه، جامعة إدنبرة 1989؛ نشرت في Journal of Divorce and Remarriage. 1991;16(3-4):195-227", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the dominant response of non-custodial fathers subsequent to divorce is one of bereavement, linked primarily to their experience of child absence, role loss, and the constraints of the new 'visiting' relationship with their children; ... there is a striking discontinuity between pre- and post-divorce father-child relationships\"", "verbatim": true}, "translation_ar": "«الاستجابة الغالبة عند الآباء غير الحاضنين بعد الطلاق هي الثكل، وترتبط أساسا بتجربة غياب الولد وفقدان الدور وقيود علاقة «الزيارة» الجديدة بأولادهم... وهناك انقطاع صارخ بين علاقة الأب بولده قبل الطلاق وبعده».", "urls": ["https://era.ed.ac.uk/items/4055a1d5-5b2c-4574-a08e-35327568d085/full", "https://doi.org/10.1300/J087v16n03_03"], "links": [{"url": "https://era.ed.ac.uk/items/4055a1d5-5b2c-4574-a08e-35327568d085/full", "label": "سجل الرسالة", "site": "مستودع جامعة إدنبرة", "domain": "era.ed.ac.uk"}, {"url": "https://doi.org/10.1300/J087v16n03_03", "label": "صفحة الدراسة", "site": "مجلة الطلاق والزواج من جديد", "domain": "doi.org"}], "strength": "explicit", "argument": "علاقة الزيارة بذاتها هي ما يقطع صلة الأب بولده، فالأب الذي كان أقرب الناس إلى ولده يتحول بقيود الزيارة إلى زائر ثاكل ثم ينقطع.", "jurisdiction": "المملكة المتحدة — جامعة إدنبرة", "title": "كروك 1989 — علاقة «الزيارة» تحول الأب إلى ثاكل وتقطع صلته بولده", "source_standing": "دراسة ميدانية على ثمانين أبا في اسكتلندا وأونتاريو، صارت البحث المرجعي في انسحاب الآباء بعد الطلاق؛ وإدوارد كروك اليوم أستاذ الخدمة الاجتماعية في جامعة كولومبيا البريطانية.", "evidence_level": "دراسة ميدانية مرجعية"}, {"section": "harm", "card_number": 131, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Braver SL, Ellman IM, Fabricius WV", "date": "2003"}, "work": {"title": "Relocation of children after divorce and children's best interests: new evidence and legal considerations", "section": "Journal of Family Psychology. 2003;17(2):206-219", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The current study provides the first direct evidence on relocation by dividing college students into groups on the basis of their divorced parents' move-away status. On most child outcomes, the ones whose parents moved are significantly disadvantaged.\"", "verbatim": true}, "translation_ar": "«تقدم هذه الدراسة أول دليل مباشر على الانتقال، بتقسيم طلاب الجامعة إلى مجموعات بحسب انتقال أحد والديهم المطلقين بعيدا. وفي معظم نتائج الأبناء كان من انتقل أحد والديهم بعيدا أسوأ حالا بدلالة».", "urls": ["https://asu.elsevierpure.com/en/publications/relocation-of-children-after-divorce-and-childrens-best-interests", "https://doi.org/10.1037/0893-3200.17.2.206"], "links": [{"url": "https://asu.elsevierpure.com/en/publications/relocation-of-children-after-divorce-and-childrens-best-interests", "label": "سجل الدراسة", "site": "بوابة بحوث جامعة ولاية أريزونا", "domain": "asu.elsevierpure.com"}, {"url": "https://doi.org/10.1037/0893-3200.17.2.206", "label": "صفحة الدراسة", "site": "APA PsycNet", "domain": "doi.org"}], "strength": "explicit", "argument": "مجرد البعد الجغرافي عن أحد الوالدين يضر الولد في معظم مقاييس حياته، فكيف ببعد يفرضه القانون داخل المدينة الواحدة بمنع المبيت والاصطحاب؟", "jurisdiction": "الولايات المتحدة — جامعة ولاية أريزونا", "title": "برافر وإلمان وفابريشيوس 2003 — إبعاد الولد عن أحد والديه يضره في معظم النتائج", "source_standing": "سانفورد برافر من رواد بحوث الطلاق، وإيرا إلمان من كبار أساتذة قانون الأسرة ومقرر مبادئ انحلال الأسرة في معهد القانون الأمريكي، ووليام فابريشيوس من أبرز باحثي وقت الرعاية؛ والمجلة تصدرها جمعية علم النفس الأمريكية.", "evidence_level": "دراسة ميدانية مرجعية"}, {"section": "harm", "card_number": 132, "supports": ["silat_al_rahim"], "author": {"name": "Comanor WS, Phillips L", "date": "2002"}, "work": {"title": "The Impact of Income and Family Structure on Delinquency", "section": "Journal of Applied Economics 5(2): 209–232", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Using data from the National Longitudinal Survey of Youth, we estimate the impact of family income and various dimensions of family structure on a youth's contact with the criminal justice system between the ages of 14 and 22. From this analysis, we conclude that the single most important factor affecting these measures of delinquency is the presence of his father in the home. All other factors, including family income, are much less important.\"", "verbatim": true}, "translation_ar": "«باستعمال بيانات المسح الوطني الأمريكي الممتد للشباب، نقدر أثر دخل الأسرة وأبعاد مختلفة من بنية الأسرة في احتكاك الشاب بنظام العدالة الجنائية بين سن 14 و22. ونخلص من هذا التحليل إلى أن العامل الأهم على الإطلاق المؤثر في مقاييس الجنوح هذه هو وجود أبيه [الشاب] في البيت. أما العوامل الأخرى كلها، ومنها دخل الأسرة، فأقل أهمية بكثير.»", "urls": ["https://doi.org/10.1080/15140326.2002.12040577", "https://api.openalex.org/works/doi:10.1080/15140326.2002.12040577"], "links": [{"url": "https://doi.org/10.1080/15140326.2002.12040577", "label": "صفحة الدراسة", "site": "صفحة الدراسة", "domain": "doi.org"}, {"url": "https://api.openalex.org/works/doi:10.1080/15140326.2002.12040577", "label": "المصدر الثاني", "site": "سجل OpenAlex", "domain": "api.openalex.org"}], "strength": "explicit", "argument": "تقطع الدراسة بأن وجود الأب في البيت هو العامل الأول في وقاية الفتى من الجنوح والوقوع في يد العدالة الجنائية، وأن الدخل أقل أثرا بكثير؛ فحرمان الولد من أبيه ضرر لا يعوضه المال ولا النفقة.", "jurisdiction": "الولايات المتحدة — المسح الوطني الممتد للشباب (NLSY)", "title": "كومانور وفيليبس 2002 — وجود الأب في البيت أهم عامل في وقاية الولد من الجنوح، والدخل أقل أثرا", "source_standing": "ويليام كومانور ولاد فيليبس أستاذا الاقتصاد بجامعة كاليفورنيا في سانتا باربرا، في مجلة الاقتصاد التطبيقي المحكمة التي تصدرها جامعة سيما الأرجنتينية وتنشرها دار تايلور وفرانسيس. تنبيه: صفحة الناشر محجوبة في هذه الجلسة، والنص مأخوذ حرفيا من ملخص الناشر المودع في قاعدة OpenAlex.", "evidence_level": "دراسة محكمة على مسح وطني ممتد"}, {"section": "harm", "card_number": 133, "supports": ["silat_al_rahim"], "author": {"name": "Antecol H, Bedard K", "date": "2007"}, "work": {"title": "Does single parenthood increase the probability of teenage promiscuity, substance use, and crime?", "section": "Journal of Population Economics 20(1): 55–71", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"There is longstanding evidence that youths raised by single parents are more likely to perform poorly in school and partake in “deviant” behaviors such as smoking, sex, substance use, and crime. … Using the National Longitudinal Survey of Youth and its Young Adult Supplement, we find that an additional 5 years with the biological father decreases the probability of smoking, drinking, engaging in sexual activity, marijuana use, and conviction by approximately 5.3, 1.2, 3.4, 2.2 and 0.3 percentage points, respectively.\"", "verbatim": true}, "translation_ar": "«ثمة أدلة قديمة على أن اليافعين الذين يربيهم والد واحد أكثر عرضة لضعف الأداء المدرسي وللسلوك «المنحرف» كالتدخين والجنس وتعاطي المواد والجريمة. ... وباستعمال المسح الوطني الممتد للشباب وملحقه الخاص بالشباب البالغين نجد أن كل 5 سنوات إضافية يقضيها الولد مع أبيه البيولوجي تخفض احتمال التدخين وشرب الخمر وممارسة الجنس وتعاطي الماريجوانا والإدانة الجنائية بنحو 5.3 و1.2 و3.4 و2.2 و0.3 نقطة مئوية على الترتيب.»", "urls": ["https://link.springer.com/article/10.1007/s00148-005-0019-x", "https://doi.org/10.1007/s00148-005-0019-x"], "links": [{"url": "https://link.springer.com/article/10.1007/s00148-005-0019-x", "label": "صفحة الدراسة", "site": "دار سبرينغر", "domain": "link.springer.com"}, {"url": "https://doi.org/10.1007/s00148-005-0019-x", "label": "المصدر الثاني", "site": "صفحة الدراسة", "domain": "doi.org"}], "strength": "explicit", "argument": "تبين الدراسة أن طول مدة إقامة الولد مع أبيه يخفض التدخين والخمر والجنس المبكر والمخدرات والإدانة الجنائية خفضا مقيسا بالأرقام؛ فكل سنة يحرم فيها الولد من أبيه خسارة محسوبة في سلوكه ومستقبله.", "jurisdiction": "الولايات المتحدة — المسح الوطني الممتد للشباب وملحق الشباب البالغين (NLSY)", "title": "أنتيكول وبيدار 2007 — كل خمس سنين إضافية مع الأب تخفض التدخين والمخدرات والإدانات", "source_standing": "هيذر أنتيكول أستاذة الاقتصاد بكلية كليرمونت ماكينا وكيلي بيدار أستاذة الاقتصاد بجامعة كاليفورنيا في سانتا باربرا، في مجلة اقتصاد السكان وهي من أبرز المجلات المحكمة في بابها (دار شبرينغر). قرئ الملخص كاملا على صفحة الناشر؛ وسجل OpenAlex لهذه الورقة تعذر قراءته بسبب تقييد الطلبات.", "evidence_level": "دراسة محكمة على مسح وطني ممتد"}, {"section": "harm", "card_number": 134, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Bramlett MD, Blumberg SJ", "date": "2007"}, "work": {"title": "Family Structure And Children's Physical And Mental Health", "section": "Health Affairs 26(2): 549–558", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Children in step, single-mother, or grandparent-only families had poorer health than children living with two biological parents. Adjusting for demographic differences reduced observed disparities, although children living in single-mother or grandparent-only families still had poorer health than children living with two biological parents. Adjusted estimates showed that children in single-father families generally did as well as (for mental health) or better than (for physical health) children living with two biological parents.\"", "verbatim": true}, "translation_ar": "«كان الأطفال في أسر زوج الأم أو الأم وحدها أو الجدين وحدهما أسوأ صحة من الأطفال الذين يعيشون مع والديهم البيولوجيين معا. وقلل تعديل الفروق السكانية من الفوارق الملحوظة، لكن الأطفال الذين يعيشون مع الأم وحدها أو مع الجدين وحدهما ظلوا أسوأ صحة من الأطفال الذين يعيشون مع والديهم البيولوجيين معا. وبينت التقديرات المعدلة أن الأطفال في أسر الأب وحده كانوا عموما بمثل حال أطفال الوالدين البيولوجيين معا (في الصحة النفسية) أو أحسن منهم (في الصحة الجسدية).»", "urls": ["https://doi.org/10.1377/hlthaff.26.2.549", "https://api.openalex.org/works/doi:10.1377/hlthaff.26.2.549"], "links": [{"url": "https://doi.org/10.1377/hlthaff.26.2.549", "label": "صفحة الدراسة", "site": "صفحة الدراسة", "domain": "doi.org"}, {"url": "https://api.openalex.org/works/doi:10.1377/hlthaff.26.2.549", "label": "المصدر الثاني", "site": "سجل OpenAlex", "domain": "api.openalex.org"}], "strength": "explicit", "argument": "بيانات رسمية أمريكية تبين أن أطفال الأم المنفردة أسوأ صحة حتى بعد تعديل الفروق، بينما أطفال الأب المنفرد بمثل حال أطفال الأسرة المجتمعة أو أحسن؛ فلا مسوغ لافتراض أن بقاء الطفل مع أمه وحدها أصلح له من انتقاله إلى أبيه.", "jurisdiction": "الولايات المتحدة — المسح الوطني لصحة الأطفال 2003، المركز الوطني للإحصاءات الصحية (CDC)", "title": "دراسة المسح الوطني لصحة الأطفال 2007 — أطفال الأسر بلا أب أسوأ صحة، وأسر الآباء المنفردين كالأسر المجتمعة", "source_standing": "المؤلفان باحثان في المركز الوطني للإحصاءات الصحية التابع لمراكز مكافحة الأمراض الأمريكية (CDC)، والبيانات من المسح الوطني الرسمي لصحة الأطفال؛ والمجلة من أرفع المجلات المحكمة في السياسة الصحية. تنبيه: صفحة الناشر محجوبة في هذه الجلسة، والملخص مأخوذ كاملا من نص الناشر المودع في قاعدة OpenAlex.", "evidence_level": "دراسة محكمة على مسح وطني رسمي"}, {"section": "harm", "card_number": 135, "supports": ["silat_al_rahim"], "author": {"name": "Mäkikyrö T, Sauvola A, Moring J, Veijola JM, Nieminen PA, Järvelin MR, Isohanni MK", "date": "1998"}, "work": {"title": "Hospital-Treated Psychiatric Disorders in Adults with a Single-Parent and Two-Parent Family Background: A 28-Year Follow-up of the 1966 Northern Finland Birth Cohort", "section": "Family Process 37(3): 335–344", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"… the family type (two-parent and 4 different single-parent types, mainly divorced) during childhood up to 14 years of age and adult hospital-treated psychiatric disorders … Northern Finland 1966 Birth Cohort (N = 11,017). … 3.1% in two-parent families and 5.4% in single-parent families (p < .001). … The adjusted odds ratios (OR) for personality disorders were highest among individuals without a father before the age of 14 years (OR 4.8), or at birth only (OR 4.0), or with a history of parental divorce (OR 2.8).\"", "verbatim": true}, "translation_ar": "«... نوع الأسرة (والدان معا، و4 أنواع من أسر الوالد الواحد، أكثرها بسبب الطلاق) في الطفولة حتى سن 14 وبين الاضطرابات النفسية المعالجة في المستشفى في الكبر ... مواليد شمال فنلندا سنة 1966 (العدد 11017). ... 3.1% في أسر الوالدين معا و5.4% في أسر الوالد الواحد (p < .001). ... وكانت نسب الخطر المعدلة (OR) لاضطرابات الشخصية أعلى ما تكون عند من عاشوا بلا أب قبل سن 14 (4.8)، أو بلا أب عند الولادة فقط (4.0)، أو عند من طلق والداهم (2.8).»", "urls": ["https://doi.org/10.1111/j.1545-5300.1998.00335.x", "https://api.openalex.org/works/doi:10.1111/j.1545-5300.1998.00335.x"], "links": [{"url": "https://doi.org/10.1111/j.1545-5300.1998.00335.x", "label": "صفحة الدراسة", "site": "صفحة الدراسة", "domain": "doi.org"}, {"url": "https://api.openalex.org/works/doi:10.1111/j.1545-5300.1998.00335.x", "label": "المصدر الثاني", "site": "سجل OpenAlex", "domain": "api.openalex.org"}], "strength": "explicit", "argument": "من عاش بلا أب في طفولته حتى 14 كان الأكثر عرضة لاضطرابات الشخصية في الكبر (نحو 5 أضعاف)، وكان المرض النفسي المعالج في المستشفى عند أبناء الوالد الواحد أكثر بنحو 75% منه عند أبناء الوالدين معا، في متابعة 11017 مولودا 28 سنة.", "jurisdiction": "فنلندا — مواليد شمال فنلندا 1966 وسجلات المستشفيات الوطنية", "title": "دراسة مواليد شمال فنلندا 1998 — الحرمان من الأب قبل الرابعة عشرة يضاعف اضطرابات الشخصية في الرشد", "source_standing": "فريق جامعة أولو الفنلندية على أشهر مجموعة مواليد فنلندية (شمال فنلندا 1966) المربوطة بسجلات المستشفيات الوطنية، في مجلة محكمة متخصصة في دراسات الأسرة (دار وايلي). تنبيه: صفحة الناشر محجوبة في هذه الجلسة، والنص من ملخص الناشر المودع في OpenAlex. يذكر الملخص أيضا أن أسرة الوالد الواحد لم ترتبط بالفصام أو غيره من الذهان، وأن الخلاصة أن «تركيبا من أسرة الوالد الواحد وعوامل الخطر النفسية الاجتماعية و/أو الوراثية» قد يؤثر في نشوء هذه الاضطرابات.", "evidence_level": "دراسة سجلات وطنية"}, {"section": "harm", "card_number": 136, "supports": ["silat_al_rahim"], "author": {"name": "Sauvola A (كما في سجل OpenAlex؛ المقال المطبوع له مؤلفون مشاركون من فريق أولو لم يتحقق منهم في هذه الجلسة)", "date": "2001"}, "work": {"title": "Mortality of young adults in relation to single-parent family background. A prospective study of the Northern Finland 1966 birth cohort", "section": "European Journal of Public Health 11(3): 284–286", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"… the Northern Finland 1966 birth cohort which is linked with the national death register. … the general mortality risk for males with a single-parent family background was significantly increased compared with males from a two-parent family background (odds ratio 1.8 and 95% confidence interval: 1.1-2.9). The risk of committing suicide was significantly increased among young adult males with a single-parent family background (OR 2.5 and 95% CI: 1.1-5.8). … more preventative mental health support for children and adolescents living in broken homes.\"", "verbatim": true}, "translation_ar": "«... مواليد شمال فنلندا 1966 المربوطون بسجل الوفيات الوطني. ... كان خطر الوفاة العام عند الذكور من خلفية أسرة الوالد الواحد أعلى بدلالة إحصائية منه عند الذكور من خلفية أسرة الوالدين معا (نسبة الخطر 1.8، وفاصل الثقة 95%: 1.1-2.9). وكان خطر الانتحار أعلى بدلالة إحصائية عند الشباب الذكور من خلفية أسرة الوالد الواحد (نسبة الخطر 2.5، وفاصل الثقة 95%: 1.1-5.8). ... [تدعو النتيجة إلى] مزيد من الدعم النفسي الوقائي للأطفال والمراهقين الذين يعيشون في بيوت مفككة.»", "urls": ["https://doi.org/10.1093/eurpub/11.3.284", "https://api.openalex.org/works/doi:10.1093/eurpub/11.3.284"], "links": [{"url": "https://doi.org/10.1093/eurpub/11.3.284", "label": "صفحة الدراسة", "site": "صفحة الدراسة", "domain": "doi.org"}, {"url": "https://api.openalex.org/works/doi:10.1093/eurpub/11.3.284", "label": "المصدر الثاني", "site": "سجل OpenAlex", "domain": "api.openalex.org"}], "strength": "explicit", "argument": "سجلات وطنية تبين أن الفتى الذي نشأ في أسرة والد واحد يموت شابا بنسبة أعلى (1.8 ضعفا) وينتحر بنسبة أعلى (2.5 ضعفا)؛ فتفكك البيت وحرمان الولد من أحد والديه خطر على حياته لا على نفسيته فحسب.", "jurisdiction": "فنلندا — مواليد شمال فنلندا 1966 وسجل الوفيات الوطني", "title": "دراسة مواليد شمال فنلندا 2001 — النشأة بلا أحد الوالدين ترفع وفيات الرجال وانتحارهم", "source_standing": "آنو ساوفولا وفريق مجموعة مواليد شمال فنلندا 1966 بجامعة أولو، في المجلة الأوروبية للصحة العامة المحكمة (دار جامعة أكسفورد)، بمتابعة 11017 مولودا من 16 إلى 28 سنة بعد مراعاة التشخيص النفسي والطبقة الاجتماعية للوالدين. تنبيه: سجل OpenAlex لا يذكر إلا المؤلفة الأولى، وصفحة الناشر وملف PDF محجوبان في هذه الجلسة.", "evidence_level": "دراسة سجلات وطنية"}, {"section": "harm", "card_number": 137, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Carlson MJ", "date": "2006"}, "work": {"title": "Family Structure, Father Involvement, and Adolescent Behavioral Outcomes", "section": "Journal of Marriage and Family 68(1): 137–154", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Research has shown that living away from one's biological father is associated with a greater risk of adverse child and adolescent outcomes … the 1979 National Longitudinal Survey of Youth (N = 2,733) … Differences in father involvement are shown to account for a sizeable fraction of the variance in outcomes by family structure. Father involvement does not affect boys and girls differently but is more beneficial when the father lives with the adolescent.\"", "verbatim": true}, "translation_ar": "«أثبتت البحوث أن العيش بعيدا عن الأب البيولوجي يرتبط بخطر أكبر لسوء مآل الطفل والمراهق ... المسح الوطني الممتد للشباب 1979 (العدد 2733) ... وتبين أن الفروق في انخراط الأب تفسر جزءا كبيرا من تباين النتائج بحسب بنية الأسرة. ولا يختلف أثر انخراط الأب بين الأولاد والبنات، لكنه أنفع حين يعيش الأب مع المراهق.»", "urls": ["https://doi.org/10.1111/j.1741-3737.2006.00239.x", "https://api.crossref.org/works/10.1111/j.1741-3737.2006.00239.x"], "links": [{"url": "https://doi.org/10.1111/j.1741-3737.2006.00239.x", "label": "صفحة الدراسة", "site": "صفحة الدراسة", "domain": "doi.org"}, {"url": "https://api.crossref.org/works/10.1111/j.1741-3737.2006.00239.x", "label": "المصدر الثاني", "site": "api.crossref.org", "domain": "api.crossref.org"}], "strength": "explicit", "argument": "تبين أن ضرر غياب الأب يفسره نقص صلة الأب بولده، وأن انخراط الأب أنفع ما يكون حين يسكن الولد معه؛ وهذا عين ما تقتضيه الرعاية المشتركة بالمناصفة وانتقال الولد إلى أبيه بعد التمييز.", "jurisdiction": "الولايات المتحدة — المسح الوطني الممتد للشباب 1979", "title": "كارلسون 2006 — انخراط الأب يفسر جانبا كبيرا من ضرر غيابه، وأنفعه حين يعيش مع ولده", "source_standing": "مارشا كارلسون أستاذة علم الاجتماع (جامعة ويسكونسن، وكانت بجامعة كولومبيا ومن فريق دراسة الأسر الهشة)، في مجلة الزواج والأسرة وهي أرفع مجلة محكمة في دراسات الأسرة. قرئ الملخص كاملا في نص الناشر المودع في CrossRef وفي OpenAlex.", "evidence_level": "دراسة محكمة على مسح وطني ممتد"}, {"section": "harm", "card_number": 138, "supports": ["7", "silat_al_rahim"], "author": {"name": "Flouri E, Buchanan A", "date": "2002"}, "work": {"title": "Father Involvement in Childhood and Trouble With the Police in Adolescence: Findings From the 1958 British Cohort", "section": "Journal of Interpersonal Violence 17(6): 689–701", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"This longitudinal study investigated the role of early father involvement (at age 7) in juvenile delinquency controlling for the effect of mother involvement at age 7 and other risk and protective factors. … Uniquely for boys, IQ and father involvement were negatively related to trouble with the police. Trouble with the police in adolescence was also related with non-intact family structure in childhood in girls, and with parental criminality in boys\"", "verbatim": true}, "translation_ar": "«بحثت هذه الدراسة الممتدة دور انخراط الأب المبكر (في سن 7) في جنوح الأحداث مع ضبط أثر انخراط الأم في سن 7 وغيره من عوامل الخطر والحماية. ... وعند الأولاد خاصة كان الذكاء وانخراط الأب مرتبطين عكسيا بالوقوع في مشكلات مع الشرطة. وارتبط الوقوع في مشكلات مع الشرطة في المراهقة أيضا بتفكك بنية الأسرة في الطفولة عند البنات، وبإجرام الوالدين عند الأولاد»", "urls": ["https://journals.sagepub.com/doi/10.1177/0886260502017006006", "https://api.openalex.org/works/doi:10.1177/0886260502017006006"], "links": [{"url": "https://journals.sagepub.com/doi/10.1177/0886260502017006006", "label": "صفحة الدراسة", "site": "دار سيج", "domain": "journals.sagepub.com"}, {"url": "https://api.openalex.org/works/doi:10.1177/0886260502017006006", "label": "المصدر الثاني", "site": "سجل OpenAlex", "domain": "api.openalex.org"}], "strength": "explicit", "argument": "انخراط الأب في ابنه وهو في السابعة يقيه من الوقوع في يد الشرطة في السادسة عشرة مستقلا عن أثر الأم، وتفكك الأسرة في الطفولة يزيد وقوع البنات في مشكلات الشرطة؛ فالسابعة تحديدا سن يحتاج فيها الولد أباه.", "jurisdiction": "المملكة المتحدة — دراسة مواليد بريطانيا 1958 (NCDS)", "title": "فلوري وبوكانان 2002 — انخراط الأب في سن السابعة يقي الأولاد من مشاكل الشرطة في المراهقة", "source_standing": "إيريني فلوري وآن بوكانان من جامعة أكسفورد، على بيانات المتابعة الوطنية لمواليد بريطانيا في أسبوع واحد من سنة 1958، في مجلة محكمة من دار سيج. قرئ الملخص على صفحة الناشر وفي OpenAlex.", "evidence_level": "دراسة متابعة وطنية ممتدة"}, {"section": "harm", "card_number": 139, "supports": ["childhood_ends_at_puberty", "silat_al_rahim"], "author": {"name": "Webster GD, Graber JA, Gesselman AN, Crosier BS, Orozco Schember T", "date": "2014"}, "work": {"title": "A Life History Theory of Father Absence and Menarche: A Meta-Analysis", "section": "Evolutionary Psychology 12(2): 273–294", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Is the absence of biological fathers related to their daughters' earlier age at menarche? … we conducted a random-effects meta-analysis of correlations … on father absence and daughter menarcheal age (k = 33; N = 70,403). The weighted mean correlation was .14, 95% CI [.09, .19] … showed no evidence of publication bias … Our findings support one aspect of the life history model and provide groundwork for subsequent examination of other pathways in the model.\"", "verbatim": true}, "translation_ar": "«هل يرتبط غياب الأب البيولوجي بتبكير سن الحيض الأول عند بناته؟ ... أجرينا تحليلا جامعا للدراسات ... على غياب الأب وسن الحيض الأول عند البنت (33 دراسة؛ 70403 مشاركة). وكان متوسط الارتباط الموزون 0.14 ... ولم يظهر دليل على تحيز النشر ... وتدعم نتائجنا جانبا من نموذج تاريخ الحياة وتمهد لفحص مسارات أخرى في النموذج.»", "urls": ["https://journals.sagepub.com/doi/10.1177/147470491401200202", "https://api.openalex.org/works/doi:10.1177/147470491401200202"], "links": [{"url": "https://journals.sagepub.com/doi/10.1177/147470491401200202", "label": "صفحة الدراسة", "site": "دار سيج", "domain": "journals.sagepub.com"}, {"url": "https://api.openalex.org/works/doi:10.1177/147470491401200202", "label": "المصدر الثاني", "site": "سجل OpenAlex", "domain": "api.openalex.org"}], "strength": "explicit", "argument": "غياب الأب يغير مسار نمو البنت الجسدي فيبكر حيضها، وهو أثر ثابت عبر 33 دراسة؛ أي أن حرمانها من أبيها يترك أثره حتى في جسدها، والتبكير مقترن في البحوث بمخاطر صحية ونفسية.", "jurisdiction": "دولي — تحليل جامع ل33 دراسة", "title": "تحليل جامع لـ33 دراسة 2014 — غياب الأب يبكر حيض البنات", "source_standing": "غريغوري وبستر وجوليا غرابر وزملاؤهما من جامعة فلوريدا، في مجلة محكمة مفتوحة من دار سيج، جمعوا 33 دراسة على أكثر من 70 ألف فتاة. قرئ الملخص على صفحة الناشر وفي OpenAlex. (نتيجة الدراسة بيولوجية: تبكير البلوغ، وليست حكما صريحا بالضرر، فتوظف مع بطاقات التبكير والمخاطر لا وحدها).", "evidence_level": "تحليل جامع للدراسات"}, {"section": "study", "card_number": 140, "supports": ["shared_parenting"], "author": {"name": "Bergström M, et al.", "date": "2015"}, "work": {"title": "Fifty moves a year", "section": "J Epidemiol Community Health 69(8):769–774", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: في 147,839 تلميذا سويديا، أطفال الإقامة المشتركة أقل أعراضا نفسجسمية من أطفال الإقامة المنفردة.", "verbatim": false}, "translation_ar": "", "urls": ["https://jech.bmj.com/content/69/8/769"], "links": null, "strength": "explicit", "argument": "دل أوسع مسح وطني في السويد على أن أطفال الإقامة المشتركة أحسن حالا في صحتهم النفسية من أطفال الإقامة المنفردة.", "jurisdiction": "السويد", "title": "دراسة سويدية وطنية 2015 — صحة أطفال الإقامة المشتركة", "source_standing": "الدراسة من مركز دراسات العدالة الصحية في جامعة ستوكهولم ومعهد كارولينسكا، على عينة وطنية من تلاميذ السويد؛ والمجلة من إصدارات مجموعة المجلة الطبية البريطانية.", "evidence_level": "دراسة وطنية واسعة"}, {"section": "study", "card_number": 141, "supports": ["shared_parenting"], "author": {"name": "Bergström M, Fransson E, Fabian H, Hjern A, Sarkadi A, Salari R", "date": ""}, "work": {"title": "Preschool children living in joint physical custody arrangements show less psychological symptoms than those living mostly or only with one parent", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: أطفال 3 و5 سنوات في الإقامة المشتركة أقل مشكلات نفسية.", "verbatim": false}, "translation_ar": "", "urls": ["https://medicalresearch.com/joint-physical-custody-better-for-childrens-psychological-health/"], "links": null, "strength": "explicit", "argument": "أطفال الثالثة والخامسة في الإقامة المشتركة أقل مشكلات نفسية، فلا وجه لحصر الصغير عند أحد والديه بدعوى صغره.", "jurisdiction": "السويد", "title": "دراسة سويدية — أطفال ما قبل المدرسة", "source_standing": "الدراسة من فريق مركز دراسات العدالة الصحية في ستوكهولم ومعهد كارولينسكا وجامعة أوبسالا؛ ونشرتها مجلة أكتا بيدياتريكا لطب الأطفال.", "evidence_level": "دراسة سكانية"}, {"section": "study", "card_number": 142, "supports": ["shared_parenting"], "author": {"name": "Warshak RA (+110 endorsers)", "date": "2014"}, "work": {"title": "Social Science and Parenting Plans for Young Children: A Consensus Report", "section": "Psychology, Public Policy, and Law 20(1):46–67", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: الأدلة في الظروف العادية تؤيد الإقامة المشتركة والمبيت عند الأب حتى لما دون الرابعة.", "verbatim": false}, "translation_ar": "", "urls": ["http://psycnet.apa.org/journals/law/20/1/46/"], "links": null, "strength": "explicit", "argument": "أجمع مئة وعشرة من الباحثين على أن الإقامة المشتركة والمبيت عند الأب أنفع حتى لمن دون الرابعة، فمن جاوز السابعة أولى بذلك.", "jurisdiction": "الولايات المتحدة (دولي التأييد)", "title": "تقرير إجماع 110 خبراء 2014 — المبيت عند الأ bsequent child behaviour: prospective analysis of the UK Millennium Cohort Study", "section": "PLoS One 11(9):e0162339", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: في الدراسة البريطانية الوطنية لأطفال الألفية ارتبط انخراط الأب المبكر، كاعتقاده الإيجابي في الأبوة ولعبه الإبداعي مع ولده، بانخفاض المشكلات السلوكية عند الطفل.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1371/journal.pone.0162339"], "links": null, "strength": "explicit", "argument": "انخراط الأب في سني ولده الأولى يقيه المشكلات السلوكية، فالأب شريك في التنشئة من البداية لا بعد انتهاء حضانة النساء.", "jurisdiction": "المملكة المتحدة — جامعة أكسفورد", "title": "دراسة بريطانية وطنية 2016 — انخراط الأب وسلوك الطفل", "source_standing": "الدراسة من وحدة علم الأوبئة الوطنية للولادة في جامعة أكسفورد، على دراسة متابعة الألفية، إحدى أكبر دراسات المتابعة الطويلة الوطنية في بريطانيا.", "evidence_level": "دراسة متابعة وطنية"}, {"section": "study", "card_number": 150, "supports": ["shared_parenting"], "author": {"name": "Nielsen L", "date": "2011"}, "work": {"title": "Shared parenting after divorce: a review of shared residential parenting research", "section": "J Divorce & Remarriage 52(8):586–609", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: انتهت المراجعة إلى أن أكثر أطفال الإقامة المشتركة أحسن حالا أو مثل أطفال الإقامة عند الأم، ولا سيما في جودة صلتهم بآبائهم ودوامها، وأن الوالدين لا يلزم أن يكونا متعاونين تعاونا استثنائيا أو موسرين لينتفع الأطفال.", "verbatim": false}, "translation_ar": "", "urls": ["https://vaderkenniscentrum.nl/669-gedeeld-ouderschap-na-scheiding-analyse-van-het-beschikbare-onderzoek-naar-verblijfsco-ouderschap-linda-nielsen-2011/"], "links": null, "strength": "explicit", "argument": "تسقط حجة من يقصر الرعاية المشتركة بالمناصفة على الأسر المثالية، فنفعها يحصل دون أن يكون الوالدان على وفاق تام أو غنى.", "jurisdiction": "الولايات المتحدة — جامعة ويك فورست", "title": "نيلسن 2011 — خلاصة
