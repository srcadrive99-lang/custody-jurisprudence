nda. موضع النقل: الملخص الأصلي المعروض في سجل الفصل", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: يوضح مؤلفو الفصل أن الطلاق قد يغير رعاية الأب لأطفاله تغييرا واسعا أو يعطلها، وأن تغير تفاعل الأب مع الطفل يكون عادة أكبر من تغير تفاعل الأم، بسبب اختلاف ترتيبات الحضانة التي تجعلها غالبا الراعي الأساسي وتحصره في الزيارة.", "verbatim": false}, "translation_ar": "", "urls": ["https://digitalcommons.unl.edu/psychfacpub/963/", "https://www.taylorfrancis.com/chapters/edit/10.4324/9780203101414-27/chapter-21-fathers-divorce-child-custody-matthew-stevenson-sanford-braver-ira-ellman-ashley-votruba"], "links": null, "strength": "explicit", "argument": "حصر الأب في الزيارة يعطل رعايته لولده ويخلف عواقب سيئة على الآباء والأطفال معا؛ فنظام الرؤية نفسه مصدر الضرر.", "jurisdiction": "الولايات المتحدة — جامعة أريزونا الحكومية ومستودع جامعة نبراسكا في لينكولن", "title": "كيف تؤثر ترتيبات الحضانة في رعاية الأب بعد الطلاق؟", "source_standing": "سانفورد برافر من جامعة ولاية أريزونا، ومعه إيرا إلمان أستاذ القانون في الجامعة نفسها ومقرر مبادئ قانون انحلال الأسرة لدى معهد القانون الأمريكي؛ والمرجع صادر عن دار روتليدج.", "evidence_level": "فصل في مرجع أكاديمي"}, {"section": "study", "card_number": 153, "supports": ["shared_parenting", "7"], "author": {"name": "Cano T, Perales F, Baxter J", "date": "2019"}, "work": {"title": "A Matter of Time: Father Involvement and Child Cognitive Outcomes", "section": "Journal of Marriage and Family. 2019;81(1):164–184", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: حللت الدراسة الأسترالية ثلاث موجات من يوميات الوقت لـ3273 طفلا، تضم 6960 مشاهدة، عند أعمار 4 و6 و8 سنوات. ارتبط الوقت التعليمي مع الأب بنتائج أفضل في اختبار المفردات، واستمر الارتباط عبر نماذج متعددة، منها التأثيرات الثابتة. روعيت خصائص الطفل ودخل الأسرة وتعليم الوالدين وعملهما وتوزيع الوقت، ولم يختلف الارتباط معنويا باختلاف المستوى التعليمي للأب.", "verbatim": false}, "translation_ar": "", "urls": ["https://onlinelibrary.wiley.com/doi/10.1111/jomf.12532", "https://library.parenthelp.eu/wp-content/uploads/2017/05/A-Matter-of-Time_Father-Involvement-and-Child-Cognitive-Outcomes.pdf"], "links": null, "strength": "explicit", "argument": "الوقت التعليمي مع الأب بين الرابعة والثامنة يرتبط بلغة أحسن عند الطفل؛ فالأب معلم ولده في سن التمييز.", "jurisdiction": "أستراليا — Longitudinal Study of Australian Children", "title": "وقت التعليم مع الأب والنتائج المعرفية في أستراليا", "source_standing": "باحثون من جامعتي بومبيو فابرا وكوينزلاند، ومعهم جنيفر باكستر من المعهد الأسترالي لدراسات الأسرة، على دراسة المتابعة الوطنية الطويلة لأطفال أستراليا؛ ومجلة الزواج والأسرة لسان المجلس الوطني لعلاقات الأسرة.", "evidence_level": "دراسة متابعة وطنية"}, {"section": "study", "card_number": 154, "supports": ["shared_parenting", "7"], "author": {"name": "Norman H, Davies J", "date": "2023"}, "work": {"title": "What a difference a dad makes: Paternal Involvement and its Effects on Children’s Education (PIECE)", "section": "University of Leeds / PIECE study، التقرير النهائي 2023. موضع الاستناد: القسم 2 (المنهج)، والقسم 3 (النتائج)، ص 10–21 المطبوعة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: ربط تحليل بالمتابعة الطويلة لـ4966 أسرة إنجليزية ذات أبوين بيانات متابعة مواليد الألفية بالسجلات التعليمية الرسمية. ارتبط ارتفاع مشاركة الأب بدرجة واحدة عند الثالثة بزيادة قدرها 0.10 درجة في التحصيل عند الخامسة؛ وارتبط ارتفاع مشاركته عند الخامسة بزيادة 0.15 عند السابعة. وروعيت في الحساب خصائص الطفل وظروف الأسرة وعمل الوالدين وتعليم الأب. ارتبطت مشاركة الأم بجوانب سلوكية واجتماعية أفضل؛ ويرى التقرير أن لكلا الوالدين إسهامات مهمة ومتكاملة.", "verbatim": false}, "translation_ar": "", "urls": ["https://piecestudy.org/wp-content/uploads/2023/09/PIECE-Final-Report-1.pdf", "https://business.leeds.ac.uk/dir-record/research-projects/1821/does-fathers-childcare-involvement-increase-children-s-educational-attainment-at-primary-school"], "links": null, "strength": "explicit", "argument": "مشاركة الأب في الخامسة ترفع تحصيل ولده في السابعة في دراسة بريطانية على نحو خمسة آلاف أسرة؛ فسنة التمييز سنة يتجلى فيها أثر الأب.", "jurisdiction": "إنجلترا — جامعة ليدز؛ متابعة الألفية والسجلات التعليمية", "title": "مشاركة الأب والتحصيل المدرسي: تقرير جامعة ليدز", "source_standing": "هيلين نورمان من جامعة ليدز، وجيريمي ديفيز من معهد الأبوة؛ والمشروع ممول من مجلس البحوث الاقتصادية والاجتماعية البريطاني، ويربط متابعة الألفية بالسجلات التعليمية الرسمية.", "evidence_level": "دراسة متابعة وطنية بالسجلات"}, {"section": "study", "card_number": 155, "supports": ["shared_parenting"], "author": {"name": "Miller DP, Thomas MMC, Waller MR, Nepomnyaschy L, Emory AD", "date": "2020"}, "work": {"title": "Father Involvement and Socioeconomic Disparities in Child Academic Outcomes", "section": "Journal of Marriage and Family. 2020;82(2):515–533", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: استخدمت الدراسة الوطنية الأمريكية 26180 مشاهدة سنوية لـ12030 طفلا، من الصف الثالث والخامس والثامن. ارتبط انخراط الأب المقيم في المدرسة، ومؤشر مشاركة الأب غير المقيم، بتحصيل أفضل. وروعيت في الحساب خصائص الطفل والأسرة والمدرسة ومشاركة الوالد الآخر. وفي المحاكاة، كان رفع مشاركة الآباء الأقل موارد مرتبطا بتضييق محدود لفجوات القراءة والرياضيات، وتضييق أكبر لفجوة إعادة الصف.", "verbatim": false}, "translation_ar": "", "urls": ["https://onlinelibrary.wiley.com/doi/10.1111/jomf.12666"], "links": null, "strength": "explicit", "argument": "مشاركة الأب، ولو كان غير مقيم، ترتبط بتحصيل أحسن لولده؛ فصلة الأب بعد الفرقة نافعة لا عبء.", "jurisdiction": "الولايات المتحدة — العينة الوطنية ECLS-K", "title": "مشاركة الأب والفوارق في التحصيل الدراسي", "source_standing": "دانيال ميلر من جامعة بوسطن، ومورين والر من جامعة كورنيل، ولينا نيبومنياشي من جامعة روتجرز، على العينة الوطنية الممتدة سنوات للطفولة المبكرة؛ ومجلة الزواج والأسرة لسان المجلس الوطني لعلاقات الأسرة.", "evidence_level": "دراسة متابعة طويلة وطنية"}, {"section": "study", "card_number": 156, "supports": ["shared_parenting"], "author": {"name": "Nepomnyaschy L, Miller DP, Waller MR, Emory AD", "date": "2020"}, "work": {"title": "The Role of Fathers in Reducing Socioeconomic Inequalities in Adolescent Behavioral Outcomes", "section": "Social Service Review. 2020;94(3):521–566", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: باستعمال عشر سنوات من بيانات متابعة مواليد المدن الأمريكية الكبيرة، ارتبطت مشاركة الآباء المقيمين وغير المقيمين في الأنشطة والوقت مع أولادهم بمشكلات سلوكية أقل عند الخامسة عشرة. وظهر ارتباط مماثل للدعم العيني من الأب غير المقيم، دون الدعم النقدي الرسمي أو غير الرسمي. وتشير نمذجة الباحثين إلى إمكان تضييق الفوارق المرتبطة بالموارد الأسرية عندما تكون مشاركة الأب مرتفعة في الأسر الأقل موارد.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.journals.uchicago.edu/doi/10.1086/710546", "https://ffcws.princeton.edu/publications/role-fathers-reducing-socioeconomic-inequalities-adolescent-behavioral-outcomes"], "links": null, "strength": "explicit", "argument": "مشاركة الأب، مقيما أو غير مقيم، بوقته ونشاطه ترتبط بقلة مشكلات الولد السلوكية في الخامسة عشرة، دون الدعم المالي وحده؛ فالحاجة إلى الأب لا تسد بالنفقة.", "jurisdiction": "الولايات المتحدة — Fragile Families and Child Wellbeing Study", "title": "صلة الأب وتقليص الفوارق في سلوك الأبناء", "source_standing": "الدراسة على بيانات دراسة الأسر الهشة ورفاه الطفل بجامعة برنستون؛ ومجلة مراجعة الخدمة الاجتماعية تصدرها مطبعة جامعة شيكاغو منذ سنة 1927.", "evidence_level": "دراسة متابعة طويلة وطنية"}, {"section": "study", "card_number": 157, "supports": ["shared_parenting"], "author": {"name": "Panter-Brick C, Burgess A, Eggerman M, McAllister F, Pruett K, Leckman JF", "date": "2014"}, "work": {"title": "Practitioner review: Engaging fathers—recommendations for a game change in parenting interventions based on a systematic review of the global evidence", "section": "Journal of Child Psychology and Psychiatry. 2014;55(11):1187–1212. موضع الاستناد: الملخص الرسمي الكامل", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: بعد فحص 786 سجلا غير مكرر، جمعت المراجعة 199 منشورا عن مشاركة الآباء في برامج دعم الآباء والأمهات وأثرها. وجدت أن قليلا من البرامج يفصل أثر الأب أو عمل الوالدين معا عند التقييم، وأن التركيز يغلب على علاقة الأم بالطفل. وحددت عوائق ثقافية ومؤسسية ومهنية، وأخرى تتعلق بالتنفيذ والمحتوى والموارد والسياسة تعوق إدماج الأب واستمراره. ودعت إلى إشراك الآباء والوالدين معا، وتحسين القياس حتى يظهر أثر كل منهما وأثر تعاونهما.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/24980187/"], "links": null, "strength": "explicit", "argument": "مراجعة لنحو مئتي منشور تنتقد غلبة التركيز على الأم في برامج رعاية الطفل، وتدعو إلى إشراك الأب والوالدين معا.", "jurisdiction": "الولايات المتحدة والمملكة المتحدة — جامعة ييل ومعهد الأبوة", "title": "إشراك الآباء في برامج تربية الأطفال: مراجعة الأدلة العالمية", "source_standing": "كاثرين بانتر بريك وجيمس ليكمان من جامعة ييل، ومعهما أدريان بيرجس من معهد الأبوة؛ ومجلة علم نفس الطفل والطب النفسي من أرفع مجلات التخصص.", "evidence_level": "مراجعة منهجية: أعلى درجات الدليل"}, {"section": "study", "card_number": 158, "supports": ["shared_parenting"], "author": {"name": "Vowels LM, Comolli CL, Bernardi L, Chacón-Mendoza D, Darwiche J", "date": "2023"}, "work": {"title": "Systematic review and theoretical comparison of children’s outcomes in post-separation living arrangements", "section": "PLOS ONE. 2023;18(6):e0288112", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: راجعت الدراسة 39 بحثا منشورا بين 2010 و2022 عن ترتيبات الإقامة بعد الانفصال. شملت الرعاية المشتركة بالمناصفة وما قاربها قضاء 30–70% من الوقت لدى كل والد. في 29 بحثا لم يظهر فرق يعتد به بينها وبين الأسرة التي يعيش فيها الوالدان معا، أو زال الفرق بعد مراعاة عوامل أخرى مفسرة. ووجدت 20 دراسة نتائج أفضل للمشتركة من الإقامة الغالبة لدى أحد الوالدين، مع عدم إجراء مقارنة مباشرة بينهما في جميع الدراسات. وكانت نتائج الأسر غير المنفصلة مساوية أو أفضل في المقارنات المعروضة.", "verbatim": false}, "translation_ar": "", "urls": ["https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0288112", "https://pubmed.ncbi.nlm.nih.gov/37390081/"], "links": null, "strength": "explicit", "argument": "مراجعة 39 دراسة حديثة: في عشرين منها كانت الرعاية المشتركة بالمناصفة أحسن من الإقامة الغالبة عند أحد الوالدين، وفي أكثرها لم يفترق أطفالها عن أطفال الأسر المجتمعة.", "jurisdiction": "مراجعة لدراسات من بلدان غربية؛ المؤسسات: سويسرا وإيطاليا وكوستاريكا", "title": "مراجعة 39 دراسة — أطفال الرعاية المشتركة بالمناصفة كأطفال الأسرة المجتمعة", "source_standing": "لورا فاولز ولاورا برناردي من جامعة لوزان، ومعهما باحثون من بولونيا وكوستاريكا؛ ومجلة بلوس ون مجلة علمية محكمة مفتوحة الإتاحة.", "evidence_level": "مراجعة منهجية"}, {"section": "study", "card_number": 159, "supports": ["shared_parenting"], "author": {"name": "Nilsen SA, Hysing M, Breivik K, Heradstveit O, Sunde EV, Stormark KM, Bøe T", "date": "2020"}, "work": {"title": "Complex families and health complaints among adolescents: A population-based cross-sectional study", "section": "Scandinavian Journal of Public Health. 2020;48(7):733–742", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: شملت الدراسة 8808 من المشاركين النرويجيين بعمر 16–19 سنة ممن يعيشون مع والد أو والدين، ضمن مسح هوردالاند لعام 2012. أبلغ المقيمون مع الوالدين معا أو في الرعاية المشتركة بالمناصفة عن شكاوى صحية أقل من المقيمين مع والد واحد أو في أسرة تضم شريكا جديدا لأحد الوالدين، بعد مراعاة عوامل اجتماعية سكانية. والمقيس صداع ودوار وآلام ذاتية الإبلاغ. وارتبط وجود إخوة من النسب بشكاوى أقل، وإخوة من أسرة الشريك بشكاوى أكثر لدى البنات وحدهن.", "verbatim": false}, "translation_ar": "", "urls": ["https://journals.sagepub.com/doi/10.1177/1403494819893903", "https://pubmed.ncbi.nlm.nih.gov/31830876/"], "links": null, "strength": "explicit", "argument": "في النرويج كان المقيمون في رعاية مشتركة أقل شكاوى صحية من المقيمين مع والد واحد، كالمقيمين مع والديهم معا.", "jurisdiction": "النرويج — هوردالاند؛ مشاركون بعمر 16–19 سنة", "title": "النرويج: المشاركة والشكاوى الجسدية لدى اليافعين", "source_standing": "الدراسة من مركز نورس البحثي وجامعة بيرغن، على المسح السكاني لشباب هوردالاند؛ والمجلة الإسكندنافية للصحة العامة مجلة محكمة لدول الشمال الأوروبي.", "evidence_level": "دراسة سكانية مسحية"}, {"section": "study", "card_number": 160, "supports": ["shared_parenting"], "author": {"name": "Bauserman R", "date": "2002"}, "work": {"title": "Child Adjustment in Joint-Custody Versus Sole-Custody Arrangements: A Meta-Analytic Review", "section": "J Fam Psychol 16(1):91–102", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Children in joint physical or legal custody were better adjusted than children in sole-custody settings, but no different from those in intact families. More positive adjustment of joint-custody children held for separate comparisons of general adjustment, family relationships, self-esteem, emotional and behavioral adjustment, and divorce-specific adjustment. Joint-custody parents reported less current and past conflict than sole-custody parents, but this did not explain the better adjustment of joint-custody children.", "verbatim": true}, "translation_ar": "«كان الأطفال في الحضانة المشتركة، البدنية أو القانونية، أحسن توافقا من الأطفال في الحضانة المنفردة، ولم يختلفوا عن أطفال الأسر المتماسكة. وثبت التوافق الأفضل لأطفال الحضانة المشتركة في مقارنات منفصلة للتوافق العام، والعلاقات الأسرية، وتقدير الذات، والتوافق العاطفي والسلوكي، والتوافق الخاص بالطلاق. وأبلغ والدو الحضانة المشتركة عن نزاع حالي وسابق أقل من والدي الحضانة المنفردة، لكن ذلك لم يفسر التوافق الأفضل لأطفال الحضانة المشتركة.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/11915414/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/11915414/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "دل التحليل الجامع للدراسات على أن أطفال الحضانة المشتركة أحسن توافقا من أطفال الحضانة المنفردة.", "jurisdiction": "الولايات المتحدة", "title": "تحليل جامع للدراسات 2002 — توافق أطفال الحضانة المشتركة", "source_standing": "روبرت باوزرمان جمع في تحليله ثلاثا وثلاثين دراسة؛ ومجلة علم نفس الأسرة تصدرها جمعية علم النفس الأمريكية.", "evidence_level": "تحليل جامع لعدة دراسات: أعلى درجات الدليل"}, {"section": "study", "card_number": 161, "supports": ["shared_parenting"], "author": {"name": "Nielsen L", "date": "2018"}, "work": {"title": "Joint versus sole physical custody: Outcomes for children independent of family income or parental conflict", "section": "J Child Custody 15(1):35–54", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "In the 60 studies published in English in academic journals or in government reports, 34 studies found that JPC children had better outcomes on all of the measures of behavioral, emotional, physical, and academic well-being and relationships with parents and grandparents. [...] In sum, independent of family income or parental conflict, JPC is generally linked to better outcomes for children.", "verbatim": true}, "translation_ar": "«في الدراسات الستين المنشورة بالإنجليزية في المجلات العلمية أو التقارير الحكومية، وجدت 34 دراسة أن أطفال الإقامة المشتركة كانت نتائجهم أفضل في جميع مقاييس السلامة السلوكية والعاطفية والبدنية والدراسية وفي علاقاتهم بالوالدين والأجداد. [...] وخلاصة القول: بصرف النظر عن دخل الأسرة أو النزاع بين الوالدين، ترتبط الإقامة المشتركة عموما بنتائج أفضل للأطفال.»", "urls": ["https://doi.org/10.1080/15379418.2017.1422414"], "links": [{"url": "https://doi.org/10.1080/15379418.2017.1422414", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "فضل الحضانة المشتركة باق بعد مراعاة دخل الأسرة ونزاع الوالدين، فهو أثر للرعاية نفسها لا لظروف الأسر.", "jurisdiction": "الولايات المتحدة", "title": "دراسة 2018 — التفوق مستقل عن الدخل والنزاع", "source_standing": "ليندا نيلسن أستاذة في جامعة ويك فورست، من أكثر الباحثين كتابة في الرعاية المشتركة بالمناصفة؛ ومجلة حضانة الطفل مجلة محكمة يكتب فيها القضاة وعلماء النفس والباحثون.", "evidence_level": "خلاصة بحوث"}, {"section": "study", "card_number": 162, "supports": ["shared_parenting"], "author": {"name": "Kelly JB, Lamb ME", "date": "2000"}, "work": {"title": "Using child development research to make appropriate custody and access decisions for young children", "section": "Family Court Review 38(3):297–311", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: الصغار يتعلقون بالوالدين معا ويحتاجون إلى رعاية يومية من كليهما.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1111/j.174-1617.2000.tb00577.x"], "links": [{"url": "https://doi.org/10.1111/j.174-1617.2000.tb00577.x", "label": "صفحة الدراسة لدى الناشر", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "الصغار يتعلقون بالوالدين معا، ويحتاجون إلى رعايتهما اليومية، لا إلى زيارة أحدهما.", "jurisdiction": "الولايات المتحدة", "title": "دراسة 2000 — تعلق الصغار بالوالدين معا", "source_standing": "جوان كيلي ومايكل لامب من كبار باحثي الطلاق والأبوة؛ ومجلة مراجعة محاكم الأسرة لسان رابطة محاكم الأسرة والمصالحة.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "study", "card_number": 163, "supports": ["shared_parenting"], "author": {"name": "Fabricius WV, Luecken LJ", "date": "2007"}, "work": {"title": "Postdivorce living arrangements, parent conflict, and long-term physical health correlates for children of divorce", "section": "J Fam Psychol 21(2):195–205", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "The more time children lived with their fathers after divorce, the better their current relationships were with their fathers, independent of parent conflict. [...] There was no interaction between exposure to parent conflict and time with father; thus, more time with father was beneficial in both high- and low-conflict families, and more exposure to parent conflict was detrimental at both high and low levels of time with father.", "verbatim": true}, "translation_ar": "«كلما زاد الوقت الذي عاشه الأبناء مع آبائهم بعد الطلاق كانت علاقتهم الحالية بآبائهم أفضل، بصرف النظر عن النزاع بين الوالدين. [...] ولم يكن هناك تفاعل بين التعرض لنزاع الوالدين والوقت مع الأب؛ أي أن زيادة الوقت مع الأب كانت نافعة في الأسر الشديدة النزاع والقليلة النزاع على السواء، وأن زيادة التعرض لنزاع الوالدين كانت ضارة سواء قل الوقت مع الأب أو كثر.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/17605542/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/17605542/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "كلما زاد وقت الأبناء مع آبائهم بعد الطلاق حسنت علاقتهم بهم، ولم تسؤ علاقتهم بأمهاتهم.", "jurisdiction": "الولايات المتحدة — ولاية أريزونا", "title": "دراسة أمريكية 2007 — وقت الأب بعد الطلاق", "source_standing": "وليام فابريشيوس ولين لوكن من جامعة ولاية أريزونا؛ ومجلة علم نفس الأسرة تصدرها جمعية علم النفس الأمريكية.", "evidence_level": "دراسة ميدانية"}, {"section": "study", "card_number": 164, "supports": ["shared_parenting"], "author": {"name": "Bjarnason T, Arnarsson AM", "date": "2011"}, "work": {"title": "Joint physical custody and communication with parents: A cross-national study of children in 36 western countries", "section": "J Comparative Family Studies 42(6):871–890", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Impaired communication with both mother and father was significantly less likely in joint physical custody than in other non-intact families. Impaired communication with mother was equally prevalent in intact families and joint physical custody families, while impaired communication with father was in fact less prevalent in joint physical custody than in intact families.", "verbatim": true}, "translation_ar": "«كان ضعف التواصل مع الأم والأب معا أقل احتمالا بدرجة ملحوظة في الإقامة المشتركة منه في الأسر الأخرى غير المتماسكة. وكان ضعف التواصل مع الأم متساوي الشيوع في الأسر المتماسكة وأسر الإقامة المشتركة، بينما كان ضعف التواصل مع الأب أقل شيوعا في الواقع في الإقامة المشتركة منه في الأسر المتماسكة.»", "urls": ["https://doi.org/10.3138/jcfs.42.6.871"], "links": [{"url": "https://doi.org/10.3138/jcfs.42.6.871", "label": "صفحة الدراسة لدى الناشر", "site": "مطبعة جامعة تورنتو", "domain": "doi.org"}], "strength": "explicit", "argument": "في ست وثلاثين دولة كان أطفال الإقامة المشتركة أيسر حديثا مع آبائهم، وأقرب إلى أطفال الأسر المجتمعة.", "jurisdiction": "36 دولة غربية", "title": "دراسة في 36 دولة 2011 — التواصل مع الآباء", "source_standing": "ثورولفور بيارناسون من جامعة أكوريري في آيسلندا، على المسح الدولي لسلوك الأطفال الصحي في سن المدرسة بإشراف منظمة الصحة العالمية؛ ومجلة دراسات الأسرة المقارنة مجلة محكمة.", "evidence_level": "دراسة دولية مقارنة"}, {"section": "study", "card_number": 165, "supports": ["shared_parenting"], "author": {"name": "Braver SL, Votruba AM", "date": "2018"}, "work": {"title": "Does joint physical custody 'cause' children's better outcomes?", "section": "J Divorce & Remarriage 59(5):452–468", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "On the basis of this comprehensive review we conclude that JPC probably does cause benefits to children on average, and that social scientists can now provisionally recommend rebuttably presumptive JPC to policymakers.", "verbatim": true}, "translation_ar": "«على أساس هذه المراجعة الشاملة نخلص إلى أن الإقامة المشتركة تسبب على الأرجح منافع للأطفال في المتوسط، وأن علماء الاجتماع يستطيعون الآن أن يوصوا صناع السياسات، توصية أولية، بجعل الإقامة المشتركة أصلا مفترضا قابلا لإثبات العكس».", "urls": ["https://doi.org/10.1080/10502556.2018.1454203"], "links": [{"url": "https://doi.org/10.1080/10502556.2018.1454203", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "لا يفسر فضل الحضانة المشتركة بأن الأسر الصالحة هي التي تختارها، فالراجح أن الرعاية المشتركة بالمناصفة هي السبب.", "jurisdiction": "الولايات المتحدة", "title": "دراسة 2018 — الأثر السببي للحضانة المشتركة", "source_standing": "سانفورد برافر أستاذ علم النفس في جامعة ولاية أريزونا، من رواد البحث في آثار الطلاق على الآباء والأبناء؛ ومجلة الطلاق والزواج الثاني مجلة محكمة متخصصة.", "evidence_level": "مراجعة تحليلية"}, {"section": "study", "card_number": 166, "supports": ["shared_parenting"], "author": {"name": "Turunen J", "date": "2017"}, "work": {"title": "Shared physical custody and children's experiences of stress", "section": "J Divorce & Remarriage 58(5):371–392", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "We ask whether children in shared physical custody settings are more likely to report high levels of stress compared to children living in sole custody. [...] The results show that children sharing residence equally have lower likelihood of experiencing high levels of stress. The results can be interpreted as evidence for a positive effect of continuing everyday-like parental relationships after a family dissolution.", "verbatim": true}, "translation_ar": "«نسأل: هل الأطفال في الحضانة المشتركة أكثر احتمالا للإبلاغ عن مستويات عالية من الضغط النفسي مقارنة بالأطفال الذين يعيشون في حضانة أحد الوالدين؟ [...] وتبين النتائج أن الأطفال الذين يتقاسمون الإقامة بالتساوي بين الوالدين أقل احتمالا لأن يعانوا مستويات عالية من الضغط النفسي. ويمكن تفسير النتائج على أنها دليل على أثر إيجابي لاستمرار علاقة يومية طبيعية بالوالدين بعد تفكك الأسرة.»", "urls": ["https://doi.org/10.1080/10502556.2017.1325648"], "links": [{"url": "https://doi.org/10.1080/10502556.2017.1325648", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "الانتقال بين بيتين لا يرهق الطفل كما يقال، والمرهق حرمانه من أحد والديه.", "jurisdiction": "السويد", "title": "دراسة سويدية 2017 — ضغوط أقل في الإقامة المشتركة", "source_standing": "يان تورونن باحث في وحدة الديموغرافيا بجامعة ستوكهولم؛ ومجلة الطلاق والزواج الثاني مجلة محكمة متخصصة.", "evidence_level": "دراسة سكانية"}, {"section": "study", "card_number": 167, "supports": ["shared_parenting"], "author": {"name": "Nielsen L", "date": "2017"}, "work": {"title": "Re-examining the research on parental conflict, coparenting, and custody arrangements", "section": "Psychology, Public Policy, and Law 23(2):211–231", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Recent research does not support the idea that conflict—including high legal conflict—should rule out joint physical custody as the arrangement that best serves children's interests. [...] Conflict and poor coparenting are not linked to worse outcomes for children in joint physical custody than in sole physical custody. The quality of the parent–child relationship is a better predictor than conflict of children's outcomes, with the exception of the most extreme forms of conflict to which some children are exposed.", "verbatim": true}, "translation_ar": "«لا تؤيد البحوث الحديثة فكرة أن النزاع، بما فيه النزاع القضائي الشديد، ينبغي أن يستبعد الإقامة المشتركة بوصفها الترتيب الذي يخدم مصالح الأطفال على أفضل وجه. [...] والنزاع وسوء تعاون الوالدين لا يرتبطان بنتائج أسوأ للأطفال في الإقامة المشتركة منها في الحضانة المنفردة. وجودة علاقة الطفل بوالديه أقدر على التنبؤ بنتائج الأطفال من النزاع، باستثناء أشد صور النزاع التي يتعرض لها بعض الأطفال.»", "urls": ["https://doi.org/10.1037/law0000109"], "links": [{"url": "https://doi.org/10.1037/law0000109", "label": "صفحة الدراسة لدى الناشر", "site": "APA PsycNet", "domain": "doi.org"}], "strength": "explicit", "argument": "يسقط اعتراض من يمنع الرعاية المشتركة بالمناصفة بحجة الخلاف بين الوالدين، فالخلاف المعتدل لا يذهب بنفعها.", "jurisdiction": "الولايات المتحدة", "title": "نيلسن 2017 — النزاع لا يبطل الرعاية المشتركة بالمناصفة", "source_standing": "ليندا نيلسن أستاذة في جامعة ويك فورست؛ والمجلة تصدرها جمعية علم النفس الأمريكية، تعنى بصلة علم النفس بالقانون والسياسات العامة.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "study", "card_number": 168, "supports": ["shared_parenting"], "author": {"name": "Fabricius WV", "date": "2003"}, "work": {"title": "Listening to children of divorce: new findings that diverge from Wallerstein, Lewis, and Blakeslee", "section": "Family Relations 52(4):385–396", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Students endorsed living arrangements that gave them equal time with their fathers, they had better outcomes when they had such arrangements and when their parents supported their time with the other parent, they experienced disagreement between mothers and fathers over living arrangements, and they gave evidence of their fathers' continuing commitment to them into their young adult years.", "verbatim": true}, "translation_ar": "«أيد الطلاب ترتيبات الإقامة التي تعطيهم وقتا متساويا مع آبائهم، وكانت نتائجهم أفضل حين كانت لهم مثل هذه الترتيبات وحين دعم والداهم وقتهم مع الطرف الآخر، وعاشوا خلافا بين الأمهات والآباء حول ترتيبات الإقامة، وقدموا ما يدل على استمرار التزام آبائهم بهم إلى سنوات شبابهم.»", "urls": ["https://doi.org/10.1111/j.1741-3729.2003.00385.x"], "links": [{"url": "https://doi.org/10.1111/j.1741-3729.2003.00385.x", "label": "صفحة الدراسة لدى الناشر", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "شهادة الأبناء أنفسهم بعد أن كبروا أن الرعاية المتساوية كانت الأنفع لهم، وهي ما يتأوله الخصم بحجة مصلحة الطفل.", "jurisdiction": "الولايات المتحدة — جامعة ولاية أريزونا", "title": "فابريشيوس 2003 — ماذا يقول أبناء الطلاق", "source_standing": "وليام فابريشيوس أستاذ علم النفس في جامعة ولاية أريزونا؛ ومجلة العلاقات الأسرية يصدرها المجلس الوطني لعلاقات الأسرة في الولايات المتحدة.", "evidence_level": "دراسة ميدانية"}, {"section": "study", "card_number": 169, "supports": ["shared_parenting"], "author": {"name": "Kruk E", "date": "2012"}, "work": {"title": "Arguments for an equal parental responsibility presumption in contested child custody", "section": "American Journal of Family Therapy 40(1):33–55", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تجمع الأدلة على أن افتراض المسؤولية الأبوية المتساوية في نزاعات الحضانة يحفظ صلة الطفل بأبويه، ويقلل النزاع والتقاضي، ويحمي الطفل من فقد أحدهما.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1080/01926187.2011.575344"], "links": [{"url": "https://doi.org/10.1080/01926187.2011.575344", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "أستاذ في الخدمة الاجتماعية الأسرية يقيم الأدلة على أن الأصل في نزاع الحضانة مسؤولية متساوية، لا انفراد أحد الوالدين.", "jurisdiction": "كندا — جامعة كولومبيا البريطانية", "title": "إدوارد كروك 2012 — المسؤولية المتساوية أصلا", "source_standing": "إدوارد كروك أستاذ الخدمة الاجتماعية في جامعة كولومبيا البريطانية بكندا، متخصص في سياسات الأسرة والطفل؛ والمجلة الأمريكية للعلاج الأسري مجلة محكمة.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "study", "card_number": 170, "supports": ["shared_parenting"], "author": {"name": "Spruijt E, Duindam V", "date": "2010"}, "work": {"title": "Joint physical custody in the Netherlands and the well-being of children", "section": "Journal of Divorce & Remarriage 51(1):65–82", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "In the Netherlands between 1998 and 2008, joint physical custody after divorce (when children actually have shared residences) has increased from 5% to 16%. [...] The main conclusion is that, on average, the effects of joint physical custody for children, mothers, and especially for fathers, are slightly positive.", "verbatim": true}, "translation_ar": "«في هولندا بين 1998 و2008 ارتفعت نسبة الإقامة المشتركة بعد الطلاق (حين يقيم الأطفال فعلا في بيتي الوالدين) من 5% إلى 16%. [...] والخلاصة الرئيسية أن آثار الإقامة المشتركة في الأطفال والأمهات، وفي الآباء خاصة، إيجابية طفيفة في المتوسط.»", "urls": ["https://doi.org/10.1080/10502550903423362"], "links": [{"url": "https://doi.org/10.1080/10502550903423362", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "الدليل من هولندا يوافق الدليل من السويد: انفراد الأم بالطفل ليس أنفع له من رعاية أبويه معا.", "jurisdiction": "هولندا — جامعة أوترخت", "title": "دراسة هولندية 2010 — الإقامة المشتركة", "source_standing": "إد سبرويت باحث في علم الاجتماع بجامعة أوترخت الهولندية، من أعرق الجامعات الأوروبية؛ ومجلة الطلاق والزواج الثاني مجلة محكمة متخصصة.", "evidence_level": "دراسة مسحية"}, {"section": "study", "card_number": 171, "supports": ["shared_parenting"], "author": {"name": "Warshak RA", "date": "2018"}, "work": {"title": "Night shifts: revisiting blanket restrictions on children's overnights with separated parents", "section": "J Divorce & Remarriage 59(4):282–323", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "No coherent theory or research confirms speculations that fathers' overnight care poses greater risks to their young children than daytime care, or that overnights are contraindicated if opposed by the mother. Theory, research, and practical considerations support the benefits of overnights.", "verbatim": true}, "translation_ar": "«لا توجد نظرية متماسكة ولا بحث يؤكد الظنون القائلة بأن رعاية الأب لصغاره ليلا تحمل مخاطر أكبر من رعايتهم نهارا، أو أن المبيت ممنوع إذا عارضته الأم. والنظرية والبحث والاعتبارات العملية تؤيد منافع المبيت.»", "urls": ["https://doi.org/10.1080/10502556.2018.1454193"], "links": [{"url": "https://doi.org/10.1080/10502556.2018.1454193", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "حتى للصغار جدا لا يسند العلم منع المبيت عند الأب، فمن جاوز السابعة أولى بأن يكون مع أبيه.", "jurisdiction": "الولايات المتحدة — جامعة تكساس", "title": "وارشاك 2018 — مراجعة القيود العامة على مبيت الصغار عند آبائهم", "source_standing": "ريتشارد ورشاك أستاذ طبي للطب النفسي في جامعة تكساس الجنوبية الغربية، صاحب تقرير الإجماع الذي أيده مئة وعشرة من الباحثين.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "study", "card_number": 172, "supports": ["shared_parenting"], "author": {"name": "Fransson E, Hjern A, Bergström M", "date": "2018"}, "work": {"title": "What can we say regarding shared parenting arrangements for Swedish children?", "section": "J Divorce & Remarriage 59(5):349–358", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Children in JPC report better well-being and mental health than children who live mostly or only with 1 parent. No Swedish studies have found children's health to be worse in JPC than in sole parental care from child age of 3 years and beyond.", "verbatim": true}, "translation_ar": "«يبلغ الأطفال في الحضانة المشتركة عن رفاه وصحة نفسية أفضل من الأطفال الذين يعيشون في الغالب أو كليا مع أحد الوالدين. ولم تجد أي دراسة سويدية أن صحة الأطفال في الحضانة المشتركة أسوأ منها في رعاية أحد الوالدين وحده من سن 3 سنوات فما فوق.»", "urls": ["https://doi.org/10.1080/10502556.2018.1454198"], "links": [{"url": "https://doi.org/10.1080/10502556.2018.1454198", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "خلاصة أكبر قاعدة بيانات في العالم في الإقامة المشتركة أنها أنفع للأطفال من انفراد أحد الوالدين.", "jurisdiction": "السويد — جامعة ستوكهولم", "title": "فرانسون وهيرن وبيرغستروم 2018 — حصيلة البحوث في الرعاية المشتركة بالمناصفة بعد الانفصال", "source_standing": "إيما فرانسون وأندرس هيرن ومالين بيرغستروم من مركز دراسات العدالة الصحية في جامعة ستوكهولم ومعهد كارولينسكا، أصحاب أوسع بحوث الإقامة المشتركة في السويد.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "study", "card_number": 173, "supports": ["shared_parenting"], "author": {"name": "Braver SL, Lamb ME", "date": "2018"}, "work": {"title": "Shared parenting after parental separation: the views of 12 experts", "section": "J Divorce & Remarriage 59(5):372–387", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: استطلاع آراء اثني عشر خبيرا دوليا في الطلاق والحضانة، وأكثرهم يرون الرعاية المشتركة بالمناصفة نافعة للأطفال في معظم الحالات، مع استثناء حالات العنف.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1080/10502556.2018.1454195"], "links": [{"url": "https://doi.org/10.1080/10502556.2018.1454195", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "خلاصة رأي كبار خبراء العالم أن الرعاية المشتركة بالمناصفة هي الأصل النافع، والاستثناء للعنف وحده.", "jurisdiction": "الولايات المتحدة والمملكة المتحدة", "title": "برافر ولامب 2018 — آراء الخبراء في الرعاية المشتركة بالمناصفة بعد الانفصال", "source_standing": "سانفورد برافر من جامعة ولاية أريزونا، ومايكل لامب من جامعة كامبريدج، جمعا آراء اثني عشر خبيرا من كبار الباحثين.", "evidence_level": "خلاصة آراء الخبراء"}, {"section": "study", "card_number": 174, "supports": ["shared_parenting"], "author": {"name": "Bergström M, Modin B, Fransson E, Rajmil L, Berlin M, Gustafsson PA, Hjern A", "date": "2013"}, "work": {"title": "Living in two homes - a Swedish national survey of wellbeing in 12 and 15 year olds with joint physical custody", "section": "BMC Public Health. 2013;13:868", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Children in joint physical custody experienced more positive outcomes, in terms of subjective wellbeing, family life and peer relations, than children living mostly or only with one parent. ... Children who spent equal time living with both parents after a separation reported better wellbeing than children in predominantly single parent care. This was particularly true for the 15-year-olds\"", "verbatim": true}, "translation_ar": "«عاش الأطفال في الحضانة المادية المشتركة نتائج أكثر إيجابية، في الرفاه الذاتي والحياة الأسرية وعلاقات الأقران، من الأطفال الذين يعيشون غالبا أو فقط مع أحد الوالدين... وأفاد الأطفال الذين قضوا وقتا متساويا في العيش مع والديهم كليهما بعد الانفصال برفاه أفضل من أطفال رعاية الوالد الواحد. وصح هذا بوجه خاص عند من في الخامسة عشرة».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/24053116/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3848933/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/24053116/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3848933/", "label": "النص الكامل", "site": "المكتبة الوطنية للطب الأمريكية", "domain": "pmc.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "في الخامسة عشرة بعينها، السن التي يزعمون أن الولد قبلها لا يحتاج إلا أمه، كان أبناء المناصفة أحسن حالا من أبناء الانفراد في مسح شمل أكثر من 164 ألف تلميذ.", "jurisdiction": "السويد — جامعة ستوكهولم ومعهد كارولينسكا", "title": "بيرغستروم 2013 — مسح وطني لأكثر من 164 ألف تلميذ في الثانية عشرة والخامسة عشرة", "source_standing": "مسح وطني لـ164580 تلميذا سويديا من مركز دراسات العدالة الصحية في جامعة ستوكهولم ومعهد كارولينسكا الذي يمنح جائزة نوبل في الطب؛ ومالين بيرغستروم أبرز باحثي الإقامة المتناوبة في العالم.", "evidence_level": "دراسة وطنية واسعة"}, {"section": "study", "card_number": 175, "supports": ["shared_parenting"], "author": {"name": "Låftman SB, Bergström M, Modin B, Östberg V", "date": "2014"}, "work": {"title": "Joint physical custody, turning to parents for emotional support, and subjective health: a study of adolescents in Stockholm, Sweden", "section": "Scandinavian Journal of Public Health. 2014;42(5):456-462", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The study suggests that joint physical custody is associated with a higher inclination to use parents as a source of emotional support and better subjective health than other post-divorce family types.\"", "verbatim": true}, "translation_ar": "«تدل الدراسة على أن الحضانة المادية المشتركة ترتبط بميل أعلى إلى اللجوء إلى الوالدين مصدرا للدعم العاطفي، وبصحة ذاتية أفضل، مقارنة بسائر أنواع الأسر بعد الطلاق».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/24662307/", "https://doi.org/10.1177/1403494814526798"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/24662307/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1177/1403494814526798", "label": "صفحة الدراسة", "site": "دار سيج للنشر", "domain": "doi.org"}], "strength": "explicit", "argument": "المراهق في الخامسة عشرة والسادسة عشرة الذي يعيش بين بيتي والديه يجد عند كليهما سندا عاطفيا، أما ابن الانفراد فيفقد نصف سنده.", "jurisdiction": "السويد — جامعة ستوكهولم ومعهد كارولينسكا", "title": "لوفتمان 2014 — أبناء المناصفة يلجؤون إلى والديهم كليهما وصحتهم أفضل", "source_standing": "مسح لمجموع تلاميذ الصف التاسع في ستوكهولم (8840 تلميذا في سن 15 و16 سنة) من مركز دراسات العدالة الصحية؛ والمجلة الإسكندنافية للصحة العامة محكمة لدول الشمال.", "evidence_level": "دراسة مسحية سكانية"}, {"section": "study", "card_number": 176, "supports": ["shared_parenting"], "author": {"name": "Fransson E, Turunen J, Hjern A, Östberg V, Bergström M", "date": "2016"}, "work": {"title": "Psychological complaints among children in joint physical custody and other family types: considering parental factors", "section": "Scandinavian Journal of Public Health. 2016;44(2):177-183", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"children in joint physical custody did not report higher levels of psychological complaints than those in nuclear families, while children in sole parental care reported elevated levels of complaints compared with those in joint physical custody. ... The difference was not explained by parental ill-health or socioeconomic variables.\"", "verbatim": true}, "translation_ar": "«لم يفد الأطفال في الحضانة المادية المشتركة بمستويات أعلى من الشكاوى النفسية من أطفال الأسر النووية، في حين أفاد أطفال رعاية الوالد الواحد بمستويات مرتفعة من الشكاوى مقارنة بأطفال الحضانة المادية المشتركة... ولم يفسر الفرق باعتلال صحة الوالدين ولا بالظروف الاجتماعية الاقتصادية».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/26553250/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4735678/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/26553250/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4735678/", "label": "النص الكامل", "site": "المكتبة الوطنية للطب الأمريكية", "domain": "pmc.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "أبناء المناصفة كأبناء البيت الواحد في الشكاوى النفسية، وأبناء الانفراد أكثر شكوى؛ والفرق ليس من فقر ولا مرض بل من الانفراد نفسه.", "jurisdiction": "السويد — جامعة ستوكهولم ومعهد كارولينسكا", "title": "فرانسون 2016 — شكاوى نفسية أقل عند أبناء المناصفة لا تفسر بصحة الوالدين ولا بالدخل", "source_standing": "الدراسة على بيانات مسح أحوال المعيشة الرسمي لهيئة الإحصاء السويدية 2007 إلى 2011 لأطفال من 10 إلى 18 سنة، من مركز دراسات العدالة الصحية في جامعة ستوكهولم ومعهد كارولينسكا.", "evidence_level": "دراسة مسحية وطنية رسمية"}, {"section": "study", "card_number": 177, "supports": ["shared_parenting"], "author": {"name": "Hagquist C", "date": "2016"}, "work": {"title": "Family residency and psychosomatic problems among adolescents in Sweden: the impact of child-parent relations", "section": "Scandinavian Journal of Public Health. 2016;44(1):36-46", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"We used data collected in 2009 by Statistics Sweden among 172,298 Swedish students in Grade 6 and Grade 9 (approximate ages 12 and 15 years old) ... In Grade 9, there were no differences in psychosomatic problems between the students in alternate residency and those living with their two parents; and in Grade 6, these differences were relatively small.\"", "verbatim": true}, "translation_ar": "«استعملنا بيانات جمعتها هيئة الإحصاء السويدية سنة 2009 من 172298 تلميذا سويديا في الصفين السادس والتاسع (نحو 12 و15 سنة)... وفي الصف التاسع لم تكن هناك فروق في المشكلات النفسية الجسدية بين تلاميذ الإقامة المتناوبة وتلاميذ البيت الواحد مع والديهم، وفي الصف السادس كانت الفروق صغيرة نسبيا».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/26487762/", "https://doi.org/10.1177/1403494815610664"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/26487762/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1177/1403494815610664", "label": "صفحة الدراسة", "site": "دار سيج للنشر", "domain": "doi.org"}], "strength": "explicit", "argument": "أكثر من 172 ألف تلميذ: ابن الخامسة عشرة الذي يتناوب بين بيتي والديه لا يفرق عن ابن البيت الواحد، فالتناوب بين البيتين ليس ضررا بل هو أقرب ما يكون إلى البيت الواحد.", "jurisdiction": "السويد — جامعة كارلستاد", "title": "هاغكفيست 2016 — في الخامسة عشرة لا فرق بين أبناء الإقامة المتناوبة وأبناء البيت الواحد", "source_standing": "دراسة على بيانات رسمية لهيئة الإحصاء السويدية شملت 80 إلى 86 بالمئة من مجموع تلاميذ الصفين في السويد كلها؛ وكورت هاغكفيست مدير مركز بحوث الصحة النفسية للأطفال والمراهقين في جامعة كارلستاد.", "evidence_level": "دراسة سكانية شبه شاملة"}, {"section": "study", "card_number": 178, "supports": ["shared_parenting"], "author": {"name": "Turunen J, Fransson E, Bergström M", "date": "2017"}, "work": {"title": "Self-esteem in children in joint physical custody and other living arrangements", "section": "Public Health. 2017;149:106-112", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"We found no significant difference in self-esteem between children who lived equally much with both parents, mostly with one parent and those in nuclear families, whereas children in single care showed lower self-esteem compared with children in the other living arrangements. The difference was not explained by socioeconomic factors.\"", "verbatim": true}, "translation_ar": "«لم نجد فرقا دالا في تقدير الذات بين الأطفال الذين يعيشون بالتساوي مع والديهم كليهما، ومن يعيشون غالبا مع أحدهما، وأطفال الأسر النووية، في حين أظهر أطفال رعاية الوالد الواحد تقدير ذات أدنى مقارنة بأطفال ترتيبات المعيشة الأخرى. ولم يفسر الفرق بعوامل اجتماعية اقتصادية».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/28595062/", "https://doi.org/10.1016/j.puhe.2017.04.009"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/28595062/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.puhe.2017.04.009", "label": "صفحة الدراسة", "site": "ساينس دايركت", "domain": "doi.org"}], "strength": "explicit", "argument": "الانفراد بالطفل ينقص تقدير الذات عنده، والمناصفة تبقيه كأبناء البيت الواحد؛ فالضرر في الانفراد لا في التناوب.", "jurisdiction": "السويد — جامعة ستوكهولم", "title": "تورونن 2017 — تقدير الذات ينخفض عند أبناء الانفراد لا عند أبناء المناصفة", "source_standing": "دراسة على عينة وطنية ممثلة للسكان (4823 طفلا من 10 إلى 18 سنة) من وحدة الديموغرافيا بجامعة ستوكهولم ومعهد كارولينسكا؛ والمجلة لسان الجمعية الملكية للصحة العامة في بريطانيا.", "evidence_level": "دراسة مسحية وطنية"}, {"section": "study", "card_number": 179, "supports": ["shared_parenting"], "author": {"name": "Hjern A, Urhoj SK, Fransson E, Bergström M", "date": "2021"}, "work": {"title": "Mental health in schoolchildren in joint physical custody: a longitudinal study", "section": "Children (Basel). 2021;8(6):473", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Of the children who had experienced parental separation, children in joint physical custody had the lowest adjusted odds ratio (OR)1.25 (95%-CI 1.09-1.44), for a high SDQ score relative to children living in a nuclear family, with adjusted ORs of 1.63 (1.42-1.86) and OR 1.72 (1.52-1.95) for sole physical custody arrangements with and without a new partner.\"", "verbatim": true}, "translation_ar": "«من بين الأطفال الذين عاشوا انفصال والديهم، كان لأطفال الحضانة المادية المشتركة أدنى نسبة خطر معدلة (1.25) لدرجة مرتفعة في استبيان المشكلات النفسية مقارنة بأطفال الأسرة النووية، مقابل 1.63 و1.72 لترتيبات الحضانة المنفردة مع شريك جديد أو بدونه».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/34199778/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8229623/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/34199778/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8229623/", "label": "النص الكامل", "site": "المكتبة الوطنية للطب الأمريكية", "domain": "pmc.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "بعد مراعاة حال الوالدين قبل الانفصال، بقي أبناء المناصفة أقرب إلى أبناء البيت الواحد في الصحة النفسية من أبناء الانفراد، في أكبر متابعة مواليد في الدنمارك.", "jurisdiction": "الدنمارك — متابعة المواليد الوطنية الدنماركية", "title": "هيرن 2021 — متابعة ممتدة سنوات لأكثر من 31 ألف طفل دنماركي", "source_standing": "متابعة ممتدة سنوات لـ31519 طفلا من متابعة المواليد الوطنية الدنماركية من السابعة إلى الحادية عشرة، لفريق معهد كارولينسكا وجامعة كوبنهاغن وجامعة أوبسالا؛ وأندرس هيرن أستاذ طب الأطفال الاجتماعي في كارولينسكا.", "evidence_level": "دراسة متابعة وطنية طويلة"}, {"section": "study", "card_number": 180, "supports": ["shared_parenting"], "author": {"name": "Adamsons K, Johnson SK", "date": "2013"}, "work": {"title": "An updated and expanded meta-analysis of nonresident fathering and child well-being", "section": "Journal of Family Psychology. 2013;27(4):589-599", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"a meta-analytic review of 52 studies of nonresident father involvement and child well-being. Consistent with Amato and Gilbreth, we found that positive forms of involvement were associated with benefits for children ... The forms of father involvement most strongly associated with child well-being were involvement in child-related activities, having positive father-child relationships, and engaging in multiple forms of involvement.\"", "verbatim": true}, "translation_ar": "«مراجعة تحليلية جامعة لاثنتين وخمسين دراسة في انخراط الأب غير المقيم ورفاه الطفل. واتساقا مع أماتو وغيلبريث وجدنا أن صور الانخراط الإيجابية ارتبطت بفوائد للأطفال... وكانت صور انخراط الأب الأقوى ارتباطا برفاه الطفل هي المشاركة في أنشطة الطفل، وإقامة علاقة إيجابية بين الأب وولده، وتعدد صور الانخراط».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/23978321/", "https://doi.org/10.1037/a0033786"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/23978321/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1037/a0033786", "label": "صفحة الدراسة", "site": "APA PsycNet", "domain": "doi.org"}], "strength": "explicit", "argument": "ما ينفع الولد من أبيه هو مشاركته في أنشطته وعلاقته به وتعدد صور حضوره، وهي كلها مستحيلة في ساعات نظر لا مشاركة فيها ولا نشاط.", "jurisdiction": "الولايات المتحدة — جامعة كونيتيكت", "title": "تحليل جامع لعدة دراسات 2013 — 52 دراسة على انخراط الأب غير المقيم", "source_standing": "تحليل جامع لعدة دراسات محدث لتحليل أماتو وغيلبريث سنة 1999، منشور في مجلة علم نفس الأسرة التي تصدرها جمعية علم النفس الأمريكية؛ وكاري آدامسونز من قسم النمو الإنساني ودراسات الأسرة بجامعة كونيتيكت.", "evidence_level": "تحليل جامع لعدة دراسات: أعلى درجات الدليل"}, {"section": "study", "card_number": 181, "supports": ["shared_parenting"], "author": {"name": "Fabricius WV", "date": "2020"}, "work": {"title": "Equal parenting time: the case for a legal presumption", "section": "In: Dwyer JG (ed.) The Oxford Handbook of Children and the Law. Oxford University Press; 2020. pp. 453-475", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"young adults' current emotional security with their fathers improved with each increment, from 0% to 50%, of parenting time that they had spent with their fathers during childhood. ... Note that there is no 'plateau' short of equal parenting time that might indicate a minimum amount of parenting necessary to ensure good father-child relationships.\"", "verbatim": true}, "translation_ar": "«تحسن أمان الشباب العاطفي الحالي مع آبائهم مع كل زيادة، من صفر إلى 50 بالمئة، في وقت الرعاية الذي قضوه مع آبائهم في الطفولة... ولاحظ أنه لا يوجد «ثبات» قبل المناصفة في وقت الرعاية يمكن أن يدل على حد أدنى من الرعاية يكفي لضمان علاقة جيدة بين الأب وولده».", "urls": ["https://doi.org/10.1093/oxfordhb/9780190694395.013.22", "https://fad.lu/wp-content/uploads/2020/08/equal-parenting-time-the-case-for-a-legal-presumption_695.pdf"], "links": [{"url": "https://doi.org/10.1093/oxfordhb/9780190694395.013.22", "label": "صفحة الفصل", "site": "مطبعة جامعة أكسفورد", "domain": "doi.org"}, {"url": "https://fad.lu/wp-content/uploads/2020/08/equal-parenting-time-the-case-for-a-legal-presumption_695.pdf", "label": "النص الكامل", "site": "نسخة منشورة من الفصل", "domain": "fad.lu"}], "strength": "explicit", "argument": "لا يوجد حد أدنى من وقت الأب يكفي الولد؛ كل ساعة زيادة حتى المناصفة تزيد أمانه مع أبيه، فثلاث ساعات في الأسبوع أدنى درجات السلم.", "jurisdiction": "الولايات المتحدة — جامعة ولاية أريزونا", "title": "فابريشيوس 2020 — أمان الولد مع أبيه يزداد مع كل زيادة في وقته معه حتى المناصفة", "source_standing": "فصل في دليل أكسفورد للأطفال والقانون الصادر عن مطبعة جامعة أكسفورد، يعرض بيانات 1030 شابا من أسر مطلقة؛ ووليام فابريشيوس أستاذ علم النفس في جامعة ولاية أريزونا الذي بنيت على بحوثه قوانين الولاية في وقت الرعاية.", "evidence_level": "فصل في مرجع أكاديمي محكم"}, {"section": "study", "card_number": 182, "supports": ["shared_parenting"], "author": {"name": "Lodge J, Alexander M — Australian Institute of Family Studies", "date": "2010"}, "work": {"title": "Views of adolescents in separated families: a study of adolescents' experiences after the 2006 reforms to the family law system", "section": "Melbourne: AIFS, 2010; pp. vi-vii and 21", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"more than one in three adolescents (36%) felt that the amount of time their other parent spent with them was not enough ... Adolescents living mainly in one household often felt close to the parent they lived with ... their relationship with the other parent was often less close. ... For adolescents with equal care time, the parent-child relationship often stayed warm, secure and trusting after the separation.\"", "verbatim": true}, "translation_ar": "«أكثر من واحد من كل ثلاثة مراهقين (36 بالمئة) شعر بأن الوقت الذي يقضيه والده الآخر معه غير كاف... وكان المراهقون المقيمون في بيت واحد غالبا قريبين من الوالد الذي يعيشون معه... وعلاقتهم بالوالد الآخر غالبا أقل قربا... أما المراهقون ذوو وقت الرعاية المتساوي فبقيت علاقتهم بوالديهم غالبا دافئة آمنة واثقة بعد الانفصال».", "urls": ["https://aifs.gov.au/research/commissioned-reports/views-adolescents-separated-families"], "links": [{"url": "https://aifs.gov.au/research/commissioned-reports/views-adolescents-separated-families", "label": "صفحة التقرير", "site": "المعهد الأسترالي لدراسات الأسرة", "domain": "aifs.gov.au"}], "strength": "explicit", "argument": "المراهق نفسه يشهد: الإقامة في بيت واحد تبعده عن والده الآخر، والرعاية المتساوية تبقي علاقته بوالديه دافئة آمنة؛ وهذه شهادة 623 مراهقا لا شهادة والد غاضب.", "jurisdiction": "أستراليا — المعهد الأسترالي لدراسات الأسرة", "title": "المعهد الأسترالي لدراسات الأسرة 2010 — المراهقون في الرعاية المتساوية يبقون قريبين من والديهم كليهما", "source_standing": "تقرير رسمي للمعهد الأسترالي لدراسات الأسرة، الهيئة البحثية الحكومية للأسرة في أستراليا، بتكليف من وزارة العدل الاتحادية، على مقابلات منظمة مع 623 مراهقا من 12 إلى 18 سنة.", "evidence_level": "تقرير حكومي رسمي"}, {"section": "study", "card_number": 183, "supports": ["shared_parenting"], "author": {"name": "Seltzer JA", "date": "1998"}, "work": {"title": "Father by law: effects of joint legal custody on nonresident fathers' involvement with children", "section": "Demography. 1998;35(2):135-146", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Controlling for socioeconomic status and the quality of family relationships before separation, fathers with joint legal custody see their children more frequently and have more overnight visits than do other fathers. The positive effect of joint legal custody on frequency of visits persists once unobserved differences among families are taken into account.\"", "verbatim": true}, "translation_ar": "«بعد مراعاة الحالة الاجتماعية الاقتصادية وجودة العلاقات الأسرية قبل الانفصال، يرى الآباء ذوو الولاية القانونية المشتركة أولادهم أكثر تكرارا ويبيت الأولاد عندهم أكثر من سائر الآباء. والأثر الموجب للولاية القانونية المشتركة في تكرار اللقاء يبقى بعد مراعاة الفروق غير الملحوظة بين الأسر».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/9622777/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/9622777/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "حين يكتب القانون للأب مركز الشريك يزداد حضوره فعلا ويبيت الولد عنده؛ فالنصوص تصنع السلوك، ومن حبس الأب في ساعات الرؤية صنع غيابه بيده.", "jurisdiction": "الولايات المتحدة — جامعة كاليفورنيا في لوس أنجلوس", "title": "سيلتزر 1998 في مجلة الديموغرافيا — الولاية المشتركة بنص القانون تزيد لقاء الأب بأولاده ومبيتهم عنده", "source_standing": "جوديث سيلتزر أستاذة علم الاجتماع في جامعة كاليفورنيا بلوس أنجلوس، على المسح الوطني الأمريكي للأسر والأسر المعيشية بموجتيه؛ ومجلة الديموغرافيا لسان الجمعية الأمريكية للسكان.", "evidence_level": "دراسة متابعة وطنية"}, {"section": "intl", "card_number": 184, "supports": ["shared_parenting"], "author": {"name": "لجنة حقوق الطفل", "date": "2013"}, "work": {"title": "General Comment No. 14", "section": "CRC/C/GC/14, para. 67", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The Committee is of the view that shared parental responsibilities are generally in the child's best interests.\"", "verbatim": true}, "translation_ar": "«ترى اللجنة أن المسؤوليات الأبوية المشتركة تكون بوجه عام في مصلحة الطفل الفضلى».", "urls": ["https://digitallibrary.un.org/record/778523"], "links": null, "strength": "explicit", "argument": "اللجنة الأممية التي تفسر اتفاقية حقوق الطفل تقرر أن المسؤولية المشتركة هي في الأصل مصلحة الطفل الفضلى.", "jurisdiction": "الأمم المتحدة — لجنة حقوق الطفل", "title": "لجنة حقوق الطفل الأممية 2013 — المسؤوليات المشتركة للأبوين في مصلحة الطفل غالبا", "source_standing": "لجنة حقوق الطفل هيئة من ثمانية عشر خبيرا مستقلا تراقب تنفيذ اتفاقية حقوق الطفل، وتعليقاتها العامة التفسير المعتمد لنصوص الاتفاقية.", "evidence_level": "تفسير رسمي لهيئة أممية"}, {"section": "intl", "card_number": 185, "supports": ["shared_parenting"], "author": {"name": "الجمعية البرلمانية لمجلس أوروبا", "date": "2015"}, "work": {"title": "Resolution 2079 (2015)", "section": "§5.5", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"[The Assembly calls on the member States to] introduce into their laws the principle of shared residence following a separation, limiting any exceptions…\"", "verbatim": true}, "translation_ar": "«[تدعو الجمعية الدول الأعضاء إلى] أن تدخل في قوانينها مبدأ الإقامة المشتركة بعد الانفصال، مع حصر الاستثناءات…».", "urls": ["https://pace.coe.int/files/22220/html", "https://pace.coe.int/en/files/22220/pdf"], "links": null, "strength": "explicit", "argument": "يطالب مجلس أوروبا بأن تكون الإقامة المشتركة أصلا في القانون، ويحصر الاستثناء في الإساءة والإهمال والعنف.", "jurisdiction": "مجلس أوروبا", "title": "مجلس أوروبا 2015 — الإقامة المشتركة أصلا", "source_standing": "الجمعية البرلمانية لمجلس أوروبا، تضم نوابا من برلمانات ست وأربعين دولة أوروبية.", "evidence_level": "قرار برلماني دولي"}, {"section": "intl", "card_number": 186, "supports": ["shared_parenting"], "author": {"name": "الجمعية العامة للأمم المتحدة", "date": "2002"}, "work": {"title": "Resolution S-27/2: A world fit for children", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"We will further promote the shared responsibility of both parents in education and in the raising of children, and will make every effort to ensure that fathers have opportunities to participate in their children's lives.\"", "verbatim": true}, "translation_ar": "«سنعمل على مزيد من تعزيز المسؤولية المشتركة لكلا الوالدين في تعليم الأطفال وتربيتهم، وسنبذل كل جهد لضمان أن تتاح للآباء فرص المشاركة في حياة أطفالهم».", "urls": ["https://pace.coe.int/files/22022/html"], "links": null, "strength": "explicit", "argument": "التزمت الدول في الأمم المتحدة، ومصر منها، بتعزيز المسؤولية المشتركة للوالدين وبتمكين الآباء من المشاركة في حياة أبنائهم.", "jurisdiction": "الأمم المتحدة", "title": "الأمم المتحدة 2002 — عالم صالح للأطفال", "source_standing": "وثيقة عالم صالح للأطفال اعتمدتها الجمعية العامة للأمم المتحدة في دورتها الاستثنائية الخاصة بالطفل سنة 2002، بحضور رؤساء الدول والحكومات.", "evidence_level": "وثيقة أممية"}, {"section": "intl", "card_number": 187, "supports": ["shared_parenting"], "author": {"name": "الجمعية البرلمانية لمجلس أوروبا", "date": "2013"}, "work": {"title": "Resolution 1921 (2013)", "section": "كما نقله القرار 2079، §3", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"[The Assembly called on the authorities of the member States to respect the right of fathers to enjoy shared responsibility by] ensuring that family law foresees, in case of separation or divorce, the possibility of joint custody of children, in their best interests, based on mutual agreement between the parents.\"", "verbatim": true}, "translation_ar": "«[دعت الجمعية سلطات الدول الأعضاء إلى احترام حق الآباء في المسؤولية المشتركة] بضمان أن يتيح قانون الأسرة، في حال الانفصال أو الطلاق، إمكان الحضانة المشتركة للأطفال، بما يحقق مصلحتهم الفضلى، وبناء على اتفاق الوالدين».", "urls": ["https://pace.coe.int/files/22220/html"], "links": null, "strength": "explicit", "argument": "دعا مجلس أوروبا منذ سنة 2013 إلى أن يتيح قانون الأسرة الحضانة المشتركة بعد الانفصال.", "jurisdiction": "مجلس أوروبا", "title": "مجلس أوروبا 2015 — أن يتيح قانون الأسرة الإقامة المتناوبة بعد الانفصال", "source_standing": "الجمعية البرلمانية لمجلس أوروبا، تضم نوابا من برلمانات ست وأربعين دولة أوروبية.", "evidence_level": "قرار برلماني دولي"}, {"section": "intl", "card_number": 188, "supports": ["shared_parenting"], "author": {"name": "لجنة الشؤون الاجتماعية بمجلس أوروبا — رأي على Doc. 13870", "date": "2015"}, "work": {"title": "Equality and shared parental responsibility: the role of fathers", "section": "Opinion", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"[I fully share her conclusion that, in general,] shared parental responsibility – both when a family is still intact, but in particular, following a separation – benefits all parties (the mother, the father and the child)…\"", "verbatim": true}, "translation_ar": "«[أشاطرها تماما ما انتهت إليه من أنه، بوجه عام،] المسؤولية الأبوية المشتركة، سواء في الأسرة المتماسكة أو، على وجه الخصوص، بعد الانفصال، تنفع الأطراف جميعا: الأم والأب والطفل…».", "urls": ["https://digitallibrary.un.org/record/778523"], "links": null, "strength": "explicit", "argument": "تقرر لجنة برلمانية أوروبية أن المسؤولية المشتركة تنفع الأم والأب والطفل جميعا.", "jurisdiction": "مجلس أوروبا", "title": "لجنة بمجلس أوروبا — نفع الأطراف جميعا", "source_standing": "لجنة الشؤون الاجتماعية والصحة في الجمعية البرلمانية لمجلس أوروبا، ورأيها جزء من الوثائق الرسمية للقرار 2079.", "evidence_level": "رأي لجنة برلمانية دولية"}, {"section": "intl", "card_number": 189, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "الأمم المتحدة", "date": "1989"}, "work": {"title": "Convention on the Rights of the Child", "section": "Art. 9(3)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"States Parties shall respect the right of the child who is separated from one or both parents to maintain personal relations and direct contact with both parents on a regular basis, except if it is contrary to the child's best interests.\"", "verbatim": true}, "translation_ar": "«تحترم الدول الأطراف حق الطفل المنفصل عن والديه أو عن أحدهما في الاحتفاظ بصورة منتظمة بعلاقات شخصية واتصالات مباشرة بكلا والديه، إلا إذا تعارض ذلك مع مصالح الطفل الفضلى».", "urls": ["https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child"], "links": null, "strength": "explicit", "argument": "تلتزم مصر بنص أممي يجعل للطفل حقا في صلة منتظمة مباشرة بكلا والديه، والحق للطفل نفسه، فلا يملك أحد أن يجعله منحة مشروطة.", "jurisdiction": "الأمم المتحدة", "title": "اتفاقية حقوق الطفل — الصلة بكلا الوالدين", "source_standing": "أوسع معاهدات حقوق الإنسان تصديقا في العالم، اعتمدتها الجمعية العامة للأمم المتحدة سنة 1989، وصدقت عليها مصر سنة 1990.", "evidence_level": "معاهدة دولية ملزمة"}, {"section": "intl", "card_number": 190, "supports": ["shared_parenting"], "author": {"name": "الأمم المتحدة", "date": "1989"}, "work": {"title": "Convention on the Rights of the Child", "section": "Art. 18(1)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"States Parties shall use their best efforts to ensure recognition of the principle that both parents have common responsibilities for the upbringing and development of the child.\"", "verbatim": true}, "translation_ar": "«تبذل الدول الأطراف قصارى جهدها لضمان الاعتراف بالمبدأ القائل إن كلا الوالدين يتحملان مسؤوليات مشتركة عن تربية الطفل ونموه».", "urls": ["https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child"], "links": null, "strength": "explicit", "argument": "مبدأ المسؤولية المشتركة للوالدين مما تلتزم الدول بالاعتراف به، وقصر الرعاية على الأم خروج عليه.", "jurisdiction": "الأمم المتحدة", "title": "اتفاقية حقوق الطفل — المسؤولية المشتركة للوالدين", "source_standing": "أوسع معاهدات حقوق الإنسان تصديقا في العالم، اعتمدتها الجمعية العامة للأمم المتحدة سنة 1989، وصدقت عليها مصر سنة 1990.", "evidence_level": "معاهدة دولية ملزمة"}, {"section": "intl", "card_number": 191, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "الاتحاد الإفريقي", "date": "1990"}, "work": {"title": "African Charter on the Rights and Welfare of the Child", "section": "Art. 19(2)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Every child who is separated from one or both parents shall have the right to maintain personal relations and direct contact with both parents on a regular basis.", "verbatim": true}, "translation_ar": "«لكل طفل منفصل عن أحد والديه أو عن كليهما الحق في أن يحتفظ بصورة منتظمة بعلاقات شخصية واتصال مباشر بكلا والديه.»", "urls": ["https://au.int/en/treaties/african-charter-rights-and-welfare-child"], "links": null, "strength": "explicit", "argument": "الميثاق الإفريقي، ومصر طرف فيه، يجعل للطفل المنفصل عن أحد والديه حق الصلة المنتظمة المباشرة بهما.", "jurisdiction": "الاتحاد الإفريقي", "title": "الميثاق الإفريقي لحقوق الطفل — الصلة بالوالدين", "source_standing": "معاهدة إفريقية لحقوق الطفل، اعتمدتها منظمة الوحدة الإفريقية سنة 1990، ونفذت سنة 1999.", "evidence_level": "معاهدة إقليمية ملزمة"}, {"section": "intl", "card_number": 192, "supports": ["shared_parenting"], "author": {"name": "الجمعية البرلمانية لمجلس أوروبا", "date": "2015"}, "work": {"title": "Resolution 2079 (2015)", "section": "§4", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"[The Assembly firmly believes that] developing shared parental responsibility helps to transcend gender stereotypes about the roles supposedly assigned to women and men within the family…\"", "verbatim": true}, "translation_ar": "«[تؤمن الجمعية إيمانا راسخا بأن] تطوير المسؤولية الأبوية المشتركة يساعد على تجاوز الصور النمطية عن الأدوار المفترض إسنادها إلى النساء والرجال داخل الأسرة…».", "urls": ["https://pace.coe.int/files/22220/html"], "links": null, "strength": "indirect", "argument": "يرى مجلس أوروبا أن قصر الرعاية على الأم صورة نمطية لا مقتضى طبيعة، وأن المسؤولية المشتركة تتجاوزها.", "jurisdiction": "مجلس أوروبا", "title": "مجلس أوروبا 2015 — تجاوز الصور النمطية", "source_standing": "الجمعية البرلمانية لمجلس أوروبا، تضم نوابا من برلمانات ست وأربعين دولة أوروبية.", "evidence_level": "قرار برلماني دولي"}, {"section": "intl", "card_number": 193, "supports": ["childhood_ends_at_puberty"], "author": {"name": "اليونيسف — شعبة البيانات والتحليل والتخطيط والرصد", "date": "2024"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Defined by the United Nations as those between the ages of 10 and 19, adolescents experience a transition period between childhood and adulthood and with it, significant growth and development.\"", "verbatim": true}, "translation_ar": "«المراهقون، الذين تعرفهم الأمم المتحدة بمن هم بين سن 10 و19 سنة، يعيشون فترة انتقال بين الطفولة والرشد، ومعها نمو وتطور كبيران».", "urls": ["https://data.unicef.org/topic/adolescents/overview/"], "links": [{"url": "https://data.unicef.org/topic/adolescents/overview/", "label": "النص الرسمي", "site": "اليونيسف — قاعدة البيانات", "domain": "data.unicef.org"}], "strength": "explicit", "argument": "الأمم المتحدة نفسها التي يحتج الخصوم بتعريفها للطفل تعد ابن العاشرة مراهقا خارجا من الطفولة، فالخامسة عشرة في منتصف المراهقة لا في الطفولة.", "jurisdiction": "الأمم المتحدة — اليونيسف", "title": "اليونيسف — الأمم المتحدة تعرف المراهقين بمن هم بين العاشرة والتاسعة عشرة", "source_standing": "الصفحة الإحصائية الرسمية لليونيسف، وكالة الأمم المتحدة للطفولة، وفيها تعريف الأمم المتحدة المعتمد في كل إحصاءاتها.", "evidence_level": "تعريف رسمي لهيئة أممية"}, {"section": "intl", "card_number": 194, "supports": ["childhood_ends_at_puberty"], "author": {"name": "الأمم المتحدة — القضايا العالمية: الشباب", "date": "1981"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"For statistical purposes, however, the United Nations—without prejudice to any other definitions made by Member States—defines 'youth' as those persons between the ages of 15 and 24 years. This definition ... was endorsed by the General Assembly in its resolution 36/28 of 1981.\"", "verbatim": true}, "translation_ar": "«لأغراض الإحصاء تعرف الأمم المتحدة، دون إخلال بأي تعريف آخر تضعه الدول الأعضاء، «الشباب» بأنهم الأشخاص بين سن 15 و24 سنة. وقد أقرت الجمعية العامة هذا التعريف في قرارها 36/28 لسنة 1981».", "urls": ["https://www.un.org/en/global-issues/youth"], "links": [{"url": "https://www.un.org/en/global-issues/youth", "label": "النص الرسمي", "site": "الأمم المتحدة", "domain": "www.un.org"}], "strength": "explicit", "argument": "من بلغ الخامسة عشرة شاب في عرف الأمم المتحدة الإحصائي بقرار من جمعيتها العامة، فتحديد الثامنة عشرة في الاتفاقية حد قانوني للأهلية لا حد طبي ولا نفسي للطفولة.", "jurisdiction": "الأمم المتحدة", "title": "الأمم المتحدة — ابن الخامسة عشرة «شاب» في كل إحصاءاتها منذ 1981", "source_standing": "الصفحة الرسمية للأمم المتحدة، والتعريف مقر بقرار من الجمعية العامة، وتعمل به كل الكتب الإحصائية الأممية عن الشباب.", "evidence_level": "تعريف رسمي بقرار أممي"}, {"section": "intl", "card_number": 195, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "الأمم المتحدة", "date": "1989"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Article 7(1): The child shall be registered immediately after birth and shall have the right from birth to a name, the right to acquire a nationality and, as far as possible, the right to know and be cared for by his or her parents. ... Article 1: a child means every human being below the age of eighteen years unless under the law applicable to the child, majority is attained earlier.\"", "verbatim": true}, "translation_ar": "«المادة 7/1: يسجل الطفل بعد ولادته فورا، ويكون له الحق منذ ولادته في اسم، والحق في اكتساب جنسية، والحق، قدر الإمكان، في معرفة والديه وتلقي رعايتهما... المادة 1: يعني الطفل كل إنسان لم يتجاوز الثامنة عشرة، ما لم يبلغ سن الرشد قبل ذلك بموجب القانون المنطبق عليه».", "urls": ["https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child"], "links": [{"url": "https://www.ohchr.org/en/instruments-mechanisms/instruments/convention-rights-child", "label": "النص الرسمي", "site": "المفوضية السامية لحقوق الإنسان", "domain": "www.ohchr.org"}], "strength": "explicit", "argument": "الاتفاقية التي يحتج بها الخصوم تجعل تلقي رعاية الوالدين كليهما حقا للطفل منذ ولادته، وتجعل الثامنة عشرة حدا قانونيا للرشد لا حدا للحاجة إلى الأم وحدها.", "jurisdiction": "الأمم المتحدة", "title": "اتفاقية حقوق الطفل — حق الطفل من ولادته في أن يعرف والديه ويتلقى رعايتهما", "source_standing": "أوسع معاهدات حقوق الإنسان تصديقا في العالم (196 دولة طرفا)، وصدقت عليها مصر سنة 1990؛ والنص من الموقع الرسمي للمفوضية السامية لحقوق الإنسان.", "evidence_level": "معاهدة دولية ملزمة"}, {"section": "intl", "card_number": 196, "supports": ["shared_parenting"], "author": {"name": "اليونيسف — بيان صحفي رسمي، على لسان بيا بريتو رئيسة نماء الطفل في سنواته الأولى", "date": "2018"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"More than just a second parent or an extra set of hands, fathers are one of the best child development resources we have, and if we are going to give children the best start in life, we all need to fully recognize and utilize this role ... when fathers nurture their young ones in their earliest years of life ... their children will learn better, have less behavioural issues, and become healthier, happier human beings.\"", "verbatim": true}, "translation_ar": "«الآباء أكثر من مجرد والد ثان أو يدين إضافيتين؛ إنهم من أفضل موارد نمو الطفل التي نملكها، وإذا أردنا أن نعطي الأطفال أفضل بداية في الحياة فعلينا جميعا أن نعترف بهذا الدور ونستثمره كاملا... فحين يرعى الآباء صغارهم في سنيهم الأولى... يتعلم أطفالهم على نحو أفضل، وتقل مشكلاتهم السلوكية، ويصيرون بشرا أصح وأسعد».", "urls": ["https://www.unicef.org/india/press-releases/fathers-are-one-best-yet-most-underutilized-child-development-resources-unicef"], "links": [{"url": "https://www.unicef.org/india/press-releases/fathers-are-one-best-yet-most-underutilized-child-development-resources-unicef", "label": "النص الرسمي", "site": "اليونيسف", "domain": "www.unicef.org"}], "strength": "explicit", "argument": "وكالة الأمم المتحدة للطفولة تصف الأب بأنه من أفضل موارد نمو الطفل، فالقانون الذي يحرم الطفل من أبيه يهدر أفضل موارده.", "jurisdiction": "الأمم المتحدة — اليونيسف", "title": "اليونيسف 2018 — الآباء من أفضل موارد نمو الطفل وأقلها استعمالا", "source_standing": "بيان رسمي صادر عن مقر اليونيسف في نيويورك ومنشور على مواقعها القطرية؛ وبيا بريتو رئيسة نماء الطفل في سنواته الأولى في اليونيسف ومن مؤلفي سلسلة لانسيت عن نماء الطفل.", "evidence_level": "بيان رسمي لهيئة أممية"}, {"section": "law", "card_number": 197, "supports": ["shared_parenting"], "author": {"name": "السويد", "date": ""}, "work": {"title": "Föräldrabalken (SFS 1949:381)", "section": "6 kap. 2 a §", "volume": "", "page": "", "edition": ""}, "original": {"lang": "sv", "text": "«Vid bedömningen av vad som är bäst för barnet skall det fästas avseende särskilt vid barnets behov av en nära och god kontakt med båda föräldrarna.»", "verbatim": true}, "translation_ar": "«عند تقدير ما هو الأفضل للطفل، يراعى على وجه الخصوص حاجة الطفل إلى صلة وثيقة وطيبة بكلا الوالدين».", "urls": ["https://data.riksdagen.se/dokument/GN01LU15.html"], "links": null, "strength": "explicit", "argument": "يوجب القانون السويدي على القاضي أن يراعي حاجة الطفل إلى صلة وثيقة بكلا والديه في كل ما يقضي به.", "jurisdiction": "السويد", "title": "القانون السويدي — صلة الطفل بكلا والديه", "source_standing": "قانون الوالدين والأولاد السويدي هو التشريع الجامع لأحكام الطفل والوالدين في السويد؛ والسويد من أعلى دول العالم في نسبة الإقامة المتناوبة بعد الفرقة.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 198, "supports": ["shared_parenting"], "author": {"name": "بلجيكا", "date": "2006"}, "work": {"title": "Code civil", "section": "art. 374 §2 (loi du 18 juillet 2006)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "fr", "text": "«À défaut d'accord, en cas d'autorité parentale conjointe, le tribunal examine prioritairement, à la demande d'un des parents au moins, la possibilité de fixer l'hébergement de l'enfant de manière égalitaire entre ses parents.»", "verbatim": true}, "translation_ar": "«عند عدم الاتفاق، وفي حال السلطة الأبوية المشتركة، تنظر المحكمة بالأولوية، بطلب من أحد الوالدين على الأقل، في إمكان تحديد إقامة الطفل بالتساوي بين والديه».", "urls": ["https://www.dekamer.be/FLWB/Pdf/51/1673/51K1673019.pdf"], "links": null, "strength": "explicit", "argument": "ألزم القانون البلجيكي المحكمة بالنظر أولا في الإقامة المتساوية، وجعل عبء نفيها على من يعترض عليها.", "jurisdiction": "بلجيكا", "title": "القانون البلجيكي 2006 — أولوية الإقامة المتساوية", "source_standing": "قانون 18 يوليو 2006 البلجيكي أدخل في القانون المدني تقديم الإقامة المتساوية عند طلب أحد الوالدين، وكان من أوائل القوانين الأوروبية في ذلك.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 199, "supports": ["shared_parenting"], "author": {"name": "كنتاكي، الولايات المتحدة", "date": "2018"}, "work": {"title": "HB 528 (KRS 403.270)", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"There shall be a presumption, rebuttable by a preponderance of the evidence, that joint custody and equally shared parenting time is in the best interest of the child.\"", "verbatim": true}, "translation_ar": "«يفترض، افتراضا قابلا لإثبات العكس برجحان الأدلة، أن الحضانة المشتركة ووقت الرعاية المتساوي هما في مصلحة الطفل الفضلى».", "urls": ["https://en.wikipedia.org/wiki/Kentucky_House_Bill_528"], "links": null, "strength": "explicit", "argument": "جعلت ولاية كنتاكي الحضانة المشتركة والوقت المتساوي أصلا مفترضا، ولو اعترض أحد الوالدين، وعلى المعترض عبء النقض؛ فالأب لا يستأذن في صلته بولده.", "jurisdiction": "الولايات المتحدة — ولاية كنتاكي", "title": "قانون ولاية كنتاكي الأمريكية 2018 — افتراض الحضانة المشتركة", "source_standing": "كنتاكي أول ولاية أمريكية جعلت الحضانة المشتركة والوقت المتساوي أصلا مفترضا في كل قضايا الحضانة، بقانون أقره مجلسا الولاية بأغلبية ساحقة.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 200, "supports": ["shared_parenting"], "author": {"name": "كندا", "date": "2021"}, "work": {"title": "Divorce Act (R.S.C. 1985)", "section": "s. 16(6)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"In allocating parenting time, the court shall give effect to the principle that a child should have as much time with each spouse as is consistent with the best interests of the child.\"", "verbatim": true}, "translation_ar": "«عند توزيع وقت الرعاية، تعمل المحكمة المبدأ القائل إن للطفل أن يقضي مع كل زوج أكبر قدر من الوقت يتسق مع مصلحته الفضلى».", "urls": ["https://laws-lois.justice.gc.ca/eng/acts/d-3.4/section-16.html"], "links": null, "strength": "explicit", "argument": "يلزم القانون الكندي المحكمة بأن تجعل للطفل مع كل والد أكبر وقت تقتضيه مصلحته.", "jurisdiction": "كندا", "title": "القانون الكندي 2021 — أكبر وقت مع كل والد", "source_standing": "قانون الطلاق الكندي قانون اتحادي يسري في كل المقاطعات، وتعديله سنة 2021 أول تعديل جوهري لأحكام الرعاية منذ أكثر من عشرين عاما.", "evidence_level": "تشريع اتحادي نافذ"}, {"section": "law", "card_number": 201, "supports": ["shared_parenting"], "author": {"name": "وزارة العدل الكندية", "date": "2021"}, "work": {"title": "The Divorce Act Changes Explained", "section": "s. 16(6) — Reason for the change", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Sufficient time with each parent is necessary to maintain these relationships.\"", "verbatim": true}, "translation_ar": "«إن الوقت الكافي مع كل والد ضروري للحفاظ على هذه العلاقات».", "urls": ["https://justice.gc.ca/eng/fl-df/cfl-mdf/dace-clde/div72.html"], "links": null, "strength": "explicit", "argument": "عللت وزارة العدل الكندية النص بأن الصلة لا تحفظ إلا بوقت كاف مع كل والد؛ فاللقاءات القصيرة المتباعدة لا تحفظ صلة ولا تبني علاقة.", "jurisdiction": "كندا", "title": "وزارة العدل الكندية — تعليل النص", "source_standing": "شرح رسمي صادر عن وزارة العدل الكندية لتعليل ن ده، لا بتقتيره.", "jurisdiction": "الولايات المتحدة — ولاية أريزونا", "title": "قانون ولاية أريزونا 2012 — تعظيم وقت كل والد", "source_standing": "قانون ولاية أريزونا المعدل سنة 2012، وتطبقه محاكم الأسرة في الولاية.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 204, "supports": ["shared_parenting"], "author": {"name": "أريزونا، الولايات المتحدة", "date": ""}, "work": {"title": "Arizona Revised Statutes", "section": "§ 25-403.01", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"…to ensure that the minor child has substantial, frequent, meaningful and continuing contact with the parent unless the court finds, after a hearing, that parenting time would endanger the child's physical, mental, moral or emotional health.\"", "verbatim": true}, "translation_ar": "«…لضمان أن يكون للطفل القاصر تواصل كبير ومتكرر وذو معنى ومستمر مع الوالد، إلا إذا ثبت للمحكمة بعد جلسة أن وقت الرعاية يعرض صحة الطفل البدنية أو العقلية أو الأخلاقية أو العاطفية للخطر».", "urls": ["https://azleg.gov/legtext/57leg/1r/bills/hb2296h.htm"], "links": null, "strength": "explicit", "argument": "للوالد غير الحاضن في أريزونا تواصل كبير مستمر، لا يمنع منه إلا بخطر يثبت بعد جلسة.", "jurisdiction": "الولايات المتحدة — ولاية أريزونا", "title": "قانون ولاية أريزونا — تواصل كبير ومستمر", "source_standing": "قانون ولاية أريزونا في الحضانة، وتطبقه محاكم الأسرة في الولاية.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 205, "supports": ["shared_parenting"], "author": {"name": "لجنة القانون في الهند", "date": "2015"}, "work": {"title": "Reforms in Guardianship and Custody Laws in India", "section": "Report No. 257", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: أوصت لجنة القانون الهندية بتعديل قانوني الولاية والحضانة ليجعلا الأب والأم متساويين في المركز القانوني في الولاية والحضانة، وبإدخال مفهوم الحضانة المشتركة وتمكين المحاكم من الحكم بها مع خطط رعاية، وجعل مصلحة الطفل الاعتبار الأعلى.", "verbatim": f
