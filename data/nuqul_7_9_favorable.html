dei genitori, di ricevere cura, educazione, istruzione e assistenza morale da entrambi e di conservare rapporti significativi con gli ascendenti e con i parenti di ciascun ramo genitoriale.»", "verbatim": true}, "translation_ar": "«للابن القاصر الحق في الحفاظ على علاقة متوازنة ومستمرة مع كل من والديه، وفي تلقي الرعاية والتربية والتعليم والسند المعنوي من كليهما، وفي الإبقاء على صلات ذات معنى بالأصول وبالأقارب من كل فرع من فرعي الوالدين».", "urls": ["https://brocardi.it/codice-civile/libro-primo/titolo-ix/capo-ii/art337ter.html"], "links": null, "strength": "explicit", "argument": "ينص القانون الإيطالي على حق الطفل في صلة متوازنة مستمرة بكلا والديه، وفي صلة بأقاربه من جهة الأب وجهة الأم معا، وهذه صلة الأرحام في لفظ تشريعي.", "jurisdiction": "إيطاليا", "title": "القانون الإيطالي — الصلة بالوالدين والأقارب", "source_standing": "القانون المدني الإيطالي، ونص الحضانة المشتركة فيه مقرر بقانون سنة 2006.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 208, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "ألمانيا", "date": ""}, "work": {"title": "BGB", "section": "§ 1626 Abs. 3", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "«Zum Wohl des Kindes gehört in der Regel der Umgang mit beiden Elternteilen. Gleiches gilt für den Umgang mit anderen Personen, zu denen das Kind Bindungen besitzt, wenn ihre Aufrechterhaltung für seine Entwicklung förderlich ist.»", "verbatim": true}, "translation_ar": "«من مصلحة الطفل في العادة التواصل مع كلا والديه. والحكم نفسه في التواصل مع غيرهم ممن تربطه بهم روابط، إذا كان الإبقاء عليها نافعا لنموه».", "urls": ["https://www.gesetze-im-internet.de/bgb/__1626.html"], "links": null, "strength": "explicit", "argument": "يجعل القانون الألماني تواصل الطفل مع والديه ومع من تربطه بهم روابط من مصلحته في الأصل.", "jurisdiction": "ألمانيا", "title": "القانون الألماني — التواصل مع الوالدين والأرحام", "source_standing": "القانون المدني الألماني من أشهر التقنينات المدنية في العالم، نافذ منذ سنة 1900.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 209, "supports": ["shared_parenting"], "author": {"name": "ألمانيا", "date": ""}, "work": {"title": "BGB", "section": "§ 1684 Abs. 1", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "«Das Kind hat das Recht auf Umgang mit jedem Elternteil; jeder Elternteil ist zum Umgang mit dem Kind verpflichtet und berechtigt.»", "verbatim": true}, "translation_ar": "«للطفل حق التواصل مع كل من والديه، وكل والد ملزم بالتواصل مع الطفل ومخول به».", "urls": ["https://www.gesetze-im-internet.de/bgb/__1684.html"], "links": null, "strength": "explicit", "argument": "للطفل حق في كل والد، وعلى كل والد واجب نحوه، فالصلة حق للطفل لا منة على الأب.", "jurisdiction": "ألمانيا", "title": "القانون الألماني — حق الطفل في كل والد", "source_standing": "القانون المدني الألماني من أشهر التقنينات المدنية في العالم، نافذ منذ سنة 1900.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 210, "supports": ["shared_parenting"], "author": {"name": "البرازيل", "date": "2014"}, "work": {"title": "Código Civil", "section": "art. 1.584 §2 (Lei 13.058/2014)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "pt", "text": "«Quando não houver acordo entre a mãe e o pai quanto à guarda do filho, encontrando-se ambos os genitores aptos a exercer o poder familiar, será aplicada a guarda compartilhada, salvo se um dos genitores declarar ao magistrado que não deseja a guarda do menor.»", "verbatim": true}, "translation_ar": "«إذا لم يتفق الأم والأب على حضانة الابن، وكان كلاهما أهلا لممارسة السلطة الأسرية، طبقت الحضانة المشتركة، إلا إذا صرح أحد الوالدين للقاضي بأنه لا يرغب في حضانة القاصر».", "urls": ["https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/L13058.htm"], "links": null, "strength": "explicit", "argument": "جعل القانون البرازيلي الحضانة المشتركة قاعدة يقضي بها القاضي عند الخلاف، ما دام الوالدان أهلا لها.", "jurisdiction": "البرازيل", "title": "القانون البرازيلي — الحضانة المشتركة قاعدة", "source_standing": "قانون اتحادي برازيلي صدر سنة 2014، جعل الحضانة المشتركة القاعدة في البلاد كلها.", "evidence_level": "تشريع اتحادي نافذ"}, {"section": "law", "card_number": 211, "supports": ["shared_parenting"], "author": {"name": "الأرجنتين", "date": "2015"}, "work": {"title": "Código Civil y Comercial", "section": "art. 651", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "«A pedido de uno o ambos progenitores o de oficio, el juez debe otorgar, como primera alternativa, el cuidado compartido del hijo con la modalidad indistinta, excepto que no sea posible o resulte perjudicial para el hijo.»", "verbatim": true}, "translation_ar": "«بطلب من أحد الوالدين أو كليهما، أو من تلقاء نفسه، يجب على القاضي أن يقضي، خيارا أول، بالرعاية المشتركة بالمناصفة للابن في صورتها المتداخلة بين الوالدين، إلا إذا تعذر ذلك أو أضر بالابن».", "urls": ["http://servicios.infoleg.gob.ar/infolegInternet/anexos/235000-239999/235975/norma.htm"], "links": null, "strength": "explicit", "argument": "يلزم القانون الأرجنتيني القاضي بأن يقضي بالرعاية المشتركة بالمناصفة خيارا أول، ولا يعدل عنها إلا لتعذر أو ضرر.", "jurisdiction": "الأرجنتين", "title": "القانون الأرجنتيني — الحضانة المشتركة خيار أول يلزم به القاضي", "source_standing": "القانون المدني والتجاري الأرجنتيني الموحد، نافذ منذ سنة 2015.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 212, "supports": ["shared_parenting"], "author": {"name": "اليابان", "date": "2024"}, "work": {"title": "تعديل القانون المدني", "section": "الولاية المشتركة بعد الطلاق", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ja", "text": "مضمونه: أقر البرلمان سنة 2024 جواز الولاية المشتركة بعد الطلاق، بعد أن كانت منفردة إلزاما، ويعمل به في 2026.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.moj.go.jp/MINJI/minji07_00357.html"], "links": [{"url": "https://www.moj.go.jp/MINJI/minji07_00357.html", "label": "الصفحة الرسمية للقانون", "site": "وزارة العدل اليابانية", "domain": "www.moj.go.jp"}], "strength": "explicit", "argument": "عدلت اليابان، وكانت من أشد الدول تمسكا بالولاية المنفردة، إلى الولاية المشتركة بعد الطلاق.", "jurisdiction": "اليابان", "title": "اليابان — إقرار الولاية المشتركة بعد الطلاق", "source_standing": "تعديل القانون المدني الياباني أقره البرلمان سنة 2024، وهو أول تغيير لأحكام الولاية بعد الطلاق منذ نحو ثمانية عقود.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 213, "supports": ["shared_parenting"], "author": {"name": "الإمارات (أبوظبي)", "date": "2021/2022"}, "work": {"title": "قانون الأحوال الشخصية المدنية لغير المسلمين", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "حضانة الأبناء حق مشترك ومتساو للأب والأم بعد وقوع الطلاق / الأصل في حضانة الأبناء هو اشتراك الأب والأم معا في مسؤولية تربية الأبناء بعد وقوع الطلاق، ما لم يطلب أحدهما التنازل كتابة أمام المحكمة عن حقه في الحضانة أو تقديم طلب للمحكمة بعزل الطرف الآخر من الحضانة المشتركة وإسقاط حقه في الحضانة", "verbatim": true}, "translation_ar": "", "urls": ["https://u.ae/-/media/Documents-2023/11Arabic2021-(1).pdf"], "links": [{"url": "https://u.ae/-/media/Documents-2023/11Arabic2021-(1).pdf", "label": "النص الرسمي في الجريدة الرسمية", "site": "البوابة الرسمية لحكومة الإمارات", "domain": "u.ae"}], "strength": "explicit", "argument": "جعلت أبوظبي الحضانة المشتركة أصلا بعد الطلاق، فالتجربة قائمة في بلد عربي.", "jurisdiction": "الإمارات — أبوظبي", "title": "أبوظبي — الحضانة المشتركة أصلا", "source_standing": "قانون صادر في إمارة أبوظبي سنة 2021 لتنظيم الأحوال الشخصية المدنية، تطبقه محكمة أبوظبي للأسرة.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 214, "supports": ["shared_parenting"], "author": {"name": "هولندا", "date": "2009"}, "work": {"title": "Burgerlijk Wetboek", "section": "Boek 1, art. 247 lid 3 (Wet bevordering voortgezet ouderschap en zorgvuldige scheiding)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "nl", "text": "Een kind over wie de ouders gezamenlijk het gezag uitoefenen, behoudt na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed, na de ontbinding van het geregistreerd partnerschap anders dan door de dood, of na het beëindigen van de samenleving indien de ouders het gezag gezamenlijk uitoefenen op grond van artikel 251b, eerste lid, of een aantekening als bedoeld in artikel 252, eerste lid, is geplaatst, recht op een gelijkwaardige verzorging en opvoeding door beide ouders.", "verbatim": true}, "translation_ar": "«الطفل الذي يمارس والداه الولاية عليه معا يحتفظ، بعد حل الزواج بغير الوفاة أو بعد الانفصال الجسدي، أو بعد حل الشراكة المسجلة بغير الوفاة، أو بعد انتهاء المعاشرة إذا كان الوالدان يمارسان الولاية معا بموجب المادة 251b الفقرة 1 أو سجل قيد بالمعنى الوارد في المادة 252 الفقرة 1، بالحق في رعاية وتربية متكافئتين من كلا الوالدين.»", "urls": ["https://wetten.overheid.nl/BWBR0002656/"], "links": null, "strength": "explicit", "argument": "جعل القانون الهولندي للطفل نفسه حقا في توزيع متكافئ لرعايته وتربيته بين والديه بعد الانفصال.", "jurisdiction": "هولندا", "title": "القانون الهولندي — حق الطفل في رعاية وتربية متكافئتين من الوالدين بعد الانفصال", "source_standing": "القانون المدني الهولندي، ونص التوزيع المتكافئ للرعاية فيه مقرر بقانون تعزيز استمرار دور الوالدين سنة 2009.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 215, "supports": ["shared_parenting"], "author": {"name": "سويسرا", "date": "2017"}, "work": {"title": "Code civil suisse", "section": "art. 298 al. 2ter", "volume": "", "page": "", "edition": ""}, "original": {"lang": "fr", "text": "«Lorsque l'autorité parentale est exercée conjointement, le juge examine, selon le bien de l'enfant, la possibilité de la garde alternée, si le père, la mère ou l'enfant la demande.»", "verbatim": true}, "translation_ar": "«إذا كانت السلطة الأبوية مشتركة، نظر القاضي، بحسب مصلحة الطفل، في إمكان الحضانة المتناوبة إذا طلبها الأب أو الأم أو الطفل».", "urls": ["https://www.fedlex.admin.ch/eli/cc/24/233_245_233/fr"], "links": null, "strength": "explicit", "argument": "يلزم القانون السويسري القاضي بالنظر في الحضانة المتناوبة متى طلبها الأب أو الأم أو الطفل.", "jurisdiction": "سويسرا", "title": "القانون السويسري — النظر في الحضانة المتناوبة", "source_standing": "القانون المدني السويسري من أدق التقنينات المدنية الأوروبية، ونص النظر في الحضانة المتناوبة فيه نافذ منذ سنة 2017.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 216, "supports": ["shared_parenting"], "author": {"name": "إسبانيا", "date": ""}, "work": {"title": "Código Civil", "section": "art. 92.8", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "«Excepcionalmente, aun cuando no se den los supuestos del apartado cinco de este artículo, el Juez… podrá acordar la guarda y custodia compartida fundamentándola en que sólo de esta forma se protege adecuadamente el interés superior del menor.»", "verbatim": true}, "translation_ar": "«استثناء، وإن لم تتحقق شروط الفقرة الخامسة من هذه المادة، يجوز للقاضي… أن يقضي بالحضانة المشتركة مسببا ذلك بأنها وحدها التي تحمي المصلحة الفضلى للقاصر حماية كافية».", "urls": ["https://www.boe.es/buscar/act.php?id=BOE-A-1889-4763"], "links": null, "strength": "explicit", "argument": "أجاز القانون الإسباني الحضانة المشتركة بطلب أحد الوالدين، ثم جعلتها المحكمة العليا هي الأصل الطبيعي المرغوب.", "jurisdiction": "إسبانيا", "title": "القانون الإسباني — الحضانة المشتركة بطلب أحد الوالدين", "source_standing": "القانون المدني الإسباني، ويفسره قضاء المحكمة العليا الإسبانية التي جعلت الحضانة المشتركة هي الأصل.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 217, "supports": ["shared_parenting"], "author": {"name": "البرتغال", "date": "2020"}, "work": {"title": "Código Civil", "section": "art. 1906.º, n.º 6 (Lei n.º 65/2020)", "volume": "", "page": "", "edition": ""}, "original": {"lang": "pt", "text": "Quando corresponder ao superior interesse da criança e ponderadas todas as circunstâncias relevantes, o tribunal pode determinar a residência alternada do filho com cada um dos progenitores, independentemente de mútuo acordo nesse sentido e sem prejuízo da fixação da prestação de alimentos.", "verbatim": true}, "translation_ar": "«عندما يوافق ذلك مصلحة الطفل الفضلى، وبعد الموازنة بين جميع الظروف ذات الصلة، يجوز للمحكمة أن تقرر الإقامة المتناوبة للابن عند كل من والديه، بصرف النظر عن وجود اتفاق متبادل بذلك، ودون إخلال بتحديد نفقة [الطفل].»", "urls": ["https://www.pgdlisboa.pt/leis/lei_mostra_articulado.php?nid=775&tabela=leis"], "links": null, "strength": "explicit", "argument": "تجيز البرتغال الإقامة المتناوبة ولو لم يتفق الوالدان، فلا يملك أحدهما تعطيلها.", "jurisdiction": "البرتغال", "title": "القانون البرتغالي 2020 — الإقامة المتناوبة", "source_standing": "قانون برتغالي صدر سنة 2020، أجاز للمحكمة تقرير الإقامة المتناوبة مراعاة لمصلحة الطفل.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 218, "supports": ["shared_parenting"], "author": {"name": "أركنساس، الولايات المتحدة", "date": "2021"}, "work": {"title": "Act 604 of 2021", "section": "Ark. Code § 9-13-101", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "(iv)(a) In an action concerning an original child custody determination in a divorce or paternity matter, there is a rebuttable presumption that joint custody is in the best interest of the child. (b) The presumption that joint custody is in the best interest of the child may be rebutted: (1) If the court finds by clear and convincing evidence that joint custody is not in the best interest of the child; — and § 9-13-101(a)(5): \"joint custody\" means the approximate and reasonable equal division of time with the child by both parents individually as agreed to by the parents or as ordered by the court.", "verbatim": true}, "translation_ar": "«(iv)(a) في الدعوى المتعلقة بتقرير حضانة الطفل لأول مرة في قضية طلاق أو نسب، يوجد افتراض قابل للدحض بأن الحضانة المشتركة في مصلحة الطفل الفضلى. (b) يجوز دحض افتراض أن الحضانة المشتركة في مصلحة الطفل الفضلى: (1) إذا وجدت المحكمة بدليل واضح ومقنع أن الحضانة المشتركة ليست في مصلحة الطفل الفضلى؛ — وتعني «الحضانة المشتركة» [في هذه المادة] تقسيم الوقت مع الطفل تقسيما متساويا تقريبا ومعقولا بين الوالدين كل على حدة، بحسب اتفاق الوالدين أو بحسب ما تأمر به المحكمة.»", "urls": ["https://www.arkleg.state.ar.us/Acts/FTPDocument?path=%2FACTS%2F2021R%2FPublic%2F&file=604.pdf&ddBienniumSession=2021%2F2021R"], "links": null, "strength": "explicit", "argument": "جعلت ولاية أركنساس الحضانة المشتركة أصلا مفترضا لا ينقض إلا بدليل واضح مقنع.", "jurisdiction": "الولايات المتحدة — ولاية أركنساس", "title": "قانون ولاية أركنساس الأمريكية 2021 — افتراض الحضانة المشتركة", "source_standing": "قانون ولاية أركنساس لسنة 2021، جعل الحضانة المشتركة أصلا لا ينقض إلا بدليل واضح مقنع.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 219, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "البرازيل", "date": "2010"}, "work": {"title": "Lei nº 12.318/2010 (Alienação Parental)", "section": "art. 3º", "volume": "", "page": "", "edition": ""}, "original": {"lang": "pt", "text": "«A prática de ato de alienação parental fere direito fundamental da criança ou do adolescente de convivência familiar saudável…»", "verbatim": true}, "translation_ar": "«ممارسة أي فعل من أفعال تنفير الطفل من أحد والديه تنتهك حقا أساسيا للطفل أو المراهق في حياة أسرية سليمة…».", "urls": ["http://www.planalto.gov.br/ccivil_03/_ato2007-2010/2010/lei/l12318.htm"], "links": null, "strength": "explicit", "argument": "جعل القانون البرازيلي تنفير الطفل من أحد والديه انتهاكا لحق أساسي للطفل؛ وهو المعنى الذي سماه فقهاؤنا التغييب والإغراء بالعقوق وقطيعة الرحم.", "jurisdiction": "البرازيل", "title": "قانون البرازيل 2010 — تنفير الطفل من أحد والديه انتهاك لحقه", "source_standing": "قانون اتحادي برازيلي خاص بمكافحة تنفير الطفل من أحد والديه، من أوائل القوانين في العالم في هذا الباب.", "evidence_level": "تشريع اتحادي نافذ"}, {"section": "law", "card_number": 220, "supports": ["shared_parenting"], "author": {"name": "فلوريدا، الولايات المتحدة", "date": "2023"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"It is the public policy of this state that each minor child has frequent and continuing contact with both parents after the parents separate or the marriage of the parties is dissolved and to encourage parents to share the rights and responsibilities, and joys, of childrearing. ... there is a rebuttable presumption that equal time-sharing of a minor child is in the best interests of the minor child.\"", "verbatim": true}, "translation_ar": "«من السياسة العامة لهذه الولاية أن يكون لكل طفل قاصر اتصال متكرر ومستمر بوالديه كليهما بعد انفصالهما أو انحلال زواجهما، وتشجيع الوالدين على أن يتقاسما حقوق تربية الأولاد ومسؤولياتها وأفراحها... وتقوم قرينة قابلة لإثبات العكس على أن تقاسم وقت الطفل القاصر بالتساوي هو في مصلحته الفضلى».", "urls": ["http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0000-0099/0061/Sections/0061.13.html"], "links": [{"url": "http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0000-0099/0061/Sections/0061.13.html", "label": "النص الرسمي للمادة", "site": "الهيئة التشريعية لولاية فلوريدا", "domain": "www.leg.state.fl.us"}], "strength": "explicit", "argument": "ولاية فيها أكثر من عشرين مليون نسمة تجعل المناصفة في وقت الطفل أصلا مفترضا، وتسمي تربية الأولاد حقا ومسؤولية وفرحا يتقاسمه الوالدان.", "jurisdiction": "الولايات المتحدة — ولاية فلوريدا", "title": "قانون ولاية فلوريدا 2023 — قرينة المناصفة في وقت الرعاية", "source_standing": "تشريع نافذ منذ 1 يوليو 2023 في ثالث أكبر ولايات أمريكا سكانا، منشور على الموقع الرسمي للهيئة التشريعية للولاية.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 221, "supports": ["shared_parenting"], "author": {"name": "فرجينيا الغربية، الولايات المتحدة", "date": "2022"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"There shall be a presumption, rebuttable by a preponderance of the evidence, that equal (50-50) custodial allocation is in the best interest of the child. If the presumption is rebutted, the court shall, absent an agreement between the parents as to all matters related to custodial allocation, construct a parenting time schedule which maximizes the time each parent has with the child\"", "verbatim": true}, "translation_ar": "«تقوم قرينة، قابلة للدحض برجحان الأدلة، على أن التقسيم الحضاني بالتساوي (50-50) هو في مصلحة الطفل الفضلى. فإذا دحضت القرينة، وجب على المحكمة، ما لم يتفق الوالدان على كل ما يتعلق بالتقسيم الحضاني، أن تضع جدولا لوقت الرعاية يعظم الوقت الذي يقضيه كل والد مع الطفل».", "urls": ["https://code.wvlegislature.gov/48-9-102A/"], "links": [{"url": "https://code.wvlegislature.gov/48-9-102A/", "label": "النص الرسمي للمادة", "site": "الهيئة التشريعية لفرجينيا الغربية", "domain": "code.wvlegislature.gov"}], "strength": "explicit", "argument": "الأصل في هذه الولاية مناصفة بالأرقام، وحتى إذا دحضت القرينة فالواجب تعظيم وقت كل والد لا تقليله إلى ساعات.", "jurisdiction": "الولايات المتحدة — ولاية فرجينيا الغربية", "title": "قانون فرجينيا الغربية 2022 — قرينة التقسيم بالمناصفة 50-50", "source_standing": "تشريع نافذ منشور على الموقع الرسمي لمدونة قوانين الولاية، وهو من أصرح نصوص المناصفة في العالم إذ ينص على النسبة 50-50 بالأرقام.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 222, "supports": ["shared_parenting"], "author": {"name": "ميزوري، الولايات المتحدة", "date": "2023"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"There shall be a rebuttable presumption that an award of equal or approximately equal parenting time to each parent is in the best interests of the child. ... it is the public policy of this state that frequent, continuing and meaningful contact with both parents after the parents have separated or dissolved their marriage is in the best interest of the child\"", "verbatim": true}, "translation_ar": "«تقوم قرينة قابلة للدحض على أن منح كل والد وقت رعاية متساويا أو يقارب المساواة هو في مصلحة الطفل الفضلى... ومن السياسة العامة لهذه الولاية أن الاتصال المتكرر المستمر ذا المعنى بالوالدين كليهما بعد انفصالهما أو انحلال زواجهما هو في مصلحة الطفل الفضلى».", "urls": ["https://revisor.mo.gov/main/OneSection.aspx?section=452.375"], "links": [{"url": "https://revisor.mo.gov/main/OneSection.aspx?section=452.375", "label": "النص الرسمي للمادة", "site": "المراجع الرسمي لقوانين ميزوري", "domain": "revisor.mo.gov"}], "strength": "explicit", "argument": "المشرع يصف الاتصال الواجب بثلاث صفات: متكرر ومستمر وذو معنى؛ وثلاث ساعات نظر في الأسبوع لا تحقق واحدة منها.", "jurisdiction": "الولايات المتحدة — ولاية ميزوري", "title": "قانون ميزوري 2023 — الاتصال المتكرر المستمر بالوالدين معا سياسة عامة وقرينة المناصفة", "source_standing": "تشريع نافذ منشور على موقع المراجع الرسمي لقوانين الولاية؛ والفقرة الرابعة إعلان سياسة عامة تطبقه محاكم الولاية في كل قضايا الحضانة.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 223, "supports": ["shared_parenting"], "author": {"name": "لويزيانا، الولايات المتحدة", "date": "2024"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The implementation order shall allocate the time periods during which each parent shall have physical custody of the child so that the child is assured of frequent and continuing contact with both parents. ... Unless the court determines it is not feasible or in the best interest of the child, physical custody of the child shall be shared equally.\"", "verbatim": true}, "translation_ar": "«يخصص أمر التنفيذ الفترات الزمنية التي يكون فيها لكل والد الحضانة المادية للطفل، بحيث يضمن للطفل اتصال متكرر ومستمر بوالديه كليهما... وما لم تقرر المحكمة أن ذلك غير ممكن أو ليس في مصلحة الطفل الفضلى، تقسم الحضانة المادية للطفل بالتساوي».", "urls": ["https://legis.la.gov/Legis/Law.aspx?d=107527"], "links": [{"url": "https://legis.la.gov/Legis/Law.aspx?d=107527", "label": "النص الرسمي للمادة", "site": "الهيئة التشريعية لولاية لويزيانا", "domain": "legis.la.gov"}], "strength": "explicit", "argument": "التساوي هو القاعدة والاستثناء يحتاج إلى قرار مسبب من المحكمة، فالعبء على من يريد حرمان الولد من نصف وقته مع أبيه.", "jurisdiction": "الولايات المتحدة — ولاية لويزيانا", "title": "قانون لويزيانا — الحضانة المادية تقسم بالتساوي ما لم يتعذر", "source_standing": "تشريع نافذ منشور على الموقع الرسمي للهيئة التشريعية للولاية، ولويزيانا من أقدم الولايات الأمريكية في تقرير الحضانة المشتركة أصلا مفترضا.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 224, "supports": ["shared_parenting"], "author": {"name": "كاليفورنيا، الولايات المتحدة", "date": "2024"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The Legislature finds and declares that it is the public policy of this state to ensure that children have frequent and continuing contact with both parents after the parents have separated or dissolved their marriage, or ended their relationship, and to encourage parents to share the rights and responsibilities of child rearing in order to effect this policy\"", "verbatim": true}, "translation_ar": "«يقرر المشرع ويعلن أن من السياسة العامة لهذه الولاية ضمان أن يكون للأطفال اتصال متكرر ومستمر بوالديهم كليهما بعد انفصال الوالدين أو انحلال زواجهما أو انتهاء علاقتهما، وتشجيع الوالدين على تقاسم حقوق تربية الأولاد ومسؤولياتها تحقيقا لهذه السياسة».", "urls": ["https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=FAM&sectionNum=3020."], "links": [{"url": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=FAM&sectionNum=3020.", "label": "النص الرسمي للمادة", "site": "الهيئة التشريعية لولاية كاليفورنيا", "domain": "leginfo.legislature.ca.gov"}], "strength": "explicit", "argument": "أكبر ولاية في أمريكا تعلن أن تقاسم الوالدين تربية الأولاد سياسة عامة للدولة، لا منحة من الحاضنة ولا رخصة من القاضي.", "jurisdiction": "الولايات المتحدة — ولاية كاليفورنيا", "title": "قانون الأسرة في كاليفورنيا — الاتصال المتكرر المستمر بالوالدين معا سياسة الولاية", "source_standing": "تشريع نافذ في أكبر ولايات أمريكا سكانا، منشور على الموقع الرسمي للمعلومات التشريعية للولاية، وتستشهد به محاكمها في كل أحكام الحضانة.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 225, "supports": ["7", "9"], "author": {"name": "ماليزيا — الأقاليم الاتحادية", "date": "1984"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"(1) The right of the hadhinah to the custody of a child terminates upon the child attaining the age of seven years, in the case of a male, and the age of nine years, in the case of a female … (2) After termination of the right of the hadhinah, the custody devolves upon the father, and if the child has reached the age of discernment (mumaiyiz), he or she shall have the choice of living with either of the parents, unless the Court otherwise orders.\"", "verbatim": true}, "translation_ar": "«(1) ينتهي حق الحاضنة في حضانة الطفل ببلوغ الطفل سن سبع سنين إن كان ذكرا، وسن تسع سنين إن كانت أنثى … (2) وبعد انتهاء حق الحاضنة تنتقل الحضانة إلى الأب، وإذا بلغ الطفل سن التمييز (مميز) كان له [أو لها] أن يختار العيش مع أي من الوالدين، ما لم تأمر المحكمة بغير ذلك».", "urls": ["https://www.ius.uzh.ch/dam/jcr:00000000-573e-dcae-0000-00004dd0afc8/Act303.pdf"], "links": [{"url": "https://www.ius.uzh.ch/dam/jcr:00000000-573e-dcae-0000-00004dd0afc8/Act303.pdf", "label": "النص الرسمي للقانون", "site": "نسخة لدى كلية الحقوق بجامعة زيورخ", "domain": "www.ius.uzh.ch"}], "strength": "explicit_7", "argument": "دولة إسلامية معاصرة تقنن في قانون نافذ ما قرره الفقهاء: سبع للغلام وتسع للجارية، ثم تنتقل الحضانة بنص المادة نفسها إلى الأب، والتخيير بعد التمييز بين أبوين حاضرين.", "jurisdiction": "ماليزيا — قانون الأسرة الإسلامي", "title": "قانون الأسرة الإسلامي في ماليزيا 1984 — حضانة النساء تنتهي بسبع للذكر وتسع للأنثى", "source_standing": "القانون الذي تطبقه المحاكم الشرعية في العاصمة كوالالمبور والأقاليم الاتحادية الماليزية، وعلى منواله قوانين الولايات الماليزية الأخرى؛ وماليزيا دولة ذات أغلبية مسلمة تطبق الفقه الشافعي في الأحوال الشخصية.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 226, "supports": ["7"], "author": {"name": "الكنيسة الكاثوليكية — مدونة القانون الكنسي", "date": "1983"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"A minor before the completion of the seventh year is called an infant and is considered not responsible for oneself (non sui compos). With the completion of the seventh year, however, a minor is presumed to have the use of reason.\"", "verbatim": true}, "translation_ar": "«القاصر قبل تمام السنة السابعة يسمى طفلا ويعد غير مسؤول عن نفسه. أما بتمام السنة السابعة فيفترض في القاصر أنه يستعمل عقله».", "urls": ["https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib1-cann96-123_en.html"], "links": [{"url": "https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib1-cann96-123_en.html", "label": "النص الرسمي", "site": "الكرسي الرسولي — الفاتيكان", "domain": "www.vatican.va"}], "strength": "explicit_7", "argument": "أكبر منظومة قانونية دينية في العالم تجعل السابعة حد عدم التمييز وسن استعمال العقل، وهو عين سن التمييز الذي حد به الفقهاء انتهاء الحضانة.", "jurisdiction": "الفاتيكان — القانون الكنسي", "title": "مدونة القانون الكنسي 1983 — بتمام السابعة يفترض استعمال العقل", "source_standing": "المدونة القانونية الملزمة للكنيسة الكاثوليكية في العالم كله، أصدرها البابا يوحنا بولس الثاني سنة 1983، والنص من الترجمة الرسمية على موقع الكرسي الرسولي.", "evidence_level": "نص قانوني ملزم لأكثر من مليار إنسان"}, {"section": "law", "card_number": 227, "supports": ["7"], "author": {"name": "مجمع الأسرار ومجمع الإكليروس — الكرسي الرسولي", "date": "1977"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The age of discretion both for confession and for communion is the age in which the child begins to reason, i.e. around the seventh year, either before or after. From that time begins the obligation\"", "verbatim": true}, "translation_ar": "«سن التمييز للاعتراف والمناولة هو السن الذي يبدأ فيه الطفل يعقل، أي نحو السنة السابعة، قبلها بقليل أو بعدها. ومن ذلك الوقت يبدأ الالتزام».", "urls": ["https://www.vatican.va/roman_curia/congregations/cclergy/documents/rc_con_cclergy_doc_19770331_penance-communion_en.html"], "links": [{"url": "https://www.vatican.va/roman_curia/congregations/cclergy/documents/rc_con_cclergy_doc_19770331_penance-communion_en.html", "label": "النص الرسمي", "site": "الكرسي الرسولي — الفاتيكان", "domain": "www.vatican.va"}], "strength": "explicit_7", "argument": "لفظ «سن التمييز» بعينه مستعمل في أكبر الكنائس بمعنى سن بدء العقل نحو السابعة، فمن جعل الصغير بلا تمييز إلى الخامسة عشرة خالف الشرائع كلها.", "jurisdiction": "الفاتيكان — القانون الكنسي", "title": "الكرسي الرسولي 1977 — سن التمييز هو سن بدء العقل نحو السابعة", "source_standing": "وثيقة رسمية صادرة عن مجمعين من مجامع الكرسي الرسولي بموافقة البابا بولس السادس، تعيد تقرير المرسوم البابوي الذي يحكم سن التمييز عند الكاثوليك منذ سنة 1910.", "evidence_level": "وثيقة رسمية للكرسي الرسولي"}, {"section": "law", "card_number": 228, "supports": ["7"], "author": {"name": "George Long, in: William Smith (ed.) — A Dictionary of Greek and Roman Antiquities, art. \"Infans\"", "date": "1875"}, "work": {"title": "", "section": "لندن، جون موراي، الصفحة 636؛ نسخة جامعة شيكاغو", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the period of infantia was extended beyond that which the strict etymological meaning of the word signifies, and its termination was fixed by a positive rule at the end of the seventh year, as appears by numerous passages (Dig. 26 tit. 7 s.1; 23 tit. 1 s.14; Cod. 6 tit. 30 s.18 ...)\"", "verbatim": true}, "translation_ar": "«مدت فترة عدم التمييز (infantia) إلى ما وراء المعنى الاشتقاقي الدقيق للكلمة، وحدد انتهاؤها بقاعدة وضعية قاطعة عند نهاية السنة السابعة، كما يظهر من نصوص كثيرة (الديجستا 26/7/1 و23/1/14، ومدونة جستنيان 6/30/18)».", "urls": ["https://penelope.uchicago.edu/Thayer/E/Roman/Texts/secondary/SMIGRA*/Infans.html"], "links": [{"url": "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/secondary/SMIGRA*/Infans.html", "label": "نص المادة", "site": "جامعة شيكاغو — مكتبة لاكوس كورتيوس", "domain": "penelope.uchicago.edu"}], "strength": "explicit_7", "argument": "أصل القوانين المدنية في أوروبا كلها، القانون الروماني، يحد سن عدم التمييز بتمام السابعة بقاعدة قاطعة، وهو ما قرره الفقهاء قبل أن يقننه الغرب.", "jurisdiction": "القانون الروماني", "title": "القانون الروماني — سن عدم التمييز تنتهي بقاعدة قاطعة عند تمام السابعة", "source_standing": "أشهر معجم كلاسيكي للمؤسسات اليونانية والرومانية، والمادة بقلم جورج لونغ زميل كلية ترينيتي في كامبريدج ومن كبار شراح القانون الروماني في عصره؛ وتستند المادة إلى نصوص الديجستا ومدونة جستنيان مباشرة.", "evidence_level": "مرجع كلاسيكي معتمد"}, {"section": "law", "card_number": 229, "supports": ["7"], "author": {"name": "الهند — برلمان الهند", "date": "2023"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"20. Nothing is an offence which is done by a child under seven years of age. 21. Nothing is an offence which is done by a child above seven years of age and under twelve years of age, who has not attained sufficient maturity of understanding to judge of the nature and consequences of his conduct\"", "verbatim": true}, "translation_ar": "«المادة 20: لا يعد جريمة ما يفعله طفل دون سبع سنين. المادة 21: لا يعد جريمة ما يفعله طفل فوق سبع سنين ودون اثنتي عشرة سنة لم يبلغ من نضج الفهم ما يكفي للحكم على طبيعة فعله وعواقبه».", "urls": ["https://www.mha.gov.in/sites/default/files/250883_english_01042024.pdf"], "links": [{"url": "https://www.mha.gov.in/sites/default/files/250883_english_01042024.pdf", "label": "النص الرسمي للقانون", "site": "وزارة الداخلية الهندية", "domain": "www.mha.gov.in"}], "strength": "explicit_7", "argument": "أكبر دولة في العالم سكانا تجعل السابعة بدء التمييز في قانون أعيد سنه سنة 2023؛ فالسابعة حد التمييز في الشرائع الحية لا في كتب الفقه وحدها.", "jurisdiction": "الهند — القانون الجنائي", "title": "قانون العقوبات الهندي 2023 — التمييز يبدأ من السابعة", "source_standing": "قانون نافذ منذ 1 يوليو 2024 لأكثر من مليار وأربعمئة مليون إنسان، منشور على موقع وزارة الداخلية الهندية، ويعيد قاعدة قانون العقوبات الهندي لسنة 1860 في المادتين 82 و83.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 230, "supports": ["7"], "author": {"name": "التلمود البابلي — بابا بترا 21أ", "date": "نحو 500 م"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Yehoshua ben Gamla came and instituted an ordinance that teachers of children should be established in each and every province and in each and every town, and they would bring the children in to learn at the age of six and at the age of seven.\"", "verbatim": true}, "translation_ar": "«جاء يهوشوع بن جملا فسن تشريعا بأن ينصب معلمون للأطفال في كل إقليم وكل مدينة، وأن يدخل الأطفال للتعلم في سن السادسة وفي سن السابعة».", "urls": ["https://www.sefaria.org/Bava_Batra.21a.4?lang=bi"], "links": [{"url": "https://www.sefaria.org/Bava_Batra.21a.4?lang=bi", "label": "النص في مصدره", "site": "مكتبة سيفاريا", "domain": "www.sefaria.org"}], "strength": "explicit_7", "argument": "قبل ألفي سنة جعلت هذه الشريعة السادسة والسابعة سن خروج الطفل من البيت إلى المعلم، وهو ما قرره الفقهاء في أن سن التأديب والتعليم سبع، وبه ينتقل الولد إلى أبيه.", "jurisdiction": "الشريعة اليهودية", "title": "التلمود — إدخال الأطفال إلى المعلمين في السادسة والسابعة", "source_standing": "التلمود البابلي النص المركزي للشريعة اليهودية، والطبعة المنقول عنها هي الطبعة الإنجليزية المعتمدة المتاحة في مكتبة سيفاريا؛ والنص يحكي أول نظام للتعليم العام في القرن الأول الميلادي.", "evidence_level": "نص شرعي مؤسس"}, {"section": "law", "card_number": 231, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "إدارة الأطفال والأسر — وزارة الصحة والخدمات الإنسانية الأمريكية", "date": "2018"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"There is a great deal of evidence indicating that fathers play an important role in healthy child development and family stability. A father's positive involvement in the life of his child, both by direct engagement with the child and positive engagement with the mother, can lead to better child outcomes in a number of areas. ... Non-resident father involvement has also been associated with children's social and emotional well-being, academic achievement, and behavioral adjustment\"", "verbatim": true}, "translation_ar": "«هناك قدر كبير من الأدلة على أن الآباء يؤدون دورا مهما في النمو الصحي للطفل واستقرار الأسرة. ومشاركة الأب الإيجابية في حياة ولده، بالانخراط المباشر مع الطفل وبالتعامل الإيجابي مع الأم، تفضي إلى نتائج أفضل للطفل في مجالات عدة... وقد ارتبطت مشاركة الأب غير المقيم كذلك برفاه الأطفال الاجتماعي والعاطفي وتحصيلهم الدراسي وتوافقهم السلوكي».", "urls": ["https://acf.gov/ofa/policy-guidance/acf-acf-im-18-01-integrating-approaches-prioritize-and-enhance-father"], "links": [{"url": "https://acf.gov/ofa/policy-guidance/acf-acf-im-18-01-integrating-approaches-prioritize-and-enhance-father", "label": "النص الرسمي", "site": "إدارة الأطفال والأسر الأمريكية", "domain": "acf.gov"}], "strength": "explicit", "argument": "الدولة الأمريكية تأمر أجهزتها ومحاكمها رسميا بإشراك الأب في حياة ولده بغض النظر عن محل إقامته ووضع الحضانة، لأن الأدلة على أثره في صحة الطفل قاطعة.", "jurisdiction": "الولايات المتحدة — وزارة الصحة والخدمات الإنسانية", "title": "الحكومة الاتحادية الأمريكية 2018 — توجيه رسمي بإشراك الآباء أيا كان وضع الحضانة", "source_standing": "توجيه رسمي موقع من مساعد وزير الصحة لشؤون الأطفال والأسر ورؤساء مكاتب الطفولة ودعم الطفل، موجه إلى وزارات الخدمات الاجتماعية والمحاكم في الولايات كلها، ويستند إلى تحاليل جامعة لعدة دراسات منشورة.", "evidence_level": "توجيه حكومي اتحادي رسمي"}, {"section": "law", "card_number": 232, "supports": ["7"], "author": {"name": "الهند — قانون الأقلية والولاية الهندوسي رقم 32 لسنة 1956", "date": "1956"}, "work": {"title": "The Hindu Minority and Guardianship Act, 1956 — Section 6", "section": "المادة 6 (أ): الأولياء الطبيعيون للقاصر الهندوسي", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"(a) in the case of a boy or an unmarried girl—the father, and after him, the mother: provided that the custody of a minor who has not completed the age of five years shall ordinarily be with the mother;\"", "verbatim": true}, "translation_ar": "«(أ) في حالة الولد أو البنت غير المتزوجة: الأب، ومن بعده الأم؛ على أن حضانة القاصر الذي لم يتم الخامسة من عمره تكون عادة مع الأم».", "urls": ["https://www.indiacode.nic.in/handle/123456789/1649"], "links": [{"url": "https://www.indiacode.nic.in/handle/123456789/1649", "label": "نص القانون", "site": "مدونة القوانين الهندية الرسمية", "domain": "www.indiacode.nic.in"}], "strength": "explicit", "argument": "شريعة أكبر أقليات العالم عددا تجعل الأب الولي الطبيعي الأول، ولا تخص الأم إلا بسني الرضاعة والفطام إلى الخامسة؛ فتمديد انفراد الأم إلى الخامسة عشرة لا نظير له في شرائع الأرض.", "jurisdiction": "الهند — البرلمان الهندي", "title": "قانون الأقلية والولاية الهندوسي 1956 — الأب هو الولي الطبيعي، وحضانة الأم عادة إلى تمام الخامسة", "source_standing": "قانون اتحادي هندي نافذ منذ 1956 يحكم ولاية وحضانة الأطفال الهندوس، وهم أكثر من مليار إنسان؛ وتطبقه المحاكم الهندية إلى اليوم.", "evidence_level": "تشريع نافذ"}, {"section": "law", "card_number": 233, "supports": ["7"], "author": {"name": "UK Parliament — Living Heritage: Custody rights and domestic violence", "date": "1839"}, "work": {"title": "Custody of Infants Act 1839 (2 & 3 Vict. c. 54)", "section": "صفحة التراث الحي على موقع البرلمان البريطاني، فقرة قانون حضانة الصغار 1839", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Previously mothers had no rights at all over their children if the marriage broke down. ... [The Custody of Infants Act 1839] permitted a mother to petition the courts for custody of her children up to the age of seven, and for access in respect of older children.\"", "verbatim": true}, "translation_ar": "«قبل ذلك لم يكن للأمهات أي حق على أطفالهن إذا انهار الزواج... [وقانون حضانة الصغار سنة 1839] أجاز للأم أن تلتمس من المحاكم حضانة أطفالها حتى سن السابعة، وحق الصلة بمن هم أكبر».", "urls": ["https://www.parliament.uk/about/living-heritage/transformingsociety/private-lives/relationships/overview/custodyrights/"], "links": [{"url": "https://www.parliament.uk/about/living-heritage/transformingsociety/private-lives/relationships/overview/custodyrights/", "label": "صفحة البرلمان البريطاني", "site": "برلمان المملكة المتحدة", "domain": "www.parliament.uk"}], "strength": "explicit_7", "argument": "حين عرف القانون الإنجليزي للأم حقا في الحضانة أول مرة حده بالسابعة؛ فالسابعة حد حضانة النساء في أصل القانون الغربي كما في الفقه الإسلامي، وما جاء بعدها جاء بالمساواة بين الوالدين لا بتفضيل الأم.", "jurisdiction": "المملكة المتحدة — برلمان المملكة المتحدة", "title": "قانون حضانة الصغار الإنجليزي 1839 — أول حق للأم في الحضانة كان إلى السابعة فقط", "source_standing": "الموقع الرسمي لبرلمان المملكة المتحدة في سلسلة «التراث الحي» التي تؤرخ لتشريعاته؛ والقانون هو أول قانون إنجليزي يعطي الأم حقا في حضانة أطفالها.", "evidence_level": "وثيقة تشريعية رسمية"}, {"section": "court", "card_number": 234, "supports": ["shared_parenting"], "author": {"name": "إسبانيا — المحكمة العليا", "date": "2013"}, "work": {"title": "STS 257/2013", "section": "29 abril 2013", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "«La redacción del artículo 92 no permite concluir que [la guarda y custodia compartida] se trate de una medida excepcional, sino que al contrario, habrá de considerarse normal e incluso deseable, porque permite que sea efectivo el derecho que los hijos tienen a relacionarse con ambos progenitores, aun en situaciones de crisis, siempre que ello sea posible y en tanto en cuanto lo sea.»", "verbatim": true}, "translation_ar": "«إن صياغة المادة 92 لا تسمح بالقول إن [الحضانة المشتركة] تدبير استثنائي، بل على العكس يجب أن تعد أمرا طبيعيا بل مرغوبا فيه، لأنها تجعل حق الأبناء في الصلة بكلا الوالدين نافذا، حتى في أوقات الأزمات، متى كان ذلك ممكنا وبقدر ما يكون ممكنا».", "urls": ["https://www.iberley.es/jurisprudencia/guarda-custodia-compartida-interes-menores-sentencia-civil-n-257-2013-ts-sala-civil-sec-1-rec-2525-2011-29-04-2013-11970411"], "links": null, "strength": "explicit", "argument": "قررت أعلى محكمة في إسبانيا أن الحضانة المشتركة هي الطبيعي المرغوب، لأنها تحقق حق الأبناء في الصلة بكلا الوالدين.", "jurisdiction": "إسبانيا", "title": "المحكمة العليا الإسبانية 2013 — الحضانة المشتركة هي الأصل", "source_standing": "أعلى هيئة قضائية في إسبانيا في غير المسائل الدستورية، وأحكامها تنشئ الاجتهاد الذي تتبعه المحاكم.", "evidence_level": "حكم قضائي ملزم"}, {"section": "court", "card_number": 235, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "المحكمة الأوروبية لحقوق الإنسان (الدائرة الكبرى)", "date": ""}, "work": {"title": "قضاء مستقر على المادة 8", "section": "Strand Lobben and Others v. Norway وما قبله", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The mutual enjoyment by parent and child of each other's company constitutes a fundamental element of family life, and domestic measures hindering such enjoyment amount to an interference with the right protected by this provision [Article 8 of the Convention].\"", "verbatim": true}, "translation_ar": "«إن تمتع الوالد والطفل كل منهما بصحبة الآخر عنصر أساسي من عناصر الحياة الأسرية، والتدابير الوطنية التي تعوق هذا التمتع تعد تدخلا في الحق الذي تحميه هذه المادة [المادة 8 من الاتفاقية]».", "urls": ["https://ks.echr.coe.int/documents/d/echr-ks/contact-rights", "https://www.hrw.org/news/2020/07/03/submission-european-court-human-rights-am-v-russia"], "links": null, "strength": "explicit", "argument": "تقضي المحكمة الأوروبية بأن صحبة الوالد وولده من صميم الحياة الأسرية، وأن ما يعوقها تدخل في الحق؛ فكل نظام يحصر صلة الأب بولده في لقاءات قصيرة متباعدة إعاقة ظاهرة لهذا الحق.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية لحقوق الإنسان — صحبة الوالد وولده", "source_standing": "محكمة دولية في ستراسبورغ أنشأها مجلس أوروبا سنة 1959، تفصل في انتهاكات الاتفاقية الأوروبية لحقوق الإنسان، وأحكامها ملزمة لست وأربعين دولة.", "evidence_level": "قضاء دولي مستقر"}, {"section": "court", "card_number": 236, "supports": ["shared_parenting"], "author": {"name": "المحكمة الأوروبية لحقوق الإنسان", "date": "2002"}, "work": {"title": "Hoppe v. Germany", "section": "Application no. 28422/95", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تمتع الوالد والطفل بصحبة أحدهما الآخر عنصر أساسي للحياة الأسرية «even if the relationship between the parents had broken down».", "verbatim": false}, "translation_ar": "«حتى لو انهارت العلاقة بين الوالدين».", "urls": ["https://vlex.co.uk/vid/hoppe-v-germany-849758494"], "links": null, "strength": "explicit", "argument": "حق الوالد وولده في الصحبة لا يسقط بانهيار الزوجية، فالفرقة بين الزوجين ليست فرقة بين الأب وولده.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية — الصحبة حق رغم انهيار الزوجية", "source_standing": "محكمة دولية في ستراسبورغ أنشأها مجلس أوروبا سنة 1959، وأحكامها ملزمة لست وأربعين دولة.", "evidence_level": "حكم قضائي دولي ملزم"}, {"section": "court", "card_number": 237, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "المحكمة الأوروبية لحقوق الإنسان", "date": ""}, "work": {"title": "قضاء مستقر على المادة 8 في قضايا التواصل", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Article 8 of the Convention thus imposes on every State the obligation to aim at reuniting a natural parent with his or her child.\"", "verbatim": true}, "translation_ar": "«فالمادة 8 من الاتفاقية تفرض على كل دولة واجب السعي إلى جمع الوالد الطبيعي بولده».", "urls": ["https://cora.ucc.ie/bitstreams/cf6d89a2-f27b-4f29-a1b9-0499d9dea3f9/download"], "links": null, "strength": "explicit", "argument": "على الدولة واجب أن تسعى إلى جمع الوالد بولده، لا أن تكتفي بالامتناع عن التفريق بينهما.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية — واجب الجمع بين الوالد وولده", "source_standing": "محكمة دولية في ستراسبورغ أنشأها مجلس أوروبا سنة 1959، وأحكامها ملزمة لست وأربعين دولة.", "evidence_level": "قضاء دولي مستقر"}, {"section": "court", "card_number": 238, "supports": ["shared_parenting"], "author": {"name": "المحكمة العليا لولاية West Virginia — مواد تدريب القضاة", "date": "2023"}, "work": {"title": "Impact of Separation on Family Bonds", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: مادة تدريبية رسمية لقضاة الأسرة تعرض تقرير Warshak 2014 ودراسة Fabricius 2017، وتنقل أن التحذير من المبيت في السنوات الثلاث الأولى لا تسنده الأدلة.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.courtswv.gov/sites/default/pubfilesmnt/2023-06/ImpactSeparationFamily%20BondSAAR.pdf"], "links": null, "strength": "explicit", "argument": "تعلم المحاكم الأمريكية قضاتها رسميا أن التحذير من مبيت الصغير عند أبيه في سنيه الأولى لا تسنده الأدلة.", "jurisdiction": "الولايات المتحدة — ولاية فرجينيا الغربية", "title": "تدريب قضاة الأسرة في ولاية أمريكية 2023 — المبيت عند الأب", "source_standing": "المحكمة العليا للاستئناف في ولاية فرجينيا الغربية أعلى محاكم الولاية، وتتولى تدريب قضاتها؛ والمادة منشورة على موقعها الرسمي.", "evidence_level": "مادة تدريب قضائي رسمية"}, {"section": "court", "card_number": 239, "supports": ["shared_parenting"], "author": {"name": "Supreme Court of Alabama — Ex parte Devine, 398 So. 2d 686", "date": "1981"}, "work": {"title": "", "section": "حكم 27 مارس 1981، القضية رقم 79-546", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"we conclude that the tender years presumption represents an unconstitutional gender-based classification which discriminates between fathers and mothers in child custody proceedings solely on the basis of sex. ... By requiring fathers to carry the difficult burden of affirmatively proving the unfitness of the mother, the presumption may have the effect of depriving some loving fathers of the custody of their children\"", "verbatim": true}, "translation_ar": "«نخلص إلى أن قرينة سن الحنان [تفضيل الأم في حضانة الصغار] تصنيف غير دستوري قائم على الجنس، يميز بين الآباء والأمهات في دعاوى الحضانة لمجرد الجنس... وبإلزام الآباء حمل العبء الشاق في إثبات عدم صلاحية الأم إثباتا إيجابيا، قد تؤدي هذه القرينة إلى حرمان آباء محبين من حضانة أولادهم».", "urls": ["https://law.justia.com/cases/alabama/supreme-court/1981/398-so-2d-686-1.html"], "links": [{"url": "https://law.justia.com/cases/alabama/supreme-court/1981/398-so-2d-686-1.html", "label": "نص الحكم", "site": "Justia — قاعدة الأحكام الأمريكية", "domain": "law.justia.com"}], "strength": "explicit", "argument": "القاعدة التي يبني عليها القانون المصري بقاء الصغير مع أمه وحدها هي «قرينة سن الحنان» بعينها، وقد قضت محكمة عليا أمريكية سنة 1981 بأنها تمييز بسبب الجنس تحرم الآباء المحبين من أولادهم.", "jurisdiction": "الولايات المتحدة — المحكمة العليا لولاية ألاباما", "title": "المحكمة العليا لألاباما 1981 — تفضيل الأم في «سن الحنان» تمييز غير دستوري", "source_standing": "أعلى محكمة في ولاية ألاباما، وحكمها هذا هو الحكم المرجعي الذي أسقط «قرينة سن الحنان» في الولايات المتحدة، وتستشهد به المحاكم الأمريكية إلى اليوم.", "evidence_level": "حكم محكمة عليا"}, {"section": "court", "card_number": 240, "supports": ["shared_parenting"], "author": {"name": "Supreme Court of Utah — Pusey v. Pusey, 728 P.2d 117", "date": "1986"}, "work": {"title": "", "section": "حكم 18 أغسطس 1986، القضية رقم 20365", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"We believe the time has come to discontinue our support, even in dictum, for the notion of gender-based preferences in child custody cases. ... the rule lacks validity because it is unnecessary and perpetuates outdated stereotypes. ... We believe that the choice in competing child custody claims should instead be based on function-related factors.\"", "verbatim": true}, "translation_ar": "«نعتقد أن الوقت قد حان لنكف عن تأييد فكرة التفضيل القائم على الجنس في دعاوى الحضانة ولو على سبيل الاستطراد... فالقاعدة [تفضيل الأم] تفتقر إلى الصحة لأنها غير ضرورية وتديم صورا نمطية بالية... ونعتقد أن الاختيار بين المتنازعين على الحضانة ينبغي أن يقوم بدلا من ذلك على عوامل وظيفية [من يقوم فعلا برعاية الولد]».", "urls": ["https://law.justia.com/cases/utah/supreme-court/1986/20365-0.html"], "links": [{"url": "https://law.justia.com/cases/utah/supreme-court/1986/20365-0.html", "label": "نص الحكم", "site": "Justia — قاعدة الأحكام الأمريكية", "domain": "law.justia.com"}], "strength": "explicit", "argument": "تفضيل الأم لمجرد أنها أم صورة نمطية بالية في نظر القضاء الأمريكي، والمعتبر من يقوم بوظيفة الرعاية فعلا؛ والأب الذي يعلم ويؤدب ويربي قائم بها.", "jurisdiction": "الولايات المتحدة — المحكمة العليا لولاية يوتا", "title": "المحكمة العليا ليوتا 1986 — لا تفضيل لوالد بسبب جنسه", "source_standing": "أعلى محكمة في ولاية يوتا، ويستشهد بحكمها مع حكم ألاباما على أن القضاء الأمريكي هجر تفضيل الأم لمجرد كونها أما.", "evidence_level": "حكم محكمة عليا"}, {"section": "court", "card_number": 241, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Supreme Court of the United States — Stanley v. Illinois, 405 U.S. 645", "date": "1972"}, "work": {"title": "", "section": "حكم 3 أبريل 1972، الصفحة 651", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The private interest here, that of a man in the children he has sired and raised, undeniably warrants deference and, absent a powerful countervailing interest, protection. ... The rights to conceive and to raise one's children have been deemed 'essential' ... 'basic civil rights of man'\"", "verbatim": true}, "translation_ar": "«المصلحة الخاصة هنا، وهي مصلحة رجل في الأولاد الذين أنجبهم ورباهم، تستوجب الاحترام بلا جدال، وتستوجب الحماية ما لم تقابلها مصلحة قوية... وقد عد الحق في الإنجاب وفي تربية الأولاد حقا جوهريا... ومن الحقوق المدنية الأساسية للإنسان».", "urls": ["https://supreme.justia.com/cases/federal/us/405/645/"], "links": [{"url": "https://supreme.justia.com/cases/federal/us/405/645/", "label": "نص الحكم", "site": "Justia — أحكام المحكمة العليا", "domain": "supreme.justia.com"}], "strength": "explicit", "argument": "أعلى محكمة في أمريكا تجعل حق الأب في تربية أولاده من الحقوق المدنية الأساسية للإنسان، فالقانون الذي يحصر صلته بولده في ساعات نظر يهدر حقا أساسيا.", "jurisdiction": "الولايات المتحدة — المحكمة العليا الاتحادية", "title": "المحكمة العليا الأمريكية 1972 — مصلحة الأب في أولاده تستوجب الحماية", "source_standing": "أعلى محكمة في الولايات المتحدة، وحكمها هذا من أحكامها المؤسسة في حقوق الآباء، قضى بأن حرمان الأب من أولاده دون سماعه مخالف للدستور.", "evidence_level": "حكم المحكمة العليا الاتحادية"}, {"section": "court", "card_number": 242, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "European Court of Human Rights — Gluhaković v. Croatia, no. 21188/09", "date": "2011"}, "work": {"title": "", "section": "حكم 12 أبريل 2011، الفقرتان 59 و84، والبند 3 من المنطوق", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the adequacy of a measure is to be judged by the swiftness of its implementation, as the passage of time can have irremediable consequences for relations between the child and the parent who does not live with the child. ... the national authorities have failed in their positive obligation to secure to the applicant the efficient enjoyment of his right to contact with his daughter in violation of Article 8\"", "verbatim": true}, "translation_ar": "«تقاس كفاية التدبير بسرعة تنفيذه، لأن مرور الوقت قد تكون له عواقب لا تدارك لها على العلاقة بين الطفل والوالد الذي لا يعيش معه... وقد أخلت السلطات الوطنية بواجبها الإيجابي في أن تكفل للمدعي [الأب] التمتع الفعلي بحقه في الصلة بابنته، انتهاكا للمادة 8».", "urls": ["https://hudoc.echr.coe.int/eng?i=001-104491"], "links": [{"url": "https://hudoc.echr.coe.int/eng?i=001-104491", "label": "نص الحكم", "site": "قاعدة أحكام المحكمة الأوروبية HUDOC", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "لقاء الأب ابنته ساعتين في مطبخ مركز اجتماعي لم يكن صلة في نظر المحكمة الأوروبية، فألزمت الدولة بصلة فعلية؛ ومرور الوقت على القطيعة ضرر لا يتدارك.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية 2011 — مرور الوقت يدمر صلة الولد بوالده الذي لا يعيش معه", "source_standing": "محكمة دولية في ستراسبورغ أحكامها ملزمة لست وأربعين دولة؛ وفي هذا الحكم ألزمت الدولة بأن تضمن لأب لقاءات فعلية بابنته في وقت يناسب عمله وفي مكان لائق، بعد أن كانت لقاءاته تعقد في مطبخ مركز اجتماعي.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 243, "supports": ["shared_parenting"], "author": {"name": "European Court of Human Rights — Zaunegger v. Germany, no. 22028/04", "date": "2009"}, "work": {"title": "", "section": "حكم 3 ديسمبر 2009، الفقرتان 38 و63؛ قضت بانتهاك المادة 14 مع المادة 8", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the mutual enjoyment by a parent and child of each other's company constitutes a fundamental element of family life, even if the relationship between the parents has broken down ... there was not a reasonable relationship of proportionality between the general exclusion of judicial review of the initial attribution of sole custody to the mother and the aim pursued\"", "verbatim": true}, "translation_ar": "«تمتع الوالد والطفل كل منهما بصحبة الآخر عنصر جوهري في الحياة الأسرية، ولو انهارت العلاقة بين الوالدين... ولم تكن هناك علاقة تناسب معقولة بين الاستبعاد العام للرقابة القضائية على إسناد الحضانة المنفردة ابتداء إلى الأم وبين الغاية المبتغاة».", "urls": ["https://hudoc.echr.coe.int/eng?i=001-96020"], "links": [{"url": "https://hudoc.echr.coe.int/eng?i=001-96020", "label": "نص الحكم", "site": "قاعدة أحكام المحكمة الأوروبية HUDOC", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "قانون يجعل الحضانة للأم وحدها ابتداء دون أن ينظر القضاء في مصلحة الطفل ونصيب الأب حكمت المحكمة الأوروبية بأنه تمييز، وهذا عين ما يصنعه قانون الحضانة المصري.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية 2009 — منح الأم الحضانة وحدها بلا رقابة قضائية تمييز", "source_standing": "محكمة دولية في ستراسبورغ أحكامها ملزمة لست وأربعين دولة؛ وبعد هذا الحكم عدلت ألمانيا قانونها المدني سنة 2013 ليتاح للأب طلب الحضانة المشتركة.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 244, "supports": ["shared_parenting"], "author": {"name": "European Court of Human Rights — Sporer v. Austria, no. 35637/03", "date": "2011"}, "work": {"title": "", "section": "حكم 3 فبراير 2011، الفقرتان 87 و89؛ قضت بانتهاك المادة 14 مع المادة 8", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the Court did not share the assumption that joint custody against the will of the mother is prima facie against the child's interests ... the Government have not submitted sufficient reasons to justify why the situation of the applicant, who had assumed his role as K.'s father from the very beginning, should allow for less judicial scrutiny\"", "verbatim": true}, "translation_ar": "«لم تشارك المحكمة في الافتراض القائل إن الحضانة المشتركة رغم إرادة الأم مخالفة ظاهرا لمصلحة الطفل... ولم تقدم الحكومة أسبابا كافية تبرر أن يكون وضع المدعي، الذي اضطلع بدوره أبا للطفل منذ البداية، أقل حظا من الرقابة القضائية».", "urls": ["https://hudoc.echr.coe.int/eng?i=001-103234"], "links": [{"url": "https://hudoc.echr.coe.int/eng?i=001-103234", "label": "نص الحكم", "site": "قاعدة أحكام المحكمة الأوروبية HUDOC", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "رفض الأم للرعاية المشتركة لا يجعلها ضد مصلحة الطفل، والأب الذي قام بأبوته من اليوم الأول لا يعامل بأقل مما يعامل به غيره.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية 2011 — الحضانة المشتركة رغم إرادة الأم ليست ضد مصلحة الطفل", "source_standing": "محكمة دولية في ستراسبورغ أحكامها ملزمة لست وأربعين دولة؛ وقد قررت هنا صراحة أن اعتراض الأم لا يكفي لمنع الحضانة المشتركة.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 245, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "European Court of Human Rights — Hokkanen v. Finland, no. 19823/92", "date": "1994"}, "work": {"title": "", "section": "حكم 23 سبتمبر 1994، الفقرتان 61 و62، والبند 1 من المنطوق بالإجماع", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the inaction of the authorities placed the burden on the applicant to have constant recourse to a succession of time-consuming and ultimately ineffectual remedies to enforce his rights. ... the non-enforcement of the applicant's right of access from 10 May 1990 until 21 October 1993 constituted a breach of his right to respect for his family life under Article 8\"", "verbatim": true}, "translation_ar": "«ألقى تقاعس السلطات على المدعي [الأب] عبء اللجوء المتواصل إلى سلسلة من وسائل الانتصاف المستهلكة للوقت وغير المجدية في النهاية لتنفيذ حقوقه... وقد شكل عدم تنفيذ حق المدعي في الرؤية من 10 مايو 1990 إلى 21 أكتوبر 1993 إخلالا بحقه في احترام حياته الأسرية بموجب المادة 8».", "urls": ["https://hudoc.echr.coe.int/eng?i=001-57911"], "links": [{"url": "https://hudoc.echr.coe.int/eng?i=001-57911", "label": "نص الحكم", "site": "قاعدة أحكام المحكمة الأوروبية HUDOC", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "الأب الذي يطرق أبواب المحاكم سنين لينفذ حقه في رؤية ابنته ضحية انتهاك تقع مسؤوليته على الدولة، وهذا حال آباء كثيرين في مصر.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية 1994 — عدم تنفيذ حق الأب في رؤية ابنته انتهاك للحياة الأسرية", "source_standing": "من أقدم أحكام المحكمة الأوروبية في حق الوالد في الصلة بولده، ويستشهد به في كل أحكامها اللاحقة في واجب الدولة تنفيذ أحكام الرؤية والحضانة.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 246, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "European Court of Human Rights — Kutzner v. Germany, no. 46544/99", "date": "2002"}, "work": {"title": "", "section": "حكم 26 فبراير 2002، الفقرة 61؛ قضت بانتهاك المادة 8", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"where the existence of a family tie has been established, the State must in principle act in a manner calculated to enable that tie to be developed and take measures that will enable parent and child to be reunited\"", "verbatim": true}, "translation_ar": "«متى ثبت وجود رابطة أسرية، وجب على الدولة من حيث المبدأ أن تتصرف على نحو يمكن هذه الرابطة من النمو، وأن تتخذ التدابير التي تمكن الوالد والطفل من الاجتماع».", "urls": ["https://hudoc.echr.coe.int/eng?i=001-60163"], "links": [{"url": "https://hudoc.echr.coe.int/eng?i=001-60163", "label": "نص الحكم", "site": "قاعدة أحكام المحكمة الأوروبية HUDOC", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "واجب الدولة أن تنمي رابطة الولد بأبيه لا أن تجمدها في ساعات نظر؛ فالقانون الذي يمنع الولد من المبيت عند أبيه وزيارة بيته يعطل نمو الرابطة الذي توجبه هذه القاعدة.", "jurisdiction": "مجلس أوروبا — المحكمة الأوروبية لحقوق الإنسان", "title": "المحكمة الأوروبية 2002 — على الدولة أن تمكن الرابطة بين الوالد وولده من النمو", "source_standing": "محكمة دولية في ستراسبورغ أحكامها ملزمة لست وأربعين دولة، والفقرة المنقولة قاعدة مستقرة تكررها المحكمة في أحكام الحضانة والرؤية.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 247, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Corte Interamericana de Derechos Humanos — Fornerón e hija vs. Argentina", "date": "2012"}, "work": {"title": "", "section": "حكم 27 أبريل 2012، السلسلة C رقم 242، الفقرتان 52 و124", "volume": "", "page": "", "edition": ""}, "original": {"lang": "es", "text": "\"el mero transcurso del tiempo en casos de custodia de menores de edad puede constituir un factor ... [que] podía determinar el carácter irreversible o irremediable de la situación de hecho ... el Estado violó el derecho a la protección a la familia reconocido en artículo 17.1 de la Convención Americana\"", "verbatim": true}, "translation_ar": "«إن مجرد مرور الوقت في قضايا حضانة القاصرين قد يكون عاملا... يقرر الطابع الذي لا رجعة فيه ولا تدارك للوضع الواقعي... وقد انتهكت الدولة الحق في حماية الأسرة المقرر في المادة 17/1 من الاتفاقية الأمريكية».", "urls": ["https://www.corteidh.or.cr/tablas/fichas/forneron.pdf"], "links": [{"url": "https://www.corteidh.or.cr/tablas/fichas/forneron.pdf", "label": "ملخص الحكم الرسمي", "site": "محكمة البلدان الأمريكية لحقوق الإنسان", "domain": "www.corteidh.or.cr"}], "strength": "explicit", "argument": "أب حيل بينه وبين ابنته سنين فقضت المحكمة أن مرور الوقت نفسه ضرر لا يتدارك، وأن الدولة انتهكت حماية الأسرة؛ فكل يوم يمر على الولد بعيدا عن أبيه خسارة لا تعوض.", "jurisdiction": "منظمة الدول الأمريكية — محكمة البلدان الأمريكية لحقوق الإنسان", "title": "محكمة البلدان الأمريكية 2012 — حرمان الأب من ابنته انتهاك لحق حماية الأسرة", "source_standing": "المحكمة الإقليمية لحقوق الإنسان في الأمريكتين ومقرها كوستاريكا، وأحكامها ملزمة للدول الأطراف؛ وقد ألزمت الأرجنتين في هذا الحكم بإجراءات لإعادة الصلة بين الأب وابنته.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 248, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Supreme Court of India — Yashita Sahu v. State of Rajasthan, 2020 INSC 58", "date": "2020"}, "work": {"title": "", "section": "حكم 20 يناير 2020، الفقرات 19 إلى 21، القاضيان ديباك غوبتا وأنيرودها بوس", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"A child, especially a child of tender years requires the love, affection, company, protection of both parents. ... a child has a human right to have the love and affection of both the parents ... Even if the custody is given to one parent the other parent must have sufficient visitation rights ... effort should be made to give maximum visitation rights to the parent who is denied custody\"", "verbatim": true}, "translation_ar": "«الطفل، ولا سيما الطفل في سن الحنان، يحتاج إلى محبة والديه كليهما وحنانهما وصحبتهما وحمايتهما... وللطفل حق إنساني في أن ينال محبة والديه كليهما وحنانهما... وحتى إذا أعطيت الحضانة لأحد الوالدين فلا بد أن يكون للآخر حقوق زيارة كافية... وينبغي بذل الجهد لإعطاء أقصى حقوق الزيارة للوالد المحروم من الحضانة».", "urls": ["https://order.law/library/courts/supreme-court/2020/jan/scin010280832019-5mmu5/yashita-sahu-vs-the-state-of-rajasthan"], "links": [{"url": "https://order.law/library/courts/supreme-court/2020/jan/scin010280832019-5mmu5/yashita-sahu-vs-the-state-of-rajasthan", "label": "نص الحكم", "site": "مكتبة أحكام المحكمة العليا الهندية", "domain": "order.law"}], "strength": "explicit", "argument": "محكمة عليا تقضي بأن الطفل الصغير يحتاج إلى صحبة أبيه كما يحتاج إلى أمه، وأن الزيارة يجب أن تكون أقصى ما يمكن لا أدنى ما يمكن؛ فثلاث ساعات نظر ليست زيارة كافية في ميزان أي محكمة.", "jurisdiction": "الهند — المحكمة العليا", "title": "المحكمة العليا في الهند 2020 — للطفل حق إنساني في محبة والديه معا", "source_standing": "أعلى محكمة في الهند، وأحكامها ملزمة لمحاكم البلاد كلها بنص الدستور؛ والحكم من أحكامها المرجعية في الحضانة.", "evidence_level": "حكم محكمة عليا"}, {"section": "court", "card_number": 249, "supports": ["shared_parenting"], "author": {"name": "Superior Tribunal de Justiça — REsp 1.251.000/MG, Rel. Min. Nancy Andrighi", "date": "2011"}, "work": {"title": "", "section": "حكم الدائرة الثالثة، الفقرتان 3/1 و4 من الأسباب", "volume": "", "page": "", "edition": ""}, "original": {"lang": "pt", "text": "\"a guarda compartilhada é o ideal a ser buscado no exercício do Poder Familiar entre pais separados, mesmo que demande a imposição estatal no seu estabelecimento ... dá à criança a possibilidade de conviver com ambos os pais\"", "verbatim": true}, "translation_ar": "«الحضانة المشتركة هي المثل الأعلى الذي يسعى إليه في ممارسة السلطة الأبوية بين الوالدين المنفصلين، ولو اقتضى إقرارها فرضا من الدولة... فهي تعطي الطفل إمكان العيش مع والديه كليهما».", "urls": ["https://www.sitios.scjn.gob.mx/derecho-familiar/sites/default/files/jurisprudencias/2021-04/6.%20Resp%201251000.pdf"], "links": [{"url": "https://www.sitios.scjn.gob.mx/derecho-familiar/sites/default/files/jurisprudencias/2021-04/6.%20Resp%201251000.pdf", "label": "نص الحكم", "site": "نسخة لدى المحكمة العليا المكسيكية", "domain": "www.sitios.scjn.gob.mx"}], "strength": "explicit", "argument": "محكمة عليا تقضي بأن الرعاية المشتركة بالمناصفة تفرض فرضا إذا رفضها أحد الوالدين، لأن العيش مع الوالدين كليهما حق الطفل، وقد سبق هذا الحكم القانون الذي قننه.", "jurisdiction": "البرازيل — المحكمة العليا للعدل", "title": "المحكمة العليا للعدل في البرازيل 2011 — الحضانة المشتركة هي المثل الأعلى ولو فرضت", "source_standing": "المحكمة العليا للعدل أعلى محكمة في البرازيل في غير المسائل الدستورية، والقاضية نانسي أندريغي من أشهر قضاتها في قانون الأسرة؛ وقد صار هذا الاجتهاد قانونا اتحاديا سنة 2014.", "evidence_level": "حكم محكمة عليا"}, {"section": "court", "card_number": 250, "supports": ["shared_parenting"], "author": {"name": "Bundesgerichtshof — Beschluss XII ZB 601/15", "date": "2017"}, "work": {"title": "", "section": "قرار 1 فبراير 2017، البيان الصحفي الرسمي رقم 25/2017", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "\"Das Wechselmodell ist anzuordnen, wenn die geteilte Betreuung durch beide Eltern im Vergleich mit anderen Betreuungsmodellen dem Kindeswohl im konkreten Fall am besten entspricht. ... Eine zum paritätischen Wechselmodell führende Umgangsregelung steht vielmehr mit dem gemeinsamen Sorgerecht im Einklang, zumal beide Eltern gleichberechtigte Inhaber der elterlichen Sorge sind\"", "verbatim": true}, "translation_ar": "«يقضى بنموذج الإقامة المتناوبة إذا كانت الرعاية المقسومة بين الوالدين كليهما، مقارنة بنماذج الرعاية الأخرى، هي الأوفق بمصلحة الطفل في الحالة المعينة... وتنظيم الصلة الذي يفضي إلى إقامة متناوبة بالمناصفة متسق مع الولاية المشتركة، إذ الوالدان كلاهما صاحبا الولاية الأبوية على قدم المساواة».", "urls": ["https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2017/2017025.html"], "links": [{"url": "https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2017/2017025.html", "label": "البيان الرسمي للحكم", "site": "محكمة العدل الاتحادية الألمانية", "domain": "www.bundesgerichtshof.de"}], "strength": "explicit", "argument": "أب كان يرى ابنه عطلة كل أسبوعين فطلب المناصفة ورفضت الأم، فقضت أعلى محكمة ألمانية بأن المناصفة تقضى إذا كانت أوفق بمصلحة الطفل، لأن الوالدين سواء في الولاية.", "jurisdiction": "ألمانيا — محكمة العدل الاتحادية", "title": "محكمة العدل الاتحادية الألمانية 2017 — الإقامة المتناوبة بالمناصفة تقضى رغم رفض أحد الوالدين", "source_standing": "أعلى محكمة مدنية في ألمانيا، وقرارها هذا هو القرار المرجعي في جواز فرض الإقامة المتناوبة بالمناصفة بطلب الأب رغم اعتراض الأم.", "evidence_level": "حكم محكمة عليا"}, {"section": "court", "card_number": 251, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Court of Appeal (England and Wales) — Re C (A Child) [2011] EWCA Civ 521", "date": "2011"}, "work": {"title": "", "section": "حكم 6 مايو 2011، تلخيص اللورد القاضي مانبي للمبادئ المستقرة، نقلا عن حكم Re O سنة 1995", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Contact between parent and child is a fundamental element of family life and is almost always in the interests of the child. ... There is a positive obligation on the State, and therefore on the judge, to take measures to maintain and to reconstitute the relationship between parent and child ... The court should take a medium-term and long-term view and not accord excessive weight to what appear likely to be short-term or transient problems.\"", "verbatim": true}, "translation_ar": "«الصلة بين الوالد والطفل عنصر جوهري في الحياة الأسرية، وهي تكاد تكون دائما في مصلحة الطفل... وعلى الدولة، ومن ثم على القاضي، واجب إيجابي باتخاذ التدابير للحفاظ على العلاقة بين الوالد والطفل وإعادة بنائها... وعلى المحكمة أن تنظر نظرة متوسطة وبعيدة المدى، وألا تعطي وزنا مفرطا لما يبدو أنه مشكلات قصيرة الأمد أو عابرة».", "urls": ["https://caselaw.nationalarchives.gov.uk/ewca/civ/2011/521"], "links": [{"url": "https://caselaw.nationalarchives.gov.uk/ewca/civ/2011/521", "label": "نص الحكم", "site": "الأرشيف الوطني البريطاني", "domain": "caselaw.nationalarchives.gov.uk"}], "strength": "explicit", "argument": "القاضي في إنجلترا مكلف بواجب إيجابي في صون صلة الولد بوالده وإعادة بنائها، ولا يعتد بالمشكلات العابرة؛ أما القاضي المصري فيكتفي بإثبات ثلاث ساعات نظر.", "jurisdiction": "المملكة المتحدة — محكمة الاستئناف في إنجلترا وويلز", "title": "محكمة الاستئناف الإنجليزية 2011 — الصلة بين الوالد وولده تكاد تكون دائما في مصلحة الطفل", "source_standing": "محكمة الاستئناف ثاني أعلى محكمة في إنجلترا وويلز، والقاضي مانبي صار بعدها رئيس قسم الأسرة في القضاء الإنجليزي؛ والمبادئ المنقولة هي القواعد المستقرة التي تطبقها محاكم الأسرة الإنجليزية.", "evidence_level": "حكم محكمة استئناف عليا"}, {"section": "court", "card_number": 252, "supports": ["shared_parenting"], "author": {"name": "Family Court of the State of New York — People ex rel. Watts v. Watts, 77 Misc. 2d 178, 350 N.Y.S.2d 285", "date": "1973"}, "work": {"title": "", "section": "حكم 8 أغسطس 1973، القاضية سيبل هارت كوبر؛ وقضت بالحضانة للأب", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The 'tender years presumption' is actually a blanket judicial finding of fact, a statement by a court that, until proven otherwise by the weight of substantial evidence, mothers are always better suited to care for young children than fathers. ... the 'tender years presumption' should be discarded because it is based on outdated social stereotypes rather than on rational and up-to-date consideration of the welfare of the children involved. The simple fact of being a mother does not, by itself, indicate a capacity or willingness to render a quality of care different from that which the father can provide.\"", "verbatim": true}, "translation_ar": "«إن قرينة سن الحنان في الحقيقة حكم قضائي شامل بواقعة، أي قول من المحكمة بأن الأمهات دائما أصلح من الآباء لرعاية الأطفال الصغار ما لم يثبت العكس بأدلة راجحة... وينبغي نبذ قرينة سن الحنان لأنها مبنية على صور نمطية اجتماعية بالية لا على نظر عقلاني محدث في مصلحة الأطفال المعنيين. فمجرد كون المرأة أما لا يدل بذاته على قدرة أو استعداد لتقديم رعاية تختلف في نوعها عما يستطيع الأب تقديمه».", "urls": ["https://www.courtlistener.com/opinion/6353892/people-ex-rel-watts-v-watts/"], "links": [{"url": "https://www.courtlistener.com/opinion/6353892/people-ex-rel-watts-v-watts/", "label": "نص الحكم", "site": "قاعدة كورت ليسنر للأحكام الأمريكية", "domain": "www.courtlistener.com"}], "strength": "explicit", "argument": "محكمة أسرة تقول بالحرف إن تفضيل الأم في الصغر «صورة نمطية بالية»، وإن الأمومة بذاتها ليست دليل رعاية أفضل؛ وهذا عين ما يبنى عليه في مصر حبس الطفل عن أبيه.", "jurisdiction": "الولايات المتحدة — محكمة الأسرة في نيويورك", "title": "محكمة الأسرة في نيويورك 1973 — «قرينة سن الحنان» صورة نمطية بالية، وكون المرأة أما لا يعني بذاته رعاية أفضل من الأب", "source_standing": "حكم مرجعي من محكمة الأسرة في نيويورك استشهدت به محاكم أمريكية لاحقة في نبذ تفضيل الأم، وهو من أوائل الأحكام التي ردت «قرينة سن الحنان» إلى أصلها: صورة نمطية لا علم.", "evidence_level": "حكم محكمة أسرة مرجعي"}, {"section": "court", "card_number": 253, "supports": ["shared_parenting"], "author": {"name": "Supreme Court of Pennsylvania — Commonwealth ex rel. Spriggs v. Carson, 470 Pa. 290, 368 A.2d 635", "date": "1977"}, "work": {"title": "", "section": "حكم 28 يناير 1977، ونقضت به حكم محكمة الاستئناف الذي أعطى الحضانة للأم بمذهب سن الحنان", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"...a doctrine that is predicated upon traditional or stereotypic roles of men and women in a marital union. Whether the tender years doctrine is employed to create a presumption which requires the male parent to overcome its effect by presenting compelling contrary evidence of a particular nature ... or merely as a makeshift where the scales are relatively balanced ... such a view is offensive to the concept of the equality of the sexes which we have embraced as a constitutional principle within this jurisdiction. ... Courts should be wary of deciding matters as sensitive as questions of custody by the invocation of 'presumptions'.\"", "verbatim": true}, "translation_ar": "«...مذهب مبني على الأدوار التقليدية أو النمطية للرجل والمرأة في الزواج. وسواء استعمل مذهب سن الحنان لإنشاء قرينة تلزم الأب بدحض أثرها بأدلة مضادة قاطعة من نوع خاص... أو مجرد مرجح حين تتقارب الكفتان... فإن هذا الرأي مناف لمفهوم المساواة بين الجنسين الذي تبنيناه مبدأ دستوريا في هذه الولاية... وعلى المحاكم أن تحذر من الفصل في مسائل بحساسية الحضانة باستدعاء \"القرائن\"».", "urls": ["https://www.courtlistener.com/opinion/2268645/commonwealth-ex-rel-spriggs-v-carson/"], "links": [{"url": "https://www.courtlistener.com/opinion/2268645/commonwealth-ex-rel-spriggs-v-carson/", "label": "نص الحكم", "site": "قاعدة كورت ليسنر للأحكام الأمريكية", "domain": "www.courtlistener.com"}], "strength": "explicit", "argument": "محكمة عليا تقضي بأن تفضيل الأم في حضانة الصغار، قرينة كان أو مرجحا، مناف للمساواة الدستورية؛ فأي معنى لقانون يجعل حضانة الخمس عشرة سنة للأم بقرينة لا تدحض؟", "jurisdiction": "الولايات المتحدة — المحكمة العليا لولاية بنسلفانيا", "title": "المحكمة العليا لبنسلفانيا 1977 — مذهب «سن الحنان» بكل صوره مناف لمبدأ المساواة الدستوري بين الجنسين", "source_standing": "أعلى محكمة في ولاية بنسلفانيا، وحكمها هذا من الأحكام المؤسسة التي أسقطت تفضيل الأم بالاستناد إلى المساواة الدستورية بين الجنسين، واستشهدت به المحكمة العليا لألاباما سنة 1981.", "evidence_level": "حكم محكمة عليا"}, {"section": "court", "card_number": 254, "supports": ["shared_parenting"], "author": {"name": "District of Columbia Court of Appeals (en banc) — Bazemore v. Davis, 394 A.2d 1377", "date": "1978"}, "work": {"title": "", "section": "حكم 1 ديسمبر 1978 بكامل هيئة المحكمة، والقاضية جوليا كوبر ماك", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"A norm is ill-suited for determining the future of a unique being whose adjustment is vital to the welfare of future generations. ... magic formulas have no place in decisions designed to salvage human values. ... For the reasons stated we now direct that, in a dispute between a natural mother and father over custody of their child, the trial courts shall decide the delicate question of what is the child's best interests solely by reference to the facts of the particular case without resort to the crutch of a presumption in favor of either party. ... Any of the prior decisions inconsistent herewith are hereby overruled.\"", "verbatim": true}, "translation_ar": "«القاعدة العامة لا تصلح لتقرير مستقبل كائن فريد يتوقف على توافقه خير الأجيال المقبلة... والصيغ السحرية لا مكان لها في قرارات غايتها إنقاذ قيم إنسانية... ولهذه الأسباب نوجه الآن بأن تفصل محاكم الموضوع، في النزاع بين الأم والأب على حضانة ولدهما، في المسألة الدقيقة، مسألة مصلحة الطفل الفضلى، بالرجوع إلى وقائع القضية بعينها وحدها دون اتكاء على عكاز قرينة لصالح أي من الطرفين... وكل الأحكام السابقة المخالفة لهذا ملغاة».", "urls": ["https://www.courtlistener.com/opinion/1499406/bazemore-v-davis/"], "links": [{"url": "https://www.courtlistener.com/opinion/1499406/bazemore-v-davis/", "label": "نص الحكم", "site": "قاعدة كورت ليسنر للأحكام الأمريكية", "domain": "www.courtlistener.com"}], "strength": "explicit", "argument": "محكمة بكامل هيئتها تلغي قرينة الأم وتسمي القاعدة العامة «عكازا» و«صيغة سحرية»؛ فحضانة الخمس عشرة سنة بقانون صيغة سحرية تقرر مصير كل طفل مصري قبل أن ينظر في حاله.", "jurisdiction": "الولايات المتحدة — محكمة استئناف مقاطعة كولومبيا", "title": "محكمة استئناف واشنطن العاصمة بكامل هيئتها 1978 — لا قرينة لصالح الأم: «الصيغ السحرية لا مكان لها» في مصير الطفل", "source_standing": "أعلى محكمة في مقاطعة كولومبيا (واشنطن العاصمة) مجتمعة بكامل هيئتها، وألغت بهذا الحكم قرينة تفضيل الأم في كل أحكامها السابقة.", "evidence_level": "حكم محكمة استئناف عليا بكامل هيئتها"}, {"section": "court", "card_number": 255, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Bundesverfassungsgericht — Beschluss 1 BvR 420/09 (BVerfGE 127, 132)", "date": "2010"}, "work": {"title": "", "section": "قرار 21 يوليو 2010، العنوان القضائي الأول؛ وأمرت المحكمة بتطبيق القانون مؤقتا بحيث تمنح محكمة الأسرة الولاية المشتركة بطلب أحد الوالدين متى كان ذلك موافقا لمصلحة الطفل", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "\"Es verletzt das Elternrecht des Vaters eines nichtehelichen Kindes aus Art. 6 Abs. 2 GG, dass er ohne Zustimmung der Mutter generell von der Sorgetragung für sein Kind ausgeschlossen ist und nicht gerichtlich überprüfen lassen kann, ob es aus Gründen des Kindeswohls angezeigt ist, ihm zusammen mit der Mutter die Sorge für sein Kind einzuräumen oder ihm anstelle der Mutter die Alleinsorge für das Kind zu übertragen.\"", "verbatim": true}, "translation_ar": "«إنه لانتهاك لحق الأبوة الذي يكفله للأب غير المتزوج من أم ولده الفصل 6 الفقرة 2 من القانون الأساسي أن يقصى على وجه العموم، بغير موافقة الأم، عن الولاية على ولده، وألا يستطيع أن يطلب من القضاء النظر فيما إذا كانت مصلحة الطفل تقتضي أن تمنح له الولاية على ولده مع الأم، أو أن تنقل إليه الولاية المنفردة بدلا منها».", "urls": ["https://www.bundesverfassungsgericht.de/SharedDocs/Entscheidungen/DE/2010/07/rs20100721_1bvr042009.html"], "links": [{"url": "https://www.bundesverfassungsgericht.de/SharedDocs/Entscheidungen/DE/2010/07/rs20100721_1bvr042009.html", "label": "نص القرار", "site": "المحكمة الدستورية الاتحادية الألمانية", "domain": "www.bundesverfassungsgericht.de"}], "strength": "explicit", "argument": "محكمة دستورية تقضي بأن جعل مركز الأب في ولده رهينا بموافقة الأم انتهاك للدستور؛ فكيف بقانون يجعل الطفل عند أمه خمس عشرة سنة ولا يملك الأب إلا ساعات نظر؟", "jurisdiction": "ألمانيا — المحكمة الدستورية الاتحادية", "title": "المحكمة الدستورية الاتحادية الألمانية 2010 — إقصاء الأب من الولاية على ولده بلا رقابة قضائية ينتهك حقه الدستوري", "source_standing": "أعلى محكمة في ألمانيا، وقرارها هذا، الصادر بعد حكم المحكمة الأوروبية في قضية تساونيغر، هو الذي حمل البرلمان الألماني على تعديل القانون المدني سنة 2013 لتمكين الآباء من الولاية المشتركة.", "evidence_level": "حكم محكمة دستورية عليا"}, {"section": "court", "card_number": 256, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "European Court of Human Rights [GC] — Elsholz v. Germany, no. 25735/94", "date": "2000"}, "work": {"title": "", "section": "حكم الدائرة الكبرى في 13 يوليو 2000، الفقرتان 51 و52؛ وقضت بانتهاك المادة 8 والمادة 6", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the mutual enjoyment by parent and child of each other's company constitutes a fundamental element of family life, even if the relationship between the parents has broken down ... taking into account the importance of the subject matter, namely, the relations between a father and his child, the Regional Court should not have been satisfied, in the circumstances, with relying on the file and the written appeal submissions without having at its disposal psychological expert evidence in order to evaluate the child's statements.\"", "verbatim": true}, "translation_ar": "«إن تمتع الوالد والولد كل منهما بصحبة الآخر عنصر أساسي من الحياة الأسرية، حتى لو انهارت العلاقة بين الوالدين... ونظرا إلى أهمية الموضوع، وهو العلاقة بين أب وولده، لم يكن ينبغي للمحكمة الإقليمية أن تكتفي، في هذه الظروف، بالا
