ساسية الوالدين وأمان تعلق الطفل", "source_standing": "شيري ماديغان أستاذة في جامعة كالغاري، صاحبة كرسي بحث كندي في محددات نمو الطفل، ومعها كبار علماء التعلق من هولندا وبريطانيا. والنشرة النفسية أرفع مجلات جمعية علم النفس الأمريكية.", "evidence_level": "تحليل جامع لعدة دراسات: أعلى درجات الدليل"}, {"section": "psy", "card_number": 49, "supports": ["shared_parenting"], "author": {"name": "Veríssimo M, Santos AJ, Vaughn BE, Torres N, Monteiro L, Santos O", "date": "2011"}, "work": {"title": "Quality of attachment to father and mother and number of reciprocal friends", "section": "Early Child Development and Care، 2011، 181(1):27–38", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: قيم تعلق 35 طفلا بكل من أبويهم بالملاحظة المنزلية في عمر 29–38 شهرا، ثم قيس عدد صداقاتهم المتبادلة. ارتبط أمن التعلق بالأب بعدد هذه الصداقات، وبقي الارتباط قائما بعد مراعاة أمن التعلق بالأم. وكان أمن التعلق بالأب وبالأم مترابطا أيضا، بما يجمع بين الاشتراك الأسري وخصوصية بعض الارتباطات.", "verbatim": false}, "translation_ar": "", "urls": ["https://repositorio.ispa.pt/bitstreams/4af28ec7-f774-43ce-b5a0-a9b48f6630da/download", "https://www.tandfonline.com/doi/abs/10.1080/03004430903211208"], "links": null, "strength": "explicit", "argument": "أمن الطفل مع أبيه يزيد صداقاته بعد مراعاة أمنه مع أمه، فللأب في نمو الطفل الاجتماعي أثر مستقل لا تقوم به الأم.", "jurisdiction": "البرتغال — معهد علم النفس التطبيقي في لشبونة", "title": "التعلق بالأب والأم والصداقات المتبادلة", "source_standing": "مانويلا فيريسيمو من المعهد الجامعي لعلم النفس التطبيقي في لشبونة، ومعها براين فون من جامعة أوبرن من كبار باحثي التعلق؛ والمجلة تصدرها دار تايلور وفرانسيس.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 50, "supports": ["shared_parenting"], "author": {"name": "Cabrera NJ, Volling BL, Barr R", "date": "2018"}, "work": {"title": "Fathers Are Parents, Too! Widening the Lens on Parenting for Children's Development", "section": "Child Development Perspectives، 2018؛ 12(3):152–157", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تدعو المقالة إلى دراسة الأب ضمن شبكة الرعاية الأسرية، وتنتقد اختزال البحث في الأم بحجة أنها مقدم الرعاية الرئيسي. وتدعو إلى قياس جودة التفاعل ومشاركة الأبوين معا.", "verbatim": false}, "translation_ar": "", "urls": ["https://onlinelibrary.wiley.com/doi/abs/10.1111/cdep.12275", "https://backend.production.deepblue-documents.lib.umich.edu/server/api/core/bitstreams/ca4f01b5-f910-47fd-9159-f28d21425602/content"], "links": null, "strength": "explicit", "argument": "مقالة منهجية في مجلة جمعية البحث في نمو الطفل تنقض اختزال الرعاية في الأم، وتقرر أن الأب غير المقيم لا يلزم أن يكون غائبا عن حياة ولده.", "jurisdiction": "الولايات المتحدة — جامعات ماريلاند وميشيغان وجورجتاون", "title": "الآباء والدون أيضا: توسيع البحث في نمو الطفل", "source_standing": "ناتاشا كابريرا من جامعة ماريلاند، وبريندا فولينغ من جامعة ميشيغان، وراشيل بار من جامعة جورجتاون؛ ومجلة آفاق في نمو الطفل تصدرها جمعية البحث في نمو الطفل، أعرق جمعيات التخصص.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 51, "supports": ["shared_parenting"], "author": {"name": "Bakermans-Kranenburg MJ, Lotz A, Alyousefi-van Dijk K, van IJzendoorn M", "date": "2019"}, "work": {"title": "Birth of a Father: Fathering in the First 1,000 Days", "section": "Child Development Perspectives، 2019؛ 13(4):247–253", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تعرض المراجعة نمو الأبوة خلال أول 1,000 يوم في نموذج يجمع الظروف الاجتماعية والسلوك والهرمونات والاستجابات العصبية. وترتبط ممارسة الرعاية باستجابات الأب للرضيع، كما تتأثر المشاركة بتوقعات المجتمع وفرص الرعاية. وتقترح بدء مساندة العلاقة الأبوية منذ الحمل وخلال السنوات التالية للولادة.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/31894183/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6919930/"], "links": null, "strength": "explicit", "argument": "الأبوة تنمو بالممارسة، فرعاية الأب لولده تقوى بقدر ما يتاح له منها؛ وحبسه عن ولده يعطل نمو هذه القدرة نفسها.", "jurisdiction": "هولندا — الجامعة الحرة بأمستردام وجامعة إيراسموس", "title": "بداية الأبوة في الأيام الألف الأولى", "source_standing": "ماريان باكرمانز كراننبرغ ومارينوس فان آيزندورن من أكثر علماء التعلق أثرا في العالم؛ ومجلة آفاق في نمو الطفل تصدرها جمعية البحث في نمو الطفل.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 52, "supports": ["shared_parenting"], "author": {"name": "Abraham E, Hendler T, Shapira-Lichter I, Kanat-Maymon Y, Zagoory-Sharon O, Feldman R", "date": "2014"}, "work": {"title": "Father's brain is sensitive to childcare experiences", "section": "Proceedings of the National Academy of Sciences of the United States of America، 2014؛ 111(27):9792–9797", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: قارنت الدراسة استجابات الدماغ والهرمونات والتفاعل مع الرضيع لدى 89 من الأمهات والآباء. ظهرت أسس عصبية مشتركة للرعاية، مع فروق ترتبط بدور الوالد في الرعاية. ولدى الآباء ارتبط الوقت الذي يقضونه منفردين في مسؤولية رعاية الرضيع بدرجة اتصال مناطق عصبية تعالج الانفعال وفهم الآخرين.", "verbatim": false}, "translation_ar": "", "urls": ["https://pmc.ncbi.nlm.nih.gov/articles/PMC4103311/"], "links": null, "strength": "explicit", "argument": "دماغ الأب يتكيف للرعاية كلما باشرها، فالأب المباشر لرعاية ولده يكتسب ما يظن أنه خاص بالأم؛ وهذا أصل علمي لتمكين الأب من الرعاية لا حجبه عنها.", "jurisdiction": "إسرائيل — جامعة بار إيلان وجامعة تل أبيب", "title": "استجابة دماغ الأب لخبرة رعاية الطفل", "source_standing": "روث فيلدمان من جامعة بار إيلان، من أبرز الباحثين في الأساس العصبي والهرموني للرابطة بين الوالد وولده؛ ومجلة وقائع الأكاديمية الوطنية للعلوم من أرفع المجلات العلمية في العالم.", "evidence_level": "دراسة تجريبية بالتصوير الوظيفي للدماغ"}, {"section": "psy", "card_number": 53, "supports": ["shared_parenting"], "author": {"name": "Flouri E", "date": "2005"}, "work": {"title": "Fathering and Child Outcomes", "section": "الفصل الأول: Fathering: A Changing Perspective؛ قسم What Is Fathering?", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تعرض فلوري الأبوة بوصفها عملا متعدد الجوانب، يشمل حماية الطفل وتعليمه وتلبية احتياجاته ورعايته. وتشرح أن مشاركة الأب تتضمن التفاعل المباشر، وإتاحته للطفل، وتحمل مسؤولية ترتيب شؤونه، كالمواعيد الطبية. كما تميز بين المشاركة السلوكية في أعمال الرعاية، والمشاركة المعرفية بالتخطيط والمتابعة، والمشاركة العاطفية بالدفء والمودة والقرب. وتبرز أهمية جودة علاقة الأب غير المقيم بطفله، وتعرض النقد الموجه إلى قياس الأبوة قياسا ضيقا بكمية الوقت وحدها.", "verbatim": false}, "translation_ar": "", "urls": ["https://catalogimages.wiley.com/images/db/pdf/0470861681.01.pdf", "https://onlinelibrary.wiley.com/doi/book/10.1002/9780470713228"], "links": null, "strength": "explicit", "argument": "الأبوة عند فلوري حماية وتعليم ورعاية يومية ومتابعة ودفء، فهي أكبر من نفقة وزيارة؛ والقانون الذي يقصر الأب على الرؤية يعطل أكثر وظائفه.", "jurisdiction": "المملكة المتحدة — جامعة أكسفورد ودار وايلي", "title": "الأبوة رعاية يومية ومعرفية وعاطفية", "source_standing": "إيريني فلوري أستاذة في كلية لندن الجامعية، من أبرز باحثي الأبوة في بريطانيا؛ وكتابها صادر عن دار وايلي بلاكويل الأكاديمية.", "evidence_level": "كتاب علمي محكم"}, {"section": "psy", "card_number": 54, "supports": ["shared_parenting"], "author": {"name": "Schaffer HR, Emerson PE", "date": "1964"}, "work": {"title": "The development of social attachments in infancy", "section": "Monographs of the Society for Research in Child Development 29(3):1–77", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: في دراسة متابعة طويلة لرضع في غلاسكو تبين أن أكثرهم يتعلق بأكثر من شخص قبل نهاية السنة الثانية، وأن الأب من أكثر من يتعلقون بهم، وأن قوة التعلق تتبع حسن الاستجابة لا مقدار الوقت في الخدمة.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/14151332/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/14151332/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "الدراسة المؤسسة في تعدد التعلق تنفي أن الطفل لا يتعلق إلا بأمه، فالصغير يتعلق بأبيه من سنيه الأولى، وحرمانه منه قطع لرابطة قائمة.", "jurisdiction": "المملكة المتحدة — غلاسكو", "title": "شافر وإمرسون 1964 — الرضيع يتعلق بأبيه", "source_standing": "رودولف شافر من رواد علم نفس النمو في بريطانيا، ودراسته من أشهر الدراسات في نظرية التعلق، وتصدر سلسلتها جمعية البحث في نمو الطفل، أعرق جمعيات التخصص.", "evidence_level": "دراسة متابعة طويلة مؤسسة"}, {"section": "psy", "card_number": 55, "supports": ["shared_parenting"], "author": {"name": "Lamb ME (ed.)", "date": "2010"}, "work": {"title": "The Role of the Father in Child Development", "section": "5th ed.", "volume": "", "page": "", "edition": "Hoboken: Wiley"}, "original": {"lang": "en", "text": "مضمونه: الأطفال يتعلقون بآبائهم وأمهاتهم في وقت واحد تقريبا منذ السنة الأولى، وأثر الأب في نمو الطفل يقوم على جودة العلاقة ودفئها، لا على جنس الوالد.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL18346510W"], "links": [{"url": "https://openlibrary.org/works/OL18346510W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "المرجع الجامع في علم نفس الأبوة يقرر أن صلة الأب بولده صلة تعلق أصيلة من الولادة، فلا معنى لتأخيرها إلى ما بعد الحضانة.", "jurisdiction": "المملكة المتحدة — جامعة كامبريدج", "title": "مايكل لامب — دور الأب في نمو الطفل", "source_standing": "مايكل لامب أستاذ علم النفس في جامعة كامبريدج، ورأس قبلها قسم النمو الاجتماعي والانفعالي في المعهد الوطني الأمريكي لصحة الطفل؛ وكتابه هذا المرجع الجامع في الموضوع منذ طبعته الأولى سنة 1976.", "evidence_level": "مرجع علمي جامع"}, {"section": "psy", "card_number": 56, "supports": ["shared_parenting"], "author": {"name": "Cabrera NJ, Tamis-LeMonda CS, Bradley RH, Hofferth S, Lamb ME", "date": "2000"}, "work": {"title": "Fatherhood in the twenty-first century", "section": "Child Development 71(1):127–136", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "The twentieth century has been characterized by four important social trends that have fundamentally changed the social cultural context in which children develop: women's increased labor force participation, increased absence of nonresidential fathers in the lives of their children, increased involvement of fathers in intact families, and increased cultural diversity in the U.S.", "verbatim": true}, "translation_ar": "«اتسم القرن العشرون بأربعة اتجاهات اجتماعية مهمة غيرت تغييرا جوهريا السياق الاجتماعي والثقافي الذي ينمو فيه الأطفال: ازدياد مشاركة النساء في سوق العمل، وازدياد غياب الآباء غير المقيمين عن حياة أبنائهم، وازدياد مشاركة الآباء في الأسر المتماسكة، وازدياد التنوع الثقافي في الولايات المتحدة.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/10836566/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/10836566/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "للأب أثر في نمو ولده لا يغني عنه أثر الأم، فالرعاية المشتركة بالمناصفة تحفظ للطفل مصدرين للنمو لا مصدرا واحدا.", "jurisdiction": "الولايات المتحدة", "title": "مجلة نمو الطفل 2000 — الأبوة في القرن الحادي والعشرين", "source_standing": "مجلة نمو الطفل تصدرها جمعية البحث في نمو الطفل، وهي أرفع مجلات علم نفس النمو؛ ومن مؤلفي البحث مايكل لامب من جامعة كامبريدج وناتاشا كابريرا من جامعة ماريلاند.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 57, "supports": ["shared_parenting"], "author": {"name": "Kelly JB", "date": "2007"}, "work": {"title": "Children's living arrangements following separation and divorce: insights from empirical and clinical research", "section": "Family Process 46(1):35–52", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Based on this research, it is argued that traditional visiting patterns and guidelines are, for the majority of children, outdated, unnecessarily rigid, restrictive, and fail in both the short and long term to address their best interests.", "verbatim": true}, "translation_ar": "«بناء على هذه البحوث، يذهب المقال إلى أن أنماط الزيارة التقليدية وقواعدها الإرشادية، بالنسبة لأكثر الأطفال، قد عفا عليها الزمن، وأنها جامدة ومقيدة بلا داع، وتخفق في المدى القريب والبعيد في تحقيق مصلحتهم الفضلى.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/17375727/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/17375727/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "شهادة الأطفال أنفسهم أن الزيارة القليلة لا تكفيهم، وهي أصدق ما يحتج به على أن الرؤية المحدودة ليست مصلحتهم.", "jurisdiction": "الولايات المتحدة", "title": "جوان كيلي 2007 — ما يريده الأطفال بعد الانفصال", "source_standing": "جوان كيلي عالمة نفس علاجية أمريكية، من رواد البحث في أحوال أبناء الطلاق منذ سبعينيات القرن العشرين؛ ومجلة العمليات الأسرية من أعرق مجلات العلاج الأسري، تأسست سنة 1962.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 58, "supports": ["shared_parenting"], "author": {"name": "Lamb ME, Kelly JB", "date": "2001"}, "work": {"title": "Using the empirical literature to guide the development of parenting plans for young children: a rejoinder to Solomon and Biringen", "section": "Family Court Review 39(4):365–371", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "This can be avoided by developing parenting plans that continue to ensure that children have regular interaction with both parents in a broad array of contexts. Overnight periods provide opportunities for many important interactions.", "verbatim": true}, "translation_ar": "«ويمكن تجنب ذلك [تضرر الطفل بانقطاع صلته بأحد والديه] بوضع خطط رعاية تضمن استمرار تفاعل الأطفال تفاعلا منتظما مع كلا الوالدين في طائفة واسعة من السياقات. وتتيح فترات المبيت فرصا لكثير من التفاعلات المهمة.»", "urls": ["https://doi.org/10.1111/j.174-1617.2001.tb00618.x"], "links": [{"url": "https://doi.org/10.1111/j.174-1617.2001.tb00618.x", "label": "صفحة الدراسة لدى الناشر", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "كبيرا علماء النمو في قضايا الحضانة يجعلان التواصل المتكرر والمبيت عند الأب أساس خطط الرعاية حتى للصغار.", "jurisdiction": "الولايات المتحدة", "title": "لامب وكيلي 2001 — خطط الرعاية للصغار", "source_standing": "مايكل لامب من جامعة كامبريدج، وجوان كيلي من رواد بحوث الطلاق؛ ومجلة مراجعة محاكم الأسرة لسان رابطة محاكم الأسرة والمصالحة، يكتب فيها القضاة وعلماء النفس.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 59, "supports": ["shared_parenting"], "author": {"name": "Wallerstein JS, Kelly JB", "date": "1980"}, "work": {"title": "Surviving the Breakup: How Children and Parents Cope with Divorce", "section": "", "volume": "", "page": "", "edition": "New York: Basic Books"}, "original": {"lang": "en", "text": "مضمونه: في دراسة متابعة طويلة لأسر مطلقة في كاليفورنيا ظهر شوق الأبناء الشديد إلى الأب الغائب، وأن الزيارات القليلة لا تسد حاجتهم إليه.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL3244770W"], "links": [{"url": "https://openlibrary.org/works/OL3244770W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "أشهر دراسة متابعة طويلة في أبناء الطلاق تثبت أن الطفل يشتاق إلى أبيه ويتضرر بغيابه، وأن الزيارة القليلة لا تكفيه.", "jurisdiction": "الولايات المتحدة — كاليفورنيا", "title": "والرستين وكيلي 1980 — شوق الأبناء إلى الأب الغائب", "source_standing": "جوديث والرستين (1921–2012) صاحبة أطول دراسة متابعة طويلة في أبناء الطلاق، تابعت فيها أسرا من كاليفورنيا خمسا وعشرين سنة؛ وجوان كيلي من رواد بحوث الطلاق.", "evidence_level": "دراسة متابعة طويلة مؤسسة"}, {"section": "psy", "card_number": 60, "supports": ["shared_parenting"], "author": {"name": "Rutter M", "date": "1972"}, "work": {"title": "Maternal Deprivation Reassessed", "section": "", "volume": "", "page": "", "edition": "Harmondsworth: Penguin"}, "original": {"lang": "en", "text": "The most parsimonious explanation of the research findings suggests that a child needs to have the presence of a person to whom he is attached but it is irrelevant whether or not this person is his mother. [...] If it is bond formation which is important (rather than mother-child bond formation), it is in a child's interest to encourage attachment to several people, not just one, so that if one person is away another is present.", "verbatim": true}, "translation_ar": "«إن أبسط تفسير لنتائج البحوث يدل على أن الطفل يحتاج إلى وجود شخص يتعلق به، لكن لا يهم أن يكون هذا الشخص أمه أو غيرها. [...] وإذا كان المهم هو تكوين الرابطة (لا تكوين رابطة الأم بالطفل خاصة)، فمن مصلحة الطفل أن يشجع على التعلق بعدة أشخاص لا بشخص واحد، حتى إذا غاب أحدهم وجد الآخر.»", "urls": ["https://openlibrary.org/works/OL1950807W"], "links": [{"url": "https://openlibrary.org/works/OL1950807W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "أبو الطب النفسي للأطفال ينقض فكرة أن الأم وحدها مصدر الأمان النفسي للطفل، فالأب رابطة أصيلة، وحرمان الطفل منه حرمان.", "jurisdiction": "المملكة المتحدة", "title": "مايكل رتر — الحرمان من الأم في ميزان جديد", "source_standing": "مايكل رتر (1933–2021) يعد أبا الطب النفسي للأطفال، من كلية كينغز في لندن، ونال لقب فارس لخدمته العلمية؛ وكتابه هذا راجع به نظرية الحرمان من الأم.", "evidence_level": "مراجعة علمية مؤسسة"}, {"section": "psy", "card_number": 61, "supports": ["shared_parenting"], "author": {"name": "Lamb ME", "date": "1977"}, "work": {"title": "Father-infant and mother-infant interaction in the first year of life", "section": "Child Development 48(1):167–181", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Infants showed no preference for either parent in the display of attachment behaviors, though both parents were consistently differentiated from a relatively unfamiliar investigator on these measures. This indicates that infants were clearly attached to both parents from the beginning of attachment relations.", "verbatim": true}, "translation_ar": "«لم يبد الرضع تفضيلا لأي من الوالدين في إظهار سلوكيات التعلق، مع أنهم ميزوا كلا الوالدين على الدوام من باحث غير مألوف نسبيا في هذه المقاييس. وهذا يدل على أن الرضع كانوا متعلقين بوضوح بكلا الوالدين منذ بداية علاقات التعلق.»", "urls": ["https://doi.org/10.2307/1128896"], "links": [{"url": "https://doi.org/10.2307/1128896", "label": "صفحة الدراسة لدى الناشر", "site": "JSTOR", "domain": "doi.org"}], "strength": "explicit", "argument": "الرضيع يتعلق بأبيه في سنته الأولى كما يتعلق بأمه، فدعوى أن الصغير يحتاج أمه وحدها تخالف الملاحظة العلمية.", "jurisdiction": "الولايات المتحدة", "title": "لامب 1977 — الرضيع يتعلق بأبيه كأمه", "source_standing": "مايكل لامب أستاذ علم النفس في جامعة كامبريدج، أوسع الباحثين أثرا في علم نفس الأبوة؛ ومجلة نمو الطفل أرفع مجلات علم نفس النمو.", "evidence_level": "دراسة متابعة بالملاحظة"}, {"section": "psy", "card_number": 62, "supports": ["shared_parenting"], "author": {"name": "Main M, Weston DR", "date": "1981"}, "work": {"title": "The quality of the toddler's relationship to mother and to father", "section": "Child Development 52(3):932–940", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تعلق الطفل بأمه وتعلقه بأبيه رابطتان مستقلتان، والطفل الذي أمن بالرابطتين أحسن حالا ممن أمن بإحداهما.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.2307/1129097"], "links": [{"url": "https://doi.org/10.2307/1129097", "label": "صفحة الدراسة لدى الناشر", "site": "JSTOR", "domain": "doi.org"}], "strength": "explicit", "argument": "لكل من الأبوين رابطة مستقلة بالطفل لا تقوم مقامها الأخرى، والأحسن حالا من أمن بأبويه جميعا.", "jurisdiction": "الولايات المتحدة", "title": "ماين وويستون 1981 — رابطتان مستقلتان", "source_standing": "ماري ماين من جامعة كاليفورنيا في بيركلي، من أعلام نظرية التعلق ومبتكرة مقابلة التعلق عند الراشدين؛ ومجلة نمو الطفل أرفع مجلات التخصص.", "evidence_level": "دراسة ملاحظة تجريبية"}, {"section": "psy", "card_number": 63, "supports": ["shared_parenting"], "author": {"name": "Grossmann K, Grossmann KE, Fremmer-Bombik E, Kindler H, Scheuerer-Englisch H, Zimmermann P", "date": "2002"}, "work": {"title": "The uniqueness of the child–father attachment relationship: fathers' sensitive and challenging play as a pivotal variable in a 16-year longitudinal study", "section": "Social Development 11(3):301–337", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Dimensions of adolescents' attachment representations were predicted by fathers' play sensitivity only. The results confirmed our main assumption that fathers' play sensitivity is a better predictor of the child's long-term attachment representation than the early infant–father security of attachment.", "verbatim": true}, "translation_ar": "«لم يتنبأ بأبعاد تصور التعلق عند المراهقين إلا حساسية الأب في اللعب [اللعب الحساس المتحدي]. وأكدت النتائج فرضيتنا الرئيسية بأن حساسية الأب في اللعب أفضل في التنبؤ بتصور الطفل للتعلق على المدى البعيد من أمان تعلق الرضيع بأبيه في سنواته الأولى.»", "urls": ["https://doi.org/10.1111/1467-9507.00202"], "links": [{"url": "https://doi.org/10.1111/1467-9507.00202", "label": "صفحة الدراسة لدى الناشر", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "للأب في نمو ولده وظيفة لا تؤديها الأم، يظهر أثرها حتى المراهقة، فحرمانه منه بعد السابعة يحرمه هذا الأثر.", "jurisdiction": "ألمانيا", "title": "غروسمان 2002 — أثر لعب الأب حتى المراهقة", "source_standing": "كلاوس وكارين غروسمان من جامعة ريغنسبورغ الألمانية، أصحاب أطول دراسات المتابعة الطويلة في التعلق في أوروبا؛ والمجلة تصدرها دار وايلي.", "evidence_level": "دراسة متابعة ست عشرة سنة"}, {"section": "psy", "card_number": 64, "supports": ["shared_parenting", "7"], "author": {"name": "Paquette D", "date": "2004"}, "work": {"title": "Theorizing the father–child relationship: mechanisms and developmental outcomes", "section": "Human Development 47(4):193–219", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "The comparison of mother-child and father-child interactions suggests that fathers play a particularly important role in the development of children's openness to the world. Men seem to have a tendency to excite, surprise, and momentarily destabilize children; they also tend to encourage children to take risks, while at the same time ensuring the latter's safety and security, thus permitting children to learn to be braver in unfamiliar situations, as well as to stand up for themselves.", "verbatim": true}, "translation_ar": "«توحي المقارنة بين تفاعلات الأم مع الطفل وتفاعلات الأب مع الطفل بأن للآباء دورا مهما على نحو خاص في تنمية انفتاح الأطفال على العالم. ويبدو أن الرجال يميلون إلى إثارة الأطفال ومفاجأتهم وزعزعة توازنهم لحظيا؛ كما يميلون إلى تشجيعهم على المخاطرة مع ضمان سلامتهم وأمنهم في الوقت نفسه، مما يتيح للأطفال أن يتعلموا الجرأة في المواقف غير المألوفة، وأن يدافعوا عن أنفسهم.»", "urls": ["https://doi.org/10.1159/000078723"], "links": [{"url": "https://doi.org/10.1159/000078723", "label": "صفحة الدراسة لدى الناشر", "site": "دار كارغر", "domain": "doi.org"}], "strength": "explicit", "argument": "إذا ميز الصغير وخرج إلى العالم اشتدت حاجته إلى علاقة التنشيط التي يقوم بها الأب، وهذا وجه علمي لانتقاله إلى أبيه بعد السابعة.", "jurisdiction": "كندا", "title": "باكيت 2004 — الأب علاقة تنشيط", "source_standing": "دانيال باكيت أستاذ في جامعة مونتريال، صاحب نظرية علاقة التنشيط بين الأب وولده؛ ومجلة النمو الإنساني تصدرها دار كارغر السويسرية.", "evidence_level": "مراجعة نظرية محكمة"}, {"section": "psy", "card_number": 65, "supports": ["shared_parenting"], "author": {"name": "Flouri E, Buchanan A", "date": "2003"}, "work": {"title": "The role of father involvement in children's later mental health", "section": "Journal of Adolescence 26(1):63–78", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Father involvement at age 7 protected against psychological maladjustment in adolescents from non-intact families, and father involvement at age 16 protected against psychological distress in adult women.", "verbatim": true}, "translation_ar": "«كان انخراط الأب في سن 7 سنوات واقيا من الاضطراب النفسي عند المراهقين من الأسر غير المتماسكة، وكان انخراط الأب في سن 16 سنة واقيا من الضيق النفسي عند النساء البالغات.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/12550822/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/12550822/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "أثر الأب في صحة ولده النفسية ممتد إلى رشده، فقطعه عنه في سني الطفولة والمراهقة يضر صحته في كبره.", "jurisdiction": "المملكة المتحدة", "title": "فلوري وبوكانان 2003 — الأب وصحة الولد النفسية", "source_standing": "إيريني فلوري أستاذة في كلية لندن الجامعية، وآن بوكانان من جامعة أكسفورد؛ والدراسة على متابعة الدراسة الوطنية لنمو الطفل في بريطانيا، المولودين سنة 1958.", "evidence_level": "دراسة متابعة وطنية طويلة"}, {"section": "psy", "card_number": 66, "supports": ["shared_parenting"], "author": {"name": "Rohner RP, Veneziano RA", "date": "2001"}, "work": {"title": "The importance of father love: history and contemporary evidence", "section": "Review of General Psychology 5(4):382–405", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Much of this evidence suggests that the influence of father love on offspring's development is as great as and occasionally greater than the influence of mother love. Some studies conclude that father love is the sole significant predictor of specific outcomes after controlling for the influence of mother love.", "verbatim": true}, "translation_ar": "«يوحي كثير من هذه الأدلة بأن أثر محبة الأب في نمو الأبناء يساوي أثر محبة الأم، ويزيد عليه أحيانا. وتخلص بعض الدراسات إلى أن محبة الأب هي العامل الوحيد ذو الدلالة في التنبؤ بنتائج معينة بعد مراعاة أثر محبة الأم.»", "urls": ["https://doi.org/10.1037/1089-2680.5.4.382"], "links": [{"url": "https://doi.org/10.1037/1089-2680.5.4.382", "label": "صفحة الدراسة لدى الناشر", "site": "APA PsycNet", "domain": "doi.org"}], "strength": "explicit", "argument": "علم النفس المقارن ينقض دعوى أن الطفل لا يحتاج إلا حنان أمه، فحنان الأب يعدل حنان الأم في أثره، وحرمان الطفل منه حرمان من نصف ما يحتاج.", "jurisdiction": "الولايات المتحدة — جامعة كونيتيكت", "title": "رونر وفينيزيانو 2001 — أهمية محبة الأب", "source_standing": "رونالد رونر أستاذ في جامعة كونيتيكت، مؤسس نظرية القبول والرفض بين الأشخاص؛ ومجلة المراجعة العامة في علم النفس تصدرها جمعية علم النفس الأمريكية.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 67, "supports": ["shared_parenting"], "author": {"name": "Pruett KD", "date": "2000"}, "work": {"title": "Fatherneed: Why Father Care Is as Essential as Mother Care for Your Child", "section": "", "volume": "", "page": "", "edition": "New York: Free Press"}, "original": {"lang": "en", "text": "مضمونه: رعاية الأب لولده ضرورة لنمو الطفل كرعاية الأم، يحتاجها الطفل منذ الرضاعة، وفيها ما لا تقدمه رعاية الأم من تنويع في اللعب والتحدي والتعلم.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL86374W"], "links": [{"url": "https://openlibrary.org/works/OL86374W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "طبيب نفسي للأطفال من أرفع مراكزه يقرر أن حاجة الطفل إلى أبيه أصيلة كحاجته إلى أمه، فدعوى الاكتفاء بالأم تخالف الطب النفسي للأطفال.", "jurisdiction": "الولايات المتحدة — جامعة ييل", "title": "كايل برويت — حاجة الطفل إلى أبيه", "source_standing": "كايل برويت أستاذ طبي للطب النفسي للأطفال في مركز دراسة الطفل بجامعة ييل، من أرفع مراكز طب الأطفال النفسي في العالم.", "evidence_level": "كتاب علمي لعالم مرجع"}, {"section": "psy", "card_number": 68, "supports": ["shared_parenting"], "author": {"name": "Parke RD", "date": "1996"}, "work": {"title": "Fatherhood", "section": "", "volume": "", "page": "", "edition": "Cambridge, MA: Harvard University Press"}, "original": {"lang": "en", "text": "مضمونه: الآباء قادرون على رعاية الرضع والأطفال بكفاءة الأمهات، وأسلوبهم في اللعب والتفاعل يسهم في نمو الطفل الاجتماعي والعاطفي إسهاما خاصا.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL1962315W"], "links": [{"url": "https://openlibrary.org/works/OL1962315W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "كفاءة الأب في رعاية صغيره ثابتة بالبحث، فلا وجه لتقديم الأم تقديما مطلقا بدعوى أن الأب لا يحسن الرعاية.", "jurisdiction": "الولايات المتحدة — جامعة كاليفورنيا", "title": "روس باركي — الأبوة", "source_standing": "روس باركي أستاذ متميز في جامعة كاليفورنيا، من رواد البحث في الأبوة منذ سبعينيات القرن العشرين؛ والكتاب صادر عن مطبعة جامعة هارفارد.", "evidence_level": "كتاب علمي لعالم مرجع"}, {"section": "psy", "card_number": 69, "supports": ["shared_parenting"], "author": {"name": "Lamb ME", "date": "2012"}, "work": {"title": "Mothers, fathers, families, and circumstances: factors affecting children's adjustment", "section": "Applied Developmental Science 16(2):98–111", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Many studies have shown that adjustment is largely affected by differences in the quality of parenting and parent–child relationships, the quality of the relationships between the parents and the richness of the economic and social resources available to the family; more recent research signals the importance of congenital differences as well.", "verbatim": true}, "translation_ar": "«أظهرت دراسات كثيرة أن توافق الطفل يتأثر إلى حد كبير بالفروق في جودة الرعاية وجودة علاقة الوالدين بالطفل، وبجودة العلاقة بين الوالدين، وبوفرة الموارد الاقتصادية والاجتماعية المتاحة للأسرة؛ وتشير بحوث أحدث إلى أهمية الفروق الخلقية [الموروثة] أيضا.»", "urls": ["https://doi.org/10.1080/10888691.2012.667344"], "links": [{"url": "https://doi.org/10.1080/10888691.2012.667344", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "العبرة في صلاح الطفل جودة صلته بأبويه جميعا، لا جنس الحاضن، فتقديم الأم مطلقا لا يستند إلى علم.", "jurisdiction": "المملكة المتحدة — جامعة كامبريدج", "title": "لامب 2012 — العبرة بجودة الصلة لا بجنس الحاضن", "source_standing": "مايكل لامب أستاذ علم النفس في جامعة كامبريدج، أوسع الباحثين أثرا في علم نفس الأبوة؛ والمجلة تصدرها دار تايلور وفرانسيس.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 70, "supports": ["shared_parenting"], "author": {"name": "Biller HB", "date": "1993"}, "work": {"title": "Fathers and Families: Paternal Factors in Child Development", "section": "", "volume": "", "page": "", "edition": "Westport, CT: Auburn House"}, "original": {"lang": "en", "text": "مضمونه: يجمع الكتاب الأدلة على أثر الأب في نمو الطفل المعرفي والخلقي والاجتماعي، وعلى ما يلحق الطفل من ضرر بفقد أبيه أو ضعف صلته به.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL3949182W"], "links": [{"url": "https://openlibrary.org/works/OL3949182W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "أثر الأب في عقل ولده وخلقه ثابت بالبحث الطويل، وحرمانه منه سنين ضرر لا يجبره شيء.", "jurisdiction": "الولايات المتحدة — جامعة رود آيلاند", "title": "هنري بيلر — الآباء والأسر", "source_standing": "هنري بيلر أستاذ علم النفس في جامعة رود آيلاند، من أوائل من درسوا أثر الأب في نمو الطفل.", "evidence_level": "كتاب علمي"}, {"section": "psy", "card_number": 71, "supports": ["shared_parenting"], "author": {"name": "Lamb ME", "date": "2018"}, "work": {"title": "Does shared parenting by separated parents affect the adjustment of young children?", "section": "Journal of Child Custody 15(1):16–25", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Consistent with attachment theory, the evidence suggests that children benefit when parenting plans allow them to maintain meaningful and positive relationships with both of their parents.", "verbatim": true}, "translation_ar": "«واتساقا مع نظرية التعلق، تشير الأدلة إلى أن الأطفال ينتفعون حين تتيح لهم خطط الرعاية الحفاظ على علاقات ذات معنى وإيجابية مع كلا والديهم.»", "urls": ["https://doi.org/10.1080/15379418.2018.1425105"], "links": [{"url": "https://doi.org/10.1080/15379418.2018.1425105", "label": "صفحة الدراسة لدى الناشر", "site": "دار تايلور وفرانسيس", "domain": "doi.org"}], "strength": "explicit", "argument": "كبير علماء الأبوة يقرر أن الرعاية المشتركة بالمناصفة لا تضر الصغار، فدعوى أن الطفل لا يصلح إلا عند أمه منقوضة.", "jurisdiction": "المملكة المتحدة — جامعة كامبريدج", "title": "مايكل لامب 2018 — الأطفال ينتفعون حين تحفظ خطط الرعاية صلتهم بالوالدين معا", "source_standing": "مايكل لامب أستاذ علم النفس في جامعة كامبريدج، أوسع الباحثين أثرا في علم نفس الأبوة؛ ومجلة حضانة الطفل مجلة محكمة متخصصة.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 72, "supports": ["shared_parenting"], "author": {"name": "Bastaits K, Ponnet K, Mortelmans D", "date": "2012"}, "work": {"title": "Parenting of divorced fathers and the association with children's self-esteem", "section": "Journal of Youth and Adolescence 41(12):1643–1656", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Results revealed that non-residential fathers (n = 225) were less supportive and controlling than fathers in joint custody (n = 138) and married fathers (n = 224). Nevertheless, having a supportive father was beneficial to children's self-esteem in each family structure. We conclude that, even after a divorce, fathers have the capacity to enhance children's self-esteem and we suggest that future research should investigate this capacity.", "verbatim": true}, "translation_ar": "«كشفت النتائج أن الآباء غير المقيمين مع أبنائهم (225 أبا) كانوا أقل دعما ومتابعة من الآباء في الحضانة المشتركة (138 أبا) ومن الآباء المتزوجين (224 أبا). ومع ذلك كان وجود أب داعم نافعا لتقدير الأبناء لأنفسهم في كل أنواع الأسر. ونخلص إلى أن الآباء، حتى بعد الطلاق، قادرون على رفع تقدير أبنائهم لأنفسهم، ونقترح أن تبحث الدراسات المقبلة هذه القدرة.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/22739936/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/22739936/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "تقدير الولد لنفسه يتأثر بتربية أبيه بعد الطلاق، فتمكين الأب من التربية مصلحة نفسية للولد.", "jurisdiction": "بلجيكا — جامعة أنتويرب", "title": "دراسة بلجيكية 2012 — تربية الأب وتقدير الولد لنفسه", "source_standing": "الدراسة من جامعة أنتويرب البلجيكية على بيانات مشروع الطلاق في فلاندرز؛ ومجلة الشباب والمراهقة من أرفع مجلات التخصص، تصدرها دار سبرينغر.", "evidence_level": "دراسة مسحية واسعة"}, {"section": "psy", "card_number": 73, "supports": ["shared_parenting"], "author": {"name": "Ramchandani PG, Domoney J, Sethna V, Psychogiou L, Vlachos H, Murray L", "date": "2013"}, "work": {"title": "Do early father-infant interactions predict the onset of externalising behaviours in young children? Findings from a longitudinal cohort study", "section": "Journal of Child Psychology and Psychiatry. 2013;54(1):56-64", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Disengaged and remote interactions between fathers and their infants were found to predict externalising behavioural problems at the age of 1 year. ... Disengaged interactions of fathers with their infants, as early as the third month of life, predict early behavioural problems in children.\"", "verbatim": true}, "translation_ar": "«وجد أن التفاعلات المنسحبة والبعيدة بين الآباء ورضعهم تنبئ بمشكلات سلوكية ظاهرة في سن سنة واحدة... فانسحاب الأب في تفاعله مع رضيعه، منذ الشهر الثالث من حياته، ينبئ بمشكلات سلوكية مبكرة عند الأطفال».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/22808985/", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3562489/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/22808985/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3562489/", "label": "النص الكامل", "site": "المكتبة الوطنية للطب الأمريكية", "domain": "pmc.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "أثر الأب في ولده يبدأ من الشهر الثالث من عمره، فدعوى أن الرضيع لا يحتاج إلا أمه تخالف ما أثبته القياس العلمي.", "jurisdiction": "المملكة المتحدة — جامعة أكسفورد", "title": "رامتشانداني 2013 — انسحاب الأب في الشهر الثالث ينبئ بمشكلات السلوك في السنة الأولى", "source_standing": "بول رامتشانداني من جامعة أكسفورد ثم أستاذ كرسي في جامعة كامبريدج، ولين موراي من جامعة ريدينغ من أعلام بحوث الرضاعة؛ والمجلة من أرفع مجلات الطب النفسي للأطفال في العالم، والدراسة ممولة من مؤسسة ويلكم.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 74, "supports": ["shared_parenting"], "author": {"name": "Sethna V, Perry E, Domoney J, Iles J, Psychogiou L, Rowbotham NEL, et al.", "date": "2017"}, "work": {"title": "Father-child interactions at 3 months and 24 months: contributions to children's cognitive development at 24 months", "section": "Infant Mental Health Journal. 2017;38(3):378-390", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"At 24 months, children whose fathers were more engaged and sensitive as well as those whose fathers were less controlling in their interactions scored higher on the MDI. These findings were independent of the effects of maternal sensitivity.\"", "verbatim": true}, "translation_ar": "«في سن 24 شهرا سجل الأطفال الذين كان آباؤهم أكثر انخراطا وحساسية، وكذلك الذين كان آباؤهم أقل تحكما في تفاعلاتهم، درجات أعلى في مؤشر النمو العقلي. وكانت هذه النتائج مستقلة عن آثار حساسية الأم».", "urls": ["https://spiral.imperial.ac.uk/bitstreams/2e1a884a-be05-43fd-96e4-02fba6b2cd67/download", "https://onlinelibrary.wiley.com/doi/10.1002/imhj.21642"], "links": [{"url": "https://spiral.imperial.ac.uk/bitstreams/2e1a884a-be05-43fd-96e4-02fba6b2cd67/download", "label": "النص الكامل", "site": "مستودع إمبريال كوليدج لندن", "domain": "spiral.imperial.ac.uk"}, {"url": "https://onlinelibrary.wiley.com/doi/10.1002/imhj.21642", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "onlinelibrary.wiley.com"}], "strength": "explicit", "argument": "أثر الأب في عقل ولده مستقل عن أثر الأم ولا تغني عنه الأم، فحرمان الصغير من أبيه خصم من نموه العقلي.", "jurisdiction": "المملكة المتحدة — كلية كينغز لندن وجامعة أكسفورد", "title": "سيثنا 2017 — انخراط الأب في اللعب يرفع ذكاء الولد مستقلا عن أثر الأم", "source_standing": "فريق من كلية كينغز لندن وجامعة أكسفورد وإمبريال كوليدج، ومن مؤلفيه آلان ستاين ولين موراي وبول رامتشانداني؛ والمجلة لسان الرابطة العالمية للصحة النفسية للرضع.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 75, "supports": ["shared_parenting"], "author": {"name": "Feldman R", "date": "2003"}, "work": {"title": "Infant-mother and infant-father synchrony: the coregulation of positive arousal", "section": "Infant Mental Health Journal. 2003;24(1):1-23", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"During father-child play, positive arousal was high, sudden, and organized in multiple peaks that appeared more frequently as play progressed. ... Father-child synchrony was related to the intensity of positive arousal and to father attachment security.\"", "verbatim": true}, "translation_ar": "«في أثناء لعب الأب مع طفله كان الانفعال الإيجابي عاليا مفاجئا منتظما في ذرى متعددة تزداد تواترا مع تقدم اللعب... وارتبط التزامن بين الأب والطفل بشدة الانفعال الإيجابي وبأمان التعلق بالأب».", "urls": ["https://cris.biu.ac.il/en/publications/infant-mother-and-infant-father-synchrony-the-coregulation-of-pos/", "https://onlinelibrary.wiley.com/doi/10.1002/imhj.10041"], "links": [{"url": "https://cris.biu.ac.il/en/publications/infant-mother-and-infant-father-synchrony-the-coregulation-of-pos/", "label": "سجل الدراسة", "site": "بوابة بحوث جامعة بار إيلان", "domain": "cris.biu.ac.il"}, {"url": "https://onlinelibrary.wiley.com/doi/10.1002/imhj.10041", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "onlinelibrary.wiley.com"}], "strength": "explicit", "argument": "للرضيع مع أبيه لغة انفعالية خاصة به لا يقدمها غيره، فالأب ليس بديلا عن الأم ولا الأم بديلا عن الأب.", "jurisdiction": "إسرائيل — جامعة بار إيلان", "title": "فيلدمان 2003 — الرضيع ينظم انفعاله مع أبيه كما ينظمه مع أمه", "source_standing": "روث فيلدمان من أكثر علماء العالم استشهادا في التزامن بين الوالد والرضيع وعصبية التعلق، وعملت في مركز دراسة الطفل بجامعة ييل؛ والمجلة لسان الرابطة العالمية للصحة النفسية للرضع.", "evidence_level": "دراسة ملاحظة تجريبية"}, {"section": "psy", "card_number": 76, "supports": ["shared_parenting"], "author": {"name": "Tamis-LeMonda CS, Shannon JD, Cabrera NJ, Lamb ME", "date": "2004"}, "work": {"title": "Fathers and mothers at play with their 2- and 3-year-olds: contributions to language and cognitive development", "section": "Child Development. 2004;75(6):1806-1820", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Fathers' and mothers' supportive parenting independently predicted children's outcomes after covarying significant demographic factors. Findings suggest direct and indirect effects of fathering on child development.\"", "verbatim": true}, "translation_ar": "«تنبأت الرعاية الداعمة من الآباء والأمهات، كل على حدة، بنتائج الأطفال بعد مراعاة العوامل الديموغرافية المؤثرة. وتدل النتائج على آثار مباشرة وغير مباشرة للأبوة في نمو الطفل».", "urls": ["https://eric.ed.gov/?id=EJ685646", "https://onlinelibrary.wiley.com/doi/10.1111/j.1467-8624.2004.00818.x"], "links": [{"url": "https://eric.ed.gov/?id=EJ685646", "label": "سجل الدراسة", "site": "قاعدة ERIC التابعة لوزارة التعليم الأمريكية", "domain": "eric.ed.gov"}, {"url": "https://onlinelibrary.wiley.com/doi/10.1111/j.1467-8624.2004.00818.x", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "onlinelibrary.wiley.com"}], "strength": "explicit", "argument": "لعب الأب مع ولده في الثانية والثالثة يبني لغته وعقله بأثر مستقل عن الأم، وهو ما لا يحصل في ساعات نظر.", "jurisdiction": "الولايات المتحدة — جامعة نيويورك", "title": "تاميس-ليموندا ولامب 2004 — الأب يسهم في لغة الطفل وعقله إسهاما مستقلا", "source_standing": "مجلة نمو الطفل أرفع مجلات علم نفس النمو؛ ومن مؤلفي الدراسة مايكل لامب من جامعة كامبريدج وناتاشا كابريرا من جامعة ماريلاند، والعينة من البرنامج الوطني الأمريكي للطفولة المبكرة.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 77, "supports": ["shared_parenting", "7"], "author": {"name": "Flouri E, Buchanan A", "date": "2004"}, "work": {"title": "Early father's and mother's involvement and child's later educational outcomes", "section": "British Journal of Educational Psychology. 2004;74(2):141-153", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Father involvement and mother involvement at age 7 independently predicted educational attainment by age 20. Conclusion: Early father involvement can be another protective factor in counteracting risk conditions that might lead to later low attainment levels.\"", "verbatim": true}, "translation_ar": "«تنبأ انخراط الأب وانخراط الأم في سن السابعة، كل على حدة، بالتحصيل التعليمي في سن العشرين. الخلاصة: انخراط الأب المبكر عامل واق آخر في مواجهة ظروف الخطر التي قد تؤدي إلى تدني التحصيل لاحقا».", "urls": ["https://eric.ed.gov/?id=EJ695672", "https://bpspsychub.onlinelibrary.wiley.com/doi/10.1348/000709904773839806"], "links": [{"url": "https://eric.ed.gov/?id=EJ695672", "label": "سجل الدراسة", "site": "قاعدة ERIC التابعة لوزارة التعليم الأمريكية", "domain": "eric.ed.gov"}, {"url": "https://bpspsychub.onlinelibrary.wiley.com/doi/10.1348/000709904773839806", "label": "صفحة الدراسة", "site": "الجمعية البريطانية لعلم النفس", "domain": "bpspsychub.onlinelibrary.wiley.com"}], "strength": "explicit", "argument": "السابعة بعينها سن يقاس فيها انخراط الأب فيتبين أثره بعد ثلاث عشرة سنة في تحصيل الولد، فمن أبعد الأب عن ولده في هذه السن أضر بمستقبله.", "jurisdiction": "المملكة المتحدة — جامعة أكسفورد", "title": "فلوري وبوكانان 2004 — انخراط الأب في السابعة ينبئ بالتحصيل في العشرين", "source_standing": "الدراسة على متابعة الدراسة الوطنية البريطانية لنمو الطفل لمواليد 1958؛ وآن بوكانان من جامعة أكسفورد وإيريني فلوري أستاذة في كلية لندن الجامعية من أبرز باحثي الأبوة، والمجلة تصدرها الجمعية البريطانية لعلم النفس.", "evidence_level": "دراسة متابعة وطنية طويلة"}, {"section": "psy", "card_number": 78, "supports": ["shared_parenting"], "author": {"name": "Jeynes WH", "date": "2015"}, "work": {"title": "A meta-analysis: the relationship between father involvement and student academic achievement", "section": "Urban Education. 2015;50(4):387-423", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"A meta-analysis was undertaken, including 66 studies, to determine the relationship between father involvement and the educational outcomes of urban school children. ... The results indicate that the association between father involvement and the educational outcomes of youth overall is significant statistically.\"", "verbatim": true}, "translation_ar": "«أجري تحليل جامع لعدة دراسات شمل 66 دراسة لتحديد العلاقة بين انخراط الأب والنتائج التعليمية لأطفال المدارس في المدن... وتدل النتائج على أن الارتباط بين انخراط الأب والنتائج التعليمية للناشئة في مجمله واضح إحصائيا».", "urls": ["https://journals.sagepub.com/doi/10.1177/0042085914525789"], "links": [{"url": "https://journals.sagepub.com/doi/10.1177/0042085914525789", "label": "صفحة الدراسة", "site": "دار سيج للنشر", "domain": "journals.sagepub.com"}], "strength": "explicit", "argument": "ست وستون دراسة مجتمعة تثبت أن الأب شريك في تعليم ولده، والفقهاء جعلوا التعليم مما يجب على الأب القيام به بعد السابعة.", "jurisdiction": "الولايات المتحدة — جامعة ولاية كاليفورنيا", "title": "تحليل جامع لعدة دراسات 2015 — 66 دراسة على أثر الأب في التحصيل الدراسي", "source_standing": "ويليام جينز من أكثر الباحثين استشهادا في التحاليل الجامعة للدراسات لمشاركة الوالدين في التعليم؛ والمجلة محكمة تصدرها دار سيج.", "evidence_level": "تحليل جامع لعدة دراسات: أعلى درجات الدليل"}, {"section": "psy", "card_number": 79, "supports": ["shared_parenting"], "author": {"name": "Rollè L, Gullotta G, Trombetta T, Curti L, Gerino E, Brustia P, et al.", "date": "2019"}, "work": {"title": "Father involvement and cognitive development in early and middle childhood: a systematic review", "section": "Frontiers in Psychology. 2019;10:2405", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The findings revealed that the main focus is the impact of father involvement on children's cognitive skills and the most of the studies highlighted that it is positive and statistically significant.\"", "verbatim": true}, "translation_ar": "«كشفت النتائج أن المحور الرئيس هو أثر انخراط الأب في المهارات المعرفية للأطفال، وأبرزت معظم الدراسات أنه أثر إيجابي وواضح إحصائيا».", "urls": ["https://www.frontiersin.org/articles/10.3389/fpsyg.2019.02405/full"], "links": [{"url": "https://www.frontiersin.org/articles/10.3389/fpsyg.2019.02405/full", "label": "النص الكامل", "site": "مجلة فرونتيرز في علم النفس", "domain": "www.frontiersin.org"}], "strength": "explicit", "argument": "خلاصة أربعين بحثا: الأب يبني عقل ولده، فليس دوره نفقة تدفع بل تربية تمارس.", "jurisdiction": "إيطاليا — جامعة تورينو", "title": "مراجعة منهجية 2019 — انخراط الأب يرفع المهارات المعرفية للطفل", "source_standing": "مراجعة منهجية وفق معايير بريزما لأربعين بحثا من قواعد PubMed وEBSCO، لفريق قسم علم النفس بجامعة تورينو؛ والمجلة محكمة مفتوحة الإتاحة.", "evidence_level": "مراجعة منهجية"}, {"section": "psy", "card_number": 80, "supports": ["shared_parenting", "7"], "author": {"name": "Boyce WT, Essex MJ, Alkon A, Goldsmith HH, Kraemer HC, Kupfer DJ", "date": "2006"}, "work": {"title": "Early father involvement moderates biobehavioral susceptibility to mental health problems in middle childhood", "section": "Journal of the American Academy of Child and Adolescent Psychiatry. 2006;45(12):1510-1520", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Among children experiencing low father involvement in infancy, behavioral, autonomic, and adrenocortical reactivity became risk factors for later mental health symptoms. The highest symptom severity scores were found for children with high autonomic reactivity that, as infants, had experienced low father involvement\"", "verbatim": true}, "translation_ar": "«عند الأطفال الذين عاشوا انخراطا منخفضا من الأب في الرضاعة صارت الاستجابة السلوكية والعصبية والهرمونية عوامل خطر لأعراض نفسية لاحقة. ووجدت أعلى درجات شدة الأعراض عند الأطفال ذوي الاستجابة العصبية العالية الذين عاشوا في رضاعتهم انخراطا منخفضا من الأب».", "urls": ["https://www.em-consulte.com/article/352611/early-father-involvement-moderates-biobehavioral-s", "https://www.jaacap.org/article/S0890-8567(09)61657-9/fulltext"], "links": [{"url": "https://www.em-consulte.com/article/352611/early-father-involvement-moderates-biobehavioral-s", "label": "ملخص الدراسة", "site": "منصة إلزفير ماسون", "domain": "www.em-consulte.com"}, {"url": "https://www.jaacap.org/article/S0890-8567(09)61657-9/fulltext", "label": "صفحة الدراسة", "site": "مجلة الأكاديمية الأمريكية للطب النفسي للأطفال", "domain": "www.jaacap.org"}], "strength": "explicit", "argument": "غياب الأب في سني الرضاعة يترك أثره في أعصاب الطفل وهرموناته فيظهر مرضا نحو السابعة؛ فالأب حاجة بيولوجية لا كمالية.", "jurisdiction": "الولايات المتحدة — جامعة كاليفورنيا", "title": "بويس 2006 — قلة انخراط الأب في الرضاعة تجعل الطفل عرضة للمرض النفسي نحو السابعة", "source_standing": "المجلة لسان الأكاديمية الأمريكية للطب النفسي للأطفال والمراهقين ومن أرفع مجلات التخصص؛ وتوماس بويس من كبار الباحثين في استجابة الأطفال للضغوط، ومعه هيلينا كريمر من ستانفورد وديفيد كوبفر من بيتسبرغ.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 81, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "King V, Sobolewski JM", "date": "2006"}, "work": {"title": "Nonresident fathers' contributions to adolescent well-being", "section": "Journal of Marriage and Family. 2006;68(3):537-557", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"even if adolescents have weak ties to mothers, those who have strong ties to nonresident fathers exhibit fewer internalizing problems and less acting out at school than adolescents who have weak ties to both parents. Adolescents are worst off on a range of outcomes when they have weak ties to both their mothers and nonresident fathers.\"", "verbatim": true}, "translation_ar": "«حتى إذا كانت صلة المراهقين بأمهاتهم ضعيفة، فإن من كانت صلتهم بآبائهم غير المقيمين قوية يظهرون مشكلات داخلية أقل وسلوكا مشاغبا أقل في المدرسة من المراهقين ضعيفي الصلة بالوالدين كليهما. ويكون المراهقون في أسوأ حال في طائفة من النتائج حين تضعف صلتهم بأمهاتهم وآبائهم غير المقيمين معا».", "urls": ["https://pure.psu.edu/en/publications/nonresident-fathers-contributions-to-adolescent-well-being", "https://onlinelibrary.wiley.com/doi/10.1111/j.1741-3737.2006.00274.x"], "links": [{"url": "https://pure.psu.edu/en/publications/nonresident-fathers-contributions-to-adolescent-well-being", "label": "سجل الدراسة", "site": "بوابة بحوث جامعة ولاية بنسلفانيا", "domain": "pure.psu.edu"}, {"url": "https://onlinelibrary.wiley.com/doi/10.1111/j.1741-3737.2006.00274.x", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "onlinelibrary.wiley.com"}], "strength": "explicit", "argument": "صلة المراهق بأبيه مورد حماية مستقل حتى حين تضعف صلته بأمه؛ فالمراهق الذي يزعمون أنه لا يحتاج إلا أمه إلى الخامسة عشرة يحتاج أباه حاجة ثابتة بالقياس.", "jurisdiction": "الولايات المتحدة — جامعة ولاية بنسلفانيا", "title": "كينغ وسوبوليفسكي 2006 — صلة المراهق بأبيه غير المقيم تحميه ولو ضعفت صلته بأمه", "source_standing": "مجلة الزواج والأسرة أرفع مجلات علوم الأسرة، لسان المجلس الوطني لعلاقات الأسرة؛ وفاليري كينغ من أبرز علماء الاجتماع في الأبوة غير المقيمة، والعينة من المسح الوطني الأمريكي للأسر.", "evidence_level": "دراسة مسحية وطنية"}, {"section": "psy", "card_number": 82, "supports": ["shared_parenting"], "author": {"name": "Bronte-Tinkew J, Carrano J, Horowitz A, Kinukawa A", "date": "2008"}, "work": {"title": "Involvement among resident fathers and links to infant cognitive outcomes", "section": "Journal of Family Issues. 2008;29(9):1211-1244", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"varied aspects of father involvement (cognitively stimulating activities, physical care, paternal warmth, and caregiving activities) are associated with a lower likelihood of infant cognitive delay. ... Early positive father-child interactions reduce cognitive delay.\"", "verbatim": true}, "translation_ar": "«ترتبط جوانب متنوعة من انخراط الأب (الأنشطة المنبهة معرفيا، والعناية الجسدية، ودفء الأب، وأنشطة الرعاية) باحتمال أقل لتأخر الرضيع المعرفي... فالتفاعلات الإيجابية المبكرة بين الأب والطفل تقلل التأخر المعرفي».", "urls": ["https://journals.sagepub.com/doi/10.1177/0192513X08318145"], "links": [{"url": "https://journals.sagepub.com/doi/10.1177/0192513X08318145", "label": "صفحة الدراسة", "site": "دار سيج للنشر", "domain": "journals.sagepub.com"}], "strength": "explicit", "argument": "عناية الأب الجسدية ودفؤه ولعبه مع الرضيع تحميه من التأخر المعرفي في تسعة أشهر، فمن ذا يزعم أن الرضيع لا يحتاج إلا أمه؟", "jurisdiction": "الولايات المتحدة — مركز تشايلد تريندز", "title": "برونتي-تينكيو 2008 — انخراط الأب يقلل احتمال تأخر الرضيع المعرفي في تسعة أشهر", "source_standing": "تحليل لعينة وطنية ممثلة للسكان من دراسة المتابعة الأمريكية الطويلة للمواليد التابعة لوزارة التعليم، أجراه مركز تشايلد تريندز أبرز مركز بحثي غير ربحي لدراسات الطفولة في الولايات المتحدة.", "evidence_level": "دراسة متابعة وطنية"}, {"section": "psy", "card_number": 83, "supports": ["shared_parenting"], "author": {"name": "Kelly JB, Johnston JR", "date": "2001"}, "work": {"title": "The alienated child: a reformulation of parental alienation syndrome", "section": "Family Court Review. 2001;39(3):249-266", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"An alienated child is defined here as one who expresses, freely and persistently, unreasonable negative feelings and beliefs (such as anger, hatred, rejection, and/or fear) toward a parent that are significantly disproportionate to the child's actual experience with that parent. ... Most often ... rejected parents have had at least an adequate relationship with these children, and the angry rejection is not merited\"", "verbatim": true}, "translation_ar": "«يعرف الطفل المنفر هنا بأنه من يعبر، بحرية وإصرار، عن مشاعر ومعتقدات سلبية غير معقولة (كالغضب والكراهية والرفض أو الخوف) تجاه أحد والديه، لا تتناسب البتة مع تجربة الطفل الفعلية مع ذلك الوالد... وفي الأغلب... كانت للوالد المرفوض علاقة مقبولة على الأقل بهؤلاء الأطفال، ولم يكن الرفض الغاضب مستحقا».", "urls": ["https://doi.org/10.1111/j.174-1617.2001.tb00609.x", "https://bhekisisa.org/wp-content/uploads/2023/07/The-Alienated-Child-kelly-johnson.pdf"], "links": [{"url": "https://doi.org/10.1111/j.174-1617.2001.tb00609.x", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}, {"url": "https://bhekisisa.org/wp-content/uploads/2023/07/The-Alienated-Child-kelly-johnson.pdf", "label": "النص الكامل", "site": "نسخة منشورة من البحث", "domain": "bhekisisa.org"}], "strength": "explicit", "argument": "رفض الولد أباه بعد سنين من الانفراد به رفض مصنوع لا يعبر عن تجربته الحقيقية مع أبيه، فالتخيير بعد التغييب تخيير بين أم حاضرة وأب شوه في عين ولده.", "jurisdiction": "الولايات المتحدة — رابطة محاكم الأسرة والمصالحة", "title": "كيلي وجونستون 2001 — الطفل المنفر يرفض والدا لم يستحق الرفض", "source_standing": "جوان كيلي شريكة والرستين في أشهر دراسة متابعة طويلة لأبناء الطلاق، وجانيت جونستون أستاذة في جامعة سان خوسيه؛ وهذا البحث أكثر بحوث التنفير استشهادا في مجلة رابطة محاكم الأسرة والمصالحة.", "evidence_level": "مراجعة طبية مرجعية"}, {"section": "psy", "card_number": 84, "supports": ["shared_parenting"], "author": {"name": "Bernet W, Baker AJL", "date": "2013"}, "work": {"title": "Parental alienation, DSM-5, and ICD-11: response to critics", "section": "Journal of the American Academy of Psychiatry and the Law. 2013;41(1):98-104", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"our definition of PA is a mental condition in which a child, usually one whose parents are engaged in a high-conflict separation or divorce, allies himself strongly with one parent (the preferred parent) and rejects a relationship with the other parent (the alienated parent) without legitimate justification.\"", "verbatim": true}, "translation_ar": "«تعريفنا للتنفير الوالدي أنه حالة نفسية يتحالف فيها الطفل، وغالبا ما يكون والداه في انفصال أو طلاق شديد النزاع، تحالفا قويا مع أحد الوالدين (الوالد المفضل) ويرفض العلاقة بالوالد الآخر (الوالد المنفر عنه) بلا مسوغ مشروع».", "urls": ["https://jaapl.org/content/41/1/98"], "links": [{"url": "https://jaapl.org/content/41/1/98", "label": "النص الكامل", "site": "مجلة الأكاديمية الأمريكية للطب النفسي والقانون", "domain": "jaapl.org"}], "strength": "explicit", "argument": "الطب النفسي الشرعي يسمي رفض الولد أباه بلا مسوغ حالة نفسية لها تعريف وعلامات، فاختيار الولد بعد سنين من الانفراد به ليس إرادة حرة بل عرض مرضي.", "jurisdiction": "الولايات المتحدة — جامعة فاندربيلت", "title": "برنيت وبيكر 2013 — التنفير: تحالف الطفل مع والد ورفض الآخر بلا مسوغ", "source_standing": "ويليام برنيت أستاذ فخري للطب النفسي في جامعة فاندربيلت وقائد مقترحات إدراج التنفير في الدليل التشخيصي DSM-5 والتصنيف الدولي ICD-11؛ والمجلة لسان الأكاديمية الأمريكية للطب النفسي والقانون.", "evidence_level": "مرجع في الطب النفسي الشرعي"}, {"section": "psy", "card_number": 85, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Laumann-Billings L, Emery RE", "date": "2000"}, "work": {"title": "Distress among young adults from divorced families", "section": "Journal of Family Psychology. 2000;14(4):671-687", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Distress about family life was greater among students from divorced than from married families. ... In both studies, greater distress was associated with children's residence, frequency of contact with fathers, interparental conflict, and psychological symptoms.\"", "verbatim": true}, "translation_ar": "«كان الكرب بشأن الحياة الأسرية أشد عند الطلاب من أسر مطلقة منه عند الطلاب من أسر متزوجة... وفي الدراستين ارتبط الكرب الأشد بمحل إقامة الأطفال، وتواتر الاتصال بالآباء، والنزاع بين الوالدين، والأعراض النفسية».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/11132488/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/11132488/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "قلة لقاء الولد أباه في الطفولة ألم يحمله معه إلى الجامعة، فالضرر لا ينتهي بالبلوغ بل يرافق الإنسان.", "jurisdiction": "الولايات المتحدة — جامعة فرجينيا", "title": "لومان-بيلينغز وإيمري 2000 — قلة رؤية الأب ألم يبقى إلى الرشد", "source_standing": "روبرت إيمري أستاذ علم النفس ومدير مركز الأطفال والأسر والقانون في جامعة فرجينيا، من أبرز باحثي الطلاق في العالم؛ والمجلة تصدرها جمعية علم النفس الأمريكية.", "evidence_level": "دراسة ميدانية في عينتين"}, {"section": "psy", "card_number": 86, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Dunn J, Cheng H, O'Connor TG, Bridges L", "date": "2004"}, "work": {"title": "Children's perspectives on their relationships with their nonresident fathers: influences, outcomes and implications", "section": "Journal of Child Psychology and Psychiatry. 2004;45(3):553-566", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Of those children, 18 per cent had no contact with their father, and 16 per cent had contact less than once a month. ... Our findings were unequivocal: more frequent and more regular contact (which included communication by telephone) was associated with closer more intense relationships with non-resident fathers and fewer adjustment problems in children.\"", "verbatim": true}, "translation_ar": "«من هؤلاء الأطفال كان 18 بالمئة بلا اتصال بآبائهم، و16 بالمئة يتصلون بهم أقل من مرة في الشهر... وكانت نتائجنا قاطعة: الاتصال الأكثر تواترا وانتظاما (ومنه التواصل بالهاتف) ارتبط بعلاقات أوثق وأعمق بالآباء غير المقيمين ومشكلات توافق أقل عند الأطفال».", "urls": ["https://bristol.ac.uk/alspac/news/2004/85.html", "https://doi.org/10.1111/j.1469-7610.2004.00245.x"], "links": [{"url": "https://bristol.ac.uk/alspac/news/2004/85.html", "label": "البيان الرسمي للدراسة", "site": "جامعة بريستول — دراسة أفون", "domain": "bristol.ac.uk"}, {"url": "https://doi.org/10.1111/j.1469-7610.2004.00245.x", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "النتيجة قاطعة بلفظ الباحثين: كثرة لقاء الأب وانتظامه تقلل مشكلات الولد، فتقليل اللقاء إلى ساعات متباعدة يكثرها.", "jurisdiction": "المملكة المتحدة — كلية كينغز لندن وجامعة بريستول", "title": "دن 2004 — كلما تواتر لقاء الأب غير المقيم قلت مشكلات الولد", "source_standing": "جودي دن عضو الأكاديمية البريطانية وأستاذة علم نفس النمو في معهد الطب النفسي بكلية كينغز لندن؛ والبيانات من دراسة أفون الممتدة سنوات للآباء والأطفال، من أكبر متابعة المواليد في بريطانيا، والمجلة من أرفع مجلات الطب النفسي للأطفال.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 87, "supports": ["shared_parenting"], "author": {"name": "Warshak RA", "date": "2003"}, "work": {"title": "Payoffs and Pitfalls of Listening to Children", "section": "Family Relations. 2003;52(4):373-384", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"This article discusses why most procedures for soliciting children's preferences do not reliably elicit information on their best interests and do not give children a meaningful voice in decision making. Instead, these procedures provide children with forums in which to takes sides in their parents' disputes. ... decision makers can use the collective voice of children, as revealed in research on such topics as joint custody, overnight stays, and relocation to help understand what children might say about these issues with the hindsight of maturity and in the absence of parental pressure, loyalty conflicts, inhibitions, and limitations in perspective and articulation.\"", "verbatim": true}, "translation_ar": "«تناقش هذه المقالة لماذا لا تكشف أكثر إجراءات استطلاع رغبات الأطفال كشفا موثوقا عن مصلحتهم الفضلى، ولا تعطيهم صوتا ذا معنى في اتخاذ القرار؛ بل تجعل لهم منابر ينحازون فيها إلى طرف في نزاع والديهم... ويستطيع أصحاب القرار الاستعانة بالصوت الجمعي للأطفال، كما تكشفه البحوث في الحضانة المشتركة والمبيت والانتقال، ليفهموا ما كان الأطفال سيقولونه في هذه المسائل بنظرة النضج اللاحقة، وفي غياب ضغط الوالدين وصراع الولاء والكبت وقصور الإدراك والتعبير».", "urls": ["https://doi.org/10.1111/j.1741-3729.2003.00373.x"], "links": [{"url": "https://doi.org/10.1111/j.1741-3729.2003.00373.x", "label": "ملخص الدراسة", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "التخيير بعد سنين من انفراد الأم لا يكشف مصلحة الطفل بل يحمله على الانحياز لمن ألفه؛ والعلم يقول: اسألوا بحوث الحضانة المشتركة لا طفلا مضغوطا، فلا تخيير مع تغييب.", "jurisdiction": "الولايات المتحدة — المركز الطبي لجامعة تكساس الجنوبية الغربية", "title": "وارشاك 2003 — سؤال الطفل عن رغبته لا يكشف مصلحته بل يجعله طرفا في نزاع والديه", "source_standing": "ريتشارد وارشاك أستاذ علم النفس العلاجي في المركز الطبي لجامعة تكساس الجنوبية الغربية، وصاحب تقرير إجماع 110 خبراء سنة 2014؛ ومجلة العلاقات الأسرية لسان المجلس الوطني لعلاقات الأسرة.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "psy", "card_number": 88, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Pancsofar N, Vernon-Feagans L; The Family Life Project Investigators", "date": "2010"}, "work": {"title": "Fathers' Early Contributions to Children's Language Development in Families from Low-income Rural Communities", "section": "Early Childhood Research Quarterly. 2010;25(4):450-463", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"After controlling for family demographics, child characteristics, as well as mother education and vocabulary, father education and father vocabulary during the picture-book task were related to more advanced language development at both 15 and 36 months of age. Only mother education, but not vocabulary during book-reading was related to children's later language. These findings support the growing evidence on the importance of fathers in understanding children's early communication and language development.\"", "verbatim": true}, "translation_ar": "«بعد مراعاة خصائص الأسرة والطفل، وتعليم الأم ومفرداتها، ارتبط تعليم الأب ومفرداته أثناء قراءة كتاب مصور مع الرضيع بنمو لغوي أكثر تقدما عند 15 شهرا و36 شهرا. ولم يرتبط بلغة الطفل اللاحقة من جهة الأم إلا تعليمها، لا مفرداتها أثناء القراءة. وتدعم هذه النتائج الأدلة المتزايدة على أهمية الآباء في فهم نمو التواصل واللغة المبكر عند الأطفال».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/21057648/", "https://doi.org/10.1016/j.ecresq.2010.02.001"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/21057648/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.ecresq.2010.02.001", "label": "صفحة الدراسة", "site": "مجلة بحوث الطفولة", "domain": "doi.org"}], "strength": "explicit", "argument": "لغة الطفل تبنى بكلمات أبيه من الشهر السادس، بأثر لا تؤديه كلمات الأم عنه؛ فمن حبس الرضيع عن أبيه حبس عنه نصف لغته.", "jurisdiction": "الولايات المتحدة — جامعة نورث كارولاينا وكلية نيوجيرسي", "title": "بانكسوفار 2010 — كلام الأب لرضيعه في الشهر السادس ينبئ بلغة الطفل في الثالثة، مستقلا عن الأم", "source_standing": "من مشروع حياة الأسرة بجامعة نورث كارولاينا، وهو دراسة متابعة كبيرة لأسر ريفية؛ والمجلة من أرفع مجلات بحوث الطفولة، والنص متاح في المكتبة الوطنية للطب.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 89, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Chacko A, Fabiano GA, Doctoroff GL, Fortson B", "date": "2018"}, "work": {"title": "Engaging Fathers in Effective Parenting for Preschool Children Using Shared Book Reading: A Randomized Controlled Trial", "section": "Journal of Clinical Child and Adolescent Psychology. 2018;47(1):79-93", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"One hundred twenty-six low-income, Spanish-speaking fathers and their children were recruited across three Head Start centers in urban communities and were randomized to the intervention or to a waitlist control condition. ... Parenting behaviors (observed and father-reported), child behaviors (father-reported), and language development of the children in the intervention group improved significantly relative to those in the waitlist control condition. ... Fathers can be engaged in parenting interventions, resulting in improved parent and child outcomes.\"", "verbatim": true}, "translation_ar": "«جند 126 أبا من ذوي الدخل المنخفض الناطقين بالإسبانية مع أطفالهم من ثلاثة مراكز هيد ستارت في أحياء حضرية، ووزعوا عشوائيا بين برنامج التدريب ومجموعة انتظار... فتحسنت سلوكيات التربية (بالملاحظة وبإبلاغ الآباء)، وسلوكيات الأطفال، ونمو الأطفال اللغوي في مجموعة البرنامج تحسنا واضحا مقارنة بمجموعة الانتظار... فالآباء يمكن إشراكهم في برامج التربية، بما يحسن نتائج الآباء والأطفال معا».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/28103110/", "https://doi.org/10.1080/15374416.2016.1266648"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/28103110/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1080/15374416.2016.1266648", "label": "صفحة الدراسة", "site": "مجلة علم نفس الأطفال والمراهقين العلاجي", "domain": "doi.org"}], "strength": "explicit", "argument": "أقوى منهج في العلم، التجربة العشوائية، يقطع بأن أثر الأب سبب لا مصادفة: قراءة الأب مع طفله حسنت لغته وسلوكه؛ فالأب مرب لا ممول.", "jurisdiction": "الولايات المتحدة — جامعة نيويورك وجامعة بافالو", "title": "تشاكو 2018 — تجربة مضبوطة: تدريب الآباء على القراءة مع أطفالهم يحسن لغة الأطفال وسلوكهم", "source_standing": "تجربة عشوائية مضبوطة لباحثين من جامعة نيويورك وجامعة بافالو ومراكز مكافحة الأمراض الأمريكية؛ والمجلة لسان جمعية علم نفس الأطفال والمراهقين العلاجي بالجمعية الأمريكية لعلم النفس.", "evidence_level": "تجربة عشوائية مضبوطة"}, {"section": "psy", "card_number": 90, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Coley RL, Medeiros BL", "date": "2007"}, "work": {"title": "Reciprocal longitudinal relations between nonresident father involvement and adolescent delinquency", "section": "Child Development. 2007;78(1):132-147", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Autoregressive and fixed effects models found that higher nonresident father involvement predicted subsequent decreases in adolescent delinquency, particularly for youth with initial engagement in delinquent activities. Adolescent delinquency did not predict subsequent changes in father involvement.\"", "verbatim": true}, "translation_ar": "«وجدت نماذج التحليل أن ارتفاع انخراط الأب غير المقيم ينبئ بانخفاض لاحق في جنوح المراهقين، ولا سيما عند من بدؤوا بسلوك جانح. ولم ينبئ جنوح المراهقين بتغير لاحق في انخراط الأب».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/17328697/", "https://doi.org/10.1111/j.1467-8624.2007.00989.x"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/17328697/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1111/j.1467-8624.2007.00989.x", "label": "صفحة الدراسة", "site": "مجلة نمو الطفل", "domain": "doi.org"}], "strength": "explicit", "argument": "حين يزداد انخراط الأب، وإن لم يسكن مع ولده، يقل الجنوح بعده؛ والاتجاه من الأب إلى الولد لا العكس. فتوسيع صلة الأب وقاية من الانحراف لا مجاملة له.", "jurisdiction": "الولايات المتحدة — كلية بوسطن", "title": "كولي وميديروس 2007 — انخراط الأب غير المقيم يخفض جنوح المراهقين: متابعة 647 مراهقا في مجلة نمو الطفل", "source_standing": "ريبيكا كولي أستاذة علم النفس التطبيقي في كلية بوسطن، على عينة ممثلة من 647 مراهقا بين 10 و14 سنة؛ ومجلة نمو الطفل لسان جمعية بحوث نمو الطفل، أرفع مجلات التخصص.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "psy", "card_number": 91, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Menning CL", "date": "2006"}, "work": {"title": "Nonresident fathers' involvement and adolescents' smoking", "section": "Journal of Health and Social Behavior. 2006;47(1):32-46", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Results indicate that adolescents who are more involved with their fathers are less likely to begin smoking regularly, that changes in involvement over time predict changes in the probability that adolescents will begin to smoke regularly, and that fathers' smoking also affects this outcome.\"", "verbatim": true}, "translation_ar": "«تدل النتائج على أن المراهقين الأكثر انخراطا مع آبائهم [غير المقيمين] أقل احتمالا لأن يبدؤوا التدخين بانتظام، وأن تغير الانخراط عبر الزمن ينبئ بتغير احتمال بدء التدخين المنتظم، وأن تدخين الآباء يؤثر أيضا في هذه النتيجة».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/16583774/", "https://doi.org/10.1177/002214650604700103"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/16583774/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1177/002214650604700103", "label": "صفحة الدراسة", "site": "مجلة الصحة والسلوك الاجتماعي", "domain": "doi.org"}], "strength": "explicit", "argument": "كلما قويت صلة المراهق بأبيه قل تدخينه، وكلما ضعفت زاد؛ فالصلة بالأب دواء يقاس أثره بالجرعة، وساعات الرؤية جرعة لا تبلغ شيئا.", "jurisdiction": "الولايات المتحدة — جامعة بول ستيت", "title": "مينينغ 2006 — المراهق الأكثر صلة بأبيه غير المقيم أقل إقبالا على التدخين: المسح الوطني لصحة المراهقين", "source_standing": "على بيانات المسح الوطني الأمريكي لصحة المراهقين، أكبر دراسات متابعة المراهقين في العالم؛ والمجلة لسان الجمعية الأمريكية لعلم الاجتماع.", "evidence_level": "دراسة متابعة وطنية"}, {"section": "psy", "card_number": 92, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Warshak RA", "date": "2015"}, "work": {"title": "Ten Parental Alienation Fallacies That Compromise Decisions in Court and in Therapy", "section": "Professional Psychology: Research and Practice. 2015;46(4):235-249", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"(a) children never unreasonably reject the parent with whom they spend the most time, (b) children never unreasonably reject mothers, ... (f) young children living with an alienating parent need no intervention, (g) alienated adolescents' stated preferences should dominate custody decisions, ... (j) separating children from an alienating parent is traumatic.\"", "verbatim": true}, "translation_ar": "[من المغالطات العشر التي يعدها البحث أخطاء تفسد أحكام المحاكم والعلاج:] «(أ) أن الأطفال لا يرفضون بغير حق الوالد الذي يقضون معه أكثر الوقت، (ب) أن الأطفال لا يرفضون الأمهات بغير حق... (و) أن الأطفال الصغار الذين يعيشون مع والد يقوم بالتنفير لا يحتاجون إلى تدخل، (ز) أن الرغبات المعلنة للمراهقين الذين وقع عليهم التنفير ينبغي أن تهيمن على قرارات الحضانة... (ي) أن فصل الأطفال عن الوالد الذي يقوم بالتنفير صادم لهم».", "urls": ["https://doi.org/10.1037/pro0000031", "https://www.warshak.com/e-libe/?p=1165"], "links": [{"url": "https://doi.org/10.1037/pro0000031", "label": "صفحة الدراسة", "site": "الجمعية الأمريكية لعلم النفس", "domain": "doi.org"}, {"url": "https://www.warshak.com/e-libe/?p=1165", "label": "نص المغالطات العشر", "site": "المكتبة العلمية للمؤلف", "domain": "www.warshak.com"}], "strength": "explicit", "argument": "العلم يسمي «تخيير المراهق الذي وقع عليه التنفير» مغالطة تفسد الأحكام، ويقرر أن الطفل قد يرفض بغير حق من يقضي معه أكثر الوقت ويرفض الأم كما يرفض الأب؛ فالتخيير بعد التغييب حكم لمن قام بالتنفير لا للطفل.", "jurisdiction": "الولايات المتحدة — المركز الطبي لجامعة تكساس الجنوبية الغربية", "title": "وارشاك 2015 في مجلة الجمعية الأمريكية لعلم النفس — من المغالطات أن «رغبة المراهق المنفر هي التي تحسم الحضانة»", "source_standing": "ريتشارد وارشاك أستاذ علم النفس العلاجي في المركز الطبي لجامعة تكساس الجنوبية الغربية وصاحب تقرير إجماع 110 خبراء؛ والمجلة تصدرها الجمعية الأمريكية لعلم النفس، والقائمة منشورة بنصها في مكتبته العلمية.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "soc", "card_number": 93, "supports": ["7", "9"], "author": {"name": "Bogin B", "date": "1997"}, "work": {"title": "Evolutionary hypotheses for human childhood", "section": "Yearbook of Physical Anthropology 40:63–89", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: الطفولة عند الإنسان طور بين الرضاعة واليفوع، يعتمد فيه الصغير على الكبار في طعامه وحمايته، وينتهي بدخول طور اليفوع في نحو السابعة.", "verbatim": false}, "translation_ar": "", "urls": ["https://deepblue.lib.umich.edu/items/589f9ed8-a5a1-438d-b3d6-8ac5a735472b"], "links": null, "strength": "explicit_7", "argument": "يجعل علم الأحياء البشري نحو السابعة نهاية طور الاعتماد التام على من يطعم ويحمي، وهو معنى قريب مما سماه الفقهاء الاستغناء.", "jurisdiction": "الولايات المتحدة — جامعة ميشيغان", "title": "بوغن 1997 — الطفولة تنتهي نحو السابعة", "source_standing": "باري بوغن عالم إنسان في جامعة لفبرة البريطانية، من أبرز الباحثين في تطور النمو البشري وأطوار حياة الإنسان؛ والكتاب السنوي لعلم الإنسان الطبيعي تصدره الجمعية الأمريكية لعلم الإنسان الطبيعي.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "soc", "card_number": 94, "supports": ["9"], "author": {"name": "Bogin B, Smith BH", "date": "1996"}, "work": {"title": "Evolution of the human life cycle", "section": "American Journal of Human Biology 8(6):703–716", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: دورة حياة الإنسان خمسة أطوار: الرضاعة والطفولة واليفوع والمراهقة والرشد؛ وطور اليفوع ينتهي عند الإناث في نحو العاشرة، قبل الذكور بسنتين.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1002/(SICI)1520-6300(1996)8:6%3C703::AID-AJHB2%3E3.0.CO;2-U"], "links": null, "strength": "explicit_9", "argument": "يقرر علم الأحياء البشري أن الذكر والأنثى يخرجان من الطفولة معا نحو السابعة، ثم تسبق الأنثى الذكر إلى البلوغ بنحو سنتين. فالجارية في السابعة ليست أقل نضجا من الغلام، بل هي أقرب منه إلى البلوغ وأحوج إلى الصيانة؛ وهذا عين ما ذهب إليه الحنابلة من أن الجارية إذا بلغت سبعا كانت عند أبيها لحاجتها إلى الحفظ، وهو من دقة نظرهم وسبقهم إلى ما انتهى إليه العلم. وأقصى هذا الطور عند الأنثى نحو العاشرة، فتقدير الحنفية بالتسع واقع فيه، والخامسة عشرة خارجة عنه بخمس سنين.", "jurisdiction": "الولايات المتحدة", "title": "بوغن وسميث 1996 — الأنثى تسبق الذكر بسنتين", "source_standing": "باري بوغن، ومعه هولي سميث من جامعة ميشيغان، من أعلام علم تطور النمو البشري؛ والمجلة الأمريكية لعلم الأحياء البشري لسان جمعية علم الأحياء البشري.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "soc", "card_number": 95, "supports": ["shared_parenting"], "author": {"name": "جمعية خدمات الأسرة والرفاه في هونغ كونغ", "date": ""}, "work": {"title": "Impact of Co-parenting Approaches on Children's Well-being in Post-divorce Families in Hong Kong", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: دراسة ميدانية على أسر مطلقة في هونغ كونغ تعرف تعاون الوالدين بعد الطلاق بأنها عمل الوالدين معا في وظيفة الأبوة مع استمرار انخراطهما، وتنتهي إلى ضرورة الإيمان بحق الطفل في صلة بكلا والديه ودعم الوالدين على التعاون.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.hkfws.org.hk/assets/files/reserch_reports/study-report_impact-of-co-parenting-approaches-on-childrens-well-being-in-post-divorce-families-in-hk.pdf"], "links": null, "strength": "explicit", "argument": "من شرق آسيا أيضا: هيئات الرعاية الأسرية تقرر حق الطفل في والديه معا بعد الطلاق، فالمسألة مسألة فطرة إنسانية لا ثقافة بلد بعينه.", "jurisdiction": "الصين — هونغ كونغ", "title": "هونغ كونغ — حق الطفل في والديه بعد الطلاق", "source_standing": "جمعية خدمات الأسرة والرفاه في هونغ كونغ من أقدم هيئات الخدمة الاجتماعية الأسرية هناك، تأسست سنة 1949.", "evidence_level": "دراسة ميدانية لهيئة اجتماعية"}, {"section": "soc", "card_number": 96, "supports": ["shared_parenting"], "author": {"name": "Ali S, Khaleque A, Rohner RP", "date": "2015"}, "work": {"title": "Pancultural Gender Differences in the Relation Between Perceived Parental Acceptance and Psychological Adjustment of Children and Adult Offspring: A Meta-Analytic Review of Worldwide Research", "section": "Journal of Cross-Cultural Psychology. 2015;46(8):1059–1080", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: جمع التحليل 220 دراسة شملت 33081 مشاركا من 23 دولة في 5 قارات. ارتبط تقبل الأب وتقبل الأم كما يدركهما الأبناء بالتوافق النفسي لدى الأطفال والبالغين في الثقافات المدروسة. ولم تظهر فروق بين الجنسين في ارتباط إدراك القبول الوالدي بالتوافق لدى الأطفال؛ أما نتائج تذكر القبول في البلوغ فاشتملت على فروق بحسب جنس الابن والوالد.", "verbatim": false}, "translation_ar": "", "urls": ["https://journals.sagepub.com/doi/10.1177/0022022115597754"], "links": null, "strength": "explicit", "argument": "في 220 دراسة من 23 دولة في خمس قارات ارتبط قبول الأب كقبول الأم بصحة الولد النفسية؛ فحاجة الطفل إلى أبيه فطرة إنسانية عامة.", "jurisdiction": "الولايات المتحدة — جامعة كونيتيكت؛ عينات من 23 دولة", "title": "تقبل الأب والتوافق النفسي في 23 دولة", "source_standing": "رونالد رونر مؤسس نظرية القبول والرفض بين الأشخاص، ومعه عبد الخالق من جامعة كونيتيكت؛ ومجلة علم النفس عبر الثقافات لسان الرابطة الدولية لعلم النفس عبر الثقافات.", "evidence_level": "تحليل جامع لعدة دراسات: أعلى درجات الدليل"}, {"section": "soc", "card_number": 97, "supports": ["shared_parenting"], "author": {"name": "Putnick DL, Bornstein MH, Lansford JE, Malone PS, Pasto
