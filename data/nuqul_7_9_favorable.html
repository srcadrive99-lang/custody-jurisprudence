<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حول سن الحضانة والرعاية المشتركة بالمناصفة — النصوص والمصادر</title>
<style>
:root{
  --bg:#FBF8F2; --paper:#FFFFFF; --ink:#1E2A2F; --soft:#4B5A60; --muted:#7D8A8F; --rule:#E3DCCD;
  --green:#2E5D4F; --green-soft:#E3EFE9; --gold:#A8782C; --gold-soft:#FBF1DD; --wine:#8B2635; --wine-soft:#F7E6E8;
  --blue:#1B4D6B; --blue-soft:#E4EEF4; --violet:#5B4B7A; --violet-soft:#ECE8F3;
  --body:'Calibri','Carlito','Segoe UI','IBM Plex Sans Arabic',sans-serif;
  --mono:'Cascadia Code','JetBrains Mono','IBM Plex Mono','Fira Code',Consolas,monospace;
  --classic:'Amiri','Traditional Arabic','Calibri','Carlito',serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:2;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{max-width:1180px;margin:0 auto;padding:36px 24px 10px;text-align:center}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--gold);direction:ltr}
h1{font-size:34px;line-height:1.5;margin:8px 0 6px;color:var(--ink)}
h1 em{font-style:normal;color:var(--wine)}
.sub{color:var(--soft);font-size:18px;margin:0 auto;max-width:820px}
.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 6px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:6px 16px;font-size:15px;color:var(--soft)}
.stat b{font-family:var(--mono);font-size:20px;color:var(--ink);margin-left:6px}
.bar{position:sticky;top:0;z-index:5;background:rgba(251,248,242,.97);border-bottom:1px solid var(--rule);
  padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp+.grp{border-right:1px solid var(--rule);padding-right:10px}
.chip{font-family:var(--body);font-size:15px;line-height:1.6;border:1px solid var(--rule);background:var(--paper);color:var(--soft);
  border-radius:999px;padding:3px 13px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip[data-sup].on{background:var(--wine);border-color:var(--wine)}
.chip[data-ver].on{background:var(--gold);border-color:var(--gold)}
input[type=search]{flex:1 1 220px;min-width:180px;font-family:var(--body);font-size:16px;border:1px solid var(--rule);border-radius:10px;
  padding:6px 12px;background:var(--paper);color:var(--ink)}
.count{font-size:14px;color:var(--muted)} .count b{font-family:var(--mono);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:18px 24px 60px}
h2.ax{font-size:24px;margin:34px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold);color:var(--ink)}
h2.ax span{font-family:var(--mono);font-size:14px;color:var(--gold);margin-left:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-right:5px solid var(--green);border-radius:10px;
  padding:16px 20px 14px;margin:14px 0;box-shadow:0 1px 2px rgba(30,42,47,.04),0 4px 14px rgba(30,42,47,.04)}
.card.ver{border-right-color:var(--gold)}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.id{font-family:var(--mono);font-size:13px;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:0 8px;direction:ltr}
.who{font-weight:700;font-size:20px} .date{color:var(--muted);font-size:15px}
.src{color:var(--soft);font-size:15px;line-height:1.8;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.tag{font-size:13px;line-height:1.7;border-radius:6px;padding:0 9px;background:var(--green-soft);color:var(--green)}
.tag.s{background:var(--wine-soft);color:var(--wine)} .tag.c{background:var(--violet-soft);color:var(--violet)}
.tag.v{background:var(--gold-soft);color:#7A5512;font-weight:700} .tag.r{background:#F3F1EC;color:var(--muted)}
blockquote{margin:8px 0;padding:10px 16px;background:#FAF7F0;border-radius:8px;font-family:var(--classic);font-size:20px;line-height:1.95;color:var(--ink)}
blockquote.ltr{direction:ltr;text-align:left;font-family:var(--body);font-size:17px;font-style:italic;color:var(--soft)}
.tr{background:var(--green-soft);border-radius:8px;padding:8px 14px;font-size:18px;margin:6px 0}
.tr b,.arg b{color:var(--green)}
.arg{font-size:17px;color:var(--soft);margin:6px 0 0} .note{font-size:15px;color:var(--muted)}
.links{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.links a{font-family:var(--mono);font-size:12.5px;color:var(--blue);direction:ltr;text-align:left;word-break:break-all;text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:40px}
footer{text-align:center;padding:26px 16px 40px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px}
.stamp{font-family:var(--mono);letter-spacing:2px;color:var(--wine);font-size:13px;direction:ltr}
@media (max-width:640px){body{font-size:18px} h1{font-size:26px} .grp+.grp{border-right:0;padding-right:0} main{padding:12px 14px 50px}}
@media print{.bar,.wm{display:none} .card{break-inside:avoid;box-shadow:none} body{background:#fff}}

.sec-blurb{color:var(--soft);font-size:16px;margin:-4px 0 10px}
.about{font-size:15px;color:var(--soft);background:#F7F4EC;border-radius:8px;padding:6px 12px;margin:6px 0} .about b{color:var(--gold)}
.ttl{font-weight:700;font-size:20px;color:var(--wine)}
.num{font-family:var(--mono);font-size:13px;color:var(--muted);direction:ltr;text-decoration:none}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0} .sel select{font:inherit;font-size:15px;padding:4px 8px;border:1px solid #D9D2C3;border-radius:8px;background:#fff;max-width:260px}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap} .acts button,.tools button{font:inherit;font-size:14px;padding:4px 12px;border-radius:8px;border:1px solid #CFC6B3;background:#FBF8F1;cursor:pointer}
.acts label{font-size:14px;color:var(--soft)} .tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.card:target{outline:3px solid #C40000;outline-offset:3px}
@media print{header.top,nav.bar,footer,.acts,.tools{display:none!important} body.selonly article.card:not(.picked){display:none} body.selonly h2.ax{display:none} article.card{break-inside:avoid}}
</style>
</head>

bi.nlm.nih.gov/9093289/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit_9", "argument": "بداية البلوغ عند الفتيات في هذه الدراسة الواسعة تقع في متوسط قريب من التاسعة، فالتاسعة ليست حدا نظريا بل واقع جسدي يتعلق به الإدراك والحاجة إلى الصيانة.", "jurisdiction": "الولايات المتحدة", "title": "دراسة أمريكية 1997 — بدء البلوغ عند الفتيات", "source_standing": "مارشيا هيرمان غيدنز من جامعة نورث كارولاينا، ودراستها على أكثر من سبعة عشر ألف فتاة في عيادات شبكة الأكاديمية الأمريكية لطب الأطفال غيرت فهم الأطباء لسن البلوغ. ومجلة طب الأطفال لسان الأكاديمية، من أرفع مجلات التخصص في العالم.", "evidence_level": "دراسة طبية واسعة متعددة المراكز"}, {"section": "med", "card_number": 6, "supports": ["9"], "author": {"name": "Biro FM, et al.", "date": "2013"}, "work": {"title": "Onset of breast development in a longitudinal cohort", "section": "Pediatrics 132(6):1019–1027", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Median age at onset of breast stage 2 was 8.8, 9.3, 9.7, and 9.7 years for African American, Hispanic, white non-Hispanic, and Asian participants, respectively. Girls with greater BMI reached breast stage 2 at younger ages.", "verbatim": true}, "translation_ar": "«كان الوسيط [القيمة الوسطى] لسن بدء المرحلة الثانية من نمو الثدي 8.8 و9.3 و9.7 و9.7 سنة عند المشاركات الأمريكيات من أصل إفريقي، ومن أصل إسباني، والبيض غير الإسبانيات، والآسيويات على الترتيب. وبلغت الفتيات ذوات مؤشر كتلة الجسم الأعلى المرحلة الثانية من نمو الثدي في سن أصغر.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/24190685/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/24190685/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit_9", "argument": "متوسط بدء البلوغ عند الفتيات بين الثامنة والنصف والتاسعة والنصف، وهذا يصدق تقدير الحنفية التاسعة حدا لحضانة الجارية.", "jurisdiction": "الولايات المتحدة", "title": "دراسة أمريكية 2013 — بدء البلوغ عند الفتيات", "source_standing": "فرانك بيرو أستاذ طب المراهقين في مستشفى سينسيناتي للأطفال، والدراسة جزء من برنامج اتحادي أمريكي لبحوث البيئة والبلوغ. ومجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال، من أرفع مجلات التخصص في العالم.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "med", "card_number": 7, "supports": ["9"], "author": {"name": "Aksglaede L, et al. (Copenhagen Puberty Study)", "date": "2009"}, "work": {"title": "Recent decline in age at breast development", "section": "Pediatrics 123(5):e932–e939", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Onset of puberty, defined as mean estimated age at attainment of glandular breast tissue (Tanner breast stage 2+), occurred significantly earlier in the 2006 cohort (estimated mean age: 9.86 years) when compared with the 1991 cohort (estimated mean age: 10.88 years). The difference remained significant after adjustment for BMI.", "verbatim": true}, "translation_ar": "«بدء البلوغ، المعرف بمتوسط السن المقدر لظهور نسيج الثدي الغدي (المرحلة الثانية فأعلى من مراحل تانر للثدي)، حدث أبكر بفارق واضح في مجموعة 2006 (متوسط السن المقدر: 9.86 سنة) مقارنة بمجموعة 1991 (متوسط السن المقدر: 10.88 سنة). وبقي الفارق قائما بعد مراعاة مؤشر كتلة الجسم.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/19403485/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/19403485/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit_9", "argument": "نزل متوسط بدء البلوغ عند الفتيات في أوروبا إلى نحو العاشرة وما دونها، فاقترب الواقع من التاسعة التي قدرها الفقهاء.", "jurisdiction": "الدنمارك", "title": "دراسة كوبنهاغن — تبكير البلوغ", "source_standing": "دراسة كوبنهاغن للبلوغ من قسم النمو والتكاثر في مستشفى ريغسهوسبيتالت الجامعي، ومن مؤلفيها أندرس يول من أعلام غدد الأطفال في أوروبا. ومجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال.", "evidence_level": "دراسة مقارنة بين جيلين"}, {"section": "med", "card_number": 8, "supports": ["9"], "author": {"name": "Eckert-Lind C, et al.", "date": "2020"}, "work": {"title": "Worldwide secular trends in age at pubertal onset assessed by breast development among girls", "section": "JAMA Pediatrics 174(4):e195881", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Overall, the age at thelarche decreased 0.24 years (95% CI, −0.44 to −0.04) (almost 3 months) per decade from 1977 to 2013 (P = .02). […] The age at thelarche has decreased a mean of almost 3 months per decade from 1977 to 2013.", "verbatim": true}, "translation_ar": "«إجمالا، انخفض سن بدء نمو الثدي بمقدار 0.24 سنة (فاصل الثقة 95%: من −0.44 إلى −0.04) (أي نحو 3 أشهر) في كل عقد من 1977 إلى 2013. [...] انخفض سن بدء نمو الثدي بمتوسط نحو 3 أشهر في كل عقد من 1977 إلى 2013.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/32040143/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/32040143/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit_9", "argument": "يدل التحليل العالمي على أن البلوغ يتبكر جيلا بعد جيل، فإبقاء الجارية في حضانة النساء إلى الخامسة عشرة يزداد بعدا عن واقعها عاما بعد عام.", "jurisdiction": "عالمي (تحليل جامع لعدة دراسات)", "title": "تحليل عالمي 2020 — تبكير البلوغ", "source_standing": "تحليل جامع لعدة دراسات لفريق مستشفى ريغسهوسبيتالت الجامعي في كوبنهاغن، جمع دراسات من قارات العالم. ومجلة جاما لطب الأطفال تصدرها الجمعية الطبية الأمريكية، وهي من أعلى مجلات التخصص أثرا.", "evidence_level": "تحليل جامع لعدة دراسات ومراجعة منهجية: أعلى درجات الدليل"}, {"section": "med", "card_number": 9, "supports": ["9"], "author": {"name": "Kliegman R, et al.", "date": "2024"}, "work": {"title": "Nelson Textbook of Pediatrics, 22nd ed.", "section": "Precocious Puberty", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: يعد البلوغ مبكرا إذا ظهرت علاماته قبل 8 سنوات في الإناث وقبل 9 في الذكور.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.us.elsevierhealth.com/nelson-textbook-of-pediatrics-2-volume-set-9780323883054.html"], "links": [{"url": "https://www.us.elsevierhealth.com/nelson-textbook-of-pediatrics-2-volume-set-9780323883054.html", "label": "صفحة الكتاب", "site": "دار إلزفير", "domain": "www.us.elsevierhealth.com"}], "strength": "explicit_9", "argument": "لا يعد البلوغ مبكرا عند الفتيات إلا قبل الثامنة، فبلوغ الجارية في التاسعة بلوغ في وقته الطبيعي، وهو ما بنى عليه الحنفية حد التسع.", "jurisdiction": "الولايات المتحدة", "title": "المرجع الأول في طب الأطفال — حد البلوغ المبكر", "source_standing": "كتاب نلسون في طب الأطفال المرجع الجامعي الأول في التخصص، يصدر عن دار إلزفير في طبعات متتابعة منذ منتصف القرن العشرين، ويدرس في كليات الطب عبر العالم.", "evidence_level": "مرجع جامعي معتمد"}, {"section": "med", "card_number": 10, "supports": ["9"], "author": {"name": "Euling SY, et al.", "date": "2008"}, "work": {"title": "Examination of US puberty-timing data from 1940 to 1994 for secular trends: panel findings", "section": "Pediatrics 121(Suppl 3):S172–S191", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "A majority of the panelists agreed that data are sufficient to suggest a trend toward an earlier breast development onset and menarche in girls but not for other female pubertal markers.", "verbatim": true}, "translation_ar": "«اتفق أكثر أعضاء اللجنة على أن البيانات كافية لترجيح اتجاه نحو تبكير بدء نمو الثدي وسن الحيض الأول عند الفتيات، لا في غيرهما من علامات البلوغ عند الإناث.»", "urls": ["https://pubmed.ncbi.nlm.nih.gov/18245511/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/18245511/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit_9", "argument": "حكم لجنة خبراء مستقلة بأن البلوغ عند الفتيات يتبكر، فتقدير التاسعة حدا لحضانة الجارية أقرب إلى واقعها من الخامسة عشرة.", "jurisdiction": "الولايات المتحدة", "title": "لجنة خبراء أمريكية 2008 — تبكير البلوغ عند الفتيات", "source_standing": "لجنة خبراء في الغدد وطب الأطفال وعلم الأوبئة دعت إليها جهات أمريكية حكومية لمراجعة بيانات البلوغ من 1940 إلى 1994. ونشرت خلاصتها مجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال.", "evidence_level": "تقرير لجنة خبراء"}, {"section": "med", "card_number": 11, "supports": ["childhood_ends_at_puberty", "9"], "author": {"name": "منظمة الصحة العالمية", "date": ""}, "work": {"title": "صفحة صحة المراهقين الرسمية", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Adolescence is the phase of life between childhood and adulthood, from ages 10 to 19.\"", "verbatim": true}, "translation_ar": "«المراهقة هي طور الحياة الواقع بين الطفولة والرشد، من سن 10 إلى 19».", "urls": ["https://www.who.int/health-topics/adolescent-health"], "links": null, "strength": "explicit", "argument": "تجعل منظمة الصحة العالمية المراهقة تبدأ من العاشرة، فالخامسة عشرة عندها في قلب المراهقة لا في الطفولة؛ وهذا وحده ينقض جعل الخامسة عشرة حدا للطفولة.", "jurisdiction": "منظمة الصحة العالمية", "title": "منظمة الصحة العالمية — الطفولة تنتهي عند العاشرة", "source_standing": "منظمة الصحة العالمية الوكالة المتخصصة في الصحة العامة التابعة للأمم المتحدة، تأسست سنة 1948، ومقرها جنيف، وتعريفاتها العمرية معتمدة في وزارات الصحة عبر العالم.", "evidence_level": "تعريف رسمي لهيئة أممية"}, {"section": "med", "card_number": 12, "supports": ["7", "9", "childhood_ends_at_puberty"], "author": {"name": "Herman-Giddens ME, Steffes J, Harris D, Slora E, Hussey M, Dowshen SA, Wasserman R, Serwint JR, Smitherman L, Reiter EO", "date": "2012"}, "work": {"title": "Secondary sexual characteristics in boys: data from the Pediatric Research in Office Settings Network", "section": "Pediatrics. 2012;130(5):e1058–e1068", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: فحص 212 ممارسا 4131 فتى في 144 عيادة أمريكية. تراوحت متوسطات بدء المرحلة الثانية لنمو الأعضاء التناسلية بين 9.14 و10.14 سنوات حسب المجموعة السكانية، وبلوغ حجم خصية 4 مل فأكثر بين 11.29 و11.75 سنة. ظهرت العلامات المدروسة أبكر من دراسات سابقة بنحو 6 أشهر إلى سنتين، بحسب العلامة والمجموعة.", "verbatim": false}, "translation_ar": "", "urls": ["https://pure.johnshopkins.edu/en/publications/secondary-sexual-characteristics-in-boys-data-from-the-pediatric--5/"], "links": null, "strength": "explicit", "argument": "بدء النمو التناسلي عند الفتيان الأمريكيين بين التاسعة والعاشرة في المتوسط، وأبكر مما كان قبل عقود؛ فالخامسة عشرة بعيدة عن حد الطفولة.", "jurisdiction": "الولايات المتحدة — شبكة أبحاث عيادات طب الأطفال", "title": "ظهور علامات النضج الجنسي لدى الأولاد", "source_standing": "مارشيا هيرمان غيدنز وفريقها في شبكة أبحاث العيادات التابعة للأكاديمية الأمريكية لطب الأطفال، على آلاف الفتيان من ولايات عدة. ونشرتها مجلة طب الأطفال لسان الأكاديمية.", "evidence_level": "دراسة طبية واسعة متعددة المراكز"}, {"section": "med", "card_number": 13, "supports": ["7"], "author": {"name": "Msall ME; DiGaudio K; Duffy LC; LaForest S; Braun S; Granger CV", "date": "1994"}, "work": {"title": "WeeFIM: Normative Sample of an Instrument for Tracking Functional Independence in Children", "section": "Clinical Pediatrics، العدد 7؛ الملخص المنشور رسميا", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: استخدمت دراسة مسحية شملت 417 طفلا، من عمر 6 أشهر إلى 8 سنوات، مقياس الاستقلال الوظيفي للأطفال لتقييم العناية بالنفس، وضبط الإخراج، والانتقال والحركة، والتواصل، والإدراك الاجتماعي. ووجد الباحثون زيادة تدريجية في الاستقلال مع تقدم العمر في جميع مجالات المقياس. وكان متوسط الدرجة الكلية متشابها لدى الذكور والإناث. وخلصوا إلى فائدة المقياس في قياس العجز الوظيفي لدى الأطفال.", "verbatim": false}, "translation_ar": "", "urls": ["https://journals.sagepub.com/doi/10.1177/000992289403300709", "https://pubmed.ncbi.nlm.nih.gov/7955782/"], "links": null, "strength": "explicit", "argument": "مقياس الاستقلال الوظيفي يثبت تزايد استقلال الطفل بنفسه في العناية والإخراج والحركة والتواصل حتى الثامنة؛ فالاستغناء حقيقة قابلة للقياس.", "jurisdiction": "الولايات المتحدة — جامعة ولاية نيويورك ومستشفى الأطفال في بوفالو", "title": "قياس الاستقلال الوظيفي في مهارات الحياة اليومية", "source_standing": "مقياس الاستقلال الوظيفي للأطفال من وضع فريق جامعة ولاية نيويورك في بوفالو، ومنهم كارل غرينجر صاحب مقياس الاستقلال الوظيفي المعتمد في مراكز التأهيل عبر العالم. ونشرته مجلة طب الأطفال العملي.", "evidence_level": "دراسة لبناء مقياس"}, {"section": "med", "card_number": 14, "supports": ["9"], "author": {"name": "Sawyer SM, et al.", "date": "2018"}, "work": {"title": "The age of adolescence", "section": "Lancet Child Adolesc Health 2(3):223–228", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "Earlier puberty has accelerated the onset of adolescence in nearly all populations, while understanding of continued growth has lifted its endpoint age well into the 20s.", "verbatim": true}, "translation_ar": "«عجل تبكير البلوغ بداية المراهقة في جميع المجتمعات تقريبا، في حين رفع فهم استمرار النمو سن نهايتها إلى ما بعد العشرين بكثير.»", "urls": ["https://doi.org/10.1016/S2352-4642(18)30022-1"], "links": null, "strength": "indirect", "argument": "تبكير البلوغ في المجتمعات كلها يجعل التاسعة عتبة الإدراك والبلوغ عند الجارية، لا سن طفولة محضة.", "jurisdiction": "أستراليا / عالمي", "title": "مجلة لانسيت 2018 — سن المراهقة", "source_standing": "سوزان سوير من مستشفى الأطفال الملكي وجامعة ملبورن، رأست لجنة مجلة لانسيت لصحة المراهقين. والمجلة من سلسلة لانسيت، أعرق المجلات الطبية البريطانية وأوسعها أثرا، تأسست سنة 1823.", "evidence_level": "رأي علمي محكم في مجلة كبرى"}, {"section": "med", "card_number": 15, "supports": ["shared_parenting"], "author": {"name": "Yogman M, Garfield CF, and the AAP Committee on Psychosocial Aspects of Child and Family Health", "date": "2016"}, "work": {"title": "Fathers' Roles in the Care and Development of Their Children: The Role of Pediatricians", "section": "Pediatrics 138(1):e20161128", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تقرير طبي رسمي للأكاديمية الأمريكية لطب الأطفال يراجع الدراسات الحديثة في مشاركة الآباء، المقيمين مع أبنائهم وغير المقيمين، ويبين أثرها في صحة الطفل ونموه في كل مرحلة من مراحل الطفولة، ويوصي أطباء الأطفال بتشجيعها ودعمها.", "verbatim": false}, "translation_ar": "", "urls": ["https://pediatrics.aappublications.org/content/138/1/e20161128.abstract"], "links": null, "strength": "explicit", "argument": "أكبر هيئة لأطباء الأطفال في العالم تعد مشاركة الأب، ولو لم يكن مقيما مع ولده، عاملا في صحته ونموه، وتأمر أطباءها بتشجيعها؛ فحبس الأب في ساعات رؤية مخالف لما يوصي به الطب.", "jurisdiction": "الولايات المتحدة — الأكاديمية الأمريكية لطب الأطفال", "title": "الأكاديمية الأمريكية لطب الأطفال 2016 — دور الأب في صحة ولده", "source_standing": "تقرير طبي رسمي للأكاديمية الأمريكية لطب الأطفال، أكبر هيئة لأطباء الأطفال في العالم، وتقاريرها مرجع الممارسة الطبية. ومايكل يوغمان من كلية الطب بجامعة هارفارد، وكريغ غارفيلد من جامعة نورثوسترن.", "evidence_level": "بيان طبي لهيئة مهنية"}, {"section": "med", "card_number": 16, "supports": ["shared_parenting"], "author": {"name": "Sarkadi A, Kristiansson R, Oberklaid F, Bremberg S", "date": "2008"}, "work": {"title": "Fathers' involvement and children's developmental outcomes: a systematic review of longitudinal studies", "section": "Acta Paediatrica 97(2):153–158", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: مراجعة منهجية لست عشرة دراسة متابعة طويلة تنتهي إلى أن انخراط الأب النشط المنتظم مع ولده يرتبط بنتائج اجتماعية وسلوكية ونفسية أحسن.", "verbatim": false}, "translation_ar": "", "urls": ["https://onlinelibrary.wiley.com/doi/10.1111/j.1651-2227.2007.00572.x/abstract"], "links": null, "strength": "explicit", "argument": "المراجعة المنهجية لدراسات المتابعة الطويلة أعلى درجات الدليل في الطب، وهي هنا تقطع بأن انخراط الأب المنتظم نافع للولد في سلوكه ونفسه وصلاته.", "jurisdiction": "السويد — جامعة أوبسالا", "title": "مراجعة منهجية سويدية 2008 — انخراط الأب ونمو الطفل", "source_standing": "آنا سركادي أستاذة طب الأطفال الاجتماعي في جامعة أوبسالا بالسويد، ومعها فرانك أوبركلايد من مركز صحة الطفل في ملبورن. ومجلة أكتا بيدياتريكا مجلة طب أطفال سويدية النشأة.", "evidence_level": "مراجعة منهجية لدراسات المتابعة الطويلة: أعلى درجات الدليل"}, {"section": "med", "card_number": 17, "supports": ["shared_parenting"], "author": {"name": "منظمة الصحة العالمية — المكتب الإقليمي لأوروبا", "date": "2007"}, "work": {"title": "Fatherhood and Health Outcomes in Europe", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: الآباء المنخرطون في رعاية أبنائهم يسهمون في صحة أحسن لأنفسهم ولأبنائهم ولشريكاتهم، والتقرير يدعو أنظمة الصحة إلى إشراك الآباء.", "verbatim": false}, "translation_ar": "", "urls": ["https://who-sandbox.squiz.cloud/__data/assets/pdf_file/0017/69011/E91129.pdf"], "links": null, "strength": "explicit", "argument": "المنظمة الصحية الأولى في العالم تقرر أن انخراط الأب في رعاية ولده سبب لصحة الولد، فحجب الأب عنه إضرار بصحته.", "jurisdiction": "منظمة الصحة العالمية — أوروبا", "title": "منظمة الصحة العالمية 2007 — الأبوة وصحة الأبناء في أوروبا", "source_standing": "تقرير المكتب الإقليمي لأوروبا في منظمة الصحة العالمية، الذي يخدم ثلاثا وخمسين دولة، ومقره كوبنهاغن.", "evidence_level": "تقرير رسمي لهيئة أممية"}, {"section": "med", "card_number": 18, "supports": ["shared_parenting"], "author": {"name": "الجمعية الكندية لطب الأطفال، لجنة طب الأطفال النفسي الاجتماعي", "date": ""}, "work": {"title": "Children's reactions to parental separation and divorce", "section": "Paediatrics & Child Health", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: يحتاج الأطفال بعد الانفصال أن يعلموا أن كلا الوالدين يحبهم، وتقرر الجمعية أن أهمية صلة الطفل بكلا والديه ورعايتهما له معا «cannot be overemphasized»، أي لا يمكن المبالغة فيها.", "verbatim": false}, "translation_ar": "", "urls": ["https://pmc.ncbi.nlm.nih.gov/articles/PMC2817796/"], "links": null, "strength": "explicit", "argument": "الهيئة المهنية لأطباء الأطفال في كندا تقرر أن صلة الطفل بأبويه معا ورعايتهما له أمر لا تبلغ المبالغة فيه حقيقته، فقطعه عن أحدهما خلاف ما يقرره طب الأطفال.", "jurisdiction": "كندا — الجمعية الكندية لطب الأطفال", "title": "الجمعية الكندية لطب الأطفال — أهمية رعاية الوالدين معا", "source_standing": "بيان الجمعية الكندية لطب الأطفال، الهيئة المهنية الوطنية لأطباء الأطفال في كندا؛ ومجلتها Paediatrics & Child Health لسانها الرسمي، وبياناتها مرجع الممارسة الطبية هناك.", "evidence_level": "بيان طبي لهيئة مهنية"}, {"section": "med", "card_number": 19, "supports": ["shared_parenting"], "author": {"name": "Cohen GJ, Weitzman CC, AAP Committee on Psychosocial Aspects of Child and Family Health", "date": "2016"}, "work": {"title": "Helping Children and Families Deal With Divorce and Separation", "section": "Pediatrics 138(6):e20163020", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: تقرير طبي للأكاديمية الأمريكية لطب الأطفال يوجه الأطباء إلى أن يكونوا محامين عن الطفل، وأن يحافظوا على صلة إيجابية بكلا الوالدين، وأن يعينوا الأسرة على تقليل آثار الطلاق على الطفل.", "verbatim": false}, "translation_ar": "", "urls": ["https://consumer.healthday.com/pediatrics-15/divorce-news-204/pediatricians-can-play-a-role-in-helping-children-of-divorce-717190.html"], "links": null, "strength": "explicit", "argument": "أكبر هيئة لأطباء الأطفال تعامل الوالدين بعد الطلاق شريكين متساويين في شأن الطفل، فلا يقصى الأب في عرف الطب.", "jurisdiction": "الولايات المتحدة — الأكاديمية الأمريكية لطب الأطفال", "title": "الأكاديمية الأمريكية لطب الأطفال 2016 — الطبيب صلة بالوالدين كليهما", "source_standing": "تقرير طبي رسمي للأكاديمية الأمريكية لطب الأطفال، أكبر هيئة لأطباء الأطفال في العالم، أعدته لجنتها المختصة بالجوانب النفسية والاجتماعية لصحة الطفل والأسرة.", "evidence_level": "بيان طبي لهيئة مهنية"}, {"section": "med", "card_number": 20, "supports": ["shared_parenting"], "author": {"name": "American Academy of Child and Adolescent Psychiatry", "date": "تحديث أبريل 2026"}, "work": {"title": "Children and Divorce", "section": "Facts for Families؛ الورقة رقم 1", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: توصي الأكاديمية بطمأنة الطفل إلى أن الانفصال ليس خطأه وأن كليهما سيظلان والديه ويحبانه. وتوضح أن الأطفال يكونون أفضل حالا عندما يعرفون استمرار مشاركة الأم والأب في حياتهم؛ أما نزاعات الحضانة الطويلة أو الضغط عليهم لاختيار أحد الوالدين فقد تكون شديدة الإضرار. وتدعو إلى تقليل النزاع والتعاون من أجل الطفل، والانتباه إلى علامات الضيق التي قد تستدعي تقييما نفسيا، دون إغفال قدرة الأسرة ودعمها على مساعدة الطفل في التكيف.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.aacap.org/AACAP/Families_and_Youth/Facts_for_Families/FFF-Guide/Children-and-Divorce-001.aspx"], "links": null, "strength": "explicit", "argument": "الأكاديمية الأمريكية للطب النفسي للأطفال تقرر أن الأطفال أحسن حالا حين يعلمون أن الأم والأب باقيان في حياتهم، وأن الضغط عليهم لاختيار أحد الوالدين شديد الإضرار؛ وهذا عين «لا تخيير مع تغييب».", "jurisdiction": "الولايات المتحدة — الأكاديمية الأمريكية للطب النفسي للأطفال والمراهقين", "title": "استمرار مشاركة الوالدين وتجنيب الطفل صراع الاختيار", "source_standing": "الأكاديمية الأمريكية للطب النفسي للأطفال والمراهقين الهيئة المهنية الجامعة لأطباء هذا التخصص في الولايات المتحدة، تأسست سنة 1953؛ وسلسلة حقائق للأسر نشرتها الرسمية للآباء.", "evidence_level": "إرشاد رسمي لهيئة مهنية"}, {"section": "med", "card_number": 21, "supports": ["shared_parenting"], "author": {"name": "The Royal College of Psychiatrists؛ تحرير Child and Family Public Education Editorial Board؛ محرر السلسلة Balaguru V", "date": "2013"}, "work": {"title": "Mental Health and Growing Up: Factsheets for Parents, Teachers and Young People", "section": "الفصل 13: Divorce or separation of parents: the impact on children and adolescents؛ المقتطف الأصلي المعروض تحت Summary", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: يوضح المقتطف أن النزاع والانفصال قد يصاحبهما شعور الطفل بالفقد وانعدام الأمان والذنب أو التمزق بين والديه، ويؤكد بقاء دور مهم لكلا الوالدين في حياته، ويدعو إلى حمايته من هموم الكبار ومسؤولياتهم، وبيان أنه غير مسؤول عن الانفصال. ومن وسائل المساندة طمأنته إلى استمرار حب الوالدين ورعايتهما، وإتاحة الوقت له، والالتزام الموثوق بترتيبات اللقاء معه.", "verbatim": false}, "translation_ar": "", "urls": ["https://www.cambridge.org/core/books/abs/mental-health-and-growing-up/divorce-or-separation-of-parents-the-impact-on-children-and-adolescents/B8C516AAF11AABF89F0D912422988202", "https://assets.cambridge.org/97819080/20468/frontmatter/9781908020468_frontmatter.pdf"], "links": null, "strength": "explicit", "argument": "الكلية الملكية للأطباء النفسيين في بريطانيا تقرر بقاء دور مهم لكلا الوالدين في حياة الطفل بعد الفرقة، والوفاء بترتيبات لقائه بهما.", "jurisdiction": "المملكة المتحدة — الكلية الملكية للأطباء النفسيين", "title": "رعاية موثوقة وصلة مستمرة بعد الفرقة", "source_standing": "الكلية الملكية للأطباء النفسيين الهيئة المهنية الرسمية للأطباء النفسيين في المملكة المتحدة، تمنح شهادة الاختصاص وتضع معايير الممارسة.", "evidence_level": "إرشاد رسمي لهيئة مهنية"}, {"section": "med", "card_number": 22, "supports": ["shared_parenting"], "author": {"name": "Garfield CF, Isacco A", "date": "2006"}, "work": {"title": "Fathers and the well-child visit", "section": "Pediatrics. 2006;117(4):e637-e645", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Father involvement is associated with positive cognitive, developmental, and sociobehavioral child outcomes such as improved weight gain in preterm infants, improved breastfeeding rates, higher receptive language skills, and higher academic achievement. ... comprehensive involvement of both parents is ideal for the child's well-being and health.\"", "verbatim": true}, "translation_ar": "«يرتبط انخراط الأب بنتائج إيجابية للطفل في الإدراك والنمو والسلوك الاجتماعي، كتحسن زيادة الوزن عند الخدج، وتحسن معدلات الرضاعة الطبيعية، وارتفاع مهارات اللغة الاستقبالية، وارتفاع التحصيل الدراسي... والانخراط الشامل للوالدين كليهما هو الأمثل لرفاه الطفل وصحته».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/16585280/", "https://doi.org/10.1542/peds.2005-1612"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/16585280/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1542/peds.2005-1612", "label": "صفحة الدراسة", "site": "مجلة طب الأطفال الأمريكية", "domain": "doi.org"}], "strength": "explicit", "argument": "أطباء الأطفال يعدون الأب جزءا من صحة الطفل منذ الخداج والرضاعة إلى المدرسة، فحرمان الطفل من أبيه مسألة صحية لا مسألة نفقة.", "jurisdiction": "الولايات المتحدة — جامعة نورثوسترن", "title": "مجلة طب الأطفال الأمريكية 2006 — الأب جزء من البيت الطبي للطفل", "source_standing": "مجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال، من أرفع مجلات التخصص في العالم؛ وكريغ غارفيلد أستاذ طب الأطفال في جامعة نورثوسترن ومن مؤلفي تقرير الأكاديمية عن الآباء.", "evidence_level": "دراسة في مجلة طبية كبرى"}, {"section": "med", "card_number": 23, "supports": ["shared_parenting"], "author": {"name": "Allport BS, Johnson S, Aqil A, Labrique AB, Nelson T, Kc A, et al.", "date": "2018"}, "work": {"title": "Promoting father involvement for child and family health", "section": "Academic Pediatrics. 2018;18(7):746-753", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Paternal involvement in children's lives is associated with a variety of child outcomes, including improved cognition, improved mental health, reduced obesity rates, and asthma exacerbation. Given this evidence, the American Academy of Pediatrics has promoted actions by pediatricians to engage fathers in pediatric care.\"", "verbatim": true}, "translation_ar": "«يرتبط انخراط الأب في حياة الأطفال بطائفة من نتائج الطفل، منها تحسن الإدراك، وتحسن الصحة النفسية، وانخفاض معدلات البدانة، ونوبات الربو. وبناء على هذه الأدلة دعت الأكاديمية الأمريكية لطب الأطفال أطباء الأطفال إلى إشراك الآباء في الرعاية».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/29653255/", "https://doi.org/10.1016/j.acap.2018.03.011"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/29653255/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.acap.2018.03.011", "label": "صفحة الدراسة", "site": "مجلة طب الأطفال الأكاديمي", "domain": "doi.org"}], "strength": "explicit", "argument": "جامعة جونز هوبكنز تجمع الأدلة: الأب يحسن عقل الطفل وصحته النفسية ويقلل بدانته، وتنتقد الاكتفاء بثنائية الأم والطفل دون الأب.", "jurisdiction": "الولايات المتحدة — جامعة جونز هوبكنز", "title": "طب الأطفال الأكاديمي 2018 — الأب يحسن عقل الطفل وصحته النفسية ويقلل بدانته", "source_standing": "المجلة لسان الرابطة الأكاديمية لطب الأطفال؛ والمؤلفون من كلية الطب وكلية الصحة العامة بجامعة جونز هوبكنز، أولى كليات الصحة العامة في العالم.", "evidence_level": "مراجعة طبية محكمة"}, {"section": "med", "card_number": 24, "supports": ["shared_parenting"], "author": {"name": "Yogman MW, Kindlon D, Earls F", "date": "1995"}, "work": {"title": "Father involvement and cognitive/behavioral outcomes of preterm infants", "section": "Journal of the American Academy of Child and Adolescent Psychiatry. 1995;34(1):58-66", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Most fathers played a meaningful role as play partner with their high-risk infants. ... Mean IQ for the high-involvement subgroup was 6.00 points higher than for the low-involvement group even after adjusting for family income, neonatal health, treatment group status, and paternal age.\"", "verbatim": true}, "translation_ar": "«أدى معظم الآباء دورا ذا معنى شركاء في اللعب مع رضعهم المعرضين للخطر... وكان متوسط الذكاء في مجموعة الانخراط العالي أعلى بست درجات منه في مجموعة الانخراط المنخفض، حتى بعد مراعاة دخل الأسرة وصحة الوليد ومجموعة العلاج وعمر الأب».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/7860458/"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/7860458/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}], "strength": "explicit", "argument": "ست درجات ذكاء فرق بين خديج لعب معه أبوه وخديج لم يفعل؛ فلعب الأب مع رضيعه دواء يقاس أثره بالأرقام.", "jurisdiction": "الولايات المتحدة — كلية الطب بجامعة هارفارد", "title": "يوغمان 1995 — انخراط الأب يرفع ذكاء الخدج ست درجات", "source_standing": "متابعة 985 رضيعا خديجا من الولادة إلى الثالثة في ثمانية مراكز أمريكية؛ ومايكل يوغمان طبيب أطفال في هارفارد قاد بعدها تقارير الأكاديمية الأمريكية عن الآباء، وفيلتون إيرلز أستاذ الطب النفسي للأطفال في هارفارد.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "med", "card_number": 25, "supports": ["shared_parenting"], "author": {"name": "Gordon I, Zagoory-Sharon O, Leckman JF, Feldman R", "date": "2010"}, "work": {"title": "Oxytocin and the development of parenting in humans", "section": "Biological Psychiatry. 2010;68(4):377-382", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Overall, parental OT increased across the study period and there were no differences between maternal and paternal OT at each time point. ... paternal OT correlated with the degree of stimulatory parenting behaviors, including proprioceptive contact, tactile stimulation, and object presentation.\"", "verbatim": true}, "translation_ar": "«في المجمل ارتفع الأوكسيتوسين [هرمون الارتباط] عند الوالدين على مدى الدراسة، ولم تكن هناك فروق بين أوكسيتوسين الأم وأوكسيتوسين الأب في أي نقطة زمنية... وارتبط أوكسيتوسين الأب بدرجة سلوكيات الرعاية المنبهة، ومنها التلامس الحركي والتنبيه اللمسي وعرض الأشياء».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/20359699/", "https://doi.org/10.1016/j.biopsych.2010.02.005"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/20359699/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.biopsych.2010.02.005", "label": "صفحة الدراسة", "site": "مجلة الطب النفسي البيولوجي", "domain": "doi.org"}], "strength": "explicit", "argument": "هرمون الارتباط بالرضيع يجري في دم الأب كما يجري في دم الأم سواء بسواء، فالارتباط بالولد فطرة في الأب بيولوجيا لا عاطفة زائدة.", "jurisdiction": "إسرائيل — جامعة بار إيلان ومركز دراسة الطفل بجامعة ييل", "title": "غوردون وفيلدمان 2010 — هرمون الارتباط عند الأب يساوي ما عند الأم", "source_standing": "مجلة الطب النفسي البيولوجي من أرفع مجلات التخصص؛ وجيمس ليكمان أستاذ في مركز دراسة الطفل بجامعة ييل، وروث فيلدمان أبرز باحثي العالم في هرمونات الأبوة والأمومة.", "evidence_level": "دراسة متابعة طويلة بالقياسات الحيوية"}, {"section": "med", "card_number": 26, "supports": ["shared_parenting"], "author": {"name": "Gettler LT, McDade TW, Feranil AB, Kuzawa CW", "date": "2011"}, "work": {"title": "Longitudinal evidence that fatherhood decreases testosterone in human males", "section": "Proceedings of the National Academy of Sciences. 2011;108(39):16194-16199", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Men who became partnered fathers then experienced large declines in waking (median: -26%) and evening (median: -34%) T, which were significantly greater than declines in single nonfathers (P < 0.001). Consistent with the hypothesis that child interaction suppresses T, fathers reporting 3 h or more of daily childcare had lower T at follow-up\"", "verbatim": true}, "translation_ar": "«الرجال الذين صاروا آباء شهدوا انخفاضات كبيرة في التستوستيرون صباحا (نحو 26 بالمئة) ومساء (نحو 34 بالمئة)، أكبر بوضوح من انخفاضه عند العزاب غير الآباء. واتساقا مع فرضية أن التفاعل مع الطفل يخفض التستوستيرون، كان الآباء الذين يرعون أطفالهم ثلاث ساعات أو أكثر يوميا أقل تستوستيرونا في المتابعة».", "urls": ["https://scholars.duke.edu/publication/1259079", "https://www.pnas.org/doi/10.1073/pnas.1105403108"], "links": [{"url": "https://scholars.duke.edu/publication/1259079", "label": "سجل الدراسة", "site": "بوابة بحوث جامعة ديوك", "domain": "scholars.duke.edu"}, {"url": "https://www.pnas.org/doi/10.1073/pnas.1105403108", "label": "صفحة الدراسة", "site": "مجلة وقائع الأكاديمية الوطنية للعلوم", "domain": "www.pnas.org"}], "strength": "explicit", "argument": "بيولوجيا الرجل تتغير حين يصير أبا لتهيئه للرعاية المباشرة، فمن قال إن الرعاية للأم وحدها خالف تكوين الإنسان.", "jurisdiction": "الولايات المتحدة — جامعة نورثوسترن", "title": "غيتلر 2011 — جسد الرجل يتهيأ هرمونيا لرعاية الرضيع", "source_standing": "مجلة وقائع الأكاديمية الوطنية للعلوم من أرفع المجلات العلمية في العالم؛ والدراسة متابعة لأربعة وعشرين وستمئة رجل في الفلبين أربع سنوات ونصفا، من فريق جامعة نورثوسترن.", "evidence_level": "دراسة متابعة طويلة"}, {"section": "med", "card_number": 27, "supports": ["shared_parenting"], "author": {"name": "Abraham E, Feldman R", "date": "2018"}, "work": {"title": "The neurobiology of human allomaternal care; implications for fathering, coparenting, and children's social development", "section": "Physiology and Behavior. 2018;193:25-34", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"we propose that in the course of hominin evolution fathers' neuroendocrine systems, brain functionality and integrity, and behavioral responses to infant cues have undergone profound natural selection to accommodate the great variability in the paternal role across time and place, culminating in the contemporary cooperative, highly involved coparent\"", "verbatim": true}, "translation_ar": "«نذهب إلى أن أجهزة الآباء العصبية الهرمونية ووظائف أدمغتهم واستجاباتهم السلوكية لإشارات الرضيع خضعت في مسار تطور الإنسان لانتقاء طبيعي عميق ليستوعب التنوع الكبير في دور الأب عبر الزمان والمكان، منتهيا إلى الأب المعاصر المتعاون الشديد الانخراط المشارك في تربية ولده».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/29730038/", "https://doi.org/10.1016/j.physbeh.2017.12.034"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/29730038/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.physbeh.2017.12.034", "label": "صفحة الدراسة", "site": "مجلة الفسيولوجيا والسلوك", "domain": "doi.org"}], "strength": "explicit", "argument": "دماغ الأب مصوغ بالانتقاء الطبيعي لرعاية الرضيع، فالأبوة الحاضرة أصل في خلقة الإنسان لا طارئ ثقافي.", "jurisdiction": "إسرائيل — جامعة رايخمان وجامعة بار إيلان", "title": "أبراهام وفيلدمان 2018 — التطور صاغ دماغ الأب وهرموناته للرعاية", "source_standing": "مراجعة لعقد من دراسات مختبر روث فيلدمان الهرمونية والعصبية والمتابعة الطويلة، وهي أكثر الباحثين استشهادا في دماغ الوالدين؛ وإيال أبراهام صار بعدها في جامعة كولومبيا.", "evidence_level": "مراجعة علمية محكمة"}, {"section": "med", "card_number": 28, "supports": ["shared_parenting"], "author": {"name": "Wilson KR, Prior MR", "date": "2011"}, "work": {"title": "Father involvement and child well-being", "section": "Journal of Paediatrics and Child Health. 2011;47(7):405-407", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Children's development is influenced by the quantity and quality of father involvement (FI) in their care. High levels of FI are associated with significant and highly desirable outcomes for children and families. ... fathers and mothers alike need to be educated about the fact that positive paternal involvement is highly beneficial to children.\"", "verbatim": true}, "translation_ar": "«يتأثر نمو الأطفال بكمية انخراط الأب في رعايتهم وكيفيته. وترتبط المستويات العالية من انخراط الأب بنتائج مهمة ومرغوبة جدا للأطفال والأسر... ويحتاج الآباء والأمهات على السواء إلى أن يعلموا أن الانخراط الإيجابي للأب مفيد جدا للأطفال».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/20598076/", "https://doi.org/10.1111/j.1440-1754.2010.01770.x"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/20598076/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1111/j.1440-1754.2010.01770.x", "label": "صفحة الدراسة", "site": "مكتبة وايلي العلمية", "domain": "doi.org"}], "strength": "explicit", "argument": "الكمية مؤثرة بنص الأطباء، فالأب الذي يرى ولده ساعات في الأسبوع محروم من الكمية التي يبنى بها النمو.", "jurisdiction": "أستراليا — جامعة ملبورن", "title": "مجلة طب الأطفال الأسترالية 2011 — كمية انخراط الأب وكيفيته تصوغ نمو الطفل", "source_standing": "المجلة لسان قسم طب الأطفال في الكلية الملكية الأسترالية للأطباء؛ ومارغوت برايور أستاذة فخرية في جامعة ملبورن ومن أبرز علماء نفس النمو في أستراليا.", "evidence_level": "مراجعة طبية محكمة"}, {"section": "med", "card_number": 29, "supports": ["9", "childhood_ends_at_puberty"], "author": {"name": "MedlinePlus — المكتبة الوطنية للطب، المعاهد الوطنية للصحة", "date": "2026"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Puberty is the time in life when a boy or girl becomes sexually mature. It is a process that usually happens between ages 8 and 13 for girls and ages 9 and 14 for boys.\"", "verbatim": true}, "translation_ar": "«البلوغ هو الوقت الذي يصير فيه الولد أو البنت ناضجا جنسيا. وهو عملية تحدث عادة بين سن 8 و13 عند البنات، وبين 9 و14 عند البنين».", "urls": ["https://medlineplus.gov/puberty.html"], "links": [{"url": "https://medlineplus.gov/puberty.html", "label": "النص الرسمي", "site": "المكتبة الوطنية للطب الأمريكية", "domain": "medlineplus.gov"}], "strength": "explicit_9", "argument": "أكبر مكتبة طبية في العالم تجعل البلوغ عند البنات من الثامنة إلى الثالثة عشرة، فالتاسعة التي حد بها الحنفية حضانة الجارية في قلب سن البلوغ الطبيعي.", "jurisdiction": "الولايات المتحدة — المكتبة الوطنية للطب", "title": "المكتبة الوطنية للطب الأمريكية — البلوغ يبدأ عند البنات من الثامنة وعند البنين من التاسعة", "source_standing": "MedlinePlus المرجع الصحي الرسمي للمكتبة الوطنية للطب التابعة للمعاهد الوطنية للصحة الأمريكية، وتراجعه معاهد الصحة الوطنية.", "evidence_level": "مرجع طبي حكومي رسمي"}, {"section": "med", "card_number": 30, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Alio AP, Mbah AK, Kornosky JL, Wathington D, Marty PJ, Salihu HM", "date": "2011"}, "work": {"title": "Assessing the impact of paternal involvement on racial/ethnic disparities in infant mortality rates", "section": "Journal of Community Health. 2011;36(1):63-68", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"infants born to black women with absent fathers had a seven-fold increased risk of infant mortality. Elevated risks of infant mortality were also observed for Hispanic infants with absent fathers (OR = 3.33, 95%CI = 2.66-4.17). About 65-75% of excess mortality could be prevented with increased paternal involvement. Paternal absence widens the black-white gap in infant mortality almost four-fold.\"", "verbatim": true}, "translation_ar": "«كان الرضع المولودون لنساء سود مع آباء غائبين معرضين لخطر الوفاة في سنتهم الأولى بسبعة أضعاف. ولوحظت مخاطر مرتفعة لوفيات الرضع أيضا عند الرضع من أصل لاتيني مع آباء غائبين (نسبة الخطر 3.33). ويمكن منع نحو 65–75% من الوفيات الزائدة بزيادة انخراط الأب. وغياب الأب يوسع الفجوة بين السود والبيض في وفيات الرضع نحو أربعة أضعاف».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/20512407/", "https://doi.org/10.1007/s10900-010-9280-3"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/20512407/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1007/s10900-010-9280-3", "label": "صفحة الدراسة", "site": "مجلة صحة المجتمع", "domain": "doi.org"}], "strength": "explicit", "argument": "الأب ضرورة من قبل أن يولد الطفل: غيابه عند الحمل والولادة يضاعف موت الرضع ثلاث مرات إلى سبع؛ فمن يقول إن الطفل لا يحتاج أباه حتى الخامسة عشرة يناقض سجلات المواليد.", "jurisdiction": "الولايات المتحدة — جامعة جنوب فلوريدا", "title": "أليو وزملاؤها 2011 — غياب الأب يضاعف وفيات الرضع في سنتهم الأولى", "source_standing": "باحثون من كلية الصحة العامة بجامعة جنوب فلوريدا، على سجلات المواليد الرسمية لولاية فلوريدا من 1998 إلى 2005؛ والمجلة محكمة تصدرها دار سبرينغر.", "evidence_level": "دراسة سجلات رسمية للدولة"}, {"section": "med", "card_number": 31, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Alio AP, Kornosky JL, Mbah AK, Marty PJ, Salihu HM", "date": "2010"}, "work": {"title": "The impact of paternal involvement on feto-infant morbidity among Whites, Blacks and Hispanics", "section": "Maternal and Child Health Journal. 2010;14(5):735-741", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"There were higher rates of low birth weight, very low birth weight, preterm birth, very preterm birth, and small for gestational age (SGA) among father-absent births. Within each racial-ethnic subgroup, women with absent fathers had higher risks of poor birth outcomes than their counterparts with involved fathers.\"", "verbatim": true}, "translation_ar": "«كانت معدلات نقص وزن المولود، ونقصه الشديد، والولادة المبكرة، والولادة المبكرة جدا، وصغر الحجم بالنسبة لعمر الحمل، أعلى في الولادات التي غاب عنها الأب. وداخل كل فئة عرقية على حدة، كانت النساء اللائي غاب عنهن الأب أكثر تعرضا لسوء نتائج الولادة من نظيراتهن ذوات الآباء المنخرطين».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/19526333/", "https://doi.org/10.1007/s10995-009-0482-1"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/19526333/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1007/s10995-009-0482-1", "label": "صفحة الدراسة", "site": "مجلة صحة الأم والطفل", "domain": "doi.org"}], "strength": "explicit", "argument": "انخراط الأب يبدأ أثره من الرحم: نقص الوزن والولادة المبكرة يزيدان حين يغيب؛ فالأبوة ليست نفقة بعد الولادة بل حضور يحمي الطفل قبلها.", "jurisdiction": "الولايات المتحدة — جامعة جنوب فلوريدا", "title": "أليو وزملاؤها 2010 — غياب الأب يزيد الولادة المبكرة ونقص وزن المواليد في كل الفئات", "source_standing": "باحثون من كلية الصحة العامة بجامعة جنوب فلوريدا، على سجلات المواليد الرسمية لولاية فلوريدا من 1998 إلى 2005؛ ومجلة صحة الأم والطفل مجلة محكمة تصدرها دار سبرينغر.", "evidence_level": "دراسة سجلات رسمية للدولة"}, {"section": "med", "card_number": 32, "supports": ["7", "childhood_ends_at_puberty"], "author": {"name": "American Dental Association (ADA) — MouthHealthy", "date": "2012"}, "work": {"title": "Primary Tooth Development · Permanent Tooth Development (eruption charts)", "section": "جدولا نمو الأسنان اللبنية والدائمة على موقع الجمعية للتثقيف الصحي", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Primary Tooth Development — Shed: Central incisor 6-7 yrs.; Lateral incisor 7-8 yrs. · Permanent Tooth Development — Erupt: First molar 6-7 yrs.; Central incisor 6-7 yrs. (lower), 7-8 yrs. (upper); Second molar 11-13 yrs. (lower), 12-13 yrs. (upper)\"", "verbatim": true}, "translation_ar": "«نمو الأسنان اللبنية — السقوط: القاطع الأوسط 6–7 سنوات؛ القاطع الجانبي 7–8 سنوات. نمو الأسنان الدائمة — النبات: الضرس الأول 6–7 سنوات؛ القاطع الأوسط 6–7 سنوات في الفك السفلي و7–8 في العلوي؛ الضرس الثاني 11–13 سنة في السفلي و12–13 في العلوي».", "urls": ["https://www.mouthhealthy.org/all-topics-a-z/eruption-charts", "https://www.mouthhealthy.org/-/media/project/ada-organization/ada/mouthhealthy/files/activity-sheets/adapermanentteethdev_eng.pdf"], "links": [{"url": "https://www.mouthhealthy.org/all-topics-a-z/eruption-charts", "label": "جداول بزوغ الأسنان", "site": "الجمعية الأمريكية لطب الأسنان", "domain": "www.mouthhealthy.org"}, {"url": "https://www.mouthhealthy.org/-/media/project/ada-organization/ada/mouthhealthy/files/activity-sheets/adapermanentteethdev_eng.pdf", "label": "جدول الأسنان الدائمة", "site": "الجمعية الأمريكية لطب الأسنان", "domain": "www.mouthhealthy.org"}], "strength": "explicit_7", "argument": "علق فقهاء اللغة والفقه التمييز بالإثغار، وها هو جدول الطب: يبدل الطفل قواطعه وينبت ضرسه الدائم الأول بين السادسة والسابعة، وينبت ضرسه الثاني عند عتبة البلوغ؛ فحد السابعة حد في الجسد لا في الاصطلاح، وحد البلوغ من بعده.", "jurisdiction": "الولايات المتحدة — الجمعية الأمريكية لطب الأسنان", "title": "الجمعية الأمريكية لطب الأسنان — الإثغار: سقوط القواطع اللبنية ونبات الضرس الدائم الأول في 6–7 سنوات", "source_standing": "الجمعية الأمريكية لطب الأسنان أكبر هيئة مهنية لأطباء الأسنان في العالم منذ 1859، وجداول بزوغ الأسنان من موادها المعتمدة التي يعمل بها أطباء الأسنان في العالم.", "evidence_level": "بيان طبي لهيئة مهنية"}, {"section": "med", "card_number": 33, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Prybylowski A, Howland J, Rankin KM, Collins JW Jr", "date": "2023"}, "work": {"title": "The First-Year Mortality Rates of Singleton Infants Born at Term of US-Born and Foreign-Born Women: The Effect of Paternal Acknowledgment", "section": "The Journal of Pediatrics. 2023;255:105-111", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The infant mortality rate of term births to US-born women with paternal nonacknowledgment equaled 5.0/1000 vs 2.0/1000 for those with paternal acknowledgment; relative risk (RR) = 2.47 (2.31, 2.86). ... Paternal nonacknowledgement is associated with a 40% greater infant mortality rate among term births to US-born and foreign-born women ... These findings highlight the importance of a father's involvement in the outcomes of infants born at term.\"", "verbatim": true}, "translation_ar": "«بلغ معدل وفيات الرضع في الولادات مكتملة النمو للنساء المولودات في أمريكا 5.0 في الألف حين لم يقر الأب بالمولود، مقابل 2.0 في الألف حين أقر؛ أي خطر نسبي 2.47... وعدم إقرار الأب يرتبط بزيادة في معدل وفيات الرضع قدرها 40% [بعد مراعاة العوامل الأخرى] في الولادات مكتملة النمو للنساء المولودات في أمريكا وخارجها... وتبرز هذه النتائج أهمية انخراط الأب في مصير الرضع المولودين مكتملي النمو».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/36372097/", "https://doi.org/10.1016/j.jpeds.2022.11.001"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/36372097/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.jpeds.2022.11.001", "label": "صفحة الدراسة", "site": "مجلة طب الأطفال", "domain": "doi.org"}], "strength": "explicit", "argument": "أحدث سجلات المواليد الأمريكية كلها: حين يغيب اسم الأب عن شهادة الميلاد يموت من الرضع مكتملي النمو ضعفان ونصف؛ فالأب عامل حياة من اليوم الأول، لا طرفا يستغنى عنه حتى الخامسة عشرة.", "jurisdiction": "الولايات المتحدة — مستشفى لوري للأطفال في شيكاغو وجامعة إلينوي", "title": "مستشفى لوري للأطفال 2023 — غياب إقرار الأب في شهادة الميلاد يرفع وفيات الرضع مكتملي النمو في أمريكا كلها", "source_standing": "من قسم حديثي الولادة بمستشفى لوري للأطفال التابع لجامعة نورثوسترن وكلية الصحة العامة بجامعة إلينوي، على سجلات المركز الوطني للإحصاءات الصحية لأكثر من مليوني مولود أمريكي سنة 2017؛ ومجلة طب الأطفال من أقدم مجلات التخصص وأرفعها.", "evidence_level": "دراسة سجلات وطنية رسمية"}, {"section": "med", "card_number": 34, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Alio AP, Mbah AK, Grunsten RA, Salihu HM", "date": "2011"}, "work": {"title": "Teenage pregnancy and the influence of paternal involvement on fetal outcomes", "section": "Journal of Pediatric and Adolescent Gynecology. 2011;24(6):404-409", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Risks of SGA (OR = 1.06), low birth weight (OR = 1.19), very low birth weight (OR = 1.53), preterm birth (OR = 1.21), and very preterm birth (OR = 1.49) were elevated for mothers in the father-absent group. ... Lack of paternal involvement is a risk factor for adverse birth outcomes among teenage mothers ... Our findings suggest that increased paternal involvement can have a positive impact on birth outcomes for teenage mothers\"", "verbatim": true}, "translation_ar": "«ارتفعت مخاطر صغر الحجم بالنسبة لعمر الحمل (نسبة الخطر 1.06)، ونقص وزن المولود (1.19)، ونقصه الشديد (1.53)، والولادة المبكرة (1.21)، والولادة المبكرة جدا (1.49) عند الأمهات في مجموعة غياب الأب... وقلة انخراط الأب عامل خطر لسوء نتائج الولادة عند الأمهات المراهقات... وتشير نتائجنا إلى أن زيادة انخراط الأب يمكن أن تحسن نتائج الولادة عند الأمهات المراهقات».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/22099734/", "https://doi.org/10.1016/j.jpag.2011.07.002"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/22099734/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1016/j.jpag.2011.07.002", "label": "صفحة الدراسة", "site": "مجلة طب نساء الأطفال والمراهقات", "domain": "doi.org"}], "strength": "explicit", "argument": "في أضعف الحالات، أم مراهقة، يبقى حضور الأب هو الذي يحمي الجنين من الخداج ونقص الوزن؛ فالأبوة ضرورة طبية لا يعوضها شيء.", "jurisdiction": "الولايات المتحدة — جامعة روتشستر وجامعة جنوب فلوريدا", "title": "أليو 2011 — حتى عند الأمهات المراهقات: غياب الأب يرفع الولادة المبكرة ونقص الوزن في 192 ألف ولادة", "source_standing": "باحثون من كلية الطب بجامعة روتشستر وكلية الصحة العامة بجامعة جنوب فلوريدا، على سجلات المواليد الرسمية لولاية فلوريدا من 1998 إلى 2007 (192,747 أما مراهقة)؛ والمجلة لسان جمعية أمريكا الشمالية لطب نساء الأطفال والمراهقات.", "evidence_level": "دراسة سجلات رسمية للدولة"}, {"section": "med", "card_number": 35, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Redshaw M, Henderson J", "date": "2013"}, "work": {"title": "Fathers' engagement in pregnancy and childbirth: evidence from a national survey", "section": "BMC Pregnancy and Childbirth. 2013;13:70", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Greater paternal engagement was positively associated with first contact with health professionals before 12 weeks gestation, having a dating scan, number of antenatal checks, offer and attendance at antenatal classes, and breastfeeding. Paternity leave was also strongly associated with maternal well-being at three months postpartum.\"", "verbatim": true}, "translation_ar": "«ارتبط انخراط الأب الأكبر ارتباطا موجبا بأول اتصال بالعاملين الصحيين قبل الأسبوع الثاني عشر من الحمل، وبإجراء فحص الموجات لتحديد موعد الولادة، وبعدد فحوص الحمل، وبعرض دروس ما قبل الولادة وحضورها، وبالرضاعة الطبيعية. وارتبطت إجازة الأبوة ارتباطا قويا أيضا بسلامة الأم النفسية بعد ثلاثة أشهر من الولادة».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/23514133/", "https://doi.org/10.1186/1471-2393-13-70"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/23514133/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1186/1471-2393-13-70", "label": "صفحة الدراسة", "site": "مجلة الحمل والولادة", "domain": "doi.org"}], "strength": "explicit", "argument": "حضور الأب يبدأ أثره قبل الولادة: رعاية حمل أبكر وأكثر، ورضاعة طبيعية أطول، وأم أسلم نفسا؛ فالأب شريك في صحة الطفل من الرحم.", "jurisdiction": "المملكة المتحدة — جامعة أكسفورد", "title": "ريدشو وهندرسون 2013 — انخراط الأب في الحمل يزيد رعاية الحمل والرضاعة وصحة الأم: مسح وطني إنجليزي", "source_standing": "من وحدة أكسفورد الوطنية لوبائيات ما حول الولادة، على المسح الوطني للأمومة في إنجلترا سنة 2010 (4616 امرأة)؛ والمجلة محكمة مفتوحة من مجموعة بيوميد سنترال.", "evidence_level": "دراسة مسحية وطنية"}, {"section": "med", "card_number": 36, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Pisacane A, Continisio GI, Aldinucci M, D'Amora S, Continisio P", "date": "2005"}, "work": {"title": "A controlled trial of the father's role in breastfeeding promotion", "section": "Pediatrics. 2005;116(4):e494-e498", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The prevalence of full breastfeeding at 6 months was 25% (35 of 140) in the intervention group and 15% (21 of 140) in the control group ... Among the women who had reported difficulties with lactation ... the prevalence of full breastfeeding at 6 months was 24% and 4.5%, respectively. CONCLUSIONS: Teaching fathers how to prevent and to manage the most common lactation difficulties is associated with higher rates of full breastfeeding at 6 months.\"", "verbatim": true}, "translation_ar": "«بلغت نسبة الرضاعة الطبيعية الكاملة عند ستة أشهر 25% (35 من 140) في مجموعة التدريب و15% (21 من 140) في مجموعة المقارنة... وعند النساء اللائي أبلغن عن صعوبات في الإرضاع كانت نسبة الرضاعة الكاملة عند ستة أشهر 24% و4.5% على الترتيب. الخلاصة: تعليم الآباء كيف يمنعون أشيع صعوبات الإرضاع ويعالجونها يرتبط بارتفاع معدلات الرضاعة الطبيعية الكاملة عند ستة أشهر».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/16199676/", "https://doi.org/10.1542/peds.2005-0479"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/16199676/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1542/peds.2005-0479", "label": "صفحة الدراسة", "site": "مجلة طب الأطفال الأمريكية", "domain": "doi.org"}], "strength": "explicit", "argument": "حتى الرضاعة، وهي أخص ما تختص به الأم، ينجح بالأب: من دربوا آباءهم أرضعوا رضاعة كاملة بمقدار الضعف، ومن تعثرن أرضعن بخمسة أضعاف؛ فأين من يقول إن الرضيع لا يحتاج أباه؟", "jurisdiction": "إيطاليا — جامعة فيديريكو الثاني في نابولي", "title": "بيزاكاني 2005 — تجربة مضبوطة في مجلة طب الأطفال: تدريب الآباء يرفع الرضاعة الطبيعية الكاملة", "source_standing": "تجربة مضبوطة من قسم طب الأطفال بجامعة فيديريكو الثاني في نابولي على 280 أسرة؛ ومجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال وأرفع مجلات التخصص.", "evidence_level": "تجربة مضبوطة"}, {"section": "med", "card_number": 37, "supports": ["silat_al_rahim"], "author": {"name": "Salihu HM, Salemi JL, Nash MC, Chandler K, Mbah AK, Alio AP", "date": "2014"}, "work": {"title": "Assessing the economic impact of paternal involvement: a comparison of the generalized linear model versus decision analysis trees", "section": "Maternal and Child Health Journal. 2014;18(6):1380-1390", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"In our cohort of 2,243,891 infants, 9.2% had a father uninvolved during pregnancy. Lack of paternal involvement was associated with higher rates of preterm birth, small-for-gestational age, and infant morbidity and mortality. Both analytic approaches estimate significantly higher per-infant costs for father uninvolved pregnancies (decision analysis model: $1,827, GLM: $1,139). This paper provides sufficient evidence that healthcare costs could be significantly reduced through enhanced father involvement during pregnancy, and buttresses the call for a national program to involve fathers in antenatal care.\"", "verbatim": true}, "translation_ar": "«في مجموعتنا البالغة 2,243,891 رضيعا كان 9.2% منهم بآباء غير منخرطين أثناء الحمل. وارتبط عدم انخراط الأب بارتفاع معدلات الولادة المبكرة، وصغر الحجم بالنسبة لعمر الحمل، ومرض الرضع ووفياتهم. ويقدر كلا الأسلوبين تكاليف أعلى بوضوح لكل رضيع في حالات الحمل التي لم ينخرط فيها الأب (1827 دولارا بأحد النموذجين و1139 بالآخر). وتقدم هذه الورقة دليلا كافيا على أن تكاليف الرعاية الصحية يمكن أن تخفض خفضا كبيرا بتعزيز انخراط الأب أثناء الحمل، وتدعم الدعوة إلى برنامج وطني لإشراك الآباء في رعاية الحمل».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/24158503/", "https://doi.org/10.1007/s10995-013-1372-0"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/24158503/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1007/s10995-013-1372-0", "label": "صفحة الدراسة", "site": "مجلة صحة الأم والطفل", "domain": "doi.org"}], "strength": "explicit", "argument": "غياب الأب ليس خسارة للطفل وحده بل للخزانة العامة: مئات الدولارات لكل رضيع في سنته الأولى؛ ولذلك يطالب الأطباء ببرنامج وطني لإشراك الآباء لا بإبعادهم.", "jurisdiction": "الولايات المتحدة — جامعة جنوب فلوريدا", "title": "صالحو 2014 — غياب الأب في الحمل يكلف علاج كل رضيع مئات الدولارات زيادة: 2.2 مليون مولود", "source_standing": "فريق صحة الأم والطفل بكلية الصحة العامة في جامعة جنوب فلوريدا، على قاعدة بيانات الولاية للأمهات والرضع اثنتي عشرة سنة؛ والمجلة محكمة تصدرها دار سبرينغر.", "evidence_level": "دراسة سجلات رسمية للدولة"}, {"section": "med", "card_number": 38, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "Wake M, Nicholson JM, Hardy P, Smith K", "date": "2007"}, "work": {"title": "Preschooler obesity and parenting styles of mothers and fathers: Australian national population study", "section": "Pediatrics. 2007;120(6):e1520-e1527", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Mothers' parenting behaviors and styles were not associated in any model with higher odds of children being in a heavier BMI category ... Compared with the reference authoritative style, children of fathers with permissive and disengaged parenting styles had higher odds of being in a higher BMI category. ... Fathers' but not mothers' parenting behaviors and styles were associated with increased risks of preschooler overweight and obesity.\"", "verbatim": true}, "translation_ar": "«لم ترتبط سلوكيات الأمهات التربوية وأساليبهن في أي نموذج بارتفاع احتمال وقوع الأطفال في فئة وزن أعلى... ومقارنة بالأسلوب الحازم الحاني، كان أطفال الآباء ذوي الأسلوب المتساهل أو المنسحب أكثر احتمالا لفئة وزن أعلى... فسلوكيات الآباء التربوية وأساليبهم، لا الأمهات، هي التي ارتبطت بزيادة خطر زيادة الوزن والسمنة عند أطفال ما قبل المدرسة».", "urls": ["https://pubmed.ncbi.nlm.nih.gov/18055667/", "https://doi.org/10.1542/peds.2006-3707"], "links": [{"url": "https://pubmed.ncbi.nlm.nih.gov/18055667/", "label": "ملخص الدراسة", "site": "PubMed", "domain": "pubmed.ncbi.nlm.nih.gov"}, {"url": "https://doi.org/10.1542/peds.2006-3707", "label": "صفحة الدراسة", "site": "مجلة طب الأطفال الأمريكية", "domain": "doi.org"}], "strength": "explicit", "argument": "صحة جسد الطفل في الرابعة والخامسة تتبع أسلوب أبيه لا أمه؛ فحبسه عن أبيه في هذه السن عين ما يحذر منه أطباء الأطفال.", "jurisdiction": "أستراليا — مستشفى الأطفال الملكي في ملبورن", "title": "ويك 2007 — سمنة أطفال الروضة ترتبط بأسلوب الأب لا الأم: مسح وطني أسترالي لـ4983 طفلا", "source_standing": "ميليسا ويك من مركز صحة الطفل المجتمعية بمستشفى الأطفال الملكي في ملبورن، على دراسة المتابعة الوطنية لأطفال أستراليا؛ ومجلة طب الأطفال لسان الأكاديمية الأمريكية لطب الأطفال.", "evidence_level": "دراسة مسحية وطنية"}, {"section": "psy", "card_number": 39, "supports": ["7"], "author": {"name": "Gerstadt CL, Hong YJ, Diamond A", "date": "1994"}, "work": {"title": "The relationship between cognition and action: performance of children 3 1/2–7 years old on a Stroop-like day-night test", "section": "Cognition. 1994;53(2):129–153. موضع النقل: الملخص في ص 129، والمناقشة العامة في ص 149–150", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: اختبرت المهمة الأساسية 160 طفلا بين 3.5 و7 سنوات بمهمة تتطلب تسمية صورة النهار بالليل وصورة الليل بالنهار، مع حفظ قاعدتين وكبح الاستجابة المعتادة. واجه من هم دون الخامسة صعوبة في المحافظة على الأداء خلال المحاولات، رغم نجاحهم في بدايتها. فارتبطت الصعوبة بمطالب الكبح إلى جانب معرفة التعليمات، وتحسن الأداء مع العمر.", "verbatim": false}, "translation_ar": "", "urls": ["https://devcogneuro.com/Publications/day-nightpaper1994.pdf"], "links": null, "strength": "explicit_7", "argument": "قدرة الطفل على حفظ قاعدتين وكبح الاستجابة المعتادة تتحسن حتى السابعة، وهذا أصل التمييز الذي يعقل به الأمر والنهي.", "jurisdiction": "الولايات المتحدة — جامعة بنسلفانيا", "title": "نمو التحكم المعرفي في اختبار النهار والليل حتى السابعة", "source_standing": "أديل دايموند من مؤسسي علم أعصاب نمو الإدراك عند الطفل، أستاذة في جامعة كولومبيا البريطانية وعضو الجمعية الملكية الكندية؛ ومجلة الإدراك من أرفع مجلات علم النفس المعرفي.", "evidence_level": "دراسة تجريبية"}, {"section": "psy", "card_number": 40, "supports": ["7"], "author": {"name": "Diamond A, Taylor C", "date": "1996"}, "work": {"title": "Development of an aspect of executive control: Development of the abilities to remember what I said and to \"Do as I say, not as I do\"", "section": "Developmental Psychobiology. 1996;29(4):315–334. موضع النقل: الملخص، ص 315", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: طبقت الباحثتان اختبار الطرق: يطرق الطفل مرة إذا طرق الفاحص مرتين، ومرتين إذا طرق مرة، على 160 طفلا بين 3.5 و7 سنوات. كان الأكبر سنا أسرع وأدق، ووقع معظم التحسن بحلول السادسة. وربطت الباحثتان التحسن بالقدرة على إبقاء قاعدتين في الذهن وكبح الميل إلى تقليد فعل الفاحص.", "verbatim": false}, "translation_ar": "", "urls": ["https://onlinelibrary.wiley.com/doi/abs/10.1002/(SICI)1098-2302(199605)29:4%3C315::AID-DEV2%3E3.0.CO;2-T", "https://devcogneuro.com/Publications/Diamond_%26_Taylor_1996_Development_of_an_aspect.pdf"], "links": null, "strength": "explicit_7", "argument": "أكثر تحسن الطفل في ضبط استجابته واتباع التعليمات يقع بحلول السادسة، فهو عند السابعة أهل للتأديب والتعليم.", "jurisdiction": "الولايات المتحدة — جامعة بنسلفانيا", "title": "تطور تذكر التعليمات وضبط الاستجابة في الطفولة", "source_standing": "أديل دايموند من مؤسسي علم أعصاب نمو الإدراك عند الطفل؛ ونشرت البحث مجلة علم النفس الحيوي للنمو، لسان الجمعية الدولية لعلم النفس الحيوي للنمو.", "evidence_level": "دراسة تجريبية"}, {"section": "psy", "card_number": 41, "supports": ["7"], "author": {"name": "Sameroff AJ, Haith MM (eds.)", "date": "1996"}, "work": {"title": "The Five to Seven Year Shift: The Age of Reason and Responsibility", "section": "", "volume": "", "page": "", "edition": "Chicago: University of Chicago Press"}, "original": {"lang": "en", "text": "مضمونه: مجلد علمي جامع يوثق أن ما بين الخامسة والسابعة تحول معرفي واجتماعي وعصبي كوني، تعترف به الثقافات بإسناد مسؤوليات جديدة للطفل.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL18961824W"], "links": [{"url": "https://openlibrary.org/works/OL18961824W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit_7", "argument": "يثبت علم النمو الحديث أن ما بين الخامسة والسابعة تحول عام في الإدراك والسلوك، تعترف به الثقافات كلها بإسناد مسؤوليات جديدة إلى الطفل؛ وهو المعنى الذي سماه الفقهاء التمييز.", "jurisdiction": "الولايات المتحدة", "title": "علماء النمو — تحول الخامسة إلى السابعة", "source_standing": "أرنولد ساميروف من جامعة ميشيغان ومارشال هيث من جامعة دنفر، جمعا في الكتاب بحوث كبار علماء النمو؛ وصدر عن مطبعة جامعة شيكاغو ضمن سلسلة مؤسسة ماك آرثر في النمو.", "evidence_level": "كتاب علمي جامع"}, {"section": "psy", "card_number": 42, "supports": ["7"], "author": {"name": "White SH", "date": "1965"}, "work": {"title": "Evidence for a hierarchical arrangement of learning processes", "section": "Advances in Child Development and Behavior, vol. 2", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: البحث المؤسس لمفهوم «تحول الخامسة إلى السابعة» في أنماط التعلم.", "verbatim": false}, "translation_ar": "", "urls": ["https://doi.org/10.1016/s0065-2407(08)60483-8"], "links": [{"url": "https://doi.org/10.1016/s0065-2407(08)60483-8", "label": "صفحة الدراسة لدى الناشر", "site": "ساينس دايركت", "domain": "doi.org"}], "strength": "explicit_7", "argument": "دراسة وايت هي الأصل الذي بني عليه القول بتحول الخامسة إلى السابعة في أنماط التعلم، وهي حجة علمية على أن السابعة حد إدراكي لا عرف اجتماعي فحسب.", "jurisdiction": "الولايات المتحدة", "title": "دراسة وايت — تحول الخامسة إلى السابعة", "source_standing": "شلدون وايت عالم نفس في جامعة هارفارد، وبحثه أصل القول بتحول الخامسة إلى السابعة في علم النمو، ونشر في سلسلة التقدم في نمو الطفل وسلوكه.", "evidence_level": "بحث علمي مؤسس"}, {"section": "psy", "card_number": 43, "supports": ["7"], "author": {"name": "Piaget J", "date": "1972"}, "work": {"title": "The Principles of Genetic Epistemology (trans. W. Mays; L'épistémologie génétique, 1970)", "section": "London: Routledge & Kegan Paul, 1972 — ch. 1: «The stage of concrete operations»", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"The age of seven to eight years, on average, marks a decisive turning point in the development …\"", "verbatim": true}, "translation_ar": "«سن السابعة إلى الثامنة، في المتوسط، يمثل نقطة تحول حاسمة في النمو …» [بدء مرحلة العمليات المحسوسة: التفكير المنطقي المنظم].", "urls": ["https://archive.org/details/principlesofgene0000piag"], "links": [{"url": "https://archive.org/details/principlesofgene0000piag", "label": "الكتاب في مصدره", "site": "أرشيف الإنترنت", "domain": "archive.org"}], "strength": "explicit_7", "argument": "بياجيه نفسه يجعل السابعة «نقطة تحول حاسمة» في نمو العقل: فيها يبدأ التفكير المنطقي المنظم ويخرج الطفل من التمركز حول ذاته؛ وهذا هو التمييز الذي علق عليه الفقهاء انتهاء حضانة النساء.", "jurisdiction": "سويسرا — جامعة جنيف", "title": "بياجيه — سن السابعة إلى الثامنة نقطة تحول حاسمة في نمو العقل", "source_standing": "جان بياجيه (1896–1980) عالم النفس السويسري في جامعة جنيف، مؤسس نظرية النمو المعرفي وأكثر علماء النفس أثرا في فهم عقل الطفل؛ والكتاب خلاصة نظريته كتبها بنفسه في آخر عمره.", "evidence_level": "نظرية علمية مؤسسة"}, {"section": "psy", "card_number": 44, "supports": ["7"], "author": {"name": "Vygotsky LS", "date": "1934"}, "work": {"title": "The Problem of Age", "section": "Collected Works vol. 5", "volume": "", "page": "", "edition": "Plenum, 1998"}, "original": {"lang": "en", "text": "School age, like all other age levels, opens with a critical or turning-point period; this was described in the literature as the crisis at age seven before the other age levels were described. It was noted that in making the transition from preschool to school age, the child changes abruptly and becomes more difficult with respect to rearing than he was previously. This is a kind of transitional stage—he is no longer a preschooler and not yet a school child.", "verbatim": true}, "translation_ar": "«يفتتح سن المدرسة، كسائر المراحل العمرية، بفترة حرجة أو فترة انعطاف؛ وقد وصفت في الأدبيات باسم أزمة السابعة قبل أن توصف المراحل العمرية الأخرى. ولوحظ أن الطفل عند انتقاله من سن ما قبل المدرسة إلى سن المدرسة يتغير فجأة ويصير أصعب في التربية مما كان قبل ذلك. وهذه مرحلة انتقالية من نوع ما: فهو لم يعد طفل ما قبل المدرسة ولم يصر بعد تلميذا.»", "urls": ["https://link.springer.com/book/10.1007/978-1-4615-5401-1"], "links": [{"url": "https://link.springer.com/book/10.1007/978-1-4615-5401-1", "label": "صفحة الكتاب", "site": "دار سبرينغر", "domain": "link.springer.com"}], "strength": "explicit_7", "argument": "أزمة السابعة عند فيجوتسكي فقدان الطفل عفويته الأولى ووعيه بنفسه وبغيره، ودخوله طور التعلم المنظم؛ فهي في علم النفس ما التمييز في الفقه.", "jurisdiction": "روسيا", "title": "فيجوتسكي — أزمة السابعة", "source_standing": "ليف فيجوتسكي (1896–1934) عالم نفس روسي، مؤسس النظرية الاجتماعية الثقافية في نمو الطفل، وما زالت مفاهيمه أساس التربية الحديثة.", "evidence_level": "نظرية علمية مؤسسة"}, {"section": "psy", "card_number": 45, "supports": ["7"], "author": {"name": "Erikson EH", "date": "1950"}, "work": {"title": "Childhood and Society", "section": "", "volume": "", "page": "", "edition": "New York: Norton"}, "original": {"lang": "en", "text": "مضمونه: المرحلة الرابعة (الاجتهاد مقابل الشعور بالنقص) تبدأ نحو السادسة، وفيها يخرج الطفل من دائرة البيت إلى المدرسة والتعلم والإنجاز.", "verbatim": false}, "translation_ar": "", "urls": ["https://openlibrary.org/works/OL1194364W"], "links": [{"url": "https://openlibrary.org/works/OL1194364W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit_7", "argument": "يجعل إريكسون السادسة مبدأ طور يخرج فيه الطفل من البيت إلى التعلم والإنجاز، وهو طور يفتقر فيه إلى توجيه الأب كما يفتقر إلى رعاية الأم.", "jurisdiction": "الولايات المتحدة", "title": "إريكسون — السادسة بداية طور جديد", "source_standing": "إريك إريكسون (1902–1994) أستاذ في جامعة هارفارد، صاحب نظرية مراحل النمو النفسي الاجتماعي، وكتابه الطفولة والمجتمع من أوسع كتب علم النفس انتشارا.", "evidence_level": "نظرية علمية مؤسسة"}, {"section": "psy", "card_number": 46, "supports": ["childhood_ends_at_puberty"], "author": {"name": "Steinberg L", "date": "2014"}, "work": {"title": "Age of Opportunity: Lessons from the New Science of Adolescence", "section": "", "volume": "", "page": "", "edition": "Boston: Houghton Mifflin Harcourt"}, "original": {"lang": "en", "text": "Conventionally, \"adolescence\" has meant the stage of development that begins with puberty and ends with the economic and social independence of the young person from his or her parents. As I will explain, by that definition, ten to twenty-five isn't far off the mark today. [...] In this book, I use the term \"adolescence\" to refer to the period from ten until twenty-five.", "verbatim": true}, "translation_ar": "«جرى العرف على أن «المراهقة» هي مرحلة النمو التي تبدأ بالبلوغ وتنتهي باستقلال الشاب اقتصاديا واجتماعيا عن والديه. وكما سأبين، فإن المدى من العاشرة إلى الخامسة والعشرين ليس بعيدا عن الصواب اليوم بهذا التعريف. [...] وفي هذا الكتاب أستعمل لفظ «المراهقة» للدلالة على الفترة من سن 10 إلى سن 25.»", "urls": ["https://openlibrary.org/works/OL21102030W"], "links": [{"url": "https://openlibrary.org/works/OL21102030W", "label": "صفحة الكتاب", "site": "مكتبة Open Library", "domain": "openlibrary.org"}], "strength": "explicit", "argument": "أحد أعلام علم نفس المراهقة يجعل البلوغ حد الخروج من الطفولة، ويقرر تبكيره؛ فالخامسة عشرة ليست طفولة في علم النفس.", "jurisdiction": "الولايات المتحدة — جامعة تمبل", "title": "لورنس شتاينبرغ — المراهقة تبدأ بالبلوغ", "source_standing": "لورنس شتاينبرغ أستاذ علم النفس في جامعة تمبل، من أبرز علماء المراهقة في العالم، ورأس جمعية بحوث المراهقة، واستندت المحكمة العليا الأمريكية إلى أبحاثه.", "evidence_level": "كتاب علمي لعالم مرجع"}, {"section": "psy", "card_number": 47, "supports": ["shared_parenting"], "author": {"name": "Dagan O, Schuengel C, Verhage ML, van IJzendoorn MH, Sagi-Schwartz A, Madigan S, Duschinsky R, Roisman GI, Bernard K, Bakermans-Kranenburg M, Bureau JF, Volling BL, Wong MS, Colonnesi C, Brown GL, Eiden RD, Fearon RMP, Oosterman M, Aviezer O, Cummings EM; Collaboration on Attachment to Multiple Parents and Outcomes Synthesis", "date": "2021"}, "work": {"title": "Configurations of mother-child and father-child attachment as predictors of internalizing and externalizing behavioral problems: An individual participant data (IPD) meta-analysis", "section": "New Directions for Child and Adolescent Development. 2021;2021(180):67-94", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: حلل البحث بيانات 1097 طفلا من 9 دراسات وفق بروتوكول مسجل سلفا. ارتبط التعلق غير الآمن بأحد الأبوين أو بكليهما بزيادة المشكلات الداخلية قياسا إلى الأمان مع كليهما. وارتبط التعلق غير المنظم مع الأبوين معا بمشكلات خارجية أكثر. ولم ترجح النتائج اختلاف دور علاقة الطفل بأمه عن دور علاقته بأبيه في هذه النتائج.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/35005834/"], "links": null, "strength": "explicit", "argument": "الطفل الآمن مع أبويه معا أقل مشكلات من الآمن مع أحدهما، ولم يظهر للأم دور يرجح على دور الأب؛ فالرابطتان كلتاهما من صحة الطفل النفسية.", "jurisdiction": "تعاون دولي — الولايات المتحدة وهولندا والمملكة المتحدة وإسرائيل وكندا", "title": "أنماط التعلق بالوالدين والمشكلات السلوكية", "source_standing": "تحليل جامع لعدة دراسات لبيانات المشاركين الأفراد أجراه تعاون دولي في التعلق بالوالدين، من أعضائه ماريان باكرمانز كراننبرغ ومارينوس فان آيزندورن من هولندا، وهما من أكثر علماء التعلق أثرا في العالم.", "evidence_level": "تحليل جامع لبيانات الأفراد: أقوى أنواع التحليل الجامع للدراسات"}, {"section": "psy", "card_number": 48, "supports": ["shared_parenting"], "author": {"name": "Madigan S, Deneault AA, Duschinsky R, Bakermans-Kranenburg MJ, Schuengel C, van IJzendoorn MH, Ly A, Fearon RMP, Eirich R, Verhage ML", "date": "2024"}, "work": {"title": "Maternal and paternal sensitivity: Key determinants of child attachment security examined through meta-analysis", "section": "Psychological Bulletin. 2024;150(7):839-872", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "مضمونه: وجد التحليل ارتباطا موجبا بين حساسية مقدم الرعاية وأمان التعلق عبر 174 دراسة و22914 مشاركا. وارتبطت حساسية الأب بأمان التعلق به بمعامل 0.21 في 22 دراسة تضم 1626 مشاركا، مقابل 0.26 لحساسية الأم في 159 دراسة تضم 21483 مشاركا. وعد المؤلفون حجم الارتباطين متقاربا.", "verbatim": false}, "translation_ar": "", "urls": ["https://pubmed.ncbi.nlm.nih.gov/38709619/", "https://www.ncbi.nlm.nih.gov/nlmcatalog?term=%22Psychol+Bull%22%5BTitle+Abbreviation%5D"], "links": null, "strength": "explicit", "argument": "أكبر تحليل جامع في الباب يجعل حساسية الأب كحساسية الأم في بناء أمان الطفل، فلا يختص الأمان العاطفي بالأم.", "jurisdiction": "كندا — جامعة كالغاري؛ تعاون مع جامعات في المملكة المتحدة وهولندا والبرتغال", "title": "ح
