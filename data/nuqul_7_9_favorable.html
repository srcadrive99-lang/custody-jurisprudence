عتماد على الملف ومذكرات الاستئناف المكتوبة من غير أن يكون تحت يدها دليل خبرة نفسية لتقويم أقوال الطفل».", "urls": ["https://hudoc.echr.coe.int/eng?i=001-58763"], "links": [{"url": "https://hudoc.echr.coe.int/eng?i=001-58763", "label": "نص الحكم", "site": "قاعدة أحكام المحكمة الأوروبية", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "المحاكم الألمانية حرمت أبا من ابنه لأن الطفل في الخامسة قال إنه لا يريده، فقضت الدائرة الكبرى بأن ذلك انتهاك؛ فما قيمة «تخيير» طفل بعد سنين من الحبس عند أحد والديه؟", "jurisdiction": "المحكمة الأوروبية لحقوق الإنسان — الدائرة الكبرى، قضية ضد ألمانيا", "title": "المحكمة الأوروبية (الدائرة الكبرى) 2000 — رفض الطفل ابن الخامسة لأبيه لا يحسم بلا خبير نفسي: انتهاك لحق الأب", "source_standing": "أعلى درجات المحكمة الأوروبية لحقوق الإنسان، وأحكامها ملزمة لسبع وأربعين دولة؛ والقضية مرجع في أن أقوال الطفل الصغير برفض أبيه لا تؤخذ مجردة.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 257, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Cour européenne des droits de l'homme — Improta c. Italie, no 66396/14", "date": "2017"}, "work": {"title": "", "section": "حكم 4 مايو 2017، الفقرات 53 إلى 58؛ وقضت بانتهاك المادة 8", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "\"La Cour rappelle que, lorsque des difficultés apparaissent qui sont dues principalement au refus du parent avec lequel vit l'enfant de permettre des contacts réguliers entre ce dernier et l'autre parent, il appartient aux autorités compétentes de prendre les mesures adéquates afin de sanctionner ce manque de coopération ... La Cour observe que, en l'espèce, le requérant ne peut voir sa fille librement depuis le 30 avril 2010 et que, pendant les douze premiers mois de la procédure, les juridictions internes ont toléré que la mère régisse de manière unilatérale les modalités du droit de visite du requérant ... La Cour rappelle en effet que la rupture de contact avec un enfant très jeune peut conduire à une altération croissante de sa relation avec son parent.\"", "verbatim": true}, "translation_ar": "«تذكر المحكمة بأنه حين تنشأ صعوبات مردها أساسا إلى رفض الوالد الذي يعيش معه الطفل السماح باتصال منتظم بين الطفل والوالد الآخر، فعلى السلطات المختصة أن تتخذ التدابير الملائمة لمعاقبة هذا الامتناع عن التعاون... وتلاحظ المحكمة أن المدعي لا يستطيع رؤية ابنته بحرية منذ 30 أبريل 2010، وأن المحاكم الوطنية سمحت خلال الاثني عشر شهرا الأولى من الدعوى بأن تنظم الأم من جانبها وحدها كيفية زيارة المدعي... وتذكر المحكمة بأن انقطاع الصلة بطفل صغير جدا قد يؤدي إلى تدهور متزايد في علاقته بوالده».", "urls": ["https://hudoc.echr.coe.int/fre?i=001-173368", "https://hudoc.echr.coe.int/eng?i=001-173581"], "links": [{"url": "https://hudoc.echr.coe.int/fre?i=001-173368", "label": "نص الحكم بالفرنسية", "site": "قاعدة أحكام المحكمة الأوروبية", "domain": "hudoc.echr.coe.int"}, {"url": "https://hudoc.echr.coe.int/eng?i=001-173581", "label": "الترجمة الإنجليزية", "site": "قاعدة أحكام المحكمة الأوروبية", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "قضاء دولي يقرر أن تحكم الأم وحدها في زيارة الأب، وانقطاع الطفل الصغير عن أبيه، مما يجب على الدولة منعه ومعاقبته؛ وفي مصر هذا التحكم هو القانون نفسه.", "jurisdiction": "المحكمة الأوروبية لحقوق الإنسان — قضية ضد إيطاليا", "title": "المحكمة الأوروبية 2017 — انقطاع الصلة بطفل صغير جدا يفسد علاقته بوالده تدريجيا، وعلى الدولة معاقبة الحاضن الممتنع", "source_standing": "المحكمة الأوروبية لحقوق الإنسان، وأحكامها ملزمة للدول الأعضاء في مجلس أوروبا؛ والقضية مرجع في واجب الدولة أن تعاقب الحاضن الذي يمنع الوالد الآخر من ولده.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 258, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "Cour européenne des droits de l'homme — Cengiz Kılıç c. Turquie, no 16192/06", "date": "2011"}, "work": {"title": "", "section": "حكم 6 ديسمبر 2011، الفقرات 127 إلى 134؛ وقضت بانتهاك المادة 8 والمادة 6 والمادة 13", "volume": "", "page": "", "edition": ""}, "original": {"lang": "de", "text": "\"le requérant a formulé, pas moins de dix fois, des demandes tendant à assurer le maintien de ses relations personnelles avec son fils ou informant le tribunal que son droit de visite avait été entravé par la mère de l'enfant. En outre, elle relève que le requérant est resté sans contact, ou en contact très limité, avec son enfant pendant des périodes allant jusqu'à deux ans. ... le recours à des sanctions ne doit pas être écarté en cas de comportement manifestement illégal du parent avec lequel vit l'enfant\"", "verbatim": true}, "translation_ar": "«قدم المدعي ما لا يقل عن عشر مرات طلبات ترمي إلى ضمان استمرار علاقاته الشخصية بابنه أو تبلغ المحكمة بأن أم الطفل عرقلت حقه في الزيارة. وتلاحظ المحكمة فوق ذلك أن المدعي بقي بلا اتصال بولده، أو باتصال محدود جدا، مددا بلغت سنتين... واللجوء إلى العقوبات لا يستبعد في حالة السلوك المخالف للقانون مخالفة ظاهرة من الوالد الذي يعيش معه الطفل».", "urls": ["https://hudoc.echr.coe.int/fre?i=001-107718", "https://hudoc.echr.coe.int/eng?i=001-107719"], "links": [{"url": "https://hudoc.echr.coe.int/fre?i=001-107718", "label": "نص الحكم بالفرنسية", "site": "قاعدة أحكام المحكمة الأوروبية", "domain": "hudoc.echr.coe.int"}, {"url": "https://hudoc.echr.coe.int/eng?i=001-107719", "label": "الترجمة الإنجليزية", "site": "قاعدة أحكام المحكمة الأوروبية", "domain": "hudoc.echr.coe.int"}], "strength": "explicit", "argument": "تركيا أدينت دوليا لأنها تركت أما تمنع أبا من ابنه سنتين رغم عشر شكاوى؛ والقانون المصري يجعل هذا المنع هو الأصل بلا شكوى ولا عقوبة.", "jurisdiction": "المحكمة الأوروبية لحقوق الإنسان — قضية ضد تركيا", "title": "المحكمة الأوروبية 2011 ضد تركيا — أب شكا عشر مرات وحرم من ابنه سنتين: على الدولة أن تعاقب الحاضن المخالف", "source_standing": "المحكمة الأوروبية لحقوق الإنسان في قضية ضد دولة مسلمة عضو في مجلس أوروبا؛ وأحكامها ملزمة، وتستشهد بتوصية مجلس أوروبا في الوساطة الأسرية لحفظ استمرار الصلة بين الوالدين والأطفال.", "evidence_level": "حكم قضاء دولي ملزم"}, {"section": "court", "card_number": 259, "supports": ["7"], "author": {"name": "High Court of Andhra Pradesh (Division Bench, Letters Patent Appeal) — judgment by Raghuvir J.", "date": "1982"}, "work": {"title": "Mohammed Jameel Ahmed Ansari v. Ishrath Sajeeda and others", "section": "Letters Patent Appeal, judgment of 5 October 1982; AIR 1983 AP 106", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Under Muslim law, after the age of 7 years, it is the father who is entitled to the custody of the child, unless the Court holds on evidence, the father is not a fit person or that it is not conducive to the health whether physical or mental of the child. … Ordinarily, the children are to be with the father. … The child is above seven years. … We are of the view that on the evidence since nothing is brought out against the father to show he is unfit we hold, he is entitled to the custody of the child.\"", "verbatim": true}, "translation_ar": "«في الشريعة الإسلامية، بعد سن 7 سنين يكون الأب هو صاحب الحق في حضانة الولد، ما لم تثبت المحكمة بالبينة أن الأب غير صالح، أو أن ذلك يضر بصحة الولد البدنية أو النفسية. … والأصل أن يكون الأولاد عند الأب. … والولد فوق السابعة. … ونرى أنه لما لم يثبت في الأدلة شيء ضد الأب يدل على عدم صلاحيته، فإننا نقضي بأنه صاحب الحق في حضانة الولد.»", "urls": ["https://indiankanoon.org/doc/991616/", "https://indiankanoon.org/doc/116184888/"], "links": [{"url": "https://indiankanoon.org/doc/991616/", "label": "نص الحكم", "site": "قاعدة الأحكام الهندية", "domain": "indiankanoon.org"}, {"url": "https://indiankanoon.org/doc/116184888/", "label": "المصدر الثاني", "site": "قاعدة الأحكام الهندية", "domain": "indiankanoon.org"}], "strength": "explicit_7", "argument": "قضاء صريح بأن حضانة الأم للولد تنتهي بالسابعة وأن «الأصل أن يكون الأولاد عند الأب» بعدها، مع تطبيق فعلي: تسليم ولد جاوز السابعة إلى أبيه رغم بقائه سنوات عند أقارب أمه، ودون أن يحتاج الأب إلى إثبات شيء سوى عدم ثبوت عدم صلاحيته.", "jurisdiction": "الهند — محكمة أندرا براديش العليا (دائرة من قاضيين)", "title": "محكمة أندرا براديش العليا 1982 — في الشريعة الإسلامية: بعد السابعة الأب هو المستحق لحضانة الولد", "source_standing": "ولد مولود في 1 أكتوبر 1970، طلقت أمه وتزوجت بأجنبي سنة 1974 وسافرت، وبقي الولد عند جده وجدته لأمه، ورفضت المحكمة الابتدائية ثم القاضي الفرد طلب الأب؛ فقضت دائرة الاستئناف بتسليم الولد (وعمره نحو 12 سنة) إلى أبيه لأن حضانة الأم تنتهي بالسابعة ولم يثبت ما يقدح في صلاحية الأب. ولجنة القانون في الهند (التقرير 257 سنة 2015، الفقرة 2.3.3) لخصت الحكم بأن المحكمة «منحت حضانة ولد في الحادية عشرة لأبيه لأن الشريعة الإسلامية لا تجعل للأم حضانة منفردة إلا إلى السابعة في الذكور».", "evidence_level": "حكم محكمة عليا إقليمية (High Court، دائرة استئنافية)"}, {"section": "court", "card_number": 260, "supports": ["7"], "author": {"name": "High Court of Judicature at Bombay — V.R. Kingaonkar J.", "date": "2007"}, "work": {"title": "Syyad Sabdarali Sy. Nyajali v. Shahistabegum w/o Sayyad Sabdarali", "section": "Appeal against the order of the IVth Ad-hoc Additional District Judge, Jalgaon, in Misc. C.A. No. 108 of 2005; judgment of 3 August 2007; 2007(5) Bom CR 36; 200", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"all the three minor sons are willing to continue their association with the mother and want to live with her … it does not mean that mere willingness of the minor would be dicisive factor. … The custody of male child over seven years of age will have to be given to the father … The appellant has proved that he is a fit person. … Child -Sayyad Danish be given in custody of the appellant -Sayyad Sabdarali, if he would furnish an undertaking … the child will be admitted in a standard school at Bhusawal or nereby area\"", "verbatim": true}, "translation_ar": "«الأبناء القاصرون الثلاثة كلهم راغبون في استمرار صلتهم بالأم ويريدون العيش معها … لكن هذا لا يعني أن مجرد رغبة القاصر تكون هي العامل الحاسم. … وحضانة الولد الذكر الذي جاوز سبع سنين يجب أن تعطى للأب … وقد أثبت المستأنف [الأب] أنه شخص صالح. … يسلم الولد سيد دانش إلى حضانة المستأنف سيد صبدر علي إذا قدم تعهدا … بأن يلحق الولد بمدرسة نظامية في بهوساول أو ما جاورها.»", "urls": ["https://indiankanoon.org/doc/225602/"], "links": [{"url": "https://indiankanoon.org/doc/225602/", "label": "نص الحكم", "site": "قاعدة الأحكام الهندية", "domain": "indiankanoon.org"}], "strength": "explicit_7", "argument": "تطبيق قضائي حديث للقاعدة: الولد الذي جاوز السابعة يسلم إلى أبيه وإن رغب في البقاء مع أمه، لأن رغبة القاصر ليست العامل الحاسم؛ والصغار دون السابعة عند الأم. وهو شاهد على أن «الحضانة إلى السابعة ثم الأب» قاعدة معمول بها في محاكم تطبق الفقه الحنفي اليوم.", "jurisdiction": "الهند — محكمة بومباي العليا", "title": "محكمة بومباي العليا 2007 — حضانة الذكر فوق السابعة تعطى للأب، ورغبة الصغير ليست حاسمة", "source_standing": "أب مسلم له ثلاثة أبناء أعمارهم عند رفع الدعوى سنة 2005: 7 و4 و2، قضت المحكمة الابتدائية بحضانة الأم للثلاثة؛ فعدلت المحكمة العليا الحكم: الابن الذي جاوز السابعة يسلم إلى الأب بشرط إلحاقه بمدرسة نظامية مع زيارة الأم له يوم الأحد، والصغيران يبقيان عند الأم. أي قسمة بحسب السن تطابق قاعدة الفقه حرفيا.", "evidence_level": "حكم محكمة عليا إقليمية (High Court)"}, {"section": "court", "card_number": 261, "supports": ["7"], "author": {"name": "High Court for the State of Telangana (Division Bench) — P. Sam Koshy and Sambasivarao Naidu JJ.", "date": "2024"}, "work": {"title": "Khusro Vilayatullah Khan v. Syed Mustafa Abdul Khader", "section": "Family Court Appeal Nos. 157 and 158 of 2024; judgment of 8 July 2024", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"Under Muslim law, after the age of 7 years, it is the father who is entitled to the custody of the child, unless the Court holds on evidence, the father is not a fit person or that is not conducive to the health whether physical or mental of the child. Ordinarily, the children are to be with the father. … the mother is having absolute custody with regard to female child until she attains puberty … Being the natural biological father undisputedly the respondent is the natural guardian also.\"", "verbatim": true}, "translation_ar": "«في الشريعة الإسلامية، بعد سن 7 سنين يكون الأب هو صاحب الحق في حضانة الولد، ما لم تثبت المحكمة بالبينة أن الأب غير صالح أو أن ذلك يضر بصحة الولد البدنية أو النفسية. والأصل أن يكون الأولاد عند الأب. … وللأم حضانة مطلقة على البنت حتى تبلغ … ولما كان [المدعى عليه] الأب البيولوجي الطبيعي بلا نزاع فهو الولي الطبيعي أيضا.»", "urls": ["https://indiankanoon.org/doc/82098008/", "https://indiankanoon.org/doc/90433711/"], "links": [{"url": "https://indiankanoon.org/doc/82098008/", "label": "نص الحكم", "site": "قاعدة الأحكام الهندية", "domain": "indiankanoon.org"}, {"url": "https://indiankanoon.org/doc/90433711/", "label": "المصدر الثاني", "site": "قاعدة الأحكام الهندية", "domain": "indiankanoon.org"}], "strength": "explicit_7", "argument": "أحدث تبن قضائي (2024) للقاعدة بصيغة صريحة: «بعد 7 سنين الأب هو صاحب حق الحضانة، والأصل أن يكون الأولاد عند الأب»، مع تقرير أن الأب هو الولي الطبيعي ولا يقدم عليه أقارب الأم.", "jurisdiction": "الهند — محكمة تيلانغانا العليا (دائرة من قاضيين)", "title": "محكمة تلنكانا العليا 2024 — تقرير القاعدة: الأب مستحق الحضانة بعد السابعة وهو الولي الطبيعي", "source_standing": "جد وجدة لأم طلبا حضانة طفلين (بنت مولودة في 9 نوفمبر 2019 وولد مولود في 7 ديسمبر 2020) بعد وفاة أمهما في 6 يونيو 2021 وزواج الأب ثانية؛ فرفضت الدائرة طلبهما وأبقت الحضانة والولاية للأب لأنه الولي الطبيعي، وقررت أن زواج الأب ثانية ليس بذاته مسقطا، مع توسيع زيارة الجد والجدة.", "evidence_level": "حكم محكمة عليا إقليمية (High Court، دائرة من قاضيين)"}, {"section": "court", "card_number": 262, "supports": ["7"], "author": {"name": "High Court of Madras — Krishnaswami Nayudu J.", "date": "1951"}, "work": {"title": "Zynab Bi alias Bibijan v. Mohammad Ghouse Mohideen", "section": "Judgment of 17 May 1951; AIR 1952 Mad 284", "volume": "", "page": "", "edition": ""}, "original": {"lang": "en", "text": "\"the mother is entitled to hizanat or custody of the male child until he has completed the age of seven years … (Kasak saya that the Hizanat, with respect to a boy, ceases at the end of seven years, as in general a child at that age is capable of performing all the necessary offices for himself, without assistance) … because, when thus far advanced, it then becomes necessary to attend to his education in all branches of useful and ornamental science\"", "verbatim": true}, "translation_ar": "«الأم صاحبة الحق في الحضانة، أي في إمساك الولد الذكر، حتى يتم سبع سنين … (يقول كساك [كذا في الأصل] إن الحضانة بالنسبة إلى الصبي تنتهي بتمام سبع سنين، لأن الولد في تلك السن يستطيع في الغالب أن يقوم بجميع حاجاته الضرورية بنفسه دون معونة) … لأنه إذا بلغ هذا الحد صار من اللازم الالتفات إلى تعليمه في جميع فروع العلوم النافعة والجمالية.»", "urls": ["https://indiankanoon.org/doc/919708/"], "links": [{"url": "https://indiankanoon.org/doc/919708/", "label": "نص الحكم", "site": "قاعدة الأحكام الهندية", "domain": "indiankanoon.org"}], "strength": "explicit_7", "argument": "محكمة تطبق الفقه الحنفي تثبت أن حد السابعة ليس تحكما بل مبني على علة: استغناء الصبي بنفسه في السابعة وحاجته بعدها إلى التعليم والتأديب؛ وهو نفس تعليل الهداية والمبسوط الذي يقوم عليه المتن.", "jurisdiction": "الهند — محكمة مدراس العليا", "title": "محكمة مدراس العليا 1951 — حضانة الأم للذكر تنتهي بتمام السابعة لاستغنائه، ثم يحتاج التعليم", "source_standing": "نزاع بين أب وأم مطلقة على بنت في نحو الخامسة وولد دون الثانية؛ قررت المحكمة القاعدة الحنفية بنصها ونقلت علتها من ترجمة هاملتون للهداية (استغناء الصبي بنفسه في السابعة ثم حاجته إلى التعليم)، ثم طبقتها كما هي: الولدان دون السن عند الأم مع زيارة الأب مرتين في الأسبوع.", "evidence_level": "حكم محكمة عليا إقليمية (High Court)"}, {"section": "azhar", "card_number": 263, "supports": ["7"], "author": {"name": "الشيخ محمد المهدي العباسي — مفتي الديار المصرية وشيخ الأزهر", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«سئل في رجل متزوج بامرأة خرجت الآن عن طاعته ومعها منه صبي بلغ عمره سبع سنين وزيادة ولم تمكن والده من رؤيته لأجل أن يعلمه ويحسن تربيته فهل للأب أخذه بلا تخيير للولد بين أمه وأبيه؟ أجاب: تنتهي حضانة الذكر باستغنائه وقدر بسبع سنين على ما به يفتى فإذا بلغ سن الصغير المذكور سبع سنين يكون لأبيه أخذه وضمه إلى نفسه كما يكون له ردها إلى طاعته إن خرجت بغير حق ولا يخير الصغير عندنا والله تعالى أعلم»", "verbatim": true}, "translation_ar": "", "urls": ["https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA290", "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA290&output=text"], "links": [{"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA290", "label": "الفتوى في صفحتها من الكتاب", "site": "كتب Google", "domain": "books.google.com"}, {"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA290&output=text", "label": "نص الصفحة", "site": "كتب Google", "domain": "books.google.com"}], "strength": "explicit_7", "argument": "شيخ الأزهر ومفتي مصر يقطع بأمرين: حضانة النساء للولد تنتهي بسبع سنين، ولا تخيير للصغير. والواقعة نفسها أم منعت الأب من رؤية ابنه، فكان الجواب ضم الولد إلى أبيه. لا تخيير مع تغييب.", "jurisdiction": "مصر — مفتي الديار المصرية وشيخ الأزهر", "title": "الفتاوى المهدية — الأم منعت الأب من رؤية ابنه: يضمه أبوه في السابعة ولا يخير الصغير", "source_standing": "الشيخ محمد المهدي العباسي (1827-1897) تولى منصب مفتي الديار المصرية وهو في نحو الحادية والعشرين، ثم صار شيخا للأزهر، وهو أول حنفي يتولى مشيخة الأزهر. وكتابه «الفتاوى المهدية في الوقائع المصرية» يجمع فتاواه الرسمية في قضايا المصريين الواقعية، وكل فتوى فيه مؤرخة بالشهر والسنة الهجرية، وطبع في المطبعة الأزهرية سنة 1301هـ.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 264, "supports": ["9", "silat_al_rahim"], "author": {"name": "الشيخ محمد المهدي العباسي — مفتي الديار المصرية وشيخ الأزهر", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«تسقط حضانة الأنثى ببلوغ سنها تسع سنين على ما عليه الفتوى وليس للأب بعد انقضاء حضانة الصغيرة منع أمها من رؤيتها وليس للأم ضمها إليها والحال هذه والله تعالى أعلم»", "verbatim": true}, "translation_ar": "", "urls": ["https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA299", "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA299&output=text"], "links": [{"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA299", "label": "الفتوى في صفحتها من الكتاب", "site": "كتب Google", "domain": "books.google.com"}, {"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA299&output=text", "label": "نص الصفحة", "site": "كتب Google", "domain": "books.google.com"}], "strength": "explicit_9", "argument": "الفتوى تجمع الأمرين معا: حضانة النساء تنتهي بتسع سنين، وصلة البنت بأمها باقية بعدها، فلا يملك الأب منع الأم من رؤيتها. الطفل لأبويه معا قبل التاسعة وبعدها.", "jurisdiction": "مصر — مفتي الديار المصرية وشيخ الأزهر", "title": "الفتاوى المهدية — البنت إلى أبيها في التاسعة ولا يمنع الأب أمها من رؤيتها", "source_standing": "الشيخ محمد المهدي العباسي (1827-1897) تولى منصب مفتي الديار المصرية وهو في نحو الحادية والعشرين، ثم صار شيخا للأزهر، وهو أول حنفي يتولى مشيخة الأزهر. وكتابه «الفتاوى المهدية في الوقائع المصرية» يجمع فتاواه الرسمية في قضايا المصريين الواقعية، وكل فتوى فيه مؤرخة بالشهر والسنة الهجرية، وطبع في المطبعة الأزهرية سنة 1301هـ.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 265, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "الشيخ محمد المهدي العباسي — مفتي الديار المصرية وشيخ الأزهر", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«سئل في رجل أخذ بنته من حاضنتها بعد بلوغ سن الحضانة ووضعها عند أخيها من أبيها فأرادت أم البنت أن تنظرها هي وخالة البنت التي كانت حاضنة لها قبل بلوغ سن الحضانة بسبب تزوج أم البنت في كل جمعة مرة أو في كل شهر فهل تجابان لذلك وليس لأخي البنت المذكور منعهما من ذلك؟ أجاب: لا تمنع الأم والخالة من رؤية البنت المذكورة وليس للأخ منعهما من ذلك بدون وجه شرعي والله تعالى أعلم»", "verbatim": true}, "translation_ar": "", "urls": ["https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA283", "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA283&output=text"], "links": [{"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA283", "label": "الفتوى في صفحتها من الكتاب", "site": "كتب Google", "domain": "books.google.com"}, {"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA283&output=text", "label": "نص الصفحة", "site": "كتب Google", "domain": "books.google.com"}], "strength": "explicit", "argument": "انتهاء الحضانة لا يقطع الطفل عن أمه: الفتوى تثبت للأم والخالة رؤية البنت كل جمعة، وتمنع من يحول بينهما. الحق للطفل في أبويه وأهلهما معا قبل السابعة والتاسعة وبعدهما.", "jurisdiction": "مصر — مفتي الديار المصرية وشيخ الأزهر", "title": "الفتاوى المهدية — بعد انتهاء الحضانة لا تمنع الأم من رؤية بنتها كل جمعة", "source_standing": "الشيخ محمد المهدي العباسي (1827-1897) تولى منصب مفتي الديار المصرية وهو في نحو الحادية والعشرين، ثم صار شيخا للأزهر، وهو أول حنفي يتولى مشيخة الأزهر. وكتابه «الفتاوى المهدية في الوقائع المصرية» يجمع فتاواه الرسمية في قضايا المصريين الواقعية، وكل فتوى فيه مؤرخة بالشهر والسنة الهجرية، وطبع في المطبعة الأزهرية سنة 1301هـ.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 266, "supports": ["7"], "author": {"name": "الشيخ محمد المهدي العباسي — مفتي الديار المصرية وشيخ الأزهر", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«حق تربية الصغيرين المذكورين وحضانتهما لأمهما إلى سن التمييز المقدر بسبع سنين إذا كانت الأم صالحة للحضانة قادرة على القيام بها وعلى الأب أجرة حضانتهما …»", "verbatim": true}, "translation_ar": "", "urls": ["https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA267", "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA267&output=text"], "links": [{"url": "https://books.google.com/books?id=yRVVb3vnlhQC&pg=PA267", "label": "الفتوى في صفحتها من الكتاب", "site": "كتب Google", "domain": "books.google.com"}, {"url": "https://books.google.com/bo e": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فمن الأحق بحضانة البنت المذكورة من المذكورين وإلى متى تستمر الحضانة وبعدها من الذى يضمها إليه … إذا كان الحال ما ذكر بالسؤال فحضانة البنت المذكورة تكون لعمتها الشقيقة المذكورة حيث كانت أهلا لذلك وتستمر حضانتها حتى يكمل لها تسع سنين ومتى انتهت هذه المدة تدفع للأقرب من العصبات بحيث لا يكون غير محرم.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/670", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/670", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_9", "argument": "يثبت أن القاعدة المصرية الرسمية منذ أول سجلات دار الإفتاء: حضانة النساء للبنت «تستمر حتى يكمل لها تسع سنين» ثم «تدفع للأقرب من العصبات» من الرجال المحارم — أي أن التاسعة حد قاطع للبنت يعقبه الانتقال إلى جهة الأب.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى مفتي الديار المصرية حسونة النواوي 1896 — حضانة البنت تستمر حتى تكمل تسع سنين", "source_standing": "من أقدم الفتاوى المسجلة في سجلات دار الإفتاء المصرية (بدأت سنة 1313 ه)، بتوقيع الشيخ حسونة النواوي مفتي الديار المصرية (1895-1899) وشيخ الأزهر بعد ذلك.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 281, "supports": ["silat_al_rahim"], "author": {"name": "دار الإفتاء المصرية — المفتي محمد عبده", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«تجبر الحاضنة على العودة بالولد إلى محل إقامة والده مادام سفرها كان إلى بلد ليس بلدها ولم تتزوج فيه وكانت بينهما مسافة بعيده لا يتأتى بسببها أن ينظر الوالد ابنه ويبيت فى بيته فى يوم واحد … فليس لها السفر بالولد وللأب أن يمنعها من السفر به إليها … بحيث لا يمكن للأب أن يطالع ولده ويبيت فى بيته … فعليها أن تعود به إلى بلدة يمكن للوالد أن يرى ولده فيها ويرجع إل "}, {"url": "https://shamela.ws/book/432", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "تطبيق عملي: ابن التاسعة «انتهت مدة حضانته فيضمه أبوه إليه» ولا تملك الجدة السفر به، وحتى الصغيران اللذان ما زالا في سن الحضانة لا تنقلهما الحاضنة من مكانهما «إلا بإذن أبيهما» — فالأب صاحب قرار في مكان ولده لا مجرد زائر.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى محمد بخيت 1915 — من بلغ تسعا انتهت حضانته فيضمه أبوه، ولا تنقل الحاضنة المحضون إلا بإذن أبيه", "source_standing": "فتوى رسمية لمفتي الديار المصرية الشيخ محمد بخيت المطيعي في المجموعة الرسمية لفتاوى دار الإفتاء المصرية، في سؤال عن ثلاثة أولاد ماتت أمهم: ابن في التاسعة ورضيع وبنت في الرابعة.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 283, "supports": ["7"], "author": {"name": "دار الإفتاء المصرية — المفتي محمد بخيت (المطيعي)", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«ومتى انتهت مدة حضانة الغلام بأن بلغ سبع سنين يسلم إلى العصبة على ترتيب الأرث فيقدم الأب ثم الجد ثم الأخ الشقيق ثم الأخ لأب ثم بنو الأخ الشقيق ثم بنو الأخ لأب ثم العم الشقيق ثم العم لأب»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/683", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/683", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "نص قاطع: مدة حضانة الغلام تنتهي ببلوغه سبع سنين ثم «يسلم إلى العصبة على ترتيب الإرث فيقدم الأب» — السابعة حد انتقال لا حد ابتداء لتقدير قضائي.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى محمد بخيت 1916 — إذا بلغ الغلام سبعا سلم إلى العصبة ويقدم الأب", "source_standing": "فتوى رسمية لمفتي الديار المصرية الشيخ محمد بخيت المطيعي في المجموعة الرسمية لفتاوى دار الإفتاء المصرية.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 284, "supports": ["7", "9"], "author": {"name": "دار الإفتاء المصرية — المفتي محمد بخيت (المطيعي)", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«2 - ليس للأم حق حضانة الأولاد بعد خروجهم من سن الحضانة. … جاء فى المادة 391 من الأحوال الشخصية أن مدة حضانة الغلام تنتهى إذا بلغ سبع سنين ومدة حضانة الصبية ببلوغها تسع سنين وللأب حينئذ أخذهما من الحاضنة فإن لم يطلبهما أجبر على أخذهما وإن لم يكن للولد أب ولا جد يدفع للأقرب من العصبة أو للوصى لو غلاما ولا تسلم الصبية لغير محرم»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/684", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/684", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "نص صريح من مفتي مصر ينقل المادة 391 من تقنين قدري باشا: حضانة النساء تنتهي بسبع للغلام وتسع للبنت، والأب يأخذهما عندئذ بل يجبر على أخذهما، ولا حق للأم بعد هذه السن. هذا هو النص الذي يثبت أن القاعدة المصرية الأصلية قبل 1929 هي 7 و9 ثم الضم إلى الأب.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى مفتي الديار المصرية محمد بخيت 1917 — المادة 391: الغلام إلى أبيه في السابعة والصبية في التاسعة", "source_standing": "فتوى رسمية مسجلة في سجلات دار الإفتاء المصرية بتوقيع مفتي الديار المصرية الشيخ محمد بخيت المطيعي (مفتي مصر 1914-1920 وأحد كبار فقهاء الحنفية)، منشورة في المجموعة الرسمية «فتاوى دار الإفتاء المصرية». والفتوى تنقل نص المادة 391 من كتاب «الأحكام الشرعية في الأحوال الشخصية» لمحمد قدري باشا، وهو المرجع الذي كانت تحكم به المحاكم الشرعية المصرية قبل 1929.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 285, "supports": ["7", "9"], "author": {"name": "دار الإفتاء المصرية — المفتي محمد بخيت (المطيعي)", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«تنتهى الحضانة بالنسبة للغلام باستغنائه عن خدمة النساء وذلك ببلوغه سبع سنين وللصبية ببلوغها تسع سنين. فإذا انتهت الحضانة أخذهما الأب من الحاضنة فإن لم يأخذهما أجبر على ذلك … فإذا انتهت مدة الحضانة دخل فى دور جديد يحتاج فيه إلى الإعداد بما هو مطالب به فى المستقبل … فإن الولد المذكور بعد بلوغه السن المذكور وهو سبع سنين يحتاج إلى تعلم ما ينفعه. والأنثى بعد بلوغها تسع سنين تبلغ حد الشهوة وبعد بلوغها حد الشهوة تحتاج إلى الحفظ والصيانة ولا شك أن الأب أقدر على ذلك إن كان موجودا»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/680", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/680", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "يقدم التعليل المصري الرسمي لانتهاء حضانة النساء: الولد بعد السابعة يدخل «دورا جديدا» يحتاج فيه إلى الإعداد لما هو مطالب به في المستقبل وإلى تعلم ما ينفعه، والبنت بعد التاسعة تبلغ حد الشهوة فتحتاج إلى الحفظ والصيانة، والأب أقدر على ذلك؛ ثم يسلمان إلى الأب ويجبر على أخذهما مراعاة لحق الصغير.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى محمد بخيت 1918 — علة انتهاء الحضانة: الغلام يحتاج الإعداد والتعليم، والصبية الحفظ والصيانة، والأب أقدر", "source_standing": "فتوى رسمية مطولة لمفتي الديار المصرية الشيخ محمد بخيت المطيعي في نزاع حضانة أولاد أسلمت أمهاتهم، منشورة في المجموعة الرسمية لفتاوى دار الإفتاء المصرية، تحيل صراحة إلى المادة 391 من «الأحكام الشرعية في الأحوال الشخصية» (قدري باشا) وتعلل الحكم.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 286, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "دار الإفتاء المصرية — المفتي محمد بخيت", "date": "1920"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«… إذا سقطت حضانة الأم وأخذه الأب لا يجبر على أن يرسله لها … وفى رد المحتار عليه بالصحيفة المذكورة نقلا عن التتارخانية ما نصه: الولد متى كان عند أحد الأبوين لا يمنع الآخر عن النظر إليه وعن تعهده …»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/820", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/820", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المجموعة الرسمية لفتاوى دار الإفتاء", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "قاعدة الرعاية المشتركة بالمناصفة في فتوى رسمية قبل مئة عام: الولد عند أي من أبويه لا يحجب عن الآخر، فلكل منهما أن يراه ويتعهده.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى محمد بخيت 1920 — الولد عند أحد الأبوين لا يمنع الآخر من النظر إليه وتعهده", "source_standing": "فتوى رسمية في سجلات دار الإفتاء المصرية بتوقيع الشيخ محمد بخيت المطيعي مفتي الديار المصرية (1914-1920)، بتاريخ 18 فبراير 1920، في المجموعة الرسمية «فتاوى دار الإفتاء المصرية».", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 287, "supports": ["silat_al_rahim"], "author": {"name": "دار الإفتاء المصرية — المفتي أحمد هريدي", "date": "1964"}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«انتهاء مدة الحضانة أو سقوط الحق فيها بالنسبة للنساء يجيز للأب السفر بالصغار إلى مكان قريب أو بعيد ما دام لم يوجد من النساء من يحضنهم … وجود الأولاد فى حضانة الأب لا يقتضى إجباره على إرسالهم إلى الأم لرؤيتهم، ولكن ليس له منعها من الرؤية إذا ما ذهبت إليهم»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/821", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/821", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المجموعة الرسمية لفتاوى دار الإفتاء", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "بعد انتهاء حضانة النساء يكون الأولاد عند أبيهم، وتبقى صلتهم بأمهم: لا يمنعها الأب من رؤيتهم.", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى مفتي الجمهورية أحمد هريدي 1964 — بعد انتهاء الحضانة الأولاد عند أبيهم، ولا يمنع الأم من رؤيتهم", "source_standing": "فتوى رسمية في سجلات دار الإفتاء المصرية بتوقيع الشيخ أحمد هريدي مفتي الجمهورية (1960-1970)، بتاريخ 23 مايو 1964، في المجموعة الرسمية «فتاوى دار الإفتاء المصرية».", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "azhar", "card_number": 288, "supports": ["7", "9"], "author": {"name": "دار الإفتاء المصرية — المفتي أحمد هريدي", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وأن حق الحضانة يثبت للنساء من حين ولادة الصغير إلى سن معينة حددت بسبع سنين بالنسبة للصغير وتسع سنين بالنسبة للصغيرة. … 4 - بامتناعها عن تسليمه تؤمر من القاضى بذلك إذا رفع الأمر إليه»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/432/705", "https://shamela.ws/book/432"], "links": [{"url": "https://shamela.ws/book/432/705", "label": "الفتوى في مصدرها", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/432", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "يثبت أن دار الإفتاء المصرية ظلت حتى 1967 تقرر أن حضانة النساء «إلى سن معينة حددت بسبع سنين بالنسبة للصغير وتسع سنين بالنسبة للصغيرة»، وأن الممتنعة عن التسليم «تؤمر من القاضي بذلك».", "jurisdiction": "مصر — دار الإفتاء المصرية (مفتي الديار المصرية)", "title": "فتوى مفتي الجمهورية أحمد هريدي 1967 — حق النساء في الحضانة محدد بسبع للصغير وتسع للصغيرة", "source_standing": "فتوى رسمية للشيخ أحمد هريدي مفتي الديار المصرية (1960-1970) في المجموعة الرسمية لفتاوى دار الإفتاء المصرية؛ صدرت بعد قانون 1929 بعقود ومع ذلك قررت الحد الشرعي 7 و9 بلا ذكر لأي مد قضائي.", "evidence_level": "فتوى رسمية لمفتي الدولة"}, {"section": "eg", "card_number": 289, "supports": ["7", "9"], "author": {"name": "محمد زيد الأبياني", "date": "ت 1355 هـ"}, "work": {"title": "مختصر شرح الأحكام الشرعية في الأحوال الشخصية", "section": "شرح كتاب قدري باشا، الطبعة الثانية، مصر 1912", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وقد حكم الشارع بأن الولد يبقى عند الحاضنة حتى يستغني عن خدمة النساء، وقدر ذلك ببلوغه سبع سنين، فإن كان مذكرا فقد انتهت مدة حضانته، وإن كان مؤنثا بقي عندها سنتين لتدريبها على الأمور المنزلية التي هي مطالبة بها في المستقبل، وحينئذ يسلم كل منهما إلى الأب حتى إذا لم يطلبهما يجبر على ذلك لتعلق حق الصغير به، إذ المذكر بعد بلوغه سن التمييز يحتاج إلى تعلم ما ينفعه، والأنثى بعد بلوغها حد الشهوة تحتاج إلى الصيانة، ولا شك في أن الأب أقدر على ذلك…»", "verbatim": true}, "translation_ar": "", "urls": ["https://sites.dlib.nyu.edu/viewer/books/aub_aco001343/display?lang=ar", "http://mc.dlib.nyu.edu/files/books/aub_aco001343/aub_aco001343_lo.pdf"], "links": null, "strength": "explicit_7", "argument": "شارح التقنين الذي قامت عليه المحاكم الشرعية في مصر يقرر أن الغلام يسلم إلى أبيه في السابعة والجارية في التاسعة، ويعلل ذلك بالتمييز والحاجة إلى التعلم في الغلام، وبحد الشهوة والحاجة إلى الصيانة في الجارية؛ بل يجعل تسليم الولد إلى أبيه حقا للصغير يجبر عليه الأب إن لم يطلبه. فالانتقال إلى الأب عند التمييز حق للطفل، لا منة على الأب.", "jurisdiction": "مصر — المذهب الحنفي", "title": "الأبياني — يسلم الولد إلى أبيه عند السابعة والتاسعة ويجبر عليه", "source_standing": "محمد زيد الأبياني مدرس الشريعة الإسلامية بمدرسة الحقوق الخديوية في القاهرة، وشرحه على تقنين قدري باشا من أعمدة فقه الأحوال الشخصية في مصر.", "evidence_level": "شرح فقهي معتمد"}, {"section": "eg", "card_number": 290, "supports": ["7", "9"] n": "السنة النبوية", "title": "صحيح مسلم — الرحم معلقة بالعرش", "source_standing": null, "evidence_level": null}, {"section": "f1", "card_number": 313, "supports": ["silat_al_rahim"], "author": {"name": "البخاري ومسلم", "date": ""}, "work": {"title": "الصحيحان", "section": "كتاب الأدب / كتاب البر والصلة", "volume": "", "page": "البخاري 5986؛ مسلم 2557", "edition": ""}, "original": {"lang": "ar", "text": "«من سره أن يبسط له في رزقه، أو ينسأ له في أثره، فليصل رحمه»", "verbatim": true}, "translation_ar": "", "urls": ["https://sunnah.com/bukhari:2067"], "links": [{"url": "https://sunnah.com/bukhari:2067", "label": "النص في مصدره", "site": "موقع السنة", "domain": "sunnah.com"}], "strength": "explicit", "argument": "صلة الرحم سبب للبركة في الرزق والعمر، والتشريع الذي يقطعها يحرم الولد وأهله من ذلك.", "jurisdiction": "السنة النبوية", "title": "الصحيحان — صلة الرحم بركة", "source_standing": null, "evidence_level": null}, {"section": "f1", "card_number": 314, "supports": ["shared_parenting"], "author": {"name": "أبو داود", "date": "ت 275 هـ"}, "work": {"title": "السنن", "section": "كتاب الزكاة، باب في صلة الرحم", "volume": "", "page": "رقم 1692", "edition": ""}, "original": {"lang": "ar", "text": "«كفى بالمرء إثما أن يضيع من يقوت»", "verbatim": true}, "translation_ar": "", "urls": ["https://sunnah.com/abudawud:1692"], "links": [{"url": "https://sunnah.com/abudawud:1692", "label": "النص في مصدره", "site": "موقع السنة", "domain": "sunnah.com"}], "strength": "explicit", "argument": "جعل النبي صلى الله عليه وسلم تضييع من يعوله الرجل إثما، والتضييع يكون بترك التعليم والتأديب كما يكون بترك النفقة؛ فالأب الذي يحال بينه وبين ولده يكره على هذا التضييع.", "jurisdiction": "السنة النبوية", "title": "سنن أبي داود — إثم من يضيع من يقوت", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 315, "supports": ["7", "9"], "author": {"name": "المرغيناني", "date": ""}, "work": {"title": "الهداية", "section": "", "volume": "2", "page": "2/284", "edition": ""}, "original": {"lang": "ar", "text": "«إذا استغنى يحتاج إلى التأدب والتخلق بآداب الرجال وأخلاقهم، والأب أقدر على التأديب والتثقيف.»\n«وبعد البلوغ تحتاج إلى التحصين والحفظ، والأب فيه أقوى وأهدى.»\n«ولا خيار للغلام والجارية؛ لأنه لقصور عقله يختار من عنده الدعة لتخليته بينه وبين اللعب، فلا يتحقق النظر.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/11820/378"], "links": null, "strength": "explicit_7", "argument": "علل المرغيناني انتقال الغلام إلى أبيه بأنه إذا استغنى احتاج إلى آداب الرجال والأب أقدر على تأديبه، وانتقال الجارية بعد البلوغ بحاجتها إلى التحصين والحفظ؛ فالعلة الاستغناء والإدراك.", "jurisdiction": "المذهب الحنفي", "title": "الهداية — إذا استغنى احتاج إلى التأدب والأب أقدر", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 316, "supports": ["7"], "author": {"name": "ابن نجيم", "date": ""}, "work": {"title": "البحر الرائق", "section": "", "volume": "4", "page": "4/184", "edition": ""}, "original": {"lang": "ar", "text": "«وفي غاية البيان والتبيين والكافي أن الفتوى على قول الخصاف من التقدير بالسبع؛ لأن الأب مأمور بأن يأمره بالصلاة إذا بلغها، وإنما يكون ذلك إذا كان الولد عنده.»", "verbatim": true}, "translation_ar": "", "urls": ["https://islamweb.net/ar/library/content/29/2269/"], "links": null, "strength": "explicit_7", "argument": "صرح ابن نجيم بأن الفتوى على التقدير بالسبع، وعلل ذلك بأن الأب مأمور بأمر ولده بالصلاة إذا بلغها، ولا يكون ذلك إلا إذا كان الولد عنده؛ فالحديث النبوي علة الحكم الفقهي.", "jurisdiction": "المذهب الحنفي", "title": "البحر الرائق — الفتوى على السبع لأن الأب مأمور بأمره بالصلاة", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 317, "supports": ["7"], "author": {"name": "المرغيناني", "date": "ت 593 هـ"}, "work": {"title": "الهداية شرح بداية المبتدي", "section": "كتاب الطلاق، باب الولد من أحق به", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«والأم والجدة أحق بالغلام حتى يأكل وحده ويشرب وحده ويلبس وحده ويستنجي وحده… والخصاف قدر الاستغناء بسبع سنين اعتبارا للغالب»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/11820/378"], "links": [{"url": "https://shamela.ws/book/11820/378", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "الاستغناء الذي جعله المذهب حدا لحضانة النساء هو أن يأكل الصبي ويلبس ويستنجي وحده، وهذه أفعال لا تستقيم إلا لمن ميز؛ فلما كان التمييز يغلب عند السابعة قدر الخصاف الاستغناء بها، فالسبع ضابط للعلة لا رقم مجرد.", "jurisdiction": "المذهب الحنفي", "title": "الهداية — تقدير الاستغناء بسبع سنين", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 318, "supports": ["7", "9"], "author": {"name": "الحصكفي", "date": "ت 1088 هـ"}, "work": {"title": "الدر المختار شرح تنوير الأبصار", "section": "باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "(والحاضنة) أما، أو غيرها (أحق به) أي بالغلام حتى يستغني عن النساء وقدر بسبع وبه يفتى لأنه الغالب ولو اختلفا في سنه، فإن أكل وشرب ولبس واستنجى وحده دفع إليه ولو جبرا وإلا لا … (وغيرهما أحق بها حتى تشتهى) وقدر بتسع وبه يفتى (وعن محمد أن الحكم في الأم والجدة كذلك) وبه يفتى لكثرة الفساد زيلعي.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21613/1848"], "links": [{"url": "https://shamela.ws/book/21613/1848", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "هذا هو المفتى به في المذهب المعمول به في مصر: سبع للغلام لأنها سن استغنائه بتمييزه، وتسع للجارية لأنها سن إدراكها وحاجتها إلى الصيانة؛ فالتقدير بالسنين ضبط لمعنيين معقولين، لا تحكم.", "jurisdiction": "المذهب الحنفي", "title": "الدر المختار — سبع وتسع وبه يفتى", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 319, "supports": ["7"], "author": {"name": "الكاساني", "date": "ت 587 هـ"}, "work": {"title": "بدائع الصنائع", "section": "كتاب الحضانة، فصل في وقت الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "وأما وقت الحضانة التي من قبل النساء فالأم والجدتان أحق بالغلام حتى يستغني عنهن فيأكل وحده ويشرب وحده ويلبس وحده كذا ذكر في ظاهر الرواية وذكر أبو داود بن رشيد عن محمد ويتوضأ وحده يريد به الاستنجاء أي ويستنجي وحده ولم يقدر في ذلك تقديرا وذكر الخصاف سبع سنين أو ثمان سنين أو نحو ذلك.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/8183/952"], "links": [{"url": "https://shamela.ws/book/8183/952", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "تقدير الخصاف بالسبع أو الثمان منقول في أصول المذهب قبل المتأخرين، وكلا الرقمين دائر حول سن التمييز؛ فالمعتبر عند الحنفية إدراك الصبي واستغناؤه، لا بلوغه.", "jurisdiction": "المذهب الحنفي", "title": "بدائع الصنائع — تقدير الاستغناء بسبع", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 320, "supports": ["9"], "author": {"name": "الكاساني", "date": ""}, "work": {"title": "بدائع الصنائع", "section": "", "volume": "4", "page": "4/43", "edition": ""}, "original": {"lang": "ar", "text": "«ثم بعد ما حاضت أو بلغت عند الأم حد الشهوة تقع الحاجة إلى حمايتها وصيانتها وحفظها عمن يطمع فيها؛ لكونها لحما على وضم، فلا بد ممن يذب عنها، والرجال على ذلك أقدر.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/12/1588/"], "links": null, "strength": "explicit_9", "argument": "علل الكاساني انتقال الجارية إلى أبيها بحاجتها إلى الحماية والصيانة إذا بلغت حد الشهوة، والرجال على ذلك أقدر؛ فالإدراك وحد الشهوة علة الحكم.", "jurisdiction": "المذهب الحنفي", "title": "بدائع الصنائع — بعد بلوغ حد الشهوة تحتاج إلى الصيانة", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 321, "supports": ["9"], "author": {"name": "البابرتي", "date": ""}, "work": {"title": "العناية شرح الهداية", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«تحتاج إلى التحصين بالتزويج، وولاية التزويج إلى الأب، وإلى الحفظ عن وقوع الفتنة، والأب فيه أقوى وأهدى… وعن محمد أنها تدفع إلى الأب إذا بلغت حد الشهوة؛ لتحقق الحاجة إلى الصيانة.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamicbook.ws/asol/hanafi/alanait-shrh-alhdait-016.html"], "links": null, "strength": "explicit_9", "argument": "علل البابرتي انتقال الجارية إلى أبيها بحاجتها إلى التحصين والحفظ، وبأن ولاية تزويجها لأبيها؛ فالإدراك علة صيانتها عند الأب.", "jurisdiction": "المذهب الحنفي", "title": "العناية — بعد البلوغ تحتاج إلى التحصين، والأب أقوى وأهدى", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 322, "supports": ["9"], "author": {"name": "ابن عابدين", "date": "ت 1252 هـ"}, "work": {"title": "رد المحتار على الدر المختار", "section": "باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "(وعن محمد أن الحكم في الأم والجدة كذلك) وبه يفتى لكثرة الفساد زيلعي. || (قوله: وبه يفتى) قال في البحر بعد نقل تصحيحه: والحاصل أن الفتوى على خلاف ظاهر الرواية. || بل في محرمات المنح: بنت تسع فصاعدا مشتهاة اتفاقا سائحاني.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21613/1849"], "links": [{"url": "https://shamela.ws/book/21613/1849", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_9", "argument": "أفتى المتأخرون بقول محمد في الجارية لما رأوا من حاجة المدركة إلى صيانة الأب في زمانهم، وحاجتها في زماننا أشد؛ فالتسع علة شرعية متعلقة بالإدراك، تقوى بفساد الزمان ولا تضعف.", "jurisdiction": "المذهب الحنفي", "title": "رد المحتار — الفتوى في الجارية", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 323, "supports": ["9"], "author": {"name": "المرغيناني", "date": "ت 593 هـ"}, "work": {"title": "الهداية", "section": "كتاب الحجر، فصل في حد البلوغ", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وأدنى المدة لذلك [أي للبلوغ] في حق الغلام اثنتا عشرة سنة، وفي حق الجارية تسع سنين»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/11820/921"], "links": [{"url": "https://shamela.ws/book/11820/921", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_9", "argument": "التاسعة أدنى سن يتصور فيه بلوغ الجارية، فإذا بلغتها دخلت في حد الإدراك الذي تتعلق به الصيانة، فوافق انتهاء حضانة النساء أول زمن يمكن فيه البلوغ.", "jurisdiction": "المذهب الحنفي", "title": "الهداية — أدنى سن بلوغ الجارية تسع", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 324, "supports": ["shared_parenting"], "author": {"name": "برهان الإسلام الزرنوجي", "date": ""}, "work": {"title": "تعليم المتعلم طريق التعلم", "section": "فصل في الجد والمواظبة والهمة، ص 88–89", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وقيل: يحتاج في التعلم والتفقه إلى جد ثلاثة: المتعلم، والأستاذ، والأب، إن كان في الأحياء»", "verbatim": true}, "translation_ar": "", "urls": ["https://ibn-katheer.com/Book/detBooks/6/79/%D8%AA%D8%B9%D9%84%D9%8A%D9%85-%D8%A7%D9%84%D9%85%D8%AA%D8%B9%D9%84%D9%85-%D9%81%D9%8A-%D8%B7%D8%B1%D9%8A%D9%82-%D8%A7%D9%84%D8%AA%D8%B9%D9%84%D9%85", "https://darul-kutub.com/uploads/books/cbc792edbc63f5732fd1bc59cd83785e4864d4f8.pdf"], "links": null, "strength": "explicit", "argument": "جعل الزرنوجي جد الأب ركنا ثالثا في تعليم الولد مع جد المتعلم والأستاذ، ولم يسقطه إلا بموت الأب؛ فحياة الأب توجب حضوره في تعليم ولده، والقانون الذي يغيبه يسقط ركنا من أركان التعلم.", "jurisdiction": "المذهب الحنفي", "title": "تعليم المتعلم — جد الأب ركن في تعليم الولد", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 325, "supports": ["7"], "author": {"name": "السرخسي", "date": "ت 483 هـ"}, "work": {"title": "المبسوط", "section": "كتاب النكاح، باب الولد من أحق به", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "فالأم أحق بالولد أن يكون عندها حتى يستغني عنها، فإن كان غلاما فحتى يأكل وحده ويشرب وحده ويلبس وحده … فأما الغلام إذا استغنى فقد احتاج إلى تعلم أعمال الرجال والأب على ذلك أقدر واحتاج إلى من يثقفه ويؤدبه والأب هو الذي يقوى على ذلك", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/5423/1119"], "links": [{"url": "https://shamela.ws/book/5423/1119", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "علل السرخسي تقديم الأم بعجز الصغير عن القيام بنفسه، فإذا استغنى زالت العلة، وحدثت حاجة أخرى هي التأدب بأخلاق الرجال؛ والحكم يدور مع علته، والاستغناء لا يكون إلا مع التمييز.", "jurisdiction": "المذهب الحنفي", "title": "المبسوط — علة الاستغناء وحاجة الغلام إلى أبيه", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 326, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "ابن عابدين، ناقلا عن التتارخانية ثم معلقا عليها", "date": ""}, "work": {"title": "رد المحتار على الدر المختار", "section": "3/571، قوله: إخراجه", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وهذا هو الأرفق بالأم ويؤيده ما في التتارخانية: الولد متى كان عند أحد الأبوين لا يمنع الآخر عن النظر إليه وعن تعهده. ا هـ. ولا يخفى أن السفر أعظم مانع.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/27/2964/باب-الحضانة"], "links": null, "strength": "explicit", "argument": "أصل في المذهب المعمول به في مصر: الولد عند أي الأبوين كان لا يحجب عن الآخر نظرا ولا تعهدا، والتعهد قيام بالشأن لا لقاء عابر، فالرؤية المحدودة في مكان عام دون ما قرره الحنفية.", "jurisdiction": "المذهب الحنفي", "title": "التتارخانية — لا يمنع أحد الأبوين من النظر إلى ولده وتعهده", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 327, "supports": ["shared_parenting"], "author": {"name": "ابن عابدين", "date": ""}, "work": {"title": "رد المحتار على الدر المختار", "section": "3/571", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(قوله: كما في جانبها) أي كما أنها [أي الأم] إذا كان الولد عندها لها إخراجه إلى مكان يمكنه أن يبصر ولده كل يوم. (قوله: لا يجبر على أن يرسله) وكذا يقال في جانبها وقت حضانتها ط.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/27/2964/باب-الحضانة"], "links": null, "strength": "explicit", "argument": "جعل ابن عابدين مناط جواز انتقال الحاضنة أن يتمكن الأب من إبصار ولده كل يوم؛ فالحد الأدنى عند الحنفية صلة يومية، لا ساعات في الأسبوع.", "jurisdiction": "المذهب الحنفي", "title": "رد المحتار — أن يبصر الأب ولده كل يوم", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 328, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "السرخسي", "date": ""}, "work": {"title": "المبسوط", "section": "6/169–170، باب الولد عند من يكون في الفرقة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فإن وقعت الفرقة بينهما [أي بين الزوجين] وانقضت عدتها، فإن كان أصل النكاح في المصر الذي هي فيه فليس لها أن تخرج بولدها إلى مصر آخر؛ لما فيه من الإضرار بالزوج بقطع ولده عنه إلا أن يكون بين المصرين قرب بحيث لو خرج الزوج لمطالعة الولد أمكنه الرجوع إلى منزله قبل الليل، فحينئذ هذا بمنزلة محال مختلفة في مصر، ولها أن تتحول من محلة إلى محلة.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/18/2362/باب-الولد-عند-من-يكون-في-الفرقة"], "links": null, "strength": "explicit", "argument": "سمى السرخسي قطع الولد عن أبيه إضرارا بالأب، ومنع الحاضنة منه؛ فالقطيعة ممنوعة في أصل المذهب، والضابط أن يطالع الأب ولده ويرجع قبل الليل.", "jurisdiction": "المذهب الحنفي", "title": "المبسوط — منع الإضرار بالأب بقطع ولده عنه", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 329, "supports": ["shared_parenting"], "author": {"name": "ابن نجيم، ناقلا عن الحاوي القدسي", "date": ""}, "work": {"title": "البحر الرائق شرح كنز الدقائق", "section": "4/187–188، باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وفي الحاوي القدسي وإذا تزوجها في قرية من رستاق لها قرى قريبة بعضها من بعض فأرادت أن تخرج بولدها من قرية إلى قرية لها ذلك ما لم تقطعه من أبيه إذا أراد أن يبصر ولده كل يوم، وكذا الأب إذا أراد أن يخرجه إلى مثل ذلك وليس له أن يخرجه من المصر إلى القرى بغير رضا أمه إذا كان صغيرا ا هـ.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/29/2278/باب-الحضانة"], "links": null, "strength": "explicit", "argument": "نص الحاوي القدسي على أن الحاضنة لا تنتقل بالولد إلا حيث لا تقطعه عن أبيه إذا أراد أن يبصره كل يوم، والحكم نفسه في الأب؛ فالصلة اليومية حق متبادل للأبوين.", "jurisdiction": "المذهب الحنفي", "title": "البحر الرائق — الرؤية اليومية حق للأبوين كليهما", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 330, "supports": ["shared_parenting"], "author": {"name": "ابن نجيم، ناقلا عن شرح النقاية", "date": ""}, "work": {"title": "البحر الرائق شرح كنز الدقائق", "section": "باب الحضانة، آخر مباحث انتقال الأم", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وفي شرح النقاية وإنما قال المصنف تسافر دون أن تخرج؛ لأنه لو كان بين الموضعين تقارب بحيث يتمكن الأب من مطالعة ولده والرجوع إليه في نهاره جاز لها أن تنتقل إليه سواء كان وطنا لها أو لم يكن وقع العقد فيه أو لم يقع؛ لأن الانتقال إلى قريب بمنزلة الانتقال من محلة إلى محلة في بلدة واحدة.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/29/2278/باب-الحضانة"], "links": null, "strength": "explicit", "argument": "مدار الحكم عند الحنفية تمكن الأب من مطالعة ولده والرجوع في نهاره، فالقرب الذي يتيح الصلة اليومية هو المعتبر.", "jurisdiction": "المذهب الحنفي", "title": "شرح النقاية — ضابط مطالعة الأب ولده في نهاره", "source_standing": null, "evidence_level": null}, {"section": "f2", "card_number": 331, "supports": ["silat_al_rahim"], "author": {"name": "الحصكفي / ابن عابدين", "date": ""}, "work": {"title": "الدر المختار وحاشيته", "section": "باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "ويؤيده ما في التتارخانية: الولد متى كان عند أحد الأبوين لا يمنع الآخر عن النظر إليه وعن تعهده. اه.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21613/1853"], "links": [{"url": "https://shamela.ws/book/21613/1853", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "نص الحنفية، وهو المذهب المعمول به في مصر، على ألا يمنع أحد الأبوين من ولده، فحق الأب في ولده أصيل لا يتوقف على إذن.", "jurisdiction": "المذهب الحنفي", "title": "رد المحتار عن التتارخانية — لا يمنع أحد الأبوين من النظر إلى ولده وتعهده", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 332, "supports": ["7"], "author": {"name": "ابن عرفة", "date": ""}, "work": {"title": "المختصر الفقهي", "section": "", "volume": "5", "page": "5/49", "edition": ""}, "original": {"lang": "ar", "text": "«الحضانة: هي محصول قول الباجي: حفظ الولد في مبيته، ومؤنة طعامه ولباسه ومضجعه، وتنظيف جسمه.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/16968/2022"], "links": null, "strength": "explicit", "argument": "حد ابن عرفة الحضانة بحفظ الولد في مبيته ومؤنة طعامه ولباسه ونظافته، وهي خدمة يستغني عنها المميز؛ فإذا استغنى زال موجبها.", "jurisdiction": "المذهب المالكي", "title": "المختصر الفقهي لابن عرفة — حد الحضانة", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 333, "supports": ["7"], "author": {"name": "ابن عرفة ناقلا عن ابن رشد والمتيطي", "date": ""}, "work": {"title": "المختصر الفقهي", "section": "", "volume": "5", "page": "5/49", "edition": ""}, "original": {"lang": "ar", "text": "«الإجماع على وجوب كفالة الأطفال الصغار؛ لأنهم خلق ضعيف يفتقر لكافل يربيه حتى يقوم بنفسه، فهو فرض كفاية إن قام به قائم سقط عن الباقي، لا يتعين إلا على الأب والأم في حولي رضاعه إن لم يكن له أب ولا مال له، أو كان لا يقبل غيرها.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/16968/2022"], "links": null, "strength": "explicit", "argument": "نقل ابن عرفة الإجماع على أن الصغير يفتقر إلى كافل حتى يقوم بنفسه؛ فغاية الحاجة إلى الحضانة قيامه بنفسه، وهو الاستغناء الذي قدر بالسبع.", "jurisdiction": "المذهب المالكي", "title": "المختصر الفقهي — الكفالة حتى يقوم بنفسه", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 334, "supports": ["7", "shared_parenting"], "author": {"name": "أبو الحسن القابسي", "date": "ت 403 هـ"}, "work": {"title": "الرسالة المفصلة لأحوال المتعلمين وأحكام المعلمين والمتعلمين", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: على الأب أن يعلم ولده القرآن وما يصلحه في دينه، وأن يدفعه إلى المكتب، وأجرة المعلم عليه؛ فإن قصر فقد ضيع ما يجب عليه لولده.", "verbatim": false}, "translation_ar": "", "urls": ["https://archive.org/details/Resalh_Mofasalh"], "links": [{"url": "https://archive.org/details/Resalh_Mofasalh", "label": "النص في مصدره", "site": "أرشيف الإنترنت", "domain": "archive.org"}], "strength": "explicit", "argument": "قرر القابسي، من أقدم من كتب في التربية في الإسلام، أن تعليم الولد وإرساله إلى المكتب واجب الأب، وهذا يبدأ بالتمييز؛ فلا يؤديه أب محجوب عن ولده.", "jurisdiction": "المذهب المالكي", "title": "القابسي — تعليم الولد واجب على أبيه", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 335, "supports": ["shared_parenting"], "author": {"name": "خليل بن إسحاق", "date": "ت 776 هـ"}, "work": {"title": "المختصر", "section": "باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وللأب تعاهده وأدبه وبعثه للمكتب»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/11355/185"], "links": null, "strength": "indirect", "argument": "حتى المالكية الذين أطالوا حضانة الأم جعلوا للأب تعاهد ولده وتأديبه وإرساله إلى الكتاب، لأن التعليم والتأديب يبدآن بالتمييز؛ فلم يقل أحد من الأئمة بقطع الأب عن ولده.", "jurisdiction": "المذهب المالكي", "title": "مختصر خليل — حق الأب في التعاهد والتأديب", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 336, "supports": ["shared_parenting"], "author": {"name": "محمد بن سحنون", "date": "ت 256 هـ"}, "work": {"title": "آداب المعلمين", "section": "ما جاء في الختم وما يجب في ذلك للمعلم", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«…ولا يجوز له [أي للمعلم] أن يأذن لهم أكثر من ذلك إلا بإذن آبائهم كلهم؛ لأنه أجير لهم»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.safahat.org/books/40635716/0.3/#sect3_10", "https://downloads.hindawi.org/books/40635716.pdf#page=305"], "links": null, "strength": "indirect", "argument": "جعل ابن سحنون المعلم أجيرا للآباء لا يأذن للصبيان إلا بإذنهم؛ فإدارة تعليم الولد ومتابعته في يد أبيه في أقدم كتاب في التربية في الإسلام.", "jurisdiction": "المذهب المالكي", "title": "آداب المعلمين — المعلم أجير الآباء", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 337, "supports": ["shared_parenting", "7"], "author": {"name": "الإمام مالك، برواية ابن القاسم في المدونة", "date": ""}, "work": {"title": "المدونة", "section": "2/258، ما جاء في حضانة الأم", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«قال: قال مالك: يؤدبه [أي الأب ولده] بالنهار ويبعثه إلى الكتاب وينقلب إلى أمه بالليل في حضانتها، ويؤدبه عند أمه ويتعاهده عند أمه ولا يفرق بينها وبينه إلا أن تتزوج.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/30/2321/ما-جاء-في-حضانة-الأم"], "links": null, "strength": "explicit", "argument": "نص الإمام مالك نفسه في الرعاية المقسومة: النهار للأب يؤدب ويعلم، والليل للأم؛ وعلته أن التأديب يبدأ حين يعقل الصبي، فلا يتأتى إلا مع حضور الأب في يومه.", "jurisdiction": "المذهب المالكي", "title": "المدونة — يؤدبه بالنهار ويبيت عند أمه", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 338, "supports": ["shared_parenting", "7"], "author": {"name": "الباجي، ناقلا عن ابن حبيب عن ابن الماجشون؛ ثم تعليق ابن عرفة", "date": ""}, "work": {"title": "المختصر الفقهي", "section": "5/49، كتاب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«الباجي: إذا كان الابن في حضانة أمه لم يمنع من الاختلاف لأبيه يعلمه ويأوي لأمه، رواه ابن حبيب عن ابن الماجشون، يريد أن للأب تعلمه وتأديبه وإسلامه في المكتب والصنائع والتصرف.\nقلت: هو نصها للأب تعاهد ولده عند أمه، وأدبه، وبعثه للمكتب، ولا يبيت إلا عند أمه.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/16968/2022"], "links": null, "strength": "explicit", "argument": "حتى في المذهب الذي أطال حضانة الأم: لا يمنع الابن من التردد إلى أبيه ليعلمه ويؤدبه، فالحضانة عند المالكية مأوى، والتعليم والتأديب للأب.", "jurisdiction": "المذهب المالكي", "title": "ابن الماجشون — لا يمنع الابن من الاختلاف إلى أبيه", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 339, "supports": ["shared_parenting"], "author": {"name": "خليل في المتن، والحطاب في الشرح ناقلا عن المدونة", "date": ""}, "work": {"title": "مواهب الجليل في شرح مختصر خليل", "section": "4/215", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(وللأب تعاهده وأدبه وبعثه للمكتب) هذا نحو قوله في المدونة: وللأب تعاهد ولده عند أمه وأدبه وبعثه للمكتب، ولا يبيت إلا عند أمه، انتهى.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/19/2957/مسألة-إذا-عتقت-الأمة-على-أن-تركت-حضانة-ولدها"], "links": null, "strength": "explicit", "argument": "شرح الحطاب نص المدونة: للأب تعاهد ولده عند أمه وأدبه وبعثه للمكتب؛ فرعاية الأب قائمة في المذهب المالكي مع مبيت الولد عند أمه.", "jurisdiction": "المذهب المالكي", "title": "مواهب الجليل — للأب تعاهده وأدبه وبعثه للمكتب", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 340, "supports": ["shared_parenting"], "author": {"name": "أبو الحسن الصغير، نقله الحطاب؛ ثم نقل المشذالي عنه", "date": ""}, "work": {"title": "مواهب الجليل في شرح مختصر خليل", "section": "4/215", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«قال أبو الحسن الصغير ويقوم من هنا أن الأب له القيام بجميع أمور ولده يختنه ويصنع الصنيع، وله أن يختنه في داره ثم يرسله لأمه، ولو تنازع الأبوان في زفاف البنت عند أيهما يكون، فظاهر النقل أن القول للأم، انتهى. وقال المشذالي في إرخاء الستور: قال الشيخ أبو الحسن لم أر فيه نصا، وفيه حق للأب وحق للأم، انتهى.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/19/2957/مسألة-إذا-عتقت-الأمة-على-أن-تركت-حضانة-ولدها"], "links": null, "strength": "explicit", "argument": "قرر أبو الحسن أن للأب القيام بجميع أمور ولده المحضون، يأخذه لشأنه ثم يرده؛ فالحضانة لا تسلب الأب ولايته على شؤون ولده.", "jurisdiction": "المذهب المالكي", "title": "أبو الحسن الصغير — للأب القيام بجميع أمور ولده", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 341, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "مالك، برواية ابن وهب، نقلها ابن عبد البر", "date": ""}, "work": {"title": "الاستذكار", "section": "23/71–72، الفقرتان 33522–33523", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فقال مالك: لا أرى ذلك [أي التفريق بين الغلام وأمه]، له [أي للأب] أن يؤدب الغلام، ويعلمه، ويقلبه إلى أمه، ولا يفرق بينه وبين أمه، ولكن يتعاهده في كتابه، ويقر عند أمه، ويتعاهد الجارية، وهي عند أمها ما لم تنكح.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/93/3075/قصة-المخنث-الذي-كان-عند-أم-سلمة"], "links": null, "strength": "explicit", "argument": "نقل ابن عبد البر عن مالك أن الأب يؤدب الغلام ويعلمه ويتعاهده في كتابه، ويتعاهد الجارية عند أمها؛ فالتعاهد حق للأب في الذكر والأنثى معا.", "jurisdiction": "المذهب المالكي", "title": "الاستذكار — يتعاهد الغلام في كتابه والجارية عند أمها", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 342, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "مالك كما نقله ابن عبد البر ضمن رواية ابن وهب", "date": ""}, "work": {"title": "الاستذكار", "section": "23/72، الفقرة 33525", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«قال: وليس للأم، ولا للجدة أن يخرجا بالولد إلى بلد بعيد عن أبيه، وأهل بيته.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/93/3075/قصة-المخنث-الذي-كان-عند-أم-سلمة"], "links": null, "strength": "explicit", "argument": "منع مالك الأم والجدة من الخروج بالولد بعيدا عن أبيه وأهل بيته، فصلة الولد بأبيه ورحمه من جهته محفوظة في أصل المذهب.", "jurisdiction": "المذهب المالكي", "title": "مالك — لا يخرج بالولد إلى بلد بعيد عن أبيه وأهل بيته", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 343, "supports": ["shared_parenting", "9"], "author": {"name": "الزرقاني شارحا مختصر خليل، ناقلا في آخره عن أبي الحسن", "date": ""}, "work": {"title": "شرح الزرقاني على مختصر خليل وحاشية البناني", "section": "صفحة الويب الداخلية 2024؛ ليست رقم الصفحة المطبوعة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(وللأب) وغيره من الأولياء (تعاهده) أي المحضون الكائن عند أمه ذكرا أو أنثى (وأدبه) أي تأديبه (وبعثه للمكتب) أو المعلم أو المعلمة من غير اتصال الأب بمطلقته الحاضنة أو ولو مع اتصال بحاضنة غيرها من محارمه وللأب ختنه وبعثه لأمه وليس له زفاف البنت من عنده لبيت الزوج بل من عند الأم فالحق للأم قاله أبو الحسن.»", "verbatim": true}, "translation_ar": "", "urls": ["https://books.islam-db.com/book/شرح_الزرقاني_علي_مختصر_خليل_وحاشيه_البناني/2024"], "links": null, "strength": "explicit", "argument": "صرح الزرقاني بأن تعاهد الأب وتأديبه وبعثه للتعلم يشمل المحضون ذكرا كان أو أنثى، فالبنت كالابن في حقها في رعاية أبيها.", "jurisdiction": "المذهب المالكي", "title": "شرح الزرقاني — التعاهد يشمل المحضون ذكرا وأنثى", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 344, "supports": ["shared_parenting"], "author": {"name": "محمد عليش، شارحا متن خليل، ناقلا في آخره عن أبي الحسن", "date": ""}, "work": {"title": "منح الجليل شرح مختصر خليل", "section": "4/421–422", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(وللأب) وسائر الأولياء (تعاهده) أي المحضون ذكرا كان أو أنثى (وأدبه) أي تأديب المحضون (وبعثه) أي إرسال المحضون (للمكتب) بفتح الميم والفوقية أي محل تعلم الكتابة أو المعلم أو المعلمة وختنه وبعثه لأمه وليس له زفاف البنت من عنده لبيت زوجها بل من عند الأم فالحق لها فيه قاله أبو الحسن.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/24/3550/فصل-نفقة-الرقيق-والدابة-والقريب-وخادمه-والحضانة-وما-يتعلق-بها"], "links": null, "strength": "explicit", "argument": "شرح عليش أن للأب تعاهد المحضون وتأديبه وإرساله إلى المعلم أو المعلمة؛ فالتعليم حق الأب ولو كان الولد في حضانة أمه.", "jurisdiction": "المذهب المالكي", "title": "منح الجليل — إرسال المحضون للتعلم مع بقاء الحضانة", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 345, "supports": ["shared_parenting"], "author": {"name": "القرطبي", "date": ""}, "work": {"title": "الجامع لأحكام القرآن", "section": "3/152، تفسير البقرة: 233", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وهذا إذا كان كل واحد من هؤلاء مأمونا على الولد، وكان عنده في حرز وكفاية، فإذا لم يكن كذلك لم يكن له حق في الحضانة، وإنما ينظر في ذلك إلى من يحوط الصبي ومن يحسن إليه في حفظه وتعلمه الخير.\nوهذا على قول من قال إن الحضانة حق الولد، وقد روي ذلك عن مالك وقال به طائفة من أصحابه.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/48/832/قوله-تعالى-والوالدات-يرضعن-أولادهن-حولين-كاملين"], "links": null, "strength": "explicit", "argument": "جعل القرطبي مناط الحضانة الأمانة والحرز وتعليم الخير، وقرر أنها حق الولد؛ فلا يستحقها من لا يحسن إليه في حفظه وتعليمه.", "jurisdiction": "المذهب المالكي", "title": "القرطبي — الحضانة لمن يحوط الصبي ويعلمه الخير", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 346, "supports": ["shared_parenting", "9"], "author": {"name": "محمد بن سالم المجلسي", "date": ""}, "work": {"title": "لوامع الدرر", "section": "", "volume": "7", "page": "7/758", "edition": ""}, "original": {"lang": "ar", "text": "«وللأب تعاهده؛ يعني أن للأب وغيره من الأولياء أن يتعاهد المحضون الكائن عند أمه ذكرا أو أنثى، ومعنى تعاهده الإتيان إليه لتفقد أحواله… وأدبه؛ يعني أن للأب وغيره من الأولياء أن يؤدب المحضون… وبعثه للمكتب؛ يعني أن للأب وغيره من الأولياء أن يبعث المحضون للمكتب، أي موضع الكتابة، وله أن يبعثه لمن يعلمه… والحاصل أن للأب القيام بجميع أمور المحضون.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/149697/5006"], "links": null, "strength": "explicit", "argument": "فسر المجلسي التعاهد بالإتيان إلى المحضون لتفقد أحواله، وجعله للذكر والأنثى معا، وجعل للأب القيام بجميع أمور المحضون.", "jurisdiction": "المذهب المالكي", "title": "لوامع الدرر — للأب أن يتعاهد المحضون ذكرا أو أنثى", "source_standing": null, "evidence_level": null}, {"section": "f3", "card_number": 347, "supports": ["shared_parenting"], "author": {"name": "كتاب موهوب الجليل في شرح مختصر خليل (2/463)", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وللأب تعاهد ولده عند حاضنته لينظر إلى حاله، وله أدبه وبعثه للمكتب، وكذلك غير الأب من الأولياء… وقال ابن شبلون: العمل على خلاف هذا، بل تسقط حضانتها لما يلحق أبا الطفل من الضرر في تعاهد ولده، وهو مع أمه في بيت زوجها ولا يدخل.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/30174/1008"], "links": null, "strength": "explicit", "argument": "نقل عن ابن شبلون أن الحضانة تسقط إذا لحق الأب ضرر في تعاهد ولده؛ فتمكين الأب من تعاهد ولده شرط في بقاء الحضانة عند بعض المالكية.", "jurisdiction": "المذهب المالكي", "title": "موهوب الجليل — تسقط الحضانة لما يلحق الأب من الضرر في تعاهد ولده", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 348, "supports": ["7", "shared_parenting"], "author": {"name": "الماوردي", "date": ""}, "work": {"title": "الحاوي الكبير", "section": "الجزء 11، باب أي الوالدين أحق بالولد", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«قال الماوردي: قد فرقنا بين زمان الحضانة وزمان الكفالة، وأن الحضانة فيما دون السبع، وتكون الأم أحق فيها بالولد، والكفالة مستحقة على الأب سواء اختاره الولد أو اختار أمه، وكذلك ما احتاج إليه الولد من تعليم وتأديب: لأنه من مصالح الولد التي يجب عليه [أي على الأب] القيام بها، وزمان التعليم في إسلامه [أي إسلام الولد] إلى الكتاب أو الصناعة بحسب عادته وعرف أهله…»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/94/6581/باب-أي-الوالدين-أحق-بالولد-من-كتب-عدة"], "links": null, "strength": "explicit_7", "argument": "فرق الماوردي بين زمانين: زمان الحضانة فيما دون السبع، وزمان الكفالة بعدها، وجعل الكفالة على الأب سواء اختاره الولد أو اختار أمه. والكفالة هنا ليست النفقة؛ فالنفقة واجبة على الأب من يوم الولادة، فلو كانت هي المراد لما كان لجعل السابعة حدا بين الزمانين معنى، وقد سمى الماوردي في الباب نفسه ما يبذله الأب من مال «مؤونة» لا كفالة. والكافل في لسان الشرع القائم بأمر المكفول، كما كفل زكريا مريم، وكما فسر النووي كافل اليتيم بأنه القائم بأموره من نفقة وكسوة وتأديب وتربية. ثم نص الماوردي على أن التعليم والتأديب مما يجب على الأب القيام به، وأن زمانه تسليم الولد إلى الكتاب أو الصنعة؛ فالقائم بالتربية بعد السابعة الأب، لا الحاضنة.", "jurisdiction": "المذهب الشافعي", "title": "الحاوي الكبير — الحضانة دون السبع، والكفالة على الأب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 349, "supports": ["7"], "author": {"name": "الخطيب الشربيني", "date": "ت 977 هـ"}, "work": {"title": "مغني المحتاج", "section": "فصل الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: سن التمييز غالبا سبع سنين أو ثمان تقريبا.", "verbatim": false}, "translation_ar": "", "urls": ["https://shamela.ws/book/11444/2394"], "links": [{"url": "https://shamela.ws/book/11444/2394", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "قدر الشافعية سن التمييز بسبع أو ثمان، فالسن عندهم علامة على الإدراك لا علة مستقلة؛ وبهذا يتبين أن التحديد بالسابعة تحديد بالعقل الذي يتوجه إليه الخطاب.", "jurisdiction": "المذهب الشافعي", "title": "مغني المحتاج — سن التمييز سبع", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 350, "supports": ["7", "shared_parenting"], "author": {"name": "النووي", "date": "ت 676 هـ"}, "work": {"title": "المنهاج شرح صحيح مسلم", "section": "18/113", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«كافل اليتيم: القائم بأموره من نفقة وكسوة وتأديب وتربية وغير ذلك»", "verbatim": true}, "translation_ar": "", "urls": ["https://hadithprophet.com/hadith-52550.html"], "links": null, "strength": "explicit", "argument": "فسر النووي، شيخ الشافعية، الكافل بأنه القائم بأمر المكفول من نفقة وكسوة وتأديب وتربية؛ فالكفالة في لسان الفقهاء رعاية وتربية وتأديب، لا مال فحسب. وبهذا يفسر قول الماوردي إن الكفالة بعد السبع على الأب: هي القيام بأمر الولد وتربيته، لا مجرد الإنفاق عليه.", "jurisdiction": "المذهب الشافعي", "title": "شرح النووي على مسلم — الكفالة تأديب وتربية لا نفقة فحسب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 351, "supports": ["7", "shared_parenting"], "author": {"name": "أبو الحسن الماوردي", "date": "ت 450 هـ"}, "work": {"title": "أدب الدنيا والدين", "section": "أدب النفس، 1/233", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«والتأديب يلزم من وجهين: أحدهما ما لزم الوالد لولده في صغره، والثاني ما لزم الإنسان في نفسه عند نشوئه وكبره. فأما التأديب اللازم للأب فهو أن يأخذ ولده بمبادئ الآداب ليأنس بها، وينشأ عليها، فيسهل عليه قبولها عند الكبر لاستئناسه بمبادئها في الصغر؛ لأن نشوء الصغير على الشيء يجعله متطبعا به. ومن أغفل تأديبه في الصغر كان تأديبه في الكبر عسيرا»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/765/217", "https://ibn-katheer.com/Book/detBooks/12/21/%D8%A3%D8%AF%D8%A8-%D8%A7%D9%84%D8%AF%D9%86%D9%8A%D8%A7-%D9%88%D8%A7%D9%84%D8%AF%D9%8A%D9%86"], "links": null, "strength": "explicit", "argument": "جعل الماوردي تأديب الولد في صغره لازما للأب بعينه، وعلل البدار به بأن ما ينشأ عليه الصغير يصير طبعا له، وأن من أغفل تأديبه صغيرا عسر تأديبه كبيرا. فحجب الأب عن ولده في سني التمييز يفوت عليه الواجب في وقته الذي لا يعوض.", "jurisdiction": "المذهب الشافعي", "title": "أدب الدنيا والدين — تأديب الولد في صغره لازم للأب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 352, "supports": ["7"], "author": {"name": "النووي", "date": "ت 676 هـ"}, "work": {"title": "منهاج الطالبين", "section": "كتاب النفقات، فصل الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "والمميز إن افترق أبواه كان عند من اختار منهما فإن كان في أحدهما جنون أو كفر أو رق أو فسق أو نكحت فالحق للآخر", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/12096/297"], "links": [{"url": "https://shamela.ws/book/12096/297", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "علق الشافعية التخيير بالتمييز لا بسن مجردة، فمتى عقل الصبي ما يختار خير؛ والتمييز يغلب في السابعة، فتنتهي عنده حضانة الأم المنفردة.", "jurisdiction": "المذهب الشافعي", "title": "منهاج الطالبين — تخيير المميز", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 353, "supports": ["shared_parenting"], "author": {"name": "بدر الدين ابن جماعة", "date": "ت 733 هـ"}, "work": {"title": "تذكرة السامع والمتكلم في أدب العالم والمتعلم", "section": "مقدمة المصنف، ص 2", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وقال حبيب بن الشهيد لابنه: يا بني اصحب الفقهاء والعلماء وتعلم منهم وخذ من أدبهم؛ فإن ذلك أحب إلي من كثير من الحديث»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/151180/3", "https://shamela.ws/book/151180"], "links": null, "strength": "indirect", "argument": "أورد ابن جماعة وصية أب لابنه في اختيار صحبته وطلب العلم والأدب؛ فتوجيه الولد إلى العلم وحسن الأدب واختيار رفقته من وظائف الأب التي لا تؤدى عن بعد.", "jurisdiction": "المذهب الشافعي", "title": "تذكرة السامع والمتكلم — الأب يوجه ابنه إلى العلم والأدب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 354, "supports": ["7", "shared_parenting"], "author": {"name": "الإمام الشافعي", "date": ""}, "work": {"title": "الأم", "section": "الجزء 5، باب أي الوالدين أحق بالولد", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(قال الشافعي) فإذا افترق الأبوان وهما في قرية واحدة فالأم أحق بولدها ما لم تتزوج وما كانوا صغارا فإذا بلغ أحدهم سبعا أو ثمان سنين وهو يعقل خير بين أبيه وأمه وكان عند أيهما اختار، فإن اختار أمه فعلى أبيه نفقته ولا يمنع من تأديبه، قال وسواء في ذلك الذكر والأنثى ويخرج الغلام إلى الكتاب والصناعة إن كان من أهلها ويأوي عند أمه وعلى أبيه نفقته.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/31/2599/باب-أي-الوالدين-أحق-بالولد"], "links": null, "strength": "explicit_7", "argument": "علق الشافعي التخيير بسبع أو ثمان مع قيد «وهو يعقل»، فالعلة التمييز؛ ثم جعل للأب التأديب والنفقة والكتاب والصنعة ولو اختار أمه، فلا تنفرد الأم بالمميز.", "jurisdiction": "المذهب الشافعي", "title": "الأم للشافعي — التخيير في السابعة أو الثامنة إذا عقل", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 355, "supports": ["7", "shared_parenting", "silat_al_rahim"], "author": {"name": "أبو إسحاق الشيرازي", "date": ""}, "work": {"title": "التنبيه في الفقه الشافعي", "section": "ص211، باب الحضانة؛ الرقم 196 في الرابط رقم داخلي للموقع", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإذا بلغ الصبي سبع سنين وهو يعقل خير بين الأبوين، وإن اختار أحدهما سلم إليه، وإن كان ابنا فاختار الأم كان عندها بالليل، وعند أبيه بالنهار، وإن اختار الأب كان عنده بالليل والنهار، ولا يمنع من زيارة أمه، ولا تمنع الأم من تمريضه إذا احتاج، وإن كانت بنتا فاختارت الأب أو الأم كانت عنده بالليل والنهار، ولا يمنع الآخر من زيارتها وعيادتها، وإن اختارت أحدهما ثم اختار الآخر حول إليه، فإن عاد واختار الأول أعيد إليه.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/7589/196"], "links": null, "strength": "explicit_7", "argument": "قيد الشيرازي التخيير بالسابعة مع العقل، وجعل الغلام عند أمه ليلا وعند أبيه نهارا، ولا يمنع من زيارة الآخر؛ فالتمييز علة، والرعاية المقسومة حكم.", "jurisdiction": "المذهب الشافعي", "title": "التنبيه — إذا بلغ سبعا وهو يعقل خير", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 356, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "الإمام الشافعي", "date": ""}, "work": {"title": "الأم", "section": "الجزء 5، تتمة باب أي الوالدين أحق بالولد", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإن اختار أباه لم يكن لأبيه منعه من أن يأتي أمه وتأتيه في الأيام وإن كانت جارية لم تمنع أمها من أن تأتيها ولا أعلم على أبيها إخراجها إليها إلا من مرض فيؤمر بإخراجها عائدة، قال وإن ماتت البنت لم تمنع الأم من أن تليها حتى تدفن ولا تمنع في مرضها من أن تلي تمريضها في منزل أبيها.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/31/2599/باب-أي-الوالدين-أحق-بالولد"], "links": null, "strength": "explicit", "argument": "إذا كان الولد عند أبيه لم يكن له منعه من أمه؛ وعكسه أولى، فالشافعي يحفظ الصلة بالأبوين جميعا في كل حال.", "jurisdiction": "المذهب الشافعي", "title": "الأم للشافعي — لا يمنع الولد من أمه ولا الأم من ولدها", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 357, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "أبو إسحاق الشيرازي؛ النص بعد «قال المصنف»", "date": ""}, "work": {"title": "المهذب، متنا ضمن المجموع مع تكملاته", "section": "المجموع مع تكملاته، موضع «قال المصنف رحمه الله تعالى» في الحضانة", "volume": "", "page": "", "edition": ""}, "original": {
