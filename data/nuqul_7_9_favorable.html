"lang": "ar", "text": "«وإن اختار أحدهما نظرت - فإن كان ابنا فاختار الأم كان عندها بالليل، ويأخذه الأب بالنهار ويسلمه في مكتب أو صنعة لأن القصد حظ الولد، وحظ الولد فيما ذكرناه، وإن اختار الأب كان عنده بالليل والنهار ولا يمنعه من زيارة أمه لأن المنع من ذلك إغراء بالعقوق وقطع الرحم.»", "verbatim": true}, "translation_ar": "", "urls": ["https://islamport.com/l/shf/3146/8845.htm"], "links": null, "strength": "explicit", "argument": "علل الشيرازي أخذ الأب الولد نهارا بحظ الولد، وجعل منع أحد الأبوين من الآخر إغراء بالعقوق وقطع الرحم؛ فالقطيعة محرمة في الاتجاهين.", "jurisdiction": "المذهب الشافعي", "title": "المهذب — المنع من زيارة الأم إغراء بالعقوق وقطع الرحم", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 358, "supports": ["shared_parenting"], "author": {"name": "النووي", "date": ""}, "work": {"title": "روضة الطالبين وعمدة المفتين", "section": "9/105، فرع فيمن اختار أمه", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«إذا اختار الأم، فليس للأب إهماله بمجرد ذلك، بل يلزمه القيام بتأديبه وتعليمه، إما بنفسه وإما بغيره ويتحمل مؤنته، وكذا المجنون الذي لا تستقل الأم بضبطه يلزم الأب رعايته، وإنما تقدم الأم فيما يتأتى منها وما هو شأنها.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/95/1706/فصل-الأم-أحق-بالحضانة-من-الأب-في-حق-من-لا-تمييز-له-أصلا"], "links": null, "strength": "explicit", "argument": "قرر النووي أن تقديم الأم إنما هو فيما يتأتى منها وما هو شأنها، وأن التأديب والتعليم واجب الأب لا يسقط؛ فليس للأم انفراد بما ليس من شأنها.", "jurisdiction": "المذهب الشافعي", "title": "روضة الطالبين — ليس للأب إهماله، وإنما تقدم الأم فيما هو شأنها", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 359, "supports": ["shared_parenting", "9"], "author": {"name": "النووي", "date": ""}, "work": {"title": "روضة الطالبين وعمدة المفتين", "section": "9/105", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«إذا اختار الأم، فإن كان ابنا، أوى إليها ليلا، وكان عند الأب نهارا يؤدبه ويعلمه أمور الدين والمعاش والحرفة، وإن كانت بنتا، كانت عند الأم ليلا ونهارا، ويزورها الأب على العادة، ولا يطلب إحضارها عنده، وهكذا الحكم إذا كان الولد عند الأم قبل سن التخيير.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/95/1706/فصل-الأم-أحق-بالحضانة-من-الأب-في-حق-من-لا-تمييز-له-أصلا"], "links": null, "strength": "explicit", "argument": "جعل النووي الابن عند أبيه نهارا يؤدبه ويعلمه الدين والمعاش، وجعل للأب زيارة البنت على العادة، وكذلك قبل سن التخيير؛ فالأب حاضر في الطورين.", "jurisdiction": "المذهب الشافعي", "title": "روضة الطالبين — الابن عند الأب نهارا، والبنت يزورها الأب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 360, "supports": ["shared_parenting", "9"], "author": {"name": "شمس الدين الرملي", "date": ""}, "work": {"title": "نهاية المحتاج إلى شرح المنهاج وحاشية الشبراملسي", "section": "7/233، بعد «ويزورها الأب على العادة»", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وظاهر أنها [أي الحاضنة] لو كانت بمسكن زوج لها امتنع دخوله إلا بإذن منه، فإن لم يأذن أخرجتها [أي البنت] إليه [أي إلى الأب] ليراها ويتفقد حالها ويلاحظها بالقيام بمصالحها.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/25/7388/فصل-في-الحضانة"], "links": null, "strength": "explicit", "argument": "إذا لم يتمكن الأب من الدخول أخرجت الحاضنة البنت إليه ليراها ويتفقد حالها ويقوم بمصالحها؛ فصلة الأب بابنته واجبة التمكين على الحاضنة.", "jurisdiction": "المذهب الشافعي", "title": "نهاية المحتاج — تخرج البنت إلى أبيها ليتفقد حالها", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 361, "supports": ["shared_parenting"], "author": {"name": "ابن الصلاح، نقل فتواه شمس الدين الرملي", "date": ""}, "work": {"title": "نهاية المحتاج إلى شرح المنهاج وحاشية الشبراملسي", "section": "7/233", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وأفتى ابن الصلاح في ساكن ببلد ومطلقته بقرية وله منها ولد مقيم عندها في مكتب بأنه إن سقط حظ الولد بإقامته عندها فالحضانة للأب رعاية لمصلحته، وإن أضر ذلك بأمه.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/25/7388/فصل-في-الحضانة"], "links": null, "strength": "explicit", "argument": "جعل ابن الصلاح مصلحة الولد في تعليمه مقدمة على بقائه عند أمه، فالحضانة تدور مع حظ الولد لا مع جنس الحاضن.", "jurisdiction": "المذهب الشافعي", "title": "فتوى ابن الصلاح — إذا سقط حظ الولد عند أمه فالحضانة للأب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 362, "supports": ["shared_parenting"], "author": {"name": "ابن حجر الهيتمي، شارحا منهاج الطالبين", "date": ""}, "work": {"title": "تحفة المحتاج وحاشيتا ابن قاسم العبادي والشرواني", "section": "8/362", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(ولو اختارها ذكر فعندها) يكون (ليلا وعند الأب) وإن علا ومثله وصي وقيم يكون (نهارا) وهو كالليل للغالب ففي نحو الأتوني الأمر بالعكس نظير ما مر في القسم (يؤدبه) وجوبا بتعليمه طهارة النفس من كل رذيلة وتحليها بكل محمود.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/20/8775/فصل-في-الحضانة-وهل-انتهائها-في-الصغير-بالبلوغ-أم-بالتمييز"], "links": null, "strength": "explicit", "argument": "نبه ابن حجر الهيتمي إلى أن قسمة الليل والنهار مبنية على الغالب وقد تنعكس، فالمقصود توزيع الرعاية بحسب حال الولد، لا توقيت جامد يحرم الأب.", "jurisdiction": "المذهب الشافعي", "title": "تحفة المحتاج — قسمة الليل والنهار مبنية على الغالب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 363, "supports": ["shared_parenting"], "author": {"name": "أحمد ابن قاسم العبادي في حاشيته على تحفة المحتاج، ناقلا أولا عن الروض وشرحه ثم مستنبطا", "date": ""}, "work": {"title": "تحفة المحتاج وحاشيتا ابن قاسم العبادي والشرواني", "section": "8/361، حاشية ابن قاسم", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(قوله في المتن: فإن اختار أحدهما، ثم الآخر حول إليه) قال في الروض وشرحه: وإن تكرر ذلك منه؛ لأنه قد يظهر له الأمر بخلاف ما ظنه، أو يتغير حال من اختاره أولا ولأن المتبع شهوته كما قد يشتهي طعاما في وقت، وغيره في آخر ولأنه قد يقصد مراعاة الجانبين انتهى. وقد يؤخذ من التعليل الأخير أنه لو اختار ابتداء أن يكون عند أحدهما مدة كيوم أو أسبوع، أو شهر وعند الآخر مدة كيوم، أو أسبوع، أو شهر أجيب لذلك وليس بعيدا، ويحتمل أن لا يجاب بل يقرع فليراجع.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/20/8775/فصل-في-الحضانة-وهل-انتهائها-في-الصغير-بالبلوغ-أم-بالتمييز"], "links": null, "strength": "explicit", "argument": "استخرج ابن قاسم العبادي من تعليل التخيير احتمال أن يكون الولد عند كل من أبويه مدة كيوم أو أسبوع، وهو تصور فقهي قديم للإقامة المتناوبة التي تأخذ بها القوانين الحديثة.", "jurisdiction": "المذهب الشافعي", "title": "حاشية ابن قاسم — احتمال الإقامة المتناوبة يوما أو أسبوعا", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 364, "supports": ["shared_parenting"], "author": {"name": "الخطيب الشربيني في مغني المحتاج، نقله الشرواني في حاشية التحفة", "date": ""}, "work": {"title": "تحفة المحتاج وحاشيتا ابن قاسم العبادي والشرواني", "section": "8/362، حاشية الشرواني عند «ويزورها الأب على العادة»", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وكذا حكم الصغير الغير المميز، والمجنون الذي لا تستقل الأم بضبطه فيكونان عند الأم ليلا ونهارا ويزورهما الأب ويلاحظهما بما مر وعليه ضبط المجنون.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/20/8775/فصل-في-الحضانة-وهل-انتهائها-في-الصغير-بالبلوغ-أم-بالتمييز"], "links": null, "strength": "explicit", "argument": "حتى غير المميز الذي يكون عند أمه ليلا ونهارا يزوره الأب ويلاحظه؛ فلا يغيب الأب عن ولده في أي سن.", "jurisdiction": "المذهب الشافعي", "title": "مغني المحتاج — يزور الأب غير المميز ويلاحظه", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 365, "supports": ["silat_al_rahim", "shared_parenting"], "author": {"name": "البكري الدمياطي", "date": ""}, "work": {"title": "إعانة الطالبين", "section": "", "volume": "4", "page": "4/117-118", "edition": ""}, "original": {"lang": "ar", "text": "«فلا يمنعه [أي الأب ولده] من زيارة أمه؛ لئلا يكون ساعيا في العقوق وقطع الرحم، فإن منعه حرم عليه.»\n«لا يمنع الأب المختار الأم من زيارة ابنها أو بنتها في بيته، بل يمكنها من دخوله لذلك.»\n«فإن لم يأذن أخرجتها إليه ليراها ويتفقد حالها ويلاحظها بقيام تأديبها وتعليمها وتحمل مؤنتها.»\n«ويزورهما الأب ويلاحظهما بما مر، وعليه ضبط المجنون.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/963/1286"], "links": null, "strength": "explicit", "argument": "صرح الدمياطي بأن منع أحد الأبوين ولده من الآخر سعي في العقوق وقطع الرحم، وأنه حرام؛ فالقانون الذي يحجب الأب سنين يقع في هذا التحريم.", "jurisdiction": "المذهب الشافعي", "title": "إعانة الطالبين — منع الزيارة سعي في العقوق وقطع الرحم", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 366, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "النووي", "date": "ت 676 هـ"}, "work": {"title": "منهاج الطالبين", "section": "كتاب النفقات، فصل الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فإن اختار الأب ذكر لم يمنعه زيارة أمه… وإن اختارها ذكر فعندها ليلا، وعند الأب نهارا يؤدبه ويسلمه لمكتب أو حرفة»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/12096/297"], "links": [{"url": "https://shamela.ws/book/12096/297", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "نص الشافعية على أن الذكر إن اختار أمه كان عندها ليلا وعند أبيه نهارا يؤدبه ويسلمه للكتاب أو الحرفة؛ فالرعاية المشتركة بالمناصفة مذهب مدون، وعلتها أن التأديب والتعليم يبدآن بالتمييز.", "jurisdiction": "المذهب الشافعي", "title": "منهاج الطالبين — الليل عند الأم والنهار عند الأب", "source_standing": null, "evidence_level": null}, {"section": "f4", "card_number": 367, "supports": ["silat_al_rahim"], "author": {"name": "النووي", "date": "ت 676 هـ"}, "work": {"title": "منهاج الطالبين", "section": "كتاب النفقات، فصل الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: الأنثى إذا اختارت أباها لا يمنع أمها من الدخول عليها زائرة.", "verbatim": false}, "translation_ar": "", "urls": ["https://shamela.ws/book/11444/2395"], "links": [{"url": "https://shamela.ws/book/11444/2395", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "صان الشافعية صلة البنت بأمها وهي عند أبيها، فالصلة عندهم حق للطرفين، لا لطرف واحد.", "jurisdiction": "المذهب الشافعي", "title": "منهاج الطالبين — زيارة الأم لابنتها", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 368, "supports": ["9", "7"], "author": {"name": "الحجاوي", "date": ""}, "work": {"title": "الإقناع", "section": "", "volume": "4", "page": "4/160-161", "edition": ""}, "original": {"lang": "ar", "text": "«الجارية إذا بلغت سبع سنين فأكثر فعند أبيها إلى البلوغ، وبعده عنده أيضا إلى الزفاف وجوبا ولو تبرعت الأم بحضانتها.»\n«ولا يمنع أحدهما من زيارتها عند الآخر.»\n«وإن مرض أحد الأبوين والولد عند الآخر، لم يمنع الولد، ذكرا كان أو أنثى، من عيادته ولا من تكرر ذلك ولا من حضوره عند موته.»\n«وفي حال الصحة فالغلام يزور أمه… على ما جرت به العادة كاليوم في الأسبوع.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/7360/1786"], "links": null, "strength": "explicit_7", "argument": "نص الحجاوي على أن الجارية إذا بلغت سبعا كانت عند أبيها وجوبا، ولا يمنع أحدهما من زيارتها؛ فالحنابلة ينقلون البنت إلى أبيها عند التمييز.", "jurisdiction": "المذهب الحنبلي", "title": "الإقناع — الجارية إذا بلغت سبعا فعند أبيها", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 369, "supports": ["7", "9"], "author": {"name": "ابن قدامة", "date": ""}, "work": {"title": "الكافي في فقه الإمام أحمد", "section": "", "volume": "3", "page": "3/247", "edition": ""}, "original": {"lang": "ar", "text": "«وإذا بلغت الجارية سبعا، تركت عند الأب بلا تخيير؛ لأن حظها في الكون عند أبيها؛ لأنها تحتاج إلى الحفظ، والأب أولى به، ولأنها تقارب الصلاحية للتزويج، وإنما تخطب من أبيها؛ لأنه وليها والمالك لتزويجها.»\n«وتكون عنده ليلا ونهارا؛ لأن تأديبها وتخريجها في البيت. ولا تمنع الأم من زيارتها.»\n«وإن مرضت فالأم أحق بتمريضها في بيتها… وإن مرضت الأم لم تمنع الجارية من عيادتها.»\n«وإن كانت جارية فلأبيها منعها من الانفراد؛ لأنه لا يؤمن عليها دخول المفسدين.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21731/1137"], "links": null, "strength": "explicit_7", "argument": "علل ابن قدامة جعل الجارية عند أبيها في السابعة بحاجتها إلى الحفظ، وبأنها تقارب الصلاحية للتزويج وتخطب من أبيها؛ وهذا موافق لما يقرره علم الأحياء البشري من سبق الأنثى إلى البلوغ بنحو سنتين، فحاجتها إلى صيانة أبيها أسبق من حاجة الغلام.", "jurisdiction": "المذهب الحنبلي", "title": "الكافي — الجارية في السابعة عند أبيها بلا تخيير", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 370, "supports": ["9", "7"], "author": {"name": "البهوتي", "date": ""}, "work": {"title": "الروض المربع", "section": "", "volume": "", "page": "ص 630", "edition": ""}, "original": {"lang": "ar", "text": "«وأبو الأنثى أحق بها بعد السبع… والأنثى عند أبيها وجوبا حتى يتسلمها زوجها؛ لأنه أحفظ لها وأحق بولايتها من غيره، ولا تمنع الأم من زيارتها إن لم يخف منها. ولو كان الأب عاجزا عن حفظها أو يهملها لاشتغاله عنها أو قلة دينه، والأم قائمة بحفظها، قدمت… ولأبيها وباقي عصبتها منعها من الانفراد.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/1679/629"], "links": null, "strength": "explicit_7", "argument": "نص البهوتي على أن أبا الأنثى أحق بها بعد السبع لأنه أحفظ لها وأحق بولايتها، ولا تمنع الأم من زيارتها؛ فالانتقال إلى الأب لا يقطع الأم.", "jurisdiction": "المذهب الحنبلي", "title": "الروض المربع — أبو الأنثى أحق بها بعد السبع", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 371, "supports": ["7"], "author": {"name": "الخرقي", "date": "ت 334 هـ"}, "work": {"title": "المختصر", "section": "باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإذا بلغ الغلام سبع سنين خير بين أبويه فكان مع من اختار منهما… وإذا بلغت الجارية سبع سنين فالأب أحق بها»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/2977/175"], "links": [{"url": "https://shamela.ws/book/2977/175", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "جعل الحنابلة السابعة حد التخيير في الغلام وحد انتقال الجارية إلى أبيها؛ لأن السابعة عندهم سن التمييز الذي يعقل فيه الصبي حظ نفسه، وتحتاج فيه الجارية إلى الحفظ. وقد وافقهم علم الأحياء البشري في أن الأنثى تسبق الذكر إلى البلوغ بنحو سنتين، فلا وجه لتأخيرها عن الغلام.", "jurisdiction": "المذهب الحنبلي", "title": "مختصر الخرقي — التخيير عند السابعة", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 372, "supports": ["7"], "author": {"name": "ابن قدامة", "date": "ت 620 هـ"}, "work": {"title": "المغني", "section": "كتاب النفقات، باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: علة دفع الجارية إلى الأب عند السابعة أنها تحتاج إلى الحفظ، والأب أولى بحفظها؛ وهي تخطب منه وهو وليها.", "verbatim": false}, "translation_ar": "", "urls": ["https://shamela.ws/book/8463/3617"], "links": [{"url": "https://shamela.ws/book/8463/3617", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "علل ابن قدامة نقل الجارية إلى أبيها في السابعة بحاجتها إلى الحفظ وبأن الأب وليها الذي تخطب منه. وهي حاجة تنشأ بالتمييز وتشتد بقرب البلوغ، والأنثى أسبق إليه من الذكر بنحو سنتين كما يقرر علم الأحياء البشري، فالتعليل الحنبلي موافق للعلم.", "jurisdiction": "المذهب الحنبلي", "title": "المغني — علة دفع الجارية إلى أبيها", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 373, "supports": ["7"], "author": {"name": "ابن قدامة", "date": "ت 620 هـ"}, "work": {"title": "المغني", "section": "كتاب النفقات، باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "فمال إلى أحد الأبوين، دل على أنه أرفق به، وأشفق عليه، فقدم بذلك وقيدناه بالسبع؛ لأنها أول حال أمر الشرع فيها بمخاطبته بالأمر بالصلاة؛ ولأن الأم قدمت في حال الصغر، لحاجته إلى حمله، ومباشرة خدمته لأنها أعرف بذلك، وأقوم به، فإذا استغنى عن ذلك، تساوى والداه، لقربهما منه، فرجح باختياره.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/8463/3616"], "links": [{"url": "https://shamela.ws/book/8463/3616", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "صرح ابن قدامة بعلة السابعة: أنها أول سن خاطب فيها الشرع الصبي بالأمر بالصلاة، والخطاب لا يتوجه إلا إلى من يعقل؛ فالسابعة حد التمييز، وبه نيط التخيير وانتهاء حضانة الأم المنفردة.", "jurisdiction": "المذهب الحنبلي", "title": "المغني — لماذا السابعة", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 374, "supports": ["shared_parenting", "7"], "author": {"name": "ابن تيمية", "date": "ت 728 هـ"}, "work": {"title": "من كلامه في معنى اليتيم", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«اليتيم في الآدميين من فقد أباه؛ لأن أباه هو الذي يهذبه، ويرزقه، وينصره بموجب الطبع المخلوق»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.alukah.net/hosnihamama/8/107788/%d9%81%d8%b6%d9%84-%d9%83%d9%81%d8%a7%d9%84%d8%a9-%d8%a7%d9%84%d8%a3%d9%8a%d8%aa%d8%a7%d9%85/"], "links": null, "strength": "explicit", "argument": "جعل ابن تيمية علة اليتم فقد الأب، لأن الأب هو الذي يهذب ولده ويرزقه وينصره؛ ففرق بين التهذيب والرزق، وجعلهما معا للأب بموجب الفطرة. فوظيفة الأب تهذيب وتربية لا نفقة وحدها، والولد المحجوب عن أبيه في حياته يلحقه من معنى اليتم ما يلحق من فقد أباه.", "jurisdiction": "المذهب الحنبلي", "title": "ابن تيمية — الأب يهذب ولده ويرزقه وينصره", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 375, "supports": ["shared_parenting"], "author": {"name": "ابن مفلح", "date": "ت 763 هـ"}, "work": {"title": "الآداب الشرعية والمنح المرعية", "section": "1/433، نقلا عن المستوعب", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«…وعلى الوالدين أن يعلما ولدهما الكتابة وما يتقن به دينه من فرائضه وسننه، والسباحة والرمي، وأن يورثه طيبا…»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/43/169/%D9%81%D8%B5%D9%84-%D9%81%D9%8A-%D8%A8%D8%B1-%D8%A7%D9%84%D9%88%D8%A7%D9%84%D8%AF%D9%8A%D9%86-%D9%88%D8%B7%D8%A7%D8%B9%D8%AA%D9%87%D9%85%D8%A7-%D9%88%D9%88%D9%84%D9%8A-%D8%A7%D9%84%D8%A3%D9%85%D8%B1-%D9%88%D8%A7%D9%84%D8%B2%D9%88%D8%AC-%D9%88%D8%A7%D9%84%D8%B3%D9%8A%D8%AF-%D9%81%D9%8A-%D8%BA%D9%8A%D8%B1-%D9%85%D8%B9%D8%B5%D9%8A%D8%A9", "https://www.islamweb.net/ar/library/bookinfo.php?bk_no=43"], "links": null, "strength": "explicit", "argument": "جعل الحنابلة تعليم الولد واجبا على الوالدين معا بلفظ التثنية؛ فالتعليم مسؤولية مشتركة لا ينفرد بها أحدهما، ولا يؤديها أب حيل بينه وبين ولده.", "jurisdiction": "المذهب الحنبلي", "title": "الآداب الشرعية — التعليم واجب على الوالدين معا", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 376, "supports": ["7", "shared_parenting"], "author": {"name": "ابن مفلح", "date": "ت 763 هـ"}, "work": {"title": "الآداب الشرعية والمنح المرعية", "section": "فصل في طلب العلم", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«قال الميموني: سألت أبا عبد الله: أيهما أحب إليك، أبدأ ابني بالقرآن أو بالحديث؟ قال: لا، بالقرآن…»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/43/194/%D9%81%D8%B5%D9%84-%D9%81%D9%8A-%D8%B7%D9%84%D8%A8-%D8%A7%D9%84%D8%B9%D9%84%D9%85-%D9%88%D9%85%D8%A7-%D9%8A%D8%A8%D8%AF%D8%A3-%D8%A8%D9%87-%D9%85%D9%86%D9%87-%D9%88%D9%85%D8%A7-%D9%87%D9%88-%D9%81%D8%B1%D9%8A%D8%B6%D8%A9-%D9%85%D9%86%D9%87-%D9%88%D9%81%D8%B6%D9%84-%D8%A3%D9%87%D9%84%D9%87", "https://www.islamweb.net/ar/library/bookinfo.php?bk_no=43"], "links": null, "strength": "indirect", "argument": "سأل الميموني الإمام أحمد بماذا يبدأ تعليم ابنه، فكان تدبير تعليم الولد إلى أبيه يستفتي فيه ويختار؛ وهذه وظيفة لا يقوم بها إلا أب حاضر في حياة ولده.", "jurisdiction": "المذهب الحنبلي", "title": "الآداب الشرعية — الأب يختار لابنه بداية تعليمه", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 377, "supports": ["shared_parenting"], "author": {"name": "ابن قدامة", "date": ""}, "work": {"title": "المغني", "section": "8/193–194، فصل سفر أحد الأبوين", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإن كان البلد الذي ينتقل إليه آمنا، وطريقه آمن، فالأب أحق به، سواء كان هو المقيم أو المنتقل، إلا أن يكون بين البلدين قريب، بحيث يراهم الأب كل يوم ويرونه، فتكون الأم على حضانتها وقال القاضي: إذا كان السفر دون مسافة القصر، فهو في حكم الإقامة، وإن كان مسافة القصر، فهو في حكم السفر والمنصوص عن أحمد ما ذكرناه، وهو أولى؛ لأن البعد الذي يمنعه من رؤيته، يمنعه من تأديبه، وتعليمه، ومراعاة حاله، فأشبه مسافة القصر.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/15/5688/فصل-أي-الأبوين-أحق-بحضانة-الطفل-إذا-أراد-أحدهما-السفر"], "links": null, "strength": "explicit", "argument": "جعل ابن قدامة علة تقديم الأب عند تباعد البلدين أن البعد يعطل رؤيته ولده وتأديبه وتعليمه؛ فمقصود الشرع بقاء هذه الوظائف للأب.", "jurisdiction": "المذهب الحنبلي", "title": "المغني — البعد يعطل الرؤية والتأديب والتعليم", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 378, "supports": ["shared_parenting", "7", "silat_al_rahim"], "author": {"name": "ابن قدامة", "date": ""}, "work": {"title": "الكافي في فقه الإمام أحمد", "section": "3/247", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإن اختار الأم، أو صار لها بالقرعة، كان عندها ليلا، ويأخذه الأب نهارا، ليسلمه في مكتب أو صناعة؛ لأن القصد حظ الولد، وحظه فيما ذكرنا. وإن اختار أباه، كان عنده ليلا ونهارا، ولا يمنع من زيارة أمه، لما فيه من الإغراء بالعقوق وقطيعة الرحم. وإن مرض صارت الأم أحق بتمريضه؛ لأنه صار كالصغير في حاجته إلى من يقوم بأمره.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21731/1137"], "links": null, "strength": "explicit", "argument": "نص ابن قدامة على الرعاية المقسومة في الغلام المميز، وعلل منع الزيارة بأنه إغراء بالعقوق وقطيعة الرحم؛ فالشركة في الرعاية مذهب الحنابلة.", "jurisdiction": "المذهب الحنبلي", "title": "الكافي — عند الأم ليلا ويأخذه الأب نهارا", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 379, "supports": ["silat_al_rahim"], "author": {"name": "ابن قدامة", "date": ""}, "work": {"title": "الكافي في فقه الإمام أحمد", "section": "3/247", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإن مرض أحد الأبوين وهو [أي الولد] عند الآخر، لم يمنع من عيادته وحضروه عنده، لما ذكرنا.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21731/1137"], "links": null, "strength": "explicit", "argument": "حفظ الحنابلة صلة الولد بالوالد الذي ليس عنده حتى في المرض، فالصلة بالأبوين قائمة في كل حال.", "jurisdiction": "المذهب الحنبلي", "title": "الكافي — لا يمنع الولد من عيادة الوالد المريض", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 380, "supports": ["shared_parenting", "7"], "author": {"name": "برهان الدين إبراهيم ابن مفلح", "date": ""}, "work": {"title": "المبدع في شرح المقنع", "section": "باب الحضانة، شرح حكم تخيير الغلام", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وإن اختار أمه كان عندها ليلا» لأنه مستحق الحضانة «وعند أبيه نهارا ليعلمه الصناعة والكتابة ويؤدبه» لأن ذلك هو القصد من حفظ الولد.", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamicbook.ws/asol/hanbali/almbda-shrh-almqna-019.html"], "links": null, "strength": "explicit", "argument": "صرح ابن مفلح بأن تعليم الولد وتأديبه هو القصد من حفظه، وهذا عمل الأب نهارا؛ فالحضانة وسيلة إلى هذا المقصد لا غاية تحجب الأب.", "jurisdiction": "المذهب الحنبلي", "title": "المبدع — التعليم والتأديب هو القصد من حفظ الولد", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 381, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "إبراهيم ابن ضويان", "date": ""}, "work": {"title": "منار السبيل في شرح الدليل", "section": "فصل تخيير الصبي في باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فإن اختار أباه كان عنده ليلا ونهارا» ليحفظه ويعلمه ويؤدبه.\n«ولا يمنع من زيارة أمه، ولا هي من زيارته» لما فيه من الإغراء بالعقوق وقطيعة الرحم.\n«وإن اختار أمه كان عندها ليلا» لأنه وقت الانحياز إلى المساكن،\n«وعند أبيه نهارا ليعلمه ويؤدبه» لئلا يضيع، ولأن النهار وقت التصرف في الحوائج، وعمل الصنائع.", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamicbook.ws/asol/hanbali/mnar-alsbil-004.html"], "links": null, "strength": "explicit", "argument": "جعل ابن ضويان الصبي عند أبيه نهارا لئلا يضيع، ولأن النهار وقت التعلم والصنائع، ومنع المنع من الزيارة في الاتجاهين.", "jurisdiction": "المذهب الحنبلي", "title": "منار السبيل — زيارات متبادلة وتعليم الأب نهارا", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 382, "supports": ["shared_parenting"], "author": {"name": "ابن القيم في الهدى، ثم ابن مفلح في الفروع، ثم تعقيب المرداوي في الإنصاف", "date": ""}, "work": {"title": "الإنصاف في معرفة الراجح من الخلاف", "section": "9/427–428", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وقال في الهدى: إن أراد المنتقل مضارة الآخر، وانتزاع الولد: لم يجب إليه، وإلا عمل ما فيه المصلحة للطفل. قال في الفروع: وهذا متوجه ولعله مراد الأصحاب. فلا مخالفة. لا سيما في صورة المضارة. انتهى. قلت: أما صورة المضارة: فلا شك فيها. وأنه لا يوافق على ذلك.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/26/4803/باب-الحضانة"], "links": null, "strength": "explicit", "argument": "قرر ابن القيم والمرداوي أن من قصد مضارة الآخر وانتزاع الولد لا يجاب، وأن المدار مصلحة الطفل؛ فالحرمان المقصود لا يقره الشرع.", "jurisdiction": "المذهب الحنبلي", "title": "الإنصاف — لا يجاب المضار المنتزع للولد", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 383, "supports": ["shared_parenting"], "author": {"name": "المرداوي", "date": ""}, "work": {"title": "الإنصاف في معرفة الراجح من الخلاف", "section": "آخر باب الحضانة، الفائدة الرابعة قبل كتاب الجنايات", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«الرابعة: لا يقر الطفل بيد من لا يصونه ويصلحه والله أعلم.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamicbook.ws/asol/hanbali/alinsaf-023.html"], "links": null, "strength": "explicit", "argument": "الصيانة والإصلاح شرط لبقاء يد الحاضن، فمن أهمل التأديب والتعليم أو قطع الطفل عن أبيه فقد ضيع شرط حضانته.", "jurisdiction": "المذهب الحنبلي", "title": "الإنصاف — لا يقر الطفل بيد من لا يصونه ويصلحه", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 384, "supports": ["shared_parenting", "7", "silat_al_rahim"], "author": {"name": "البهوتي", "date": ""}, "work": {"title": "كشاف القناع عن متن الإقناع", "section": "باب الحضانة، بعد قوله: ولا يخير قبل سبع", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(فإن اختار) الغلام (أباه كان عنده ليلا ونهارا ولا يمنع من زيارة أمه)؛ لما فيه من الإغراء بالعقوق وقطيعة الرحم (وإن مرض) الغلام (كانت) أمه (أحق بتمريضه في بيتها) لأنه صار بالمرض كالصغير في الحاجة (وإن اختار) الغلام (أمه كان عندها ليلا) لأنه وقت السكن وانحياز الرجال إلى المنازل.\n(و) يكون (عند أبيه نهارا ليعلمه الصناعة والكتابة ويؤدبه) لأن ذلك هو القصد في حفظ الولد.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/16/8139/?idfrom=&idto=&start="], "links": null, "strength": "explicit", "argument": "نص البهوتي على أن اختيار الغلام أحد أبويه لا يسقط حق الآخر في الزيارة ولا حق الأب في التعليم نهارا، وأن التخيير مشروط بأهلية الأبوين.", "jurisdiction": "المذهب الحنبلي", "title": "كشاف القناع — التعليم والتمريض والزيارة لا تسقط باختيار أحد الأبوين", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 385, "supports": ["shared_parenting"], "author": {"name": "ابن تيمية", "date": ""}, "work": {"title": "مجموع الفتاوى", "section": "34/104", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«إذا حكم له [أي للأب] حاكم لم يكن لأمه أن تغيبه عنه؛ وإذا غيبته عنه والحالة هذه لم يكن لها أن تطالبه بالنفقة المفروضة ولا بما أنفقوه عليه في هذه الحالة. والله أعلم.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/22/5855/مسألة-مطلقة-لها-ولد-وتزوجت-وكفلته-جدته-وغيبوه-سبع-سنين-هل-له-نفقة"], "links": null, "strength": "explicit", "argument": "قضى ابن تيمية بأن الأم إذا غيبت الولد عن أبيه بعد الحكم له لم يكن لها أن تطالبه بالنفقة؛ فالتغييب جناية على حق الأب يسقط بها ما كان لها، وهو شاهد لمعنى «لا تخيير مع تغييب».", "jurisdiction": "المذهب الحنبلي", "title": "مجموع الفتاوى — ليس للأم أن تغيب الولد عن أبيه", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 386, "supports": ["shared_parenting", "7"], "author": {"name": "ابن تيمية، شارحا رواية حنبل عن أحمد بعد نقل أبي البركات", "date": ""}, "work": {"title": "مجموع الفتاوى", "section": "34/113–114، فصل حضانة الصغير المميز", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فهذه الرواية تدل على أنه [أي الصبي] إذا كبر وصار يعقل الأدب فإنه يكون مقره أيضا عند الأم؛ لكن في وقت الأدب وهو النهار يكون عند الأب وهذه المدونة مذهب مالك بعينه الذي حكيناه. فصار في المسألة ثلاث روايات.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/22/5869/فصل-في-حضانة-الصغير-المميز"], "links": null, "strength": "explicit", "argument": "رواية عن أحمد شرحها ابن تيمية: إذا كبر الصبي وصار يعقل الأدب كان وقت الأدب عند أبيه؛ فالعقل والتمييز علة انتقال الأدب إلى الأب.", "jurisdiction": "المذهب الحنبلي", "title": "مجموع الفتاوى — إذا عقل الأدب فوقت الأدب عند الأب", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 387, "supports": ["shared_parenting"], "author": {"name": "ابن تيمية", "date": ""}, "work": {"title": "مجموع الفتاوى", "section": "34/121–122، سياق تخيير المميز وتكافؤ الأبوين", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فلا يمكن أن يقال: كل أب فهو أصلح للمميز من الأم ولا كل أم هي أصلح له من الأب؛ بل قد يكون بعض الآباء أصلح وبعض الأمهات أصلح. وقد يكون الأب أصلح في حال والأم أصلح في حال.»", "verbatim": true}, "translation_ar": "", "urls": ["https://www.islamweb.net/ar/library/content/22/5869/فصل-في-حضانة-الصغير-المميز"], "links": null, "strength": "explicit", "argument": "نفى ابن تيمية أن تكون الأم أصلح مطلقا أو الأب أصلح مطلقا، فالحكم يدور مع المصلحة؛ وهذا يهدم دعوى تقديم الأم تقديما مطلقا إلى الخامسة عشرة.", "jurisdiction": "المذهب الحنبلي", "title": "مجموع الفتاوى — لا يقال كل أم أصلح من الأب", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 388, "supports": ["shared_parenting", "7"], "author": {"name": "البهوتي", "date": ""}, "work": {"title": "الروض المربع", "section": "", "volume": "", "page": "ص 630", "edition": ""}, "original": {"lang": "ar", "text": "«فإن اختار أباه كان عنده ليلا ونهارا، ولا يمنع زيارة أمه، وإن اختارها كان عندها ليلا وعند أبيه نهارا ليعلمه ويؤدبه.»\n«ولا يقر محضون بيد من لا يصونه ويصلحه؛ لفوات المقصود من الحضانة.»\n«وأبو الأنثى أحق بها بعد السبع، والأنثى عند أبيها وجوبا حتى يتسلمها زوجها؛ لأنه أحفظ لها وأحق بولايتها من غيره، ولا تمنع الأم من زيارتها.»\n«ولو كان الأب عاجزا عن حفظها أو يهملها… والأم قائمة بحفظها قدمت.»\n«ولأبيها وباقي عصبتها منعها من الانفراد.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/1679/629"], "links": null, "strength": "explicit", "argument": "جمع البهوتي بين الرعاية المقسومة للغلام وبين قاعدة أن المحضون لا يقر بيد من لا يصونه ويصلحه؛ فالحضانة أمانة تسقط بالتضييع.", "jurisdiction": "المذهب الحنبلي", "title": "الروض المربع — لا يقر محضون بيد من لا يصونه", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 389, "supports": ["7", "shared_parenting"], "author": {"name": "الحجاوي", "date": ""}, "work": {"title": "الإقناع، تقييد التخيير بالمصلحة", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«قال ابن عقيل: مع السلامة من فساد، فأما إن علم أنه يختار أحدهما ليمكنه من فساد ويكره الآخر للأدب، لم يعمل بمقتضى شهوته.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/7360/1786"], "links": null, "strength": "explicit", "argument": "نقل الحجاوي عن ابن عقيل أن الصبي إن اختار من يمكنه من الفساد ويكره الآخر للأدب لم يعمل باختياره؛ فالتخيير ليس هوى، وإنما يكون بين أبوين صالحين صحبهما الصبي.", "jurisdiction": "المذهب الحنبلي", "title": "الإقناع — التخيير مشروط بالسلامة من الفساد", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 390, "supports": ["shared_parenting", "silat_al_rahim"], "author": {"name": "ابن قدامة", "date": "ت 620 هـ"}, "work": {"title": "المغني", "section": "كتاب النفقات، باب الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "وإن كان الغلام عند الأم بعد السبع، لاختياره لها، كان عندها ليلا، ويأخذه الأب نهارا ليسلمه في مكتب، أو في صناعة؛ لأن القصد حظ الغلام وحظه فيما ذكرناه وإن كان عند الأب، كان عنده ليلا ونهارا، ولا يمنع من زيارة أمه؛ لأن منعه من ذلك إغراء بالعقوق، وقطيعة للرحم", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/8463/3618"], "links": [{"url": "https://shamela.ws/book/8463/3618", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "جعل الحنابلة الولد عند أمه ليلا وعند أبيه نهارا يعلمه ويؤدبه، وهذه رعاية مشتركة منصوصة؛ وعلتها أن المميز يحتاج إلى حنو الأم وتأديب الأب معا.", "jurisdiction": "المذهب الحنبلي", "title": "المغني — الليل عند الأم والنهار عند الأب", "source_standing": null, "evidence_level": null}, {"section": "f5", "card_number": 391, "supports": ["7"], "author": {"name": "ابن قدامة المقدسي ت 620 ه", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«وجملته أن الغلام إذا بلغ سبعا، وليس بمعتوه، خير بين أبويه، إذا تنازعا فيه، فمن اختاره منهما، فهو أولى به قضى بذلك عمر، وعلي، وشريح وهو مذهب الشافعي، وقال مالك، وأبو حنيفة: لا يخير لكن قال أبو حنيفة: إذا استقل بنفسه، فأكل بنفسه، ولبس بنفسه، واستنجى بنفسه، فالأب أحق به ومالك يقول: الأم أحق به حتى يثغر»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/8463/3615", "https://shamela.ws/book/8463/3616"], "links": [{"url": "https://shamela.ws/book/8463/3615", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/8463/3616", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "المذاهب الثلاثة المحكية في الصفحة نفسها تدور كلها حول السابعة: التخيير عند بلوغ سبع (أحمد والشافعي وقضاء عمر وعلي وشريح)، أو انتقال الغلام إلى أبيه متى استقل بنفسه (أبو حنيفة)، أو انتهاء حق الأم بالإثغار (رواية عن مالك). فليس في شيء منها مد حضانة النساء للغلام إلى 15 سنة، والعلة واحدة: استغناء الغلام عن خدمة النساء.", "jurisdiction": "الفقه الحنبلي، مع حكاية مذهب مالك ومذهب أبي حنيفة", "title": "المغني — إذا بلغ الغلام سبعا خير، والأب أحق به عند أبي حنيفة إذا استقل، والأم حتى يثغر في رواية عن مالك", "source_standing": "ابن قدامة من كبار أئمة الحنابلة، والمغني أوسع كتب الفقه المقارن وأكثرها أمانة في حكاية مذاهب الأئمة. في هذا الموضع يحكي عن مالك أن الأم أحق بالغلام «حتى يثغر» أي حتى تسقط أسنانه اللبنية وتنبت الدائمة (نحو 6 إلى 7 سنين)، وعن أبي حنيفة أن الأب أحق به متى استقل بنفسه في الأكل واللبس والاستنجاء. تنبيه للمؤلف: هذه الرواية عن مالك يحكيها المالكية أنفسهم بصيغة «وقد قيل: حتى يثغر» والمشهور عندهم أن حضانة الذكر تنتهي بالبلوغ (انظر قائمة المرفوض: الكافي لابن عبد البر ومواهب الجليل)، فالنص حجة من جهة حكاية ابن قدامة وحده.", "evidence_level": "نص فقهي معتمد (حكاية مذاهب الأئمة)"}, {"section": "f5", "card_number": 392, "supports": ["7"], "author": {"name": "منصور بن يونس البهوتي ت 1051 ه", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«(فصل وإذا بلغ الغلام سبع سنين عاقلا واتفق أبواه أن يكون عند أحدهما جاز) لأن الحق في حضانته إليهما لا يعدوهما (وإن تنازعا) أي الأبوان (فيه) أي في حضانته (خيره الحاكم بينهما فكان مع من اختار منهما) ... وقيد بالسبع لأنها أول حال أمر الشرع فيها بمخاطبته بالصلاة بخلاف الأم فإنها قدمت في حال الصغر لحاجته إلى حمله ومباشرة خدمته لأنها أعرف بذلك.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21642/2667"], "links": [{"url": "https://shamela.ws/book/21642/2667", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "النص يربط حد الحضانة صراحة بسن الأمر بالصلاة (7 سنين)، ويصرح بأن علة تقديم الأم هي الحاجة البدنية للصغير (الحمل ومباشرة الخدمة)، فإذا زالت هذه الحاجة زالت الأولوية. وهذا نقيض القول بأن الأم أحق بالولد إلى 15 سنة.", "jurisdiction": "الفقه الحنبلي (المعتمد في الفتوى)", "title": "كشاف القناع — قيد بالسبع لأنها أول حال أمر الشرع فيها بمخاطبته بالصلاة", "source_standing": "كشاف القناع للبهوتي هو عمدة الفتوى في المذهب الحنبلي المتأخر، والمتن (الإقناع للحجاوي) معتمد المذهب. النص يعلل ربط انتهاء حضانة النساء بالسابعة بأنها أول سن يخاطب فيها الصبي بالأمر بالصلاة، ويعلل تقديم الأم في الصغر بالحاجة إلى حمله وخدمته لا بأصل عام.", "evidence_level": "نص فقهي معتمد (عمدة الفتوى في المذهب الحنبلي)"}, {"section": "f6", "card_number": 393, "supports": ["7", "shared_parenting"], "author": {"name": "تحقيق مستنبط من نصوص المذاهب", "date": ""}, "work": {"title": "تقرير في شرط التخيير", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«لا يكون التخيير بعد أن تنفرد الأم بالولد سنين، ولا بين أبوين أحدهما يضر الولد؛ فإن التخيير بعد حرمان الصغير من أحد طرفي حضانته يقع عبثا، إذ يختار من ألفه على من لم يألفه، فيبطل معنى التخيير، والشريعة منزهة عن العبث. فدل ذلك على أن الرعاية المشتركة بالمناصفة ثابتة قبل التخيير، ليبقى الصغير على صلة بأبويه جميعا، حتى إذا خير اختار عن معرفة بهما.»", "verbatim": true}, "translation_ar": "", "urls": [], "links": null, "strength": "explicit", "argument": "شرط التخيير معرفة الصغير بأبويه جميعا، ولا معرفة بلا صحبة؛ فالرعاية المشتركة بالمناصفة قبل السابعة شرط لصحة التخيير بعدها، لا منة يمن بها على الأب.", "jurisdiction": "استنباط من نصوص المذاهب", "title": "تقرير في شرط التخيير — لا تخيير بعد الحرمان", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 394, "supports": ["7", "shared_parenting"], "author": {"name": "ابن القيم", "date": "ت 751 هـ"}, "work": {"title": "زاد المعاد في هدي خير العباد", "section": "فصل في الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "مضمونه: لا يكون التخيير ولا القرعة إلا حيث تحصل بهما مصلحة الولد؛ فإن كان أحد الأبوين يضيعه أو يعينه على هواه قدم الآخر، ولم يلتفت إلى اختيار الصبي، فإنه ضعيف العقل يؤثر البطالة واللعب.", "verbatim": false}, "translation_ar": "", "urls": ["https://shamela.ws/book/21713/2312"], "links": [{"url": "https://shamela.ws/book/21713/2312", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "التخيير عند المحققين وسيلة إلى مصلحة الولد لا غاية في نفسه، فلا يصح أن يجري بين من يصلحه ومن يضره، ولا بعد أن يحرم الصغير من أحد أبويه فيختار من ألف دون من غيب عنه.", "jurisdiction": "الفقه المقارن", "title": "زاد المعاد — التخيير مقيد بمصلحة الولد", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 395, "supports": ["shared_parenting", "7"], "author": {"name": "أبو حامد الغزالي", "date": "ت 505 هـ"}, "work": {"title": "إحياء علوم الدين", "section": "كتاب رياضة النفس، بيان الطريق في رياضة الصبيان", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«والصبي أمانة عند والديه، وقلبه الطاهر جوهرة نفيسة ساذجة خالية عن كل نقش وصورة، وهو قابل لكل ما نقش، ومائل إلى كل ما يمال به إليه»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/9472/818"], "links": [{"url": "https://shamela.ws/book/9472/818", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "جعل الغزالي الصبي أمانة عند والديه معا لا عند أحدهما، فالأمانة مشتركة، ولا يؤدي الأب أمانته ممنوعا من ولده.", "jurisdiction": "التراث التربوي الإسلامي", "title": "إحياء علوم الدين — الصبي أمانة عند والديه", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 396, "supports": ["shared_parenting", "7"], "author": {"name": "ابن القيم", "date": "ت 751 هـ"}, "work": {"title": "تحفة المودود بأحكام المولود", "section": "الباب السادس عشر، فصل في وجوب تأديب الأولاد", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«فمن أهمل تعليم ولده ما ينفعه وتركه سدى فقد أساء إليه غاية الإساءة»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/6266/227"], "links": [{"url": "https://shamela.ws/book/6266/227", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "جعل ابن القيم ترك تعليم الولد غاية الإساءة إليه، وتعليمه بعد التمييز عمل الأب؛ فحرمان الأب من ولده سنين إيقاع للولد في هذه الإساءة.", "jurisdiction": "التراث التربوي الإسلامي", "title": "تحفة المودود — إهمال تعليم الولد غاية الإساءة", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 397, "supports": ["7", "shared_parenting"], "author": {"name": "ابن القيم", "date": "ت 751 هـ"}, "work": {"title": "تحفة المودود بأحكام المولود", "section": "باب في وجوب تأديب الأولاد", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "وأكثر الأولاد إنما جاء فسادهم من قبل الآباء وإهمالهم لهم وترك تعليمهم فرائض الدين وسننه فأضاعوهم صغارا فلم ينتفعوا بأنفسهم ولم ينفعوا آباءهم كبارا", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/6266/227"], "links": [{"url": "https://shamela.ws/book/6266/227", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "indirect", "argument": "جعل ابن القيم فساد أكثر الأولاد من قبل الآباء وإهمالهم، فدل على أن صلاح الولد منوط بقيام الأب على تعليمه بعد أن يميز؛ وإبعاد الأب عنه تعطيل لأعظم أسباب صلاحه.", "jurisdiction": "التراث التربوي الإسلامي", "title": "تحفة المودود — فساد الأولاد من إهمال الآباء", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 398, "supports": ["7"], "author": {"name": "أبو حامد الغزالي", "date": "ت 505 هـ"}, "work": {"title": "إحياء علوم الدين", "section": "كتاب رياضة النفس، بيان الطريق في رياضة الصبيان", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "ومهما بلغ سن التمييز فينبغي أن لا يسامح في ترك الطهارة والصلاة ويؤمر بالصوم في بعض أيام رمضان ويجنب لبس الديباج والحرير والذهب ويعلم كل ما يحتاج إليه من حدود الشرع", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/9472/819"], "links": [{"url": "https://shamela.ws/book/9472/819", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "يجعل الغزالي السابعة مبدأ أخذ الصبي بالطهارة والصلاة، لأنها سن يعقل فيها الأمر؛ وهذا التأديب من شأن الأب، فلا يستقيم أن يحجب عنه في السن التي يبدأ فيها.", "jurisdiction": "التراث التربوي الإسلامي", "title": "الغزالي — لا يسامح الصبي في ترك الطهارة والصلاة إذا بلغ سن التمييز", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 399, "supports": ["childhood_ends_at_puberty"], "author": {"name": "ابن منظور", "date": "ت 711 هـ"}, "work": {"title": "لسان العرب", "section": "مادة طفل", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "الصبي يدعى طفلا حين يسقط من بطن أمه إلى أن يحتلم.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/1687/5580"], "links": [{"url": "https://shamela.ws/book/1687/5580", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "حد الطفل في اللغة من الولادة إلى الاحتلام، فمن احتلم خرج من اسم الطفولة، ولا يبقى عليه شيء من أحكامها.", "jurisdiction": "معاجم العربية", "title": "لسان العرب — حد الطفل", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 400, "supports": ["childhood_ends_at_puberty"], "author": {"name": "وزارة الأوقاف الكويتية", "date": ""}, "work": {"title": "الموسوعة الفقهية الكويتية", "section": "مادتا «صغر» و«طفل»", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "واصطلاحا: هو وصف يلحق بالإنسان منذ مولده إلى بلوغه الحلم", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/11430/16645"], "links": [{"url": "https://shamela.ws/book/11430/16645", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "تقطع الموسوعة الفقهية بأن الصغر وصف ينتهي بالبلوغ، فالحضانة التي تمتد بعد البلوغ حضانة لغير صغير.", "jurisdiction": "الكويت — وزارة الأوقاف", "title": "الموسوعة الفقهية — الصغر إلى البلوغ", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 401, "supports": ["7"], "author": {"name": "الثعالبي", "date": "ت 429 هـ"}, "work": {"title": "فقه اللغة وسر العربية", "section": "باب في ترتيب سن الغلام", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "فإذا سقطت رواضعه فهو مثغور عن أبي زيد. فإذا نبتت أسنانه بعد السقوط فهو مثغر بالثاء والتاء عن أبي عمرو. فإذا كاد يجاوز العشر السنين أو جاوزها فهو مترعرع وناشئ. فإذا كاد يبلغ الحلم أو بلغه فهو يافع ومراهق.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/11235/64"], "links": [{"url": "https://shamela.ws/book/11235/64", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "indirect", "argument": "ربطت العرب تبدل اسم الصبي بسقوط أسنانه ونباتها نحو السابعة، فعرفت اللغة حد التمييز قبل أن يقرره الفقه.", "jurisdiction": "معاجم العربية", "title": "فقه اللغة — سقوط الأسنان ونباتها", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 402, "supports": ["shared_parenting"], "author": {"name": "ابن القيم ناقلا عن ابن تيمية", "date": "ت 751 هـ"}, "work": {"title": "زاد المعاد", "section": "فصل في الحضانة", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "قال: ومما ينبغي أن يعلم أن الشارع ليس عنه نص عام في تقديم أحد الأبوين مطلقا، ولا تخيير الولد بين الأبوين مطلقا، والعلماء متفقون على أنه لا يتعين أحدهما مطلقا، بل لا يقدم ذو العدوان والتفريط على البر العادل المحسن، والله أعلم.", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/21713/2313"], "links": [{"url": "https://shamela.ws/book/21713/2313", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "أصل ابن تيمية وابن القيم أن الحضانة تدور مع مصلحة الولد، لا مع جنس الحاضن؛ فلا يقدم أحد الأبوين تقديما مطلقا، ولا يمكن أحدهما من حرمان الآخر.", "jurisdiction": "الفقه المقارن", "title": "زاد المعاد — لا تقديم مطلق لأحد الأبوين", "source_standing": null, "evidence_level": null}, {"section": "f6", "card_number": 403, "supports": ["7"], "author": {"name": "ابن قيم الجوزية ت 751 ه", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«ثم ينشأ معه التمييز والعقل على التدريج شيئا فشيئا إلى سن التمييز وليس له سن معين بل من الناس ما يميز لخمس ... فإذا صار له سبع سنين دخل في سن التمييز وأمر بالصلاة كما في المسند والسنن من حديث عمرو بن شعيب عن أبيه عن جده قال قال رسول الله صلى الله عليه وسلم مروا أبناءكم بالصلاة لسبع سنين وأضربوهم عليها لعشر سنين وفرقوا بينهم في المضاجع»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/6266/289", "https://shamela.ws/book/6266/290"], "links": [{"url": "https://shamela.ws/book/6266/289", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/6266/290", "label": "المصدر الثاني", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit_7", "argument": "النص يجعل السابعة بداية سن التمييز صراحة ويربطها بالأمر بالصلاة، وهو عين المناط الذي تنتهي به حضانة النساء عند الحنابلة والشافعية، فالطفل الذي يخاطبه الشرع بالصلاة ويقام له التأديب لم يعد في حاجة إلى حمل النساء وخدمتهن.", "jurisdiction": "الفقه الحنبلي (ابن القيم)", "title": "تحفة المودود — إذا صار له سبع سنين دخل في سن التمييز وأمر بالصلاة", "source_standing": "ابن القيم من أعلام الحنابلة، وتحفة المودود أشهر كتاب تراثي مفرد في أحكام المولود وتربيته. في باب أطوار الإنسان ينص على أن الطفل إذا صار له سبع سنين دخل في سن التمييز وأمر بالصلاة. وفي ص293 من الكتاب نفسه يذهب إلى أن أحاديث التخيير بين الأبوين ليس فيها تقييد بالسبع وأن مدارها على أن يميز الصبي بين أبيه وأمه، وهذا في صالح الأطروحة لا عليها لأنه يبكر التخيير ولا يؤخره. وفي ص296 يذكر أن الصبي عند بلوغ العشر «يتجدد له حال أخرى يقوى فيها تمييزه ومعرفته».", "evidence_level": "نص فقهي معتمد (ابن القيم)"}, {"section": "f6", "card_number": 404, "supports": ["7"], "author": {"name": "ابن منظور ت 711 ه، ناقلا عن أبي زيد الأنصاري وشمر بن حمدويه، وفيه أثر إبراهيم النخعي", "date": ""}, "work": {"title": "", "section": "", "volume": "", "page": "", "edition": ""}, "original": {"lang": "ar", "text": "«أبو زيد: إذا سقطت رواضع الصبي قيل: ثغر، فهو مثغور، فإذا نبتت أسنانه بعد السقوط قيل: اثغر ... ومن السقوط حديث إبراهيم: كانوا يحبون أن يعلموا الصبي الصلاة إذا اثغر، الإثغار: سقوط سن الصبي ونباتها، والمراد به هاهنا السقوط؛ وقال شمر: هو عندي في الحديث بمعنى السقوط، يدل على ذلك ما رواه ابن المبارك بإسناده عن إبراهيم إذا ثغر، وثغر لا يكون إلا بمعنى السقوط.»", "verbatim": true}, "translation_ar": "", "urls": ["https://shamela.ws/book/1687/2064", "https://shamela.ws/book/23691/211"], "links": [{"url": "https://shamela.ws/book/1687/2064", "label": "النص في مصدره", "site": "المكتبة الشاملة", "domain": "shamela.ws"}, {"url": "https://shamela.ws/book/23691/211", "label": "النهاية لابن الأثير", "site": "المكتبة الشاملة", "domain": "shamela.ws"}], "strength": "explicit", "argument": "عمل السلف كان على تعليم الصبي الصلاة عند الإثغار أي سقوط أسنانه اللبنية، وهو عين الحد الذي حكاه ابن قدامة عن مالك لانتهاء حضانة الأم، وهو حد بدني ظاهر يقع في 6 إلى 7 سنين (انظر البطاقة A2-072 عن جدول بزوغ الأسنان)، فيلتقي حد الحضانة وحد التكليف التربوي عند السابعة.", "jurisdiction": "اللغة وغريب الحديث (أثر عن التابعين)", "title": "لسان العرب — كانوا يحبون أن يعلموا الصبي الصلاة إذا اثغر: الإثغار سقوط الأسنان ونباتها", "source_standing": "لسان العرب أوسع معاجم العربية، وينقل هنا عن أبي زيد الأنصاري وشمر وابن الأثير. الأثر منسوب إلى التابعي إبراهيم النخعي، وأشار شمر إلى رواية ابن المبارك له بإسناده بلفظ «إذا ثغر». لم أقف في هذه الجلسة على موضع الأثر المسند في المصنفات (ابن أبي شيبة ونحوه) لأن فهارس الشاملة مطوية ولا بحث متاح، فالقرار للمؤلف في تخريجه.", "evidence_level": "أثر عن التابعين أورده أئمة غريب الحديث واللغة (ابن الأثير وابن منظور) وأسنده ابن المبارك"}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const L=D.meta.legend, E=D.entries, SN=D.meta.sections, ORDER=D.meta.order;
const SUPS=['7','9','childhood_ends_at_puberty','shared_parenting','silat_al_rahim'];
const st={sec:'',sup:null,q:'',lv:'',ju:'',yr:''};
const picked=new Set();
const jur=e=>String(e.jurisdiction||'').split('—')[0].split('؛')[0].trim();
const yearOf=e=>{const m=String((e.author||{}).date||'').match(/(1[0-9]{3}|20[0-9]{2})/);return m?+m[1]:null;};
const decade=e=>{const y=yearOf(e);if(!y)return '';if(y<1900)return 'قبل 1900';return (Math.floor(y/10)*10)+'–'+(Math.floor(y/10)*10+9);};
function fillSel(id,vals){const el=document.getElementById(id);[...new Set(vals.filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});el.onchange=()=>{st[id.slice(0,2)]=el.value;draw();};}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=k=>E.filter(e=>e.supports.includes(k)).length;
document.getElementById('stats').innerHTML=`<div class="stat"><b>${E.length}</b>نصا ومصدرا</div>`+SUPS.map(k=>`<div class="stat"><b>${n(k)}</b>${L.supports[k]}</div>`).join('');
const axF=document.getElementById('axF');
axF.innerHTML=`<button class="chip on" data-sec="">كل الأقسام</button>`+ORDER.map(k=>`<button class="chip" data-sec="${k}">${esc(SN[k])}</button>`).join('');
const supF=document.getElementById('supF');
supF.innerHTML=SUPS.map(k=>`<button class="chip" data-sup="${k}">${L.supports[k]}</button>`).join('');
axF.onclick=e=>{const b=e.target.closest('[data-sec]');if(!b)return;st.sec=b.dataset.sec;axF.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));draw();};
supF.onclick=e=>{const b=e.target.closest('[data-sup]');if(!b)return;st.sup=st.sup===b.dataset.sup?null:b.dataset.sup;supF.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.sup===st.sup));draw();};
fillSel('lvF',E.map(e=>e.evidence_level));fillSel('juF',E.map(jur));fillSel('yrF',E.map(decade));
document.getElementById('prAll').onclick=()=>{document.body.classList.remove('selonly');window.print();};
document.getElementById('prSel').onclick=()=>{if(!picked.size){alert('حدد بطاقة واحدة على الأقل');return;}document.body.classList.add('selonly');window.print();setTimeout(()=>document.body.classList.remove('selonly'),500);};
document.getElementById('clrSel').onclick=()=>{picked.clear();draw();};
function cite(e){const w=e.work||{};return [e.author.name+(e.author.date?' ('+e.author.date+')':''),e.title,[w.title,w.section,w.volume,w.page,w.edition].filter(Boolean).join('، '),e.jurisdiction,((e.links&&e.links[0]&&e.links[0].url)||(e.urls||[])[0]||''),'بطاقة '+e.card_number+' — حول سن الحضانة والرعاية المشتركة بالمناصفة'].filter(Boolean).join(' · ');}
document.getElementById('list').addEventListener('click',ev=>{const b=ev.target.closest('[data-cite]');if(b){const e=E.find(x=>x.card_number==b.dataset.cite);const t=cite(e);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='تم النسخ ✓';setTimeout(()=>b.textContent='نسخ التوثيق',1500);}).catch(()=>{prompt('انسخ التوثيق:',t);});}});
document.getElementById('list').addEventListener('change',ev=>{const c=ev.target.closest('[data-pick]');if(c){const n=+c.dataset.pick;c.checked?picked.add(n):picked.delete(n);c.closest('article').classList.toggle('picked',c.checked);}});
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();draw();};
const SL={explicit_7:'نص في السابعة',explicit_9:'نص في التاسعة',explicit:'دلالة صريحة',indirect:'دلالة بالاستنباط',contextual:'شاهد'};
function card(e){
  const w=e.work||{}, ref=[w.title,w.section,w.volume,w.page,w.edition].filter(Boolean).map(esc).join('، ');
  const ltr=e.original.lang!=='ar';
  const links=(e.links&&e.links.length)?e.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} — ${esc(l.url)}</a>`).join(''):(e.urls||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('');
  return `<article class="card ver${picked.has(e.card_number)?' picked':''}" id="b${e.card_number}">
   <div class="head"><a class="num" href="#b${e.card_number}">بطاقة ${e.card_number}</a><span class="ttl">${esc(e.title)}</span></div>
   <div class="head"><span class="who">${esc(e.author.name)}</span>${e.author.date?`<span class="date">${esc(e.author.date)}</span>`:''}</div>
   <div class="src"><b style="color:var(--blue)">${esc(e.jurisdiction)}</b>${ref?' · '+ref:''}</div>
   <div class="tags">${e.supports.map(s=>`<span class="tag s">${L.supports[s]}</span>`).join('')}<span class="tag">${SL[e.strength]||''}</span>${e.evidence_level?`<span class="tag v">${esc(e.evidence_level)}</span>`:''}</div>
   <blockquote class="${ltr&&e.original.verbatim?'ltr':''}">${esc(e.original.text)}</blockquote>
   ${e.translation_ar?`<div class="tr"><b>الترجمة:</b> ${esc(e.translation_ar)}</div>`:''}
   ${e.argument?`<p class="arg"><b>المضمون: الاستدلال به:</b> ${esc(e.argument)}</p>`:''}
   ${e.source_standing?`<div class="about"><b>عن المصدر:</b> ${esc(e.source_standing)}</div>`:''}
   ${links?`<div class="links">${links}</div>`:''}
   <div class="acts"><button data-cite="${e.card_number}">نسخ التوثيق</button><label><input type="checkbox" data-pick="${e.card_number}" ${picked.has(e.card_number)?'checked':''}> تحديد للطباعة</label></div>
  </article>`;}
function draw(){
  const qn=/^\d+$/.test(st.q)?+st.q:null;
  let f=E.filter(e=>(!st.sec||e.section===st.sec)&&(!st.sup||e.supports.includes(st.sup))&&(!st.lv||e.evidence_level===st.lv)&&(!st.ju||jur(e)===st.ju)&&(!st.yr||decade(e)===st.yr)&&(!st.q||(qn!==null?e.card_number===qn:JSON.stringify(e).toLowerCase().includes(st.q))));
  document.getElementById('cnt').innerHTML=`عرض <b>${f.length}</b> من <b>${E.length}</b>`;
  const out=[];
  ORDER.forEach(k=>{const g=f.filter(e=>e.section===k).sort((x,y)=>x.card_number-y.card_number);
    if(g.length) out.push(`<h2 class="ax"><span>${g.length} نصا</span>${esc(SN[k])}</h2>`+g.map(card).join(''));});
  document.getElementById('list').innerHTML=out.join('')||'<div class="empty">لا نتائج بهذه المرشحات.</div>';
}
draw();
if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView();}
window.addEventListener('hashchange',()=>{const el=document.querySelector(location.hash);if(el)el.scrollIntoView();});
})();
</script>
</body>
</html>
